<svg aria-label="Jerarquía temporal del interfaz aire de TETRA. El intervalo de tiempo dura 14,167 milisegundos. Cuatro intervalos forman una trama de 56,67 milisegundos. Dieciocho tramas forman una multitrama de 1,02 segundos, y la trama número 18 se reserva para señalización. Sesenta multitramas forman una hipertrama de 61,2 segundos, cuyo número interviene en la generación del flujo de clave del cifrado del interfaz aire" role="img" viewbox="0 0 680 334" xmlns="http://www.w3.org/2000/svg">
<style>.t12{font:700 10px system-ui,sans-serif;fill:#fff}.s12{font:8.5px system-ui,sans-serif;fill:#fff}.d12{font:8.5px system-ui,sans-serif;fill:#333}.h12{font:700 13px system-ui,sans-serif;fill:#0055a0}.k12{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n12{font:8.5px system-ui,sans-serif;fill:#666}.m12{font:700 11px system-ui,sans-serif;fill:#fff}.p12{font:7.5px system-ui,sans-serif;fill:#fff}</style>
<text class="h12" text-anchor="middle" x="340" y="22">14,167 ms → 56,67 ms → 1,02 s → 61,2 s</text>
<text class="k12" x="20" y="46">NIVEL 1 · INTERVALO DE TIEMPO (time slot)</text>
<rect fill="#0055a0" height="34" rx="4" width="140" x="20" y="54"></rect>
<text class="m12" text-anchor="middle" x="90" y="76">14,167 ms</text>
<text class="d12" x="176" y="68">Unidad básica. En el enlace descendente, la ráfaga normal lleva 432 bits útiles;</text>
<text class="d12" x="176" y="82">en el ascendente, 336. La ráfaga de control ascendente ocupa medio intervalo.</text>
<text class="k12" x="20" y="110">NIVEL 2 · TRAMA TDMA = 4 INTERVALOS</text>
<rect fill="#2d8659" height="32" rx="4" width="158" x="20" y="118"></rect>
<text class="s12" text-anchor="middle" x="99" y="139">Int. 1</text>
<rect fill="#2d8659" height="32" rx="4" width="158" x="182" y="118"></rect>
<text class="s12" text-anchor="middle" x="261" y="139">Int. 2</text>
<rect fill="#2d8659" height="32" rx="4" width="158" x="344" y="118"></rect>
<text class="s12" text-anchor="middle" x="423" y="139">Int. 3</text>
<rect fill="#2d8659" height="32" rx="4" width="162" x="506" y="118"></rect>
<text class="s12" text-anchor="middle" x="587" y="139">Int. 4 · trama = 56,67 ms</text>
<text class="k12" x="20" y="172">NIVEL 3 · MULTITRAMA = 18 TRAMAS = 1,02 s</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="20" y="180"></rect>
<text class="p12" text-anchor="middle" x="37" y="200">1</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="58" y="180"></rect>
<text class="p12" text-anchor="middle" x="75" y="200">2</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="96" y="180"></rect>
<text class="p12" text-anchor="middle" x="113" y="200">3</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="134" y="180"></rect>
<text class="p12" text-anchor="middle" x="151" y="200">4</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="172" y="180"></rect>
<text class="p12" text-anchor="middle" x="189" y="200">5</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="210" y="180"></rect>
<text class="p12" text-anchor="middle" x="227" y="200">6</text>
<rect fill="#e89822" height="30" rx="3" width="182" x="248" y="180"></rect>
<text class="p12" text-anchor="middle" x="339" y="200">tramas 7 a 16 · tráfico del usuario</text>
<rect fill="#e89822" height="30" rx="3" width="34" x="434" y="180"></rect>
<text class="p12" text-anchor="middle" x="451" y="200">17</text>
<rect fill="#d13c3c" height="30" rx="3" width="60" x="472" y="180"></rect>
<text class="p12" text-anchor="middle" x="502" y="200">18</text>
<text class="d12" x="544" y="192">La trama 18 es la TRAMA</text>
<text class="d12" x="544" y="205">DE CONTROL: señalización</text>
<text class="k12" x="20" y="232">NIVEL 4 · HIPERTRAMA = 60 MULTITRAMAS = 61,2 s</text>
<rect fill="#0055a0" height="34" rx="4" width="648" x="20" y="240"></rect>
<text class="t12" text-anchor="middle" x="340" y="254">60 multitramas seguidas · 61,2 segundos</text>
<text class="s12" text-anchor="middle" x="340" y="268">El número de hipertrama interviene en la generación del flujo de clave del cifrado de interfaz aire</text>
<rect fill="none" height="22" rx="4" stroke="#d13c3c" stroke-width="1.5" width="648" x="20" y="284"></rect>
<text class="k12" text-anchor="middle" x="344" y="299">Y ahí estuvo la vulnerabilidad CVE-2022-24401: el tiempo de red se difunde SIN AUTENTICAR</text>
<text class="n12" text-anchor="end" x="670" y="326">[Fuente: elaboración propia sobre ETSI EN 300 392-2 y Midnight Blue, TETRA:BURST 2023]</text>
</svg>