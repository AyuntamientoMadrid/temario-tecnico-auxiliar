<svg aria-label="Clasificación de los canales lógicos de TETRA. La familia de canales de control incluye el BCCH de difusión con sus variantes BNCH de red y BSCH de sincronización, el LCH de linealización, el SCH de señalización con sus variantes completa y de medio intervalo, el ACCH asociado a una llamada en curso con las variantes rápida y lenta, y el STCH que roba capacidad al tráfico. La familia de canales de tráfico incluye el TCH de voz a 7,2 kilobits por segundo y los de datos a 7,2 sin protección, 4,8 con protección baja y 2,4 con protección alta" role="img" viewbox="0 0 680 334" xmlns="http://www.w3.org/2000/svg">
<style>.t13{font:700 10px system-ui,sans-serif;fill:#fff}.s13{font:8.5px system-ui,sans-serif;fill:#fff}.d13{font:8.5px system-ui,sans-serif;fill:#333}.h13{font:700 13px system-ui,sans-serif;fill:#0055a0}.k13{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n13{font:8.5px system-ui,sans-serif;fill:#666}.b13{font:700 9px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h13" text-anchor="middle" x="340" y="22">Canal FÍSICO es un intervalo; canal LÓGICO es lo que se transporta en él</text>
<rect fill="none" height="222" rx="5" stroke="#0055a0" stroke-width="2" width="322" x="20" y="36"></rect>
<rect fill="#0055a0" height="24" rx="3" width="298" x="32" y="46"></rect>
<text class="t13" text-anchor="middle" x="181" y="62">CANALES DE CONTROL (CCH)</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="298" x="32" y="78"></rect>
<text class="b13" x="44" y="92">BCCH · difusión</text>
<text class="d13" x="44" y="105">BNCH (información de red) y BSCH (sincronización)</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="298" x="32" y="116"></rect>
<text class="b13" x="44" y="130">SCH · señalización</text>
<text class="d13" x="44" y="143">SCH/F completo · SCH/HD y SCH/HU de medio intervalo</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="298" x="32" y="154"></rect>
<text class="b13" x="44" y="168">ACCH · asociado a una llamada en curso</text>
<text class="d13" x="44" y="181">FACCH rápido (roba tráfico) y SACCH lento (trama de control)</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="298" x="32" y="192"></rect>
<text class="b13" x="44" y="206">STCH · robo de capacidad</text>
<text class="d13" x="44" y="219">Señalización urgente sobre el canal de tráfico</text>
<rect fill="#f1f5f9" height="20" rx="3" stroke="#c9d6e2" width="298" x="32" y="230"></rect>
<text class="d13" x="44" y="243">LCH · linealización de los amplificadores</text>
<rect fill="none" height="222" rx="5" stroke="#2d8659" stroke-width="2" width="314" x="354" y="36"></rect>
<rect fill="#2d8659" height="24" rx="3" width="290" x="366" y="46"></rect>
<text class="t13" text-anchor="middle" x="511" y="62">CANALES DE TRÁFICO (TCH)</text>
<rect fill="#2d8659" height="38" rx="3" width="290" x="366" y="78"></rect>
<text class="t13" x="378" y="94">TCH/S · VOZ</text>
<text class="s13" x="378" y="109">7,2 kbit/s por intervalo · códec ACELP</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="290" x="366" y="122"></rect>
<text class="b13" x="378" y="136">TCH/7,2 · datos sin protección</text>
<text class="d13" x="378" y="149">Máximo caudal, mínima robustez</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="290" x="366" y="160"></rect>
<text class="b13" x="378" y="174">TCH/4,8 · datos con protección baja</text>
<text class="d13" x="378" y="187">Compromiso habitual</text>
<rect fill="#f1f5f9" height="32" rx="3" stroke="#c9d6e2" width="290" x="366" y="198"></rect>
<text class="b13" x="378" y="212">TCH/2,4 · datos con protección alta</text>
<text class="d13" x="378" y="225">Para el borde de la cobertura</text>
<text class="d13" x="378" y="246">Con los 4 intervalos agregados: hasta 28,8 kbit/s</text>
<rect fill="#e89822" height="38" rx="4" width="648" x="20" y="268"></rect>
<text class="t13" x="36" y="284">EL CANAL DE CONTROL PRINCIPAL (MCCH)</text>
<text class="s13" x="36" y="299">Es el canal lógico de control que la estación base mantiene permanentemente activo en el intervalo 1 de la portadora principal</text>
<text class="n13" text-anchor="end" x="670" y="326">[Fuente: elaboración propia sobre ETSI EN 300 392-2, capa MAC]</text>
</svg>