<svg aria-label="Topología de una red TETRA. En el centro, la infraestructura de conmutación y gestión o SwMI, que contiene el nodo de conmutación, las bases de datos de abonados y grupos, el centro de autenticación y las estaciones base. A la izquierda, los terminales portátiles, móviles y fijos, que se conectan por el interfaz aire I1. A la derecha, las consolas de despacho, el grabador y el sistema de gestión de red, conectados por las interfaces de línea I2 y de gestión I5. Abajo, la pasarela hacia la red telefónica y la interfaz entre sistemas I3 hacia otra red TETRA" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
