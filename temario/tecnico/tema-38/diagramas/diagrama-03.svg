<svg aria-label="Mapa de la familia de normas TETRA del ETSI. La serie EN 300 392 regula el modo troncalizado voz más datos, con la parte 1 de diseño general, la parte 2 del interfaz aire, la parte 3 de la interfaz entre sistemas, la parte 4 de pasarelas, la parte 5 del interfaz de equipo periférico, la parte 7 de seguridad y las partes 9 a 12 de servicios suplementarios. La serie EN 300 396 regula el modo directo. Además, EN 300 394 de pruebas de conformidad, EN 300 395 del códec de voz, EN 300 812 del módulo de identidad, TR 102 580 de TEDS y TS 104 053 de los algoritmos de cifrado" role="img" viewbox="0 0 680 324" xmlns="http://www.w3.org/2000/svg">
<style>.t3{font:700 10px system-ui,sans-serif;fill:#fff}.s3{font:8.5px system-ui,sans-serif;fill:#fff}.d3{font:8.5px system-ui,sans-serif;fill:#333}.h3{font:700 13px system-ui,sans-serif;fill:#0055a0}.k3{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n3{font:8.5px system-ui,sans-serif;fill:#666}.b3{font:700 9px system-ui,sans-serif;fill:#0055a0}</style>
