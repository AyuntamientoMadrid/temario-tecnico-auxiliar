<svg aria-label="Escenario operativo que compara el modo troncalizado y el modo directo. Arriba, el modo troncalizado: los terminales en superficie hablan con la estación base y con el centro de mando. En el centro, el sótano sin cobertura, donde las dotaciones trabajan en modo directo y el centro de mando no las oye. Abajo, las dos soluciones: el repetidor DM-REP amplía el alcance dentro del modo directo pero sigue sin llegar al centro de mando, y la pasarela DM-GATE reinyecta la comunicación en la red y devuelve la visibilidad al despacho" role="img" viewbox="0 0 680 356" xmlns="http://www.w3.org/2000/svg">
<style>.t7{font:700 10px system-ui,sans-serif;fill:#fff}.s7{font:8.5px system-ui,sans-serif;fill:#fff}.d7{font:8.5px system-ui,sans-serif;fill:#333}.h7{font:700 13px system-ui,sans-serif;fill:#0055a0}.k7{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n7{font:8.5px system-ui,sans-serif;fill:#666}.b7{font:700 9px system-ui,sans-serif;fill:#0055a0}.r7{font:700 9.5px system-ui,sans-serif;fill:#d13c3c}.g7{font:700 9.5px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h7" text-anchor="middle" x="340" y="22">Repetidor y pasarela NO son lo mismo</text>
<rect fill="none" height="74" rx="5" stroke="#2d8659" stroke-width="1.5" width="648" x="20" y="36"></rect>
<text class="g7" x="32" y="54">TMO · MODO TRONCALIZADO — a través de la infraestructura (EN 300 392)</text>
<rect fill="#2d8659" height="36" rx="4" width="130" x="32" y="62"></rect>
<text class="t7" text-anchor="middle" x="97" y="78">Terminal</text>
<text class="s7" text-anchor="middle" x="97" y="92">en superficie</text>
<path d="M164,80 L198,80" stroke="#2d8659" stroke-width="2"></path>
<path d="M190,76 L198,80 L190,84 Z" fill="#2d8659"></path>
<rect fill="#2d8659" height="36" rx="4" width="130" x="200" y="62"></rect>
<text class="t7" text-anchor="middle" x="265" y="78">Estación base</text>
<text class="s7" text-anchor="middle" x="265" y="92">de la red</text>
<path d="M332,80 L366,80" stroke="#2d8659" stroke-width="2"></path>
<path d="M358,76 L366,80 L358,84 Z" fill="#2d8659"></path>
<rect fill="#2d8659" height="36" rx="4" width="130" x="368" y="62"></rect>
<text class="t7" text-anchor="middle" x="433" y="78">SwMI</text>
<text class="s7" text-anchor="middle" x="433" y="92">conmutación</text>
<path d="M500,80 L534,80" stroke="#2d8659" stroke-width="2"></path>
<path d="M526,76 L534,80 L526,84 Z" fill="#2d8659"></path>
<rect fill="#0055a0" height="36" rx="4" width="120" x="536" y="62"></rect>
<text class="t7" text-anchor="middle" x="596" y="78">CENTRO</text>
<text class="s7" text-anchor="middle" x="596" y="92">de mando</text>
<rect fill="none" height="62" rx="5" stroke="#d13c3c" stroke-width="1.5" width="648" x="20" y="120"></rect>
<text class="r7" x="32" y="138">DMO · MODO DIRECTO — terminal a terminal, sin red (EN 300 396)</text>
<rect fill="#d13c3c" height="26" rx="4" width="150" x="32" y="146"></rect>
<text class="s7" text-anchor="middle" x="107" y="163">Dotación en el sótano</text>
<path d="M184,159 L214,159" stroke="#d13c3c" stroke-width="2"></path>
<path d="M206,155 L214,159 L206,163 Z" fill="#d13c3c"></path>
<rect fill="#d13c3c" height="26" rx="4" width="150" x="216" y="146"></rect>
<text class="s7" text-anchor="middle" x="291" y="163">Otra dotación, a 20 m</text>
<text class="d7" x="380" y="157">Se oyen entre sí, pero el centro de mando NO se entera:</text>
<text class="d7" x="380" y="170">sin despacho, sin grabación y sin posiciones.</text>
<text class="k7" x="20" y="206">LAS DOS FORMAS DE AMPLIAR EL MODO DIRECTO, Y LO QUE CONSIGUE CADA UNA</text>
<rect fill="#e89822" height="104" rx="5" width="314" x="20" y="214"></rect>
<text class="t7" text-anchor="middle" x="177" y="234">DM-REP · REPETIDOR</text>
<text class="s7" text-anchor="middle" x="177" y="252">Recibe en modo directo y retransmite con más</text>
<text class="s7" text-anchor="middle" x="177" y="265">potencia y desde mejor posición.</text>
<text class="s7" text-anchor="middle" x="177" y="282">Tipos: 1A (una portadora) · 1B (par dúplex) · 2 (dos llamadas)</text>
<text class="t7" text-anchor="middle" x="177" y="302">Resultado: se oyen MÁS LEJOS, pero siguen aislados</text>
<rect fill="#0055a0" height="104" rx="5" width="322" x="346" y="214"></rect>
<text class="t7" text-anchor="middle" x="507" y="234">DM-GATE · PASARELA</text>
<text class="s7" text-anchor="middle" x="507" y="252">Recibe en modo directo y REINYECTA la comunicación</text>
<text class="s7" text-anchor="middle" x="507" y="265">en la red troncalizada, y al revés.</text>
<text class="s7" text-anchor="middle" x="507" y="282">El DM-REP/GATE hace las dos funciones a la vez</text>
<text class="t7" text-anchor="middle" x="507" y="302">Resultado: vuelven a ser VISIBLES para el centro de mando</text>
<text class="n7" text-anchor="end" x="670" y="348">[Fuente: elaboración propia sobre ETSI EN 300 392-2 y ETSI EN 300 396-4]</text>
</svg>