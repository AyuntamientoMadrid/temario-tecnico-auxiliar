<svg aria-label="Capas del software de base, de abajo arriba: hardware, firmware UEFI, núcleo del sistema operativo con controladores, bibliotecas y servicios del sistema, middleware y aplicaciones. La frontera entre modo núcleo y modo usuario se cruza mediante llamadas al sistema" role="img" viewbox="0 0 680 336" xmlns="http://www.w3.org/2000/svg">
