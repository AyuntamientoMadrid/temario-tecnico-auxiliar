<svg aria-label="Esquema Nacional de Seguridad aplicado a la administración de sistemas: cinco dimensiones de seguridad, tres categorías, cuatro responsables diferenciados, tres grupos de medidas del anexo dos y las medidas concretas de explotación, continuidad y copias de seguridad que afectan a este tema" role="img" viewbox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
<style>.t10{font:700 10.5px system-ui,sans-serif;fill:#fff}.s10{font:9px system-ui,sans-serif;fill:#fff}.h10{font:700 13px system-ui,sans-serif;fill:#0055a0}.k10{font:700 10px system-ui,sans-serif;fill:#0055a0}.d10{font:9px system-ui,sans-serif;fill:#444}</style>
<text class="h10" text-anchor="middle" x="340" y="20">Real Decreto 311/2022 (ENS) — lo que obliga al administrador</text>
<text class="k10" text-anchor="middle" x="340" y="40">Las cinco DIMENSIONES de seguridad (anexo I)</text>
<rect fill="#0055a0" height="34" rx="5" width="124" x="16" y="48"></rect>
<text class="t10" text-anchor="middle" x="78" y="70">Disponibilidad</text>
<rect fill="#0055a0" height="34" rx="5" width="124" x="148" y="48"></rect>
<text class="t10" text-anchor="middle" x="210" y="70">Integridad</text>
<rect fill="#0055a0" height="34" rx="5" width="124" x="280" y="48"></rect>
<text class="t10" text-anchor="middle" x="342" y="70">Confidencialidad</text>
<rect fill="#0055a0" height="34" rx="5" width="124" x="412" y="48"></rect>
<text class="t10" text-anchor="middle" x="474" y="70">Autenticidad</text>
<rect fill="#0055a0" height="34" rx="5" width="120" x="544" y="48"></rect>
<text class="t10" text-anchor="middle" x="604" y="70">Trazabilidad</text>
<rect fill="#f0f4f8" height="70" rx="5" stroke="#0055a0" width="316" x="16" y="92"></rect>
<text class="k10" text-anchor="middle" x="174" y="110">CATEGORÍA del sistema: manda la más alta</text>
<text class="d10" text-anchor="middle" x="174" y="127">ALTA: alguna dimensión en nivel ALTO</text>
<text class="d10" text-anchor="middle" x="174" y="141">MEDIA: alguna en MEDIO y ninguna superior</text>
<text class="d10" text-anchor="middle" x="174" y="155">BÁSICA: alguna en BAJO y ninguna superior</text>
<rect fill="#f0f4f8" height="70" rx="5" stroke="#0055a0" width="316" x="348" y="92"></rect>
<text class="k10" text-anchor="middle" x="506" y="110">Cuatro RESPONSABLES diferenciados (art. 11)</text>
<text class="d10" text-anchor="middle" x="506" y="127">de la Información · del Servicio · de la Seguridad</text>
<text class="d10" text-anchor="middle" x="506" y="141">y del Sistema (el administrador)</text>
<text class="d10" text-anchor="middle" x="506" y="155">Seguridad y explotación NO en la misma persona</text>
<text class="k10" text-anchor="middle" x="340" y="182">Las medidas del anexo II que caen sobre este tema</text>
<rect fill="#004077" height="30" rx="5" width="210" x="16" y="192"></rect>
<text class="t10" text-anchor="middle" x="121" y="212">MARCO ORGANIZATIVO [org]</text>
<rect fill="#0055a0" height="30" rx="5" width="210" x="234" y="192"></rect>
<text class="t10" text-anchor="middle" x="339" y="212">MARCO OPERACIONAL [op]</text>
<rect fill="#2d8659" height="30" rx="5" width="212" x="452" y="192"></rect>
<text class="t10" text-anchor="middle" x="558" y="212">MEDIDAS DE PROTECCIÓN [mp]</text>
<rect fill="#f0f4f8" height="106" rx="5" stroke="#0055a0" width="428" x="16" y="230"></rect>
<text class="k10" text-anchor="middle" x="230" y="248">Explotación [op.exp] y continuidad [op.cont]</text>
<text class="d10" text-anchor="middle" x="230" y="268">op.exp.1 Inventario de activos · op.exp.2 Configuración de seguridad</text>
<text class="d10" text-anchor="middle" x="230" y="284">op.exp.3 Gestión de la configuración · op.exp.5 Gestión de cambios</text>
<text class="d10" text-anchor="middle" x="230" y="300">op.exp.7 Gestión de incidentes · op.exp.8 Registro de la actividad</text>
<text class="d10" text-anchor="middle" x="230" y="320">op.cont.1 a 4: análisis de impacto, plan, pruebas y medios alternativos</text>
<rect fill="#e89822" height="106" rx="5" width="208" x="456" y="230"></rect>
<text class="t10" text-anchor="middle" x="560" y="249">op.exp.4</text>
<text class="s10" text-anchor="middle" x="560" y="266">Mantenimiento y</text>
<text class="s10" text-anchor="middle" x="560" y="281">actualizaciones de seguridad</text>
<text class="s10" text-anchor="middle" x="560" y="301">R1 · pruebas en preproducción</text>
<text class="s10" text-anchor="middle" x="560" y="317">R2 · mecanismo para revertir</text>
<text class="s10" text-anchor="middle" x="560" y="331">= el corazón de este tema</text>
<rect fill="#d13c3c" height="30" rx="5" width="648" x="16" y="344"></rect>
<text class="t10" text-anchor="middle" x="340" y="364">mp.info.6 Copias de seguridad · R1 obliga a PROBAR la restauración · auditoría al menos cada 2 años</text>
<text style="font:9.5px system-ui;fill:#666" text-anchor="end" x="670" y="386">[Fuente: ENS (RD 311/2022)]</text>
</svg>