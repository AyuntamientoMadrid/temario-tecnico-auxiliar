<svg aria-label="Las tres anomalías de un diseño no normalizado: inserción, borrado y actualización, causadas por la redundancia de datos" class="d17-10" role="img" viewbox="0 0 660 300" xmlns="http://www.w3.org/2000/svg">
<style>.d17-10 .t{font:700 12px system-ui,sans-serif;fill:#fff}.d17-10 .s{font:11px system-ui,sans-serif;fill:#fff}.d17-10 .h{font:700 13px system-ui,sans-serif;fill:#0055a0}.d17-10 .l{font:11px system-ui,sans-serif;fill:#444}</style>
<text class="h" text-anchor="middle" x="330" y="26">Redundancia → tres anomalías</text>
<rect fill="#d13c3c" height="40" rx="6" width="260" x="200" y="40"></rect><text class="t" text-anchor="middle" x="330" y="58">Dato repetido en muchas filas</text><text class="s" text-anchor="middle" x="330" y="73">(p. ej. nombre_distrito en cada habitante)</text>
<rect fill="#0055a0" height="110" rx="6" width="190" x="30" y="120"></rect><text class="t" text-anchor="middle" x="125" y="146">Inserción</text><text class="s" text-anchor="middle" x="125" y="172">No puedo dar de alta</text><text class="s" text-anchor="middle" x="125" y="190">un distrito sin tener</text><text class="s" text-anchor="middle" x="125" y="208">al menos un habitante</text>
<rect fill="#0055a0" height="110" rx="6" width="190" x="235" y="120"></rect><text class="t" text-anchor="middle" x="330" y="146">Borrado</text><text class="s" text-anchor="middle" x="330" y="172">Borrar al último</text><text class="s" text-anchor="middle" x="330" y="190">habitante elimina el</text><text class="s" text-anchor="middle" x="330" y="208">nombre del distrito</text>
<rect fill="#0055a0" height="110" rx="6" width="190" x="440" y="120"></rect><text class="t" text-anchor="middle" x="535" y="146">Actualización</text><text class="s" text-anchor="middle" x="535" y="172">Cambiar el nombre</text><text class="s" text-anchor="middle" x="535" y="190">obliga a tocar TODAS</text><text class="s" text-anchor="middle" x="535" y="208">las filas (inconsistencia)</text>
<path d="M280 80 L150 118" stroke="#888" stroke-width="2"></path><path d="M330 80 L330 118" stroke="#888" stroke-width="2"></path><path d="M380 80 L520 118" stroke="#888" stroke-width="2"></path>
<text class="l" text-anchor="middle" x="330" y="258">Solución: normalizar (3FN) → cada hecho se guarda una sola vez</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="650" y="288">[Fuente: ELMASRI, cap. 14]</text>
</svg>