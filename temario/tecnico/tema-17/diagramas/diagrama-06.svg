<svg aria-label="Comparación de tipos de índice: B+tree para igualdad y rango, hash solo para igualdad, bitmap para columnas de baja cardinalidad" class="d17-6" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.d17-6 .t{font:700 12px system-ui,sans-serif;fill:#fff}.d17-6 .s{font:11px system-ui,sans-serif;fill:#fff}.d17-6 .l{font:11px system-ui,sans-serif;fill:#444}.d17-6 .h{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h" text-anchor="middle" x="340" y="26">¿Qué índice usar?</text>
<rect fill="#0055a0" height="120" rx="6" width="200" x="30" y="48"></rect><text class="t" text-anchor="middle" x="130" y="74">B+tree (por defecto)</text><text class="s" text-anchor="middle" x="130" y="98">Igualdad = </text><text class="s" text-anchor="middle" x="130" y="116">Rango BETWEEN, &lt;, &gt;</text><text class="s" text-anchor="middle" x="130" y="134">Orden ORDER BY</text><text class="s" text-anchor="middle" x="130" y="156">Equilibrado y enlazado</text>
<rect fill="#2d8659" height="120" rx="6" width="190" x="245" y="48"></rect><text class="t" text-anchor="middle" x="340" y="74">Hash</text><text class="s" text-anchor="middle" x="340" y="100">Solo igualdad exacta</text><text class="s" text-anchor="middle" x="340" y="120">Muy rápido</text><text class="s" text-anchor="middle" x="340" y="142">No sirve para rangos</text>
<rect fill="#e89822" height="120" rx="6" width="200" x="450" y="48"></rect><text class="t" text-anchor="middle" x="550" y="74">Bitmap</text><text class="s" text-anchor="middle" x="550" y="100">Baja cardinalidad</text><text class="s" text-anchor="middle" x="550" y="120">(sexo, distrito)</text><text class="s" text-anchor="middle" x="550" y="142">OLAP; penaliza escrituras</text>
<rect fill="#fbeeed" height="70" rx="6" width="620" x="30" y="195"></rect><text fill="#d13c3c" font="700 12px system-ui,sans-serif" text-anchor="middle" x="340" y="220">El índice acelera lecturas pero penaliza escrituras y ocupa espacio</text><text class="l" text-anchor="middle" x="340" y="244">Indexar columnas selectivas y consultadas, no todas. Índice compuesto: regla del prefijo izquierdo.</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="308">[Fuente: RAMAKRISHNAN, cap. 8]</text>
</svg>