<svg aria-label="Sobre una tabla: la relación es la tabla, la tupla es una fila, el atributo una columna, el grado el número de columnas y la cardinalidad el número de filas" class="d17-7" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.d17-7 .k{font:700 11px system-ui,sans-serif;fill:#fff}.d17-7 .l{font:11px system-ui,sans-serif;fill:#444}.d17-7 .h{font:700 13px system-ui,sans-serif;fill:#0055a0}.d17-7 .a{font:600 11px system-ui,sans-serif;fill:#d13c3c}</style>
<text class="h" text-anchor="middle" x="250" y="26">Relación HABITANTE (grado 3, cardinalidad 3)</text>
<rect fill="#0055a0" height="26" width="260" x="120" y="44"></rect><text class="k" x="150" y="62">dni</text><text class="k" x="240" y="62">nombre</text><text class="k" x="330" y="62">distrito</text>
<rect fill="#e8f0f8" height="24" width="260" x="120" y="70"></rect><text class="l" x="150" y="87">0001A</text><text class="l" x="240" y="87">Ana</text><text class="l" x="335" y="87">1</text>
<rect fill="#fff" height="24" width="260" x="120" y="94"></rect><text class="l" x="150" y="111">0002B</text><text class="l" x="240" y="111">Luis</text><text class="l" x="335" y="111">2</text>
<rect fill="#e8f0f8" height="24" width="260" x="120" y="118"></rect><text class="l" x="150" y="135">0003C</text><text class="l" x="240" y="135">Eva</text><text class="l" x="335" y="135">1</text>
<text class="a" x="400" y="60">← esquema / atributos (columnas)</text>
<text class="a" x="400" y="106">← tupla (fila)</text>
<line stroke="#d13c3c" x1="150" x2="150" y1="155" y2="175"></line><line stroke="#d13c3c" x1="370" x2="370" y1="155" y2="175"></line><text class="a" text-anchor="middle" x="260" y="170">grado = nº de columnas = 3</text>
<text class="l" x="60" y="200">Atributo = columna · Dominio = valores válidos del atributo (p. ej. distrito ∈ 1..21)</text>
<text class="l" x="60" y="222">Cardinalidad = nº de filas = 3 · No hay tuplas duplicadas (es un conjunto)</text>
<text class="l" x="60" y="244">Orden de filas y columnas: irrelevante en el modelo teórico</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="308">[Fuente: CODD70; DATE, cap. 6]</text>
</svg>