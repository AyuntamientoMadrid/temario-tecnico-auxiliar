<svg aria-label="Operadores del álgebra relacional: cinco primitivos (selección, proyección, unión, diferencia, producto cartesiano) y derivados (join, intersección, división)" class="d17-9" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>.d17-9 .t{font:700 12px system-ui,sans-serif;fill:#fff}.d17-9 .s{font:11px system-ui,sans-serif;fill:#fff}.d17-9 .h{font:700 13px system-ui,sans-serif;fill:#0055a0}.d17-9 .l{font:11px system-ui,sans-serif;fill:#444}</style>
<text class="h" text-anchor="middle" x="340" y="26">Álgebra relacional (lenguaje procedimental)</text>
<rect fill="#eef3f9" height="150" rx="6" stroke="#0055a0" width="320" x="30" y="44"></rect><text class="h" text-anchor="middle" x="190" y="64">5 primitivos</text>
<rect fill="#0055a0" height="30" rx="4" width="145" x="45" y="74"></rect><text class="s" text-anchor="middle" x="117" y="94">σ Selección (filas)</text>
<rect fill="#0055a0" height="30" rx="4" width="145" x="195" y="74"></rect><text class="s" text-anchor="middle" x="267" y="94">π Proyección (columnas)</text>
<rect fill="#0055a0" height="30" rx="4" width="145" x="45" y="110"></rect><text class="s" text-anchor="middle" x="117" y="130">∪ Unión</text>
<rect fill="#0055a0" height="30" rx="4" width="145" x="195" y="110"></rect><text class="s" text-anchor="middle" x="267" y="130">− Diferencia</text>
<rect fill="#0055a0" height="30" rx="4" width="295" x="45" y="146"></rect><text class="s" text-anchor="middle" x="192" y="166">× Producto cartesiano</text>
<rect fill="#eaf5ef" height="150" rx="6" stroke="#2d8659" width="290" x="370" y="44"></rect><text class="h" text-anchor="middle" x="515" y="64">Derivados</text>
<rect fill="#2d8659" height="30" rx="4" width="260" x="385" y="74"></rect><text class="s" text-anchor="middle" x="515" y="94">⋈ Join (natural, theta, externo)</text>
<rect fill="#2d8659" height="30" rx="4" width="260" x="385" y="110"></rect><text class="s" text-anchor="middle" x="515" y="130">∩ Intersección</text>
<rect fill="#2d8659" height="30" rx="4" width="260" x="385" y="146"></rect><text class="s" text-anchor="middle" x="515" y="166">÷ División («para todos»)</text>
<text class="l" text-anchor="middle" x="340" y="222">σ filtra FILAS · π elige COLUMNAS · el resultado es siempre otra relación (se componen)</text>
<text class="l" text-anchor="middle" x="340" y="246">Equivale en poder expresivo al cálculo relacional (declarativo)</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="328">[Fuente: CODD70; ELMASRI, cap. 8]</text>
</svg>