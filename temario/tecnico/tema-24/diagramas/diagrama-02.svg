<rect fill="none" height="30" rx="5" stroke="#0055a0" stroke-width="2" width="560" x="60" y="312"></rect>
<text style="font:700 10.5px system-ui;fill:#0055a0" text-anchor="middle" x="340" y="332">Lo decisivo no es «usa o no web», sino CÓMO se dibuja la interfaz</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="354">[Fuente: CORDOVA-DOC; RN-DOC; FLUTTER-DOC; MDN-PWA]</text>
