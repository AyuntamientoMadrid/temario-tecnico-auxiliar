<svg aria-label="Las cuatro capas de iOS de arriba abajo: Cocoa Touch con UIKit y SwiftUI, la capa Media con gráficos y audio, Core Services con Foundation y Core Data, y Core OS con el núcleo Darwin y la seguridad del sistema" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
