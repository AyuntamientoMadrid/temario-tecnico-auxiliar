<svg aria-label="Arquitectura de una aplicación híbrida de contenedor web: una aplicación nativa contenedora aloja un WebView a pantalla completa que ejecuta el HTML, CSS y JavaScript empaquetados; el acceso al hardware pasa por un puente asíncrono hacia plugins nativos que exponen cámara, GPS y NFC" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.t12{font:700 10.5px system-ui,sans-serif;fill:#fff}.s12{font:9.5px system-ui,sans-serif;fill:#fff}.h12{font:700 13px system-ui,sans-serif;fill:#0055a0}.n12{font:700 10px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h12" text-anchor="middle" x="340" y="20">Híbrido de contenedor web (Cordova · Ionic · Capacitor)</text>
<rect fill="none" height="216" rx="8" stroke="#0055a0" stroke-width="2.5" width="370" x="20" y="38"></rect>
<text class="n12" text-anchor="middle" x="205" y="58">APLICACIÓN NATIVA CONTENEDORA</text>
<rect fill="#e89822" height="170" rx="6" width="334" x="38" y="68"></rect>
<text class="t12" text-anchor="middle" x="205" y="88">WebView a pantalla completa</text>
<text class="s12" text-anchor="middle" x="205" y="104">motor de renderizado web del sistema, sin barra de direcciones</text>
<rect fill="#0055a0" height="106" rx="5" width="298" x="56" y="118"></rect>
<text class="t12" text-anchor="middle" x="205" y="146">HTML + CSS + JavaScript</text>
<text class="s12" text-anchor="middle" x="205" y="168">Empaquetados DENTRO del binario:</text>
<text class="s12" text-anchor="middle" x="205" y="184">no se descargan de un servidor</text>
<text class="s12" text-anchor="middle" x="205" y="208">Ionic aporta componentes de interfaz por plataforma</text>
<rect fill="#d13c3c" height="170" rx="6" width="66" x="404" y="68"></rect>
<text class="t12" text-anchor="middle" x="437" y="140">PUENTE</text>
<text class="s12" text-anchor="middle" x="437" y="158">asíncrono</text>
<text class="s12" text-anchor="middle" x="437" y="174">(bridge)</text>
<path d="M356 152 L400 152" marker-end="url(#a12)" stroke="#0055a0" stroke-width="3"></path>
<path d="M472 152 L516 152" marker-end="url(#a12b)" stroke="#2d8659" stroke-width="3"></path>
<defs>
<marker id="a12" markerheight="9" markerwidth="9" orient="auto" refx="4.5" refy="4.5"><path d="M0 0 L9 4.5 L0 9 z" fill="#0055a0"></path></marker>
<marker id="a12b" markerheight="9" markerwidth="9" orient="auto" refx="4.5" refy="4.5"><path d="M0 0 L9 4.5 L0 9 z" fill="#2d8659"></path></marker>
</defs>
<rect fill="#2d8659" height="78" rx="6" width="140" x="520" y="68"></rect>
<text class="t12" text-anchor="middle" x="590" y="94">PLUGINS NATIVOS</text>
<text class="s12" text-anchor="middle" x="590" y="114">parte nativa + API</text>
<text class="s12" text-anchor="middle" x="590" y="130">JavaScript</text>
<rect fill="#888" height="78" rx="6" width="140" x="520" y="160"></rect>
<text class="t12" text-anchor="middle" x="590" y="186">HARDWARE</text>
<text class="s12" text-anchor="middle" x="590" y="206">cámara · GPS · NFC</text>
<text class="s12" text-anchor="middle" x="590" y="222">contactos · ficheros</text>
<path d="M590 148 L590 156" stroke="#2d8659" stroke-width="3"></path>
<rect fill="#d13c3c" height="34" rx="5" width="640" x="20" y="266"></rect>
<text class="t12" text-anchor="middle" x="340" y="287">Sin plugin no hay hardware: si el plugin queda sin mantenimiento, la función se rompe</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="314">[Fuente: CORDOVA-DOC; IONIC-DOC; CAPACITOR-DOC]</text>
</svg>