<svg aria-label="Comparación del número de flujos en tres topologías de videoconferencia: punto a punto entre dos participantes, malla completa entre cinco participantes con veinte flujos, y servidor central con una sola conexión por participante; con la tabla de crecimiento del ancho de banda de subida según el número de participantes" role="img" viewbox="0 0 680 356" xmlns="http://www.w3.org/2000/svg">
<style>.h7{font:700 13px system-ui,sans-serif;fill:#0055a0}.k7{font:700 10px system-ui,sans-serif;fill:#0055a0}.d7{font:9px system-ui,sans-serif;fill:#333}.n7{font:8.5px system-ui,sans-serif;fill:#666}.w7{font:700 9px system-ui,sans-serif;fill:#fff}.r7{font:700 9.5px system-ui,sans-serif;fill:#d13c3c}.g7{font:700 9.5px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h7" text-anchor="middle" x="340" y="19">Cuántos flujos genera una reunión, según la topología</text>
<text class="k7" text-anchor="middle" x="105" y="42">PUNTO A PUNTO (N = 2)</text>
<circle cx="55" cy="88" fill="#0055a0" r="17"></circle><text class="w7" text-anchor="middle" x="55" y="92">A</text>
<circle cx="155" cy="88" fill="#0055a0" r="17"></circle><text class="w7" text-anchor="middle" x="155" y="92">B</text>
<line stroke="#2d8659" stroke-width="2" x1="72" x2="138" y1="88" y2="88"></line>
<text class="g7" text-anchor="middle" x="105" y="122">2 flujos. Retardo mínimo</text>
<text class="d7" text-anchor="middle" x="105" y="135">Extremo a extremo trivial</text>
<text class="k7" text-anchor="middle" x="340" y="42">MALLA COMPLETA (N = 5)</text>
<g opacity="0.75" stroke="#d13c3c" stroke-width="0.9">
<line x1="340" x2="399" y1="62" y2="105"></line><line x1="340" x2="377" y1="62" y2="146"></line>
<line x1="340" x2="303" y1="62" y2="146"></line><line x1="340" x2="281" y1="62" y2="105"></line>
<line x1="399" x2="377" y1="105" y2="146"></line><line x1="399" x2="303" y1="105" y2="146"></line>
<line x1="399" x2="281" y1="105" y2="105"></line><line x1="377" x2="303" y1="146" y2="146"></line>
<line x1="377" x2="281" y1="146" y2="105"></line><line x1="303" x2="281" y1="146" y2="105"></line>
</g>
<circle cx="340" cy="62" fill="#d13c3c" r="14"></circle><text class="w7" text-anchor="middle" x="340" y="66">A</text>
<circle cx="399" cy="105" fill="#d13c3c" r="14"></circle><text class="w7" text-anchor="middle" x="399" y="109">B</text>
<circle cx="377" cy="146" fill="#d13c3c" r="14"></circle><text class="w7" text-anchor="middle" x="377" y="150">C</text>
<circle cx="303" cy="146" fill="#d13c3c" r="14"></circle><text class="w7" text-anchor="middle" x="303" y="150">D</text>
<circle cx="281" cy="105" fill="#d13c3c" r="14"></circle><text class="w7" text-anchor="middle" x="281" y="109">E</text>
<text class="r7" text-anchor="middle" x="340" y="180">5 × 4 = 20 flujos</text>
<text class="k7" text-anchor="middle" x="575" y="42">SERVIDOR CENTRAL (N = 5)</text>
<rect fill="#2d8659" height="26" rx="4" width="48" x="551" y="92"></rect>
<text class="w7" text-anchor="middle" x="575" y="109">MCU/SFU</text>
<circle cx="575" cy="62" fill="#0055a0" r="12"></circle>
<circle cx="630" cy="90" fill="#0055a0" r="12"></circle>
<circle cx="618" cy="140" fill="#0055a0" r="12"></circle>
<circle cx="532" cy="140" fill="#0055a0" r="12"></circle>
<circle cx="520" cy="90" fill="#0055a0" r="12"></circle>
<g stroke="#2d8659" stroke-width="1.6">
<line x1="575" x2="575" y1="74" y2="92"></line><line x1="618" x2="599" y1="94" y2="99"></line>
<line x1="606" x2="592" y1="136" y2="118"></line><line x1="544" x2="558" y1="136" y2="118"></line>
<line x1="532" x2="551" y1="94" y2="99"></line>
</g>
<text class="g7" text-anchor="middle" x="575" y="180">1 conexión por participante</text>
<rect fill="#eef4fa" height="50" rx="4" width="636" x="22" y="196"></rect>
<text class="k7" x="32" y="212">LAS FÓRMULAS QUE HAY QUE SABER</text>
<text class="d7" x="32" y="227">Malla: CADA participante sostiene N−1 subidas y N−1 bajadas · EL SISTEMA, N × (N−1) flujos · Crecimiento CUADRÁTICO en el sistema</text>
<text class="n7" x="32" y="238">Con servidor central: cada participante sube 1 flujo. Baja 1 si el servidor MEZCLA (MCU) y hasta N−1 si REENVÍA (SFU)</text>
<rect fill="#0055a0" height="22" rx="3" width="636" x="22" y="256"></rect>
<text class="w7" text-anchor="middle" x="70" y="271">Participantes</text>
<text class="w7" text-anchor="middle" x="200" y="271">Flujos del sistema en malla</text>
<text class="w7" text-anchor="middle" x="380" y="271">Subida por participante (720p a 1,54 Mbit/s)</text>
<text class="w7" text-anchor="middle" x="570" y="271">Viabilidad</text>
<rect fill="#f5f8fb" height="18" width="636" x="22" y="280"></rect>
<text class="d7" text-anchor="middle" x="70" y="293">4</text><text class="d7" text-anchor="middle" x="200" y="293">12</text>
<text class="d7" text-anchor="middle" x="380" y="293">4,6 Mbit/s</text><text class="g7" text-anchor="middle" x="570" y="293">Viable</text>
<rect fill="#fff" height="18" width="636" x="22" y="298"></rect>
<text class="d7" text-anchor="middle" x="70" y="311">6</text><text class="d7" text-anchor="middle" x="200" y="311">30</text>
<text class="d7" text-anchor="middle" x="380" y="311">7,7 Mbit/s</text><text class="d7" text-anchor="middle" x="570" y="311">En el límite</text>
<rect fill="#fbe9e9" height="18" width="636" x="22" y="316"></rect>
<text class="d7" text-anchor="middle" x="70" y="329">10</text><text class="d7" text-anchor="middle" x="200" y="329">90</text>
<text class="d7" text-anchor="middle" x="380" y="329">13,9 Mbit/s</text><text class="r7" text-anchor="middle" x="570" y="329">Inviable: manda la SUBIDA</text>
<text class="n7" text-anchor="end" x="658" y="350">[Fuente: RFC 7667, RTP Topologies · elaboración propia]</text>
</svg>