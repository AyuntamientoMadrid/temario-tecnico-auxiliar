<svg aria-label="Diagrama de secuencia del establecimiento de una llamada SIP entre dos agentes de usuario a través de un servidor apoderado, con los mensajes INVITE, 100 Trying, 180 Ringing, 200 OK y ACK, y el flujo RTP que va directamente entre los extremos sin pasar por el servidor" role="img" viewbox="0 0 680 346" xmlns="http://www.w3.org/2000/svg">
<style>.h10{font:700 13px system-ui,sans-serif;fill:#0055a0}.k10{font:700 10px system-ui,sans-serif;fill:#0055a0}.d10{font:9px system-ui,sans-serif;fill:#333}.n10{font:8.5px system-ui,sans-serif;fill:#666}.w10{font:700 9.5px system-ui,sans-serif;fill:#fff}.m10{font:700 9px system-ui,sans-serif;fill:#0055a0}.g10{font:700 9.5px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h10" text-anchor="middle" x="340" y="19">SIP: establecimiento de una llamada (RFC 3261, IETF, julio de 2002)</text>
<rect fill="#0055a0" height="24" rx="4" width="120" x="40" y="32"></rect>
<text class="w10" text-anchor="middle" x="100" y="48">AGENTE A (llama)</text>
<rect fill="#e89822" height="24" rx="4" width="120" x="280" y="32"></rect>
<text class="w10" text-anchor="middle" x="340" y="48">APODERADO (proxy)</text>
<rect fill="#0055a0" height="24" rx="4" width="120" x="520" y="32"></rect>
<text class="w10" text-anchor="middle" x="580" y="48">AGENTE B (recibe)</text>
<line stroke="#c8d4de" stroke-dasharray="4,3" stroke-width="1.4" x1="100" x2="100" y1="60" y2="250"></line>
<line stroke="#c8d4de" stroke-dasharray="4,3" stroke-width="1.4" x1="340" x2="340" y1="60" y2="250"></line>
<line stroke="#c8d4de" stroke-dasharray="4,3" stroke-width="1.4" x1="580" x2="580" y1="60" y2="250"></line>
<line marker-end="url(#a10)" stroke="#0055a0" stroke-width="1.5" x1="100" x2="334" y1="78" y2="78"></line>
<text class="m10" text-anchor="middle" x="215" y="73">INVITE (lleva la OFERTA SDP)</text>
<line marker-end="url(#a10)" stroke="#0055a0" stroke-width="1.5" x1="340" x2="574" y1="94" y2="94"></line>
<text class="m10" text-anchor="middle" x="458" y="89">INVITE</text>
<line marker-end="url(#a10g)" stroke="#8a949e" stroke-width="1.3" x1="334" x2="106" y1="112" y2="112"></line>
<text class="n10" text-anchor="middle" x="220" y="107">100 Trying (provisional, 1xx)</text>
<line marker-end="url(#a10g)" stroke="#8a949e" stroke-width="1.3" x1="574" x2="346" y1="130" y2="130"></line>
<text class="n10" text-anchor="middle" x="460" y="125">180 Ringing</text>
<line marker-end="url(#a10g)" stroke="#8a949e" stroke-width="1.3" x1="334" x2="106" y1="148" y2="148"></line>
<text class="n10" text-anchor="middle" x="220" y="143">180 Ringing</text>
<line marker-end="url(#a10v)" stroke="#2d8659" stroke-width="1.6" x1="574" x2="346" y1="166" y2="166"></line>
<text class="g10" text-anchor="middle" x="460" y="161">200 OK (lleva la RESPUESTA SDP)</text>
<line marker-end="url(#a10v)" stroke="#2d8659" stroke-width="1.6" x1="334" x2="106" y1="184" y2="184"></line>
<text class="g10" text-anchor="middle" x="220" y="179">200 OK</text>
<line marker-end="url(#a10)" stroke="#0055a0" stroke-width="1.5" x1="100" x2="574" y1="202" y2="202"></line>
<text class="m10" text-anchor="middle" x="340" y="197">ACK</text>
<rect fill="#2d8659" height="26" rx="13" width="464" x="108" y="216"></rect>
<text class="w10" text-anchor="middle" x="340" y="233">MEDIA POR RTP — DIRECTAMENTE ENTRE LOS EXTREMOS, SIN PASAR POR EL APODERADO</text>
<defs>
<marker id="a10" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#0055a0"></path></marker>
<marker id="a10g" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#8a949e"></path></marker>
<marker id="a10v" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#2d8659"></path></marker>
</defs>
<rect fill="#eef4fa" height="52" rx="4" width="312" x="22" y="256"></rect>
<text class="k10" x="32" y="272">MÉTODOS Y ENTIDADES</text>
<text class="d10" x="32" y="286">INVITE · ACK · BYE · CANCEL · REGISTER · OPTIONS</text>
<text class="d10" x="32" y="299">Agente de usuario · apoderado · redirección · registrador</text>
<rect fill="#fdf3e3" height="52" rx="4" width="312" x="346" y="256"></rect>
<text class="k10" x="356" y="272">SDP NO NEGOCIA NADA: ES UN FORMATO</text>
<text class="d10" x="356" y="286">Vigente: RFC 8866 (enero 2021), que OBSOLETÓ la RFC 4566</text>
<text class="d10" x="356" y="299">Lo negocia el modelo oferta/respuesta de la RFC 3264</text>
<text class="n10" text-anchor="end" x="658" y="336">[Fuente: RFC 3261 · RFC 8866 · RFC 3264 · RFC 3550]</text>
</svg>