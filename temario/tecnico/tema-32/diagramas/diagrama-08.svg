<svg aria-label="Los tres factores de autenticación: algo que se sabe, algo que se tiene y algo que se es, con ejemplos y debilidades de cada uno, la regla de que la autenticación multifactor exige factores de categorías distintas, y la escalera de refuerzos R1 a R4 de la medida op punto acc punto 6 del ENS" role="img" viewbox="0 0 680 344" xmlns="http://www.w3.org/2000/svg">
<style>.t8{font:700 11px system-ui,sans-serif;fill:#fff}.s8{font:8.5px system-ui,sans-serif;fill:#fff}.d8{font:9px system-ui,sans-serif;fill:#333}.h8{font:700 13px system-ui,sans-serif;fill:#0055a0}.k8{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n8{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h8" text-anchor="middle" x="340" y="20">Tres factores · multifactor exige CATEGORÍAS distintas</text>
<rect fill="#0055a0" height="40" rx="5" width="208" x="20" y="36"></rect><text class="t8" text-anchor="middle" x="124" y="54">ALGO QUE SE SABE</text><text class="s8" text-anchor="middle" x="124" y="69">conocimiento</text>
<rect fill="#2d8659" height="40" rx="5" width="208" x="236" y="36"></rect><text class="t8" text-anchor="middle" x="340" y="54">ALGO QUE SE TIENE</text><text class="s8" text-anchor="middle" x="340" y="69">posesión</text>
<rect fill="#e89822" height="40" rx="5" width="208" x="452" y="36"></rect><text class="t8" text-anchor="middle" x="556" y="54">ALGO QUE SE ES</text><text class="s8" text-anchor="middle" x="556" y="69">inherencia</text>
<rect fill="#eef3f8" height="46" rx="4" width="208" x="20" y="82"></rect><text class="d8" text-anchor="middle" x="124" y="99">Contraseña, PIN, patrón,</text><text class="d8" text-anchor="middle" x="124" y="113">pregunta de seguridad</text><text class="n8" text-anchor="middle" x="124" y="125">Se olvida, se comparte, se adivina</text>
<rect fill="#eef3f8" height="46" rx="4" width="208" x="236" y="82"></rect><text class="d8" text-anchor="middle" x="340" y="99">Tarjeta criptográfica, OTP,</text><text class="d8" text-anchor="middle" x="340" y="113">llave FIDO2, móvil</text><text class="n8" text-anchor="middle" x="340" y="125">Se pierde, se roba, se olvida en casa</text>
<rect fill="#eef3f8" height="46" rx="4" width="208" x="452" y="82"></rect><text class="d8" text-anchor="middle" x="556" y="99">Huella, iris, rostro, voz,</text><text class="d8" text-anchor="middle" x="556" y="113">patrón venoso</text><text class="n8" text-anchor="middle" x="556" y="125">No se cambia si se compromete</text>
<rect fill="#2d8659" height="30" rx="4" width="316" x="20" y="138"></rect><text class="s8" text-anchor="middle" x="178" y="157">SÍ ES MULTIFACTOR: contraseña + tarjeta · PIN + huella</text>
<rect fill="#d13c3c" height="30" rx="4" width="316" x="344" y="138"></rect><text class="s8" text-anchor="middle" x="502" y="157">NO ES MULTIFACTOR: contraseña + PIN (mismo factor)</text>
<text class="k8" x="20" y="190">ESCALERA DE MECANISMOS ADMITIDOS POR op.acc.6</text>
<rect fill="#888" height="44" rx="4" width="155" x="20" y="198"></rect><text class="t8" text-anchor="middle" x="97" y="216">R1 · Contraseña</text><text class="s8" text-anchor="middle" x="97" y="232">solo desde zona controlada</text>
<rect fill="#0055a0" height="44" rx="4" width="155" x="182" y="198"></rect><text class="t8" text-anchor="middle" x="259" y="216">R2 · Contraseña + 2F</text><text class="s8" text-anchor="middle" x="259" y="232">dispositivo u OTP</text>
<rect fill="#2d8659" height="44" rx="4" width="155" x="344" y="198"></rect><text class="t8" text-anchor="middle" x="421" y="216">R3 · Certificado</text><text class="s8" text-anchor="middle" x="421" y="232">cualificado + PIN o biometría</text>
<rect fill="#7a2f8a" height="44" rx="4" width="154" x="506" y="198"></rect><text class="t8" text-anchor="middle" x="583" y="216">R4 · Cert. en tarjeta</text><text class="s8" text-anchor="middle" x="583" y="232">soporte físico + 2F</text>
<rect fill="#fdf3e3" height="26" rx="4" width="640" x="20" y="252"></rect>
<text class="d8" text-anchor="middle" x="340" y="269">R8: desde o a través de zona NO controlada, doble factor OBLIGATORIO (R2, R3 o R4) — en todos los niveles</text>
<rect fill="#eef3f8" height="32" rx="4" width="316" x="20" y="288"></rect><text class="d8" text-anchor="middle" x="178" y="303">FAR: impostores admitidos — grave</text><text class="d8" text-anchor="middle" x="178" y="316">FRR: legítimos rechazados — molesto</text>
<rect fill="#eef3f8" height="32" rx="4" width="316" x="344" y="288"></rect><text class="d8" text-anchor="middle" x="502" y="303">EER: punto donde FAR = FRR</text><text class="d8" text-anchor="middle" x="502" y="316">Cuanto MENOR sea la EER, mejor el sistema</text>
<text class="n8" text-anchor="end" x="670" y="336">[Fuente: ENS, op.acc.6 y anexo IV; SP800-63]</text>
</svg>