<svg aria-label="Defensa en profundidad en capas sucesivas desde la política de seguridad y la formación hasta el dato cifrado, mostrando que las líneas de defensa han de ser de naturaleza organizativa, física y lógica según el artículo 9 del Esquema Nacional de Seguridad" role="img" viewbox="0 0 680 344" xmlns="http://www.w3.org/2000/svg">
<style>.t4{font:700 10.5px system-ui,sans-serif;fill:#fff}.s4{font:8.5px system-ui,sans-serif;fill:#fff}.d4{font:9px system-ui,sans-serif;fill:#333}.h4{font:700 13px system-ui,sans-serif;fill:#0055a0}.k4{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n4{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h4" text-anchor="middle" x="340" y="20">Múltiples capas: si una cae, las demás siguen</text>
<text class="k4" x="30" y="42">NATURALEZA</text><text class="k4" x="200" y="42">CAPA</text><text class="k4" x="440" y="42">MEDIDAS DEL ANEXO II</text>
<rect fill="#7a2f8a" height="44" rx="4" width="140" x="20" y="50"></rect><text class="t4" text-anchor="middle" x="90" y="70">ORGANIZATIVA</text><text class="s4" text-anchor="middle" x="90" y="85">el papel y las personas</text>
<rect fill="#eef3f8" height="44" rx="4" width="250" x="168" y="50"></rect><text class="d4" text-anchor="middle" x="293" y="70">Política, normativa, procedimientos,</text><text class="d4" text-anchor="middle" x="293" y="85">formación y concienciación</text>
<rect fill="#f5f5f5" height="44" rx="4" width="234" x="426" y="50"></rect><text class="d4" text-anchor="middle" x="543" y="70">org.1 a org.4 · mp.per.1 a mp.per.4</text><text class="d4" text-anchor="middle" x="543" y="85">op.pl · op.exp.7</text>
<rect fill="#0055a0" height="44" rx="4" width="140" x="20" y="100"></rect><text class="t4" text-anchor="middle" x="90" y="120">FÍSICA</text><text class="s4" text-anchor="middle" x="90" y="135">el edificio y la sala</text>
<rect fill="#eef3f8" height="44" rx="4" width="250" x="168" y="100"></rect><text class="d4" text-anchor="middle" x="293" y="120">Perímetro, control de acceso,</text><text class="d4" text-anchor="middle" x="293" y="135">energía, clima e incendios</text>
<rect fill="#f5f5f5" height="44" rx="4" width="234" x="426" y="100"></rect><text class="d4" text-anchor="middle" x="543" y="120">mp.if.1 a mp.if.7</text><text class="d4" text-anchor="middle" x="543" y="135">mp.eq.1 a mp.eq.4</text>
<rect fill="#2d8659" height="44" rx="4" width="140" x="20" y="150"></rect><text class="t4" text-anchor="middle" x="90" y="170">LÓGICA — red</text><text class="s4" text-anchor="middle" x="90" y="185">el camino</text>
<rect fill="#eef3f8" height="44" rx="4" width="250" x="168" y="150"></rect><text class="d4" text-anchor="middle" x="293" y="170">Segmentación, perímetro seguro,</text><text class="d4" text-anchor="middle" x="293" y="185">canal cifrado y monitorización</text>
<rect fill="#f5f5f5" height="44" rx="4" width="234" x="426" y="150"></rect><text class="d4" text-anchor="middle" x="543" y="170">mp.com.1 a mp.com.4</text><text class="d4" text-anchor="middle" x="543" y="185">op.mon.1 a op.mon.3</text>
<rect fill="#2d8659" height="44" rx="4" width="140" x="20" y="200"></rect><text class="t4" text-anchor="middle" x="90" y="220">LÓGICA — sistema</text><text class="s4" text-anchor="middle" x="90" y="235">el equipo</text>
<rect fill="#eef3f8" height="44" rx="4" width="250" x="168" y="200"></rect><text class="d4" text-anchor="middle" x="293" y="220">Bastionado, parcheo, antimalware,</text><text class="d4" text-anchor="middle" x="293" y="235">control de acceso y registro</text>
<rect fill="#f5f5f5" height="44" rx="4" width="234" x="426" y="200"></rect><text class="d4" text-anchor="middle" x="543" y="220">op.exp.2 · op.exp.4 · op.exp.6</text><text class="d4" text-anchor="middle" x="543" y="235">op.acc.1 a op.acc.6 · op.exp.8</text>
<rect fill="#e89822" height="44" rx="4" width="140" x="20" y="250"></rect><text class="t4" text-anchor="middle" x="90" y="270">LÓGICA — dato</text><text class="s4" text-anchor="middle" x="90" y="285">el activo esencial</text>
<rect fill="#eef3f8" height="44" rx="4" width="250" x="168" y="250"></rect><text class="d4" text-anchor="middle" x="293" y="270">Cifrado, firma, copias de seguridad</text><text class="d4" text-anchor="middle" x="293" y="285">y borrado seguro</text>
<rect fill="#f5f5f5" height="44" rx="4" width="234" x="426" y="250"></rect><text class="d4" text-anchor="middle" x="543" y="270">mp.si.2 · mp.si.5 · mp.info.3</text><text class="d4" text-anchor="middle" x="543" y="285">mp.info.6 · op.exp.10</text>
<rect fill="none" height="20" rx="4" stroke="#0055a0" stroke-width="1.5" width="640" x="20" y="302"></rect>
<text class="k4" text-anchor="middle" x="340" y="316">Art. 9.2 del ENS: las líneas de defensa han de ser organizativas, físicas Y lógicas</text>
<text class="n4" text-anchor="end" x="670" y="336">[Fuente: ENS, arts. 8 y 9, anexo II]</text>
</svg>