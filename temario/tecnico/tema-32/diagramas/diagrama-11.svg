<svg aria-label="Las siete fases de la cadena de ataque de Lockheed Martin: reconocimiento, preparación del arma, entrega, explotación, instalación, mando y control, y acciones sobre el objetivo, con la contramedida defensiva correspondiente a cada fase y la idea de que cuanto antes se corta la cadena menor es el daño" role="img" viewbox="0 0 680 342" xmlns="http://www.w3.org/2000/svg">
<style>.t11{font:700 10px system-ui,sans-serif;fill:#fff}.s11{font:8.5px system-ui,sans-serif;fill:#fff}.d11{font:9px system-ui,sans-serif;fill:#333}.h11{font:700 13px system-ui,sans-serif;fill:#0055a0}.k11{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n11{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h11" text-anchor="middle" x="340" y="20">Siete fases · siete oportunidades de cortar</text>
<rect fill="#0055a0" height="44" rx="4" width="88" x="20" y="36"></rect><text class="t11" text-anchor="middle" x="64" y="54">1 RECONOC.</text><text class="s11" text-anchor="middle" x="64" y="69">busca objetivo</text>
<rect fill="#1a6bb0" height="44" rx="4" width="88" x="113" y="36"></rect><text class="t11" text-anchor="middle" x="157" y="54">2 ARMA</text><text class="s11" text-anchor="middle" x="157" y="69">prepara el envío</text>
<rect fill="#3781c0" height="44" rx="4" width="88" x="206" y="36"></rect><text class="t11" text-anchor="middle" x="250" y="54">3 ENTREGA</text><text class="s11" text-anchor="middle" x="250" y="69">correo o web</text>
<rect fill="#e89822" height="44" rx="4" width="88" x="299" y="36"></rect><text class="t11" text-anchor="middle" x="343" y="54">4 EXPLOTA</text><text class="s11" text-anchor="middle" x="343" y="69">usa el fallo</text>
<rect fill="#d95d3c" height="44" rx="4" width="88" x="392" y="36"></rect><text class="t11" text-anchor="middle" x="436" y="54">5 INSTALA</text><text class="s11" text-anchor="middle" x="436" y="69">persiste</text>
<rect fill="#d13c3c" height="44" rx="4" width="88" x="485" y="36"></rect><text class="t11" text-anchor="middle" x="529" y="54">6 MANDO C2</text><text class="s11" text-anchor="middle" x="529" y="69">recibe órdenes</text>
<rect fill="#8e1c1c" height="44" rx="4" width="82" x="578" y="36"></rect><text class="t11" text-anchor="middle" x="619" y="54">7 OBJETIVO</text><text class="s11" text-anchor="middle" x="619" y="69">roba o cifra</text>
<path d="M108 58 L111 58" stroke="#666"></path><path d="M201 58 L204 58" stroke="#666"></path><path d="M294 58 L297 58" stroke="#666"></path><path d="M387 58 L390 58" stroke="#666"></path><path d="M480 58 L483 58" stroke="#666"></path><path d="M573 58 L576 58" stroke="#666"></path>
<text class="k11" x="20" y="102">CONTRAMEDIDA EN CADA FASE</text>
<rect fill="#eef3f8" height="52" rx="4" width="88" x="20" y="110"></rect><text class="d11" text-anchor="middle" x="64" y="128">Reducir la</text><text class="d11" text-anchor="middle" x="64" y="141">superficie</text><text class="d11" text-anchor="middle" x="64" y="154">expuesta</text>
<rect fill="#eef3f8" height="52" rx="4" width="88" x="113" y="110"></rect><text class="d11" text-anchor="middle" x="157" y="128">Inteligencia</text><text class="d11" text-anchor="middle" x="157" y="141">de amenazas</text><text class="d11" text-anchor="middle" x="157" y="154">CCN-CERT</text>
<rect fill="#eef3f8" height="52" rx="4" width="88" x="206" y="110"></rect><text class="d11" text-anchor="middle" x="250" y="128">Filtrado de</text><text class="d11" text-anchor="middle" x="250" y="141">correo y web</text><text class="d11" text-anchor="middle" x="250" y="154">mp.s.1 y mp.s.3</text>
<rect fill="#eef3f8" height="52" rx="4" width="88" x="299" y="110"></rect><text class="d11" text-anchor="middle" x="343" y="128">Parcheo y</text><text class="d11" text-anchor="middle" x="343" y="141">bastionado</text><text class="d11" text-anchor="middle" x="343" y="154">op.exp.4 y 2</text>
<rect fill="#eef3f8" height="52" rx="4" width="88" x="392" y="110"></rect><text class="d11" text-anchor="middle" x="436" y="128">Lista blanca</text><text class="d11" text-anchor="middle" x="436" y="141">y EDR</text><text class="d11" text-anchor="middle" x="436" y="154">op.exp.6 R3 y R4</text>
<rect fill="#eef3f8" height="52" rx="4" width="88" x="485" y="110"></rect><text class="d11" text-anchor="middle" x="529" y="128">Salida</text><text class="d11" text-anchor="middle" x="529" y="141">controlada</text><text class="d11" text-anchor="middle" x="529" y="154">op.mon.1</text>
<rect fill="#eef3f8" height="52" rx="4" width="82" x="578" y="110"></rect><text class="d11" text-anchor="middle" x="619" y="128">Cifrado y</text><text class="d11" text-anchor="middle" x="619" y="141">copias</text><text class="d11" text-anchor="middle" x="619" y="154">mp.info.6</text>
<rect fill="#fdf3e3" height="26" rx="4" width="640" x="20" y="176"></rect>
<text class="d11" text-anchor="middle" x="340" y="193">Cuanto ANTES se corta la cadena, menor es el daño: por eso hacen falta controles en TODAS las fases, no solo en el perímetro</text>
<text class="k11" x="20" y="224">MODELADO DE AMENAZAS · STRIDE Y LA PROPIEDAD QUE VULNERA CADA UNA</text>
<rect fill="#0055a0" height="44" rx="4" width="106" x="20" y="232"></rect><text class="t11" text-anchor="middle" x="73" y="250">S · Spoofing</text><text class="s11" text-anchor="middle" x="73" y="266">Autenticidad</text>
<rect fill="#0055a0" height="44" rx="4" width="106" x="132" y="232"></rect><text class="t11" text-anchor="middle" x="185" y="250">T · Tampering</text><text class="s11" text-anchor="middle" x="185" y="266">Integridad</text>
<rect fill="#7a2f8a" height="44" rx="4" width="106" x="244" y="232"></rect><text class="t11" text-anchor="middle" x="297" y="250">R · Repudiation</text><text class="s11" text-anchor="middle" x="297" y="266">No repudio</text>
<rect fill="#0055a0" height="44" rx="4" width="106" x="356" y="232"></rect><text class="t11" text-anchor="middle" x="409" y="250">I · Info. disclos.</text><text class="s11" text-anchor="middle" x="409" y="266">Confidencialidad</text>
<rect fill="#d13c3c" height="44" rx="4" width="106" x="468" y="232"></rect><text class="t11" text-anchor="middle" x="521" y="250">D · Denial of s.</text><text class="s11" text-anchor="middle" x="521" y="266">Disponibilidad</text>
<rect fill="#e89822" height="44" rx="4" width="80" x="580" y="232"></rect><text class="t11" text-anchor="middle" x="620" y="250">E · Elevation</text><text class="s11" text-anchor="middle" x="620" y="266">Autorización</text>
<rect fill="none" height="26" rx="4" stroke="#0055a0" stroke-width="1.5" width="640" x="20" y="288"></rect>
<text class="k11" text-anchor="middle" x="340" y="305">Ataque PASIVO: solo observa, difícil de detectar, se PREVIENE cifrando · Ataque ACTIVO: altera, se DETECTA y se responde</text>
<text class="n11" text-anchor="end" x="670" y="334">[Fuente: KILLCHAIN; ATTACK; STRIDE; ENS, mp.com.3]</text>
</svg>