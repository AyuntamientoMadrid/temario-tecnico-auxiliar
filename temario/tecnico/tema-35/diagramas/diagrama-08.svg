<svg aria-label="Jerarquía del DNS desde la raíz con trece identidades de servidor hasta el dominio de tercer nivel, y resolución paso a paso de sede punto madrid punto es: el cliente lanza una consulta recursiva al resolutor y este realiza consultas iterativas a la raíz, al servidor del dominio es y al servidor autoritativo de madrid punto es, cachea la respuesta durante su tiempo de vida y la entrega al cliente. El DNS usa el puerto 53, UDP para consultas y TCP para respuestas grandes y transferencias de zona" role="img" viewbox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>.t8{font:700 10px system-ui,sans-serif;fill:#fff}.s8{font:8.5px system-ui,sans-serif;fill:#fff}.d8{font:9px system-ui,sans-serif;fill:#333}.h8{font:700 13px system-ui,sans-serif;fill:#0055a0}.k8{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n8{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h8" text-anchor="middle" x="340" y="20">El cliente pregunta una vez; el resolutor pregunta tres</text>
<text class="k8" x="20" y="42">LA JERARQUÍA · un nombre se lee de derecha a izquierda</text>
<rect fill="#0055a0" height="46" rx="5" width="154" x="20" y="50"></rect><text class="t8" text-anchor="middle" x="97" y="68">RAÍZ · el punto final</text><text class="s8" text-anchor="middle" x="97" y="84">13 identidades, A a M</text>
<rect fill="#0055a0" height="46" rx="5" width="154" x="182" y="50"></rect><text class="t8" text-anchor="middle" x="259" y="68">TLD · es</text><text class="s8" text-anchor="middle" x="259" y="84">ccTLD gestionado por Red.es</text>
<rect fill="#2d8659" height="46" rx="5" width="154" x="344" y="50"></rect><text class="t8" text-anchor="middle" x="421" y="68">2.º NIVEL · madrid.es</text><text class="s8" text-anchor="middle" x="421" y="84">Zona del Ayuntamiento</text>
<rect fill="#2d8659" height="46" rx="5" width="154" x="506" y="50"></rect><text class="t8" text-anchor="middle" x="583" y="68">SUBDOMINIO · sede</text><text class="s8" text-anchor="middle" x="583" y="84">sede.madrid.es</text>
<text class="k8" x="20" y="118">RESOLUCIÓN DE sede.madrid.es</text>
<rect fill="#fdf3e3" height="28" rx="4" width="640" x="20" y="126"></rect><circle cx="38" cy="140" fill="#e89822" r="9"></circle><text class="t8" text-anchor="middle" x="38" y="143">1</text><text class="d8" x="56" y="144">CLIENTE → RESOLUTOR: consulta RECURSIVA. «Dame la dirección de sede.madrid.es, resuélvelo tú»</text>
<rect fill="#eef3f8" height="28" rx="4" width="640" x="20" y="158"></rect><circle cx="38" cy="172" fill="#0055a0" r="9"></circle><text class="t8" text-anchor="middle" x="38" y="175">2</text><text class="d8" x="56" y="176">RESOLUTOR → RAÍZ: consulta ITERATIVA. La raíz no lo sabe, pero responde con los NS de .es</text>
<rect fill="#eef3f8" height="28" rx="4" width="640" x="20" y="190"></rect><circle cx="38" cy="204" fill="#0055a0" r="9"></circle><text class="t8" text-anchor="middle" x="38" y="207">3</text><text class="d8" x="56" y="208">RESOLUTOR → SERVIDOR DE .es: responde con los NS autoritativos de madrid.es</text>
<rect fill="#eef3f8" height="28" rx="4" width="640" x="20" y="222"></rect><circle cx="38" cy="236" fill="#0055a0" r="9"></circle><text class="t8" text-anchor="middle" x="38" y="239">4</text><text class="d8" x="56" y="240">RESOLUTOR → AUTORITATIVO DE madrid.es: devuelve el registro A (IPv4) o AAAA (IPv6)</text>
<rect fill="#eaf5ef" height="28" rx="4" width="640" x="20" y="254"></rect><circle cx="38" cy="268" fill="#2d8659" r="9"></circle><text class="t8" text-anchor="middle" x="38" y="271">5</text><text class="d8" x="56" y="272">RESOLUTOR: guarda la respuesta en caché durante su TTL y la entrega al cliente</text>
<rect fill="#fdf3e3" height="40" rx="4" width="312" x="20" y="290"></rect><text class="d8" text-anchor="middle" x="176" y="306">PUERTO 53</text><text class="n8" text-anchor="middle" x="176" y="321">UDP para consultas · TCP si la respuesta es grande</text>
<rect fill="#fbeaea" height="40" rx="4" width="312" x="348" y="290"></rect><text class="d8" text-anchor="middle" x="504" y="306">TRANSFERENCIA DE ZONA</text><text class="n8" text-anchor="middle" x="504" y="321">AXFR completa e IXFR incremental: SIEMPRE por TCP</text>
<text class="k8" text-anchor="middle" x="340" y="348">Registros: A · AAAA · CNAME · MX · NS · PTR · SOA · TXT · SRV · CAA</text>
<text class="n8" text-anchor="end" x="670" y="364">[Fuente: RFC 1034 y RFC 1035; ICANN]</text>
</svg>