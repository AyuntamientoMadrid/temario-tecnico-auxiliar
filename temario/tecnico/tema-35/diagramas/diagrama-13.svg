<svg aria-label="Intercambio DHCP en cuatro pasos: Discover en difusión desde el cliente, Offer del servidor con una dirección propuesta, Request del cliente aceptando una oferta y Acknowledge del servidor confirmando la concesión. Usa UDP con el puerto 67 en el servidor y el 68 en el cliente, y la concesión se renueva al cincuenta por ciento de su duración. En IPv6 conviven SLAAC sin estado y DHCPv6 con estado en los puertos 546 y 547. Riesgos: servidor DHCP no autorizado, mitigado con DHCP snooping y RA Guard" role="img" viewbox="0 0 680 364" xmlns="http://www.w3.org/2000/svg">
<style>.t13{font:700 10px system-ui,sans-serif;fill:#fff}.s13{font:8.5px system-ui,sans-serif;fill:#fff}.d13{font:9px system-ui,sans-serif;fill:#333}.h13{font:700 13px system-ui,sans-serif;fill:#0055a0}.k13{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n13{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h13" text-anchor="middle" x="340" y="20">DORA: Discover, Offer, Request y Acknowledge</text>
<text class="k13" x="20" y="42">EL INTERCAMBIO · UDP, puerto 67 en el servidor y 68 en el cliente</text>
<rect fill="#0055a0" height="58" rx="5" width="154" x="20" y="50"></rect><text class="t13" text-anchor="middle" x="97" y="68">1 · DISCOVER</text><text class="s13" text-anchor="middle" x="97" y="84">El cliente, sin dirección,</text><text class="s13" text-anchor="middle" x="97" y="97">emite en DIFUSIÓN</text>
<rect fill="#2d8659" height="58" rx="5" width="154" x="182" y="50"></rect><text class="t13" text-anchor="middle" x="259" y="68">2 · OFFER</text><text class="s13" text-anchor="middle" x="259" y="84">Uno o varios servidores</text><text class="s13" text-anchor="middle" x="259" y="97">ofrecen una dirección</text>
<rect fill="#0055a0" height="58" rx="5" width="154" x="344" y="50"></rect><text class="t13" text-anchor="middle" x="421" y="68">3 · REQUEST</text><text class="s13" text-anchor="middle" x="421" y="84">El cliente acepta UNA</text><text class="s13" text-anchor="middle" x="421" y="97">oferta, también en difusión</text>
<rect fill="#2d8659" height="58" rx="5" width="154" x="506" y="50"></rect><text class="t13" text-anchor="middle" x="583" y="68">4 · ACK</text><text class="s13" text-anchor="middle" x="583" y="84">El servidor confirma la</text><text class="s13" text-anchor="middle" x="583" y="97">concesión y su duración</text>
<rect fill="#fdf3e3" height="26" rx="4" width="640" x="20" y="118"></rect>
<text class="d13" text-anchor="middle" x="340" y="135">Renovación: al 50 % de la concesión (T1) con el mismo servidor y, si no responde, al 87,5 % (T2) con cualquiera</text>
<text class="k13" x="20" y="166">PIEZAS CLAVE</text>
<rect fill="#eef3f8" height="44" rx="4" width="312" x="20" y="174"></rect><text class="d13" text-anchor="middle" x="176" y="190">AGENTE DE RETRANSMISIÓN</text><text class="n13" text-anchor="middle" x="176" y="205">Las difusiones no cruzan el encaminador: él reenvía la petición</text>
<rect fill="#eef3f8" height="44" rx="4" width="312" x="348" y="174"></rect><text class="d13" text-anchor="middle" x="504" y="190">RESERVA POR DIRECCIÓN MAC</text><text class="n13" text-anchor="middle" x="504" y="205">Dirección estable para impresoras y servidores</text>
<text class="k13" x="20" y="240">CONFIGURACIÓN EN IPv6 · dos vías que conviven</text>
<rect fill="#e89822" height="52" rx="5" width="312" x="20" y="248"></rect><text class="t13" text-anchor="middle" x="176" y="266">SLAAC · SIN ESTADO</text><text class="s13" text-anchor="middle" x="176" y="282">El encaminador anuncia el prefijo (RA) y</text><text class="s13" text-anchor="middle" x="176" y="295">cada equipo se construye su dirección</text>
<rect fill="#0055a0" height="52" rx="5" width="312" x="348" y="248"></rect><text class="t13" text-anchor="middle" x="504" y="266">DHCPv6 · CON ESTADO</text><text class="s13" text-anchor="middle" x="504" y="282">RFC 9915 (2026), STD 102 · UDP 547 y 546</text><text class="s13" text-anchor="middle" x="504" y="295">Mantiene registro de las concesiones</text>
<rect fill="#fbeaea" height="26" rx="4" width="640" x="20" y="308"></rect>
<text class="d13" text-anchor="middle" x="340" y="325">Un servidor DHCP no autorizado puede convertirse en intermediario: se mitiga con DHCP snooping y, en IPv6, con RA Guard</text>
<text class="n13" text-anchor="end" x="670" y="356">[Fuente: RFC 2131, RFC 9915, RFC 4862; ENS mp.com.4]</text>
</svg>