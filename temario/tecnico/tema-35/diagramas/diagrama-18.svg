<svg aria-label="Conexión HTTPS completa a una sede electrónica: resolución DNS del nombre, conexión TCP, redirección 301 de HTTP a HTTPS que es el único momento en claro y que elimina la precarga de HSTS, saludo TLS con el nombre del servidor en la extensión SNI, validación de la cadena del certificado comprobando firma, vigencia, nombre alternativo y revocación, y finalmente la petición HTTP cifrada y la respuesta con la cabecera HSTS. Se indican las medidas del Esquema Nacional de Seguridad aplicables: mp punto com punto 2 y 3, mp punto s punto 2 y op punto exp punto 10" role="img" viewbox="0 0 680 384" xmlns="http://www.w3.org/2000/svg">
<style>.t18{font:700 10px system-ui,sans-serif;fill:#fff}.s18{font:8.5px system-ui,sans-serif;fill:#fff}.d18{font:9px system-ui,sans-serif;fill:#333}.h18{font:700 13px system-ui,sans-serif;fill:#0055a0}.k18{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n18{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h18" text-anchor="middle" x="340" y="20">HTTPS no es otro protocolo: es HTTP dentro de TLS, en el puerto 443</text>
<text class="k18" x="20" y="42">EL ORDEN DE LAS CAPAS · TCP primero, TLS después, HTTP al final</text>
<rect fill="#7a2f8a" height="34" rx="4" width="206" x="20" y="50"></rect><text class="t18" text-anchor="middle" x="123" y="71">1 · TCP · saludo en tres pasos</text>
<rect fill="#0055a0" height="34" rx="4" width="206" x="237" y="50"></rect><text class="t18" text-anchor="middle" x="340" y="71">2 · TLS · saludo y claves</text>
<rect fill="#2d8659" height="34" rx="4" width="206" x="454" y="50"></rect><text class="t18" text-anchor="middle" x="557" y="71">3 · HTTP · ya cifrado</text>
<text class="k18" x="20" y="106">LA CONEXIÓN COMPLETA A sede.madrid.es</text>
<rect fill="#eef3f8" height="26" rx="4" width="640" x="20" y="114"></rect><circle cx="38" cy="127" fill="#0055a0" r="9"></circle><text class="t18" text-anchor="middle" x="38" y="130">1</text><text class="d18" x="56" y="131">DNS: se resuelve el nombre en una dirección IP (con DoT o DoH la consulta va cifrada)</text>
<rect fill="#fbeaea" height="26" rx="4" width="640" x="20" y="144"></rect><circle cx="38" cy="157" fill="#d13c3c" r="9"></circle><text class="t18" text-anchor="middle" x="38" y="160">2</text><text class="d18" x="56" y="161">Si la petición sale por HTTP/80, el servidor responde 301 · ÚNICO MOMENTO EN CLARO Y ÚNICO RIESGO</text>
<rect fill="#eef3f8" height="26" rx="4" width="640" x="20" y="174"></rect><circle cx="38" cy="187" fill="#0055a0" r="9"></circle><text class="t18" text-anchor="middle" x="38" y="190">3</text><text class="d18" x="56" y="191">TCP/443 y saludo TLS: el cliente envía el nombre del sitio en la extensión SNI, que viaja EN CLARO</text>
<rect fill="#eef3f8" height="26" rx="4" width="640" x="20" y="204"></rect><circle cx="38" cy="217" fill="#0055a0" r="9"></circle><text class="t18" text-anchor="middle" x="38" y="220">4</text><text class="d18" x="56" y="221">Validación de la cadena: firma de la AC, vigencia, nombre en el SAN, restricciones básicas y revocación</text>
<rect fill="#eaf5ef" height="26" rx="4" width="640" x="20" y="234"></rect><circle cx="38" cy="247" fill="#2d8659" r="9"></circle><text class="t18" text-anchor="middle" x="38" y="250">5</text><text class="d18" x="56" y="251">Petición HTTP cifrada; la respuesta incluye HSTS, que evita el paso 2 en las visitas siguientes</text>
<text class="k18" x="20" y="282">REFUERZOS Y RESPALDO NORMATIVO</text>
<rect fill="#fdf3e3" height="44" rx="4" width="154" x="20" y="290"></rect><text class="d18" text-anchor="middle" x="97" y="306">HSTS y precarga</text><text class="n18" text-anchor="middle" x="97" y="321">Elimina el riesgo del paso 2</text>
<rect fill="#fdf3e3" height="44" rx="4" width="154" x="182" y="290"></rect><text class="d18" text-anchor="middle" x="259" y="306">CAA y CT</text><text class="n18" text-anchor="middle" x="259" y="321">Qué AC puede emitir y qué emitió</text>
<rect fill="#eef3f8" height="44" rx="4" width="154" x="344" y="290"></rect><text class="d18" text-anchor="middle" x="421" y="306">mp.com.2 y mp.com.3</text><text class="n18" text-anchor="middle" x="421" y="321">Cifrado e integridad del canal</text>
<rect fill="#eef3f8" height="44" rx="4" width="154" x="506" y="290"></rect><text class="d18" text-anchor="middle" x="583" y="306">mp.s.2 y op.exp.10</text><text class="n18" text-anchor="middle" x="583" y="321">Auditoría web y claves</text>
<rect fill="none" height="26" rx="4" stroke="#d13c3c" stroke-width="1.5" width="640" x="20" y="338"></rect>
<text class="k18" text-anchor="middle" x="340" y="355">HTTPS oculta el contenido, las cabeceras y la ruta; NO oculta la IP de destino ni el SNI, salvo con ECH</text>
<text class="n18" text-anchor="end" x="670" y="376">[Fuente: RFC 9110, RFC 6797; ENS anexo II; Ley 40/2015, art. 38]</text>
</svg>