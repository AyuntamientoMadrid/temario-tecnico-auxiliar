<svg aria-label="Arquitectura de TLS: el protocolo Record encapsula a los subprotocolos Handshake, Alert, Change Cipher Spec y los datos de aplicación. Comparación del saludo: TLS 1.2 necesita dos vueltas completas mientras que TLS 1.3 lo resuelve en una sola vuelta porque el cliente envía ya su parte del intercambio Diffie-Hellman en el primer mensaje. Novedades de TLS 1.3: confidencialidad directa obligatoria, solo cifrado autenticado AEAD, sin RSA estático, sin renegociación y sin compresión. Estado de las versiones: SSL prohibido, TLS 1.0 y 1.1 obsoletos, TLS 1.2 y 1.3 vigentes" role="img" viewbox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>.t17{font:700 10px system-ui,sans-serif;fill:#fff}.s17{font:8.5px system-ui,sans-serif;fill:#fff}.d17{font:9px system-ui,sans-serif;fill:#333}.h17{font:700 13px system-ui,sans-serif;fill:#0055a0}.k17{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n17{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h17" text-anchor="middle" x="340" y="20">El Record transporta a todos los demás; el Handshake acuerda las claves</text>
<text class="k17" x="20" y="42">ARQUITECTURA · los subprotocolos viajan DENTRO del Record</text>
<rect fill="#0055a0" height="34" rx="4" width="154" x="20" y="50"></rect><text class="t17" text-anchor="middle" x="97" y="71">HANDSHAKE</text>
<rect fill="#0055a0" height="34" rx="4" width="154" x="182" y="50"></rect><text class="t17" text-anchor="middle" x="259" y="71">ALERT</text>
<rect fill="#888" height="34" rx="4" width="154" x="344" y="50"></rect><text class="t17" text-anchor="middle" x="421" y="71">CHANGE CIPHER SPEC</text>
<rect fill="#2d8659" height="34" rx="4" width="154" x="506" y="50"></rect><text class="t17" text-anchor="middle" x="583" y="71">DATOS DE APLICACIÓN</text>
<rect fill="#7a2f8a" height="36" rx="4" width="640" x="20" y="88"></rect><text class="t17" text-anchor="middle" x="340" y="104">RECORD PROTOCOL · fragmenta, cifra y protege la integridad de todo lo anterior</text><text class="s17" text-anchor="middle" x="340" y="118">Es el subprotocolo de más bajo nivel: en TLS 1.3 el Change Cipher Spec solo se conserva por compatibilidad</text>
<text class="k17" x="20" y="148">EL SALUDO</text>
<rect fill="#eef3f8" height="86" rx="5" width="312" x="20" y="156"></rect>
<text class="d17" text-anchor="middle" x="176" y="174">TLS 1.2 · DOS VUELTAS (2-RTT)</text>
<text class="n17" x="30" y="192">1 · ClientHello: versiones, aleatorio y suites</text>
<text class="n17" x="30" y="206">2 · ServerHello + Certificate (EN CLARO) + Done</text>
<text class="n17" x="30" y="220">3 · ClientKeyExchange + ChangeCipherSpec + Finished</text>
<text class="n17" x="30" y="234">4 · ChangeCipherSpec + Finished del servidor</text>
<rect fill="#eaf5ef" height="86" rx="5" width="312" x="348" y="156"></rect>
<text class="d17" text-anchor="middle" x="504" y="174">TLS 1.3 · UNA VUELTA (1-RTT)</text>
<text class="n17" x="358" y="192">1 · ClientHello + key_share: el cliente ya envía</text>
<text class="n17" x="358" y="206">     su parte del Diffie-Hellman efímero</text>
<text class="n17" x="358" y="220">2 · ServerHello + certificado YA CIFRADO + Finished</text>
<text class="n17" x="358" y="234">Reanudación posterior: 0-RTT (solo si es idempotente)</text>
<text class="k17" x="20" y="264">NOVEDADES DE TLS 1.3 · tres de las cinco</text>
<rect fill="#2d8659" height="44" rx="4" width="206" x="20" y="272"></rect><text class="t17" text-anchor="middle" x="123" y="290">CONFIDENCIALIDAD DIRECTA</text><text class="s17" text-anchor="middle" x="123" y="306">Obligatoria: solo ECDHE o DHE</text>
<rect fill="#2d8659" height="44" rx="4" width="206" x="237" y="272"></rect><text class="t17" text-anchor="middle" x="340" y="290">SOLO CIFRADO AEAD</text><text class="s17" text-anchor="middle" x="340" y="306">Sin RC4, 3DES ni compresión</text>
<rect fill="#2d8659" height="44" rx="4" width="206" x="454" y="272"></rect><text class="t17" text-anchor="middle" x="557" y="290">SIN RSA NI RENEGOCIACIÓN</text><text class="s17" text-anchor="middle" x="557" y="306">RSA sigue valiendo para FIRMAR</text>
<rect fill="#fbeaea" height="26" rx="4" width="640" x="20" y="324"></rect>
<text class="d17" text-anchor="middle" x="340" y="341">SSL 2.0 y 3.0 PROHIBIDOS · TLS 1.0 y 1.1 OBSOLETOS (RFC 8996) · vigentes TLS 1.2 y TLS 1.3 (RFC 9846, julio de 2026)</text>
<text class="n17" text-anchor="end" x="670" y="364">[Fuente: RFC 9846, RFC 8996, RFC 7568; CCN-STIC-807]</text>
</svg>