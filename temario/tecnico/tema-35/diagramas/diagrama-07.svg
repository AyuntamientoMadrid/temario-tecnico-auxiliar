<svg aria-label="Agotamiento de IPv4 y coexistencia con IPv6: la IANA agotó su reserva el 3 de febrero de 2011, RIPE NCC entró en la fase del último bloque barra ocho el 14 de septiembre de 2012 y alcanzó el agotamiento pleno el 25 de noviembre de 2019. Paliativos: CIDR, direccionamiento privado, NAT y CGNAT. Comparación entre IPv4 de 32 bits e IPv6 de 128 bits con cabecera fija de 40 bytes y sin difusión. Los tres mecanismos de coexistencia son la doble pila, los túneles y la traducción con NAT64 y DNS64" role="img" viewbox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>.t7{font:700 10px system-ui,sans-serif;fill:#fff}.s7{font:8.5px system-ui,sans-serif;fill:#fff}.d7{font:9px system-ui,sans-serif;fill:#333}.h7{font:700 13px system-ui,sans-serif;fill:#0055a0}.k7{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n7{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h7" text-anchor="middle" x="340" y="20">IPv4 e IPv6 son incompatibles: por eso hacen falta mecanismos de coexistencia</text>
<text class="k7" x="20" y="42">CRONOLOGÍA DEL AGOTAMIENTO</text>
<rect fill="#d13c3c" height="46" rx="5" width="206" x="20" y="50"></rect><text class="t7" text-anchor="middle" x="123" y="68">3-2-2011 · IANA</text><text class="s7" text-anchor="middle" x="123" y="84">Entrega sus últimos cinco /8</text>
<rect fill="#d13c3c" height="46" rx="5" width="206" x="237" y="50"></rect><text class="t7" text-anchor="middle" x="340" y="68">14-9-2012 · RIPE NCC</text><text class="s7" text-anchor="middle" x="340" y="84">Último /8: un solo /22 por operador</text>
<rect fill="#d13c3c" height="46" rx="5" width="206" x="454" y="50"></rect><text class="t7" text-anchor="middle" x="557" y="68">25-11-2019 · RIPE NCC</text><text class="s7" text-anchor="middle" x="557" y="84">Agotado: solo lista de espera</text>
<text class="k7" x="20" y="118">PALIATIVOS QUE APLAZARON EL PROBLEMA, PERO NO CREAN DIRECCIONES</text>
<rect fill="#eef3f8" height="42" rx="4" width="154" x="20" y="126"></rect><text class="d7" text-anchor="middle" x="97" y="142">CIDR</text><text class="n7" text-anchor="middle" x="97" y="157">Sin clases; prefijo variable</text>
<rect fill="#eef3f8" height="42" rx="4" width="154" x="182" y="126"></rect><text class="d7" text-anchor="middle" x="259" y="142">RFC 1918 · privadas</text><text class="n7" text-anchor="middle" x="259" y="157">10/8 · 172.16/12 · 192.168/16</text>
<rect fill="#eef3f8" height="42" rx="4" width="154" x="344" y="126"></rect><text class="d7" text-anchor="middle" x="421" y="142">NAT y PAT</text><text class="n7" text-anchor="middle" x="421" y="157">Rompe el extremo a extremo</text>
<rect fill="#fbeaea" height="42" rx="4" width="154" x="506" y="126"></rect><text class="d7" text-anchor="middle" x="583" y="142">CGNAT · RFC 6598</text><text class="n7" text-anchor="middle" x="583" y="157">100.64.0.0/10 · sin trazabilidad</text>
<text class="k7" x="20" y="190">LOS DOS PROTOCOLOS</text>
<rect fill="#888" height="58" rx="5" width="312" x="20" y="198"></rect><text class="t7" text-anchor="middle" x="176" y="216">IPv4 · 32 bits</text><text class="s7" text-anchor="middle" x="176" y="231">≈ 4.294 millones · cabecera de 20 a 60 bytes</text><text class="s7" text-anchor="middle" x="176" y="246">Con suma de control, difusión y ARP</text>
<rect fill="#0055a0" height="58" rx="5" width="312" x="348" y="198"></rect><text class="t7" text-anchor="middle" x="504" y="216">IPv6 · 128 bits · RFC 8200</text><text class="s7" text-anchor="middle" x="504" y="231">Cabecera FIJA de 40 bytes, sin suma de control</text><text class="s7" text-anchor="middle" x="504" y="246">Sin difusión: multidifusión y anycast · subred /64</text>
<text class="k7" x="20" y="278">LOS TRES MECANISMOS DE COEXISTENCIA · no hay ningún otro</text>
<rect fill="#2d8659" height="46" rx="5" width="206" x="20" y="286"></rect><text class="t7" text-anchor="middle" x="123" y="304">DOBLE PILA</text><text class="s7" text-anchor="middle" x="123" y="320">Ambas pilas a la vez · RECOMENDADO</text>
<rect fill="#e89822" height="46" rx="5" width="206" x="237" y="286"></rect><text class="t7" text-anchor="middle" x="340" y="304">TÚNELES</text><text class="s7" text-anchor="middle" x="340" y="320">6in4, 6to4, Teredo, GRE, 6rd</text>
<rect fill="#e89822" height="46" rx="5" width="206" x="454" y="286"></rect><text class="t7" text-anchor="middle" x="557" y="304">TRADUCCIÓN</text><text class="s7" text-anchor="middle" x="557" y="320">NAT64 + DNS64 · 464XLAT</text>
<text class="k7" text-anchor="middle" x="340" y="348">España está en torno al 10 % de adopción de IPv6, muy por debajo de la media mundial, que superó el 50 % el 28-3-2026</text>
<text class="n7" text-anchor="end" x="670" y="364">[Fuente: RFC 8200, RFC 1918, RFC 6598; RIPE NCC; Google IPv6]</text>
</svg>