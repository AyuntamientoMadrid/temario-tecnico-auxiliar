<svg aria-label="Línea del tiempo de Internet en tres etapas: la red de investigación de 1969 a 1983 con ARPANET, el protocolo TCP de Cerf y Kahn y el día de la bandera de 1983; la etapa de la Web de 1983 a 1995 con el DNS, la World Wide Web del CERN, el navegador Mosaic y la privatización de NSFNET; y la etapa de madurez con el agotamiento de IPv4, HTTP dos y tres, TLS uno punto tres y la superación del cincuenta por ciento de IPv6 en 2026" role="img" viewbox="0 0 680 356" xmlns="http://www.w3.org/2000/svg">
<style>.t1{font:700 10.5px system-ui,sans-serif;fill:#fff}.s1{font:8.5px system-ui,sans-serif;fill:#fff}.d1{font:9px system-ui,sans-serif;fill:#333}.h1{font:700 13px system-ui,sans-serif;fill:#0055a0}.k1{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n1{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h1" text-anchor="middle" x="340" y="20">Primero nace la RED (1983); la WEB llega seis años después</text>
<text class="k1" x="20" y="42">ETAPA 1 · LA RED DE INVESTIGACIÓN</text>
<rect fill="#0055a0" height="58" rx="5" width="154" x="20" y="50"></rect><text class="t1" text-anchor="middle" x="97" y="68">1969 · ARPANET</text><text class="s1" text-anchor="middle" x="97" y="83">4 nodos: UCLA, SRI,</text><text class="s1" text-anchor="middle" x="97" y="96">UCSB y Utah. Protocolo NCP</text>
<rect fill="#0055a0" height="58" rx="5" width="154" x="182" y="50"></rect><text class="t1" text-anchor="middle" x="259" y="68">1974 · TCP</text><text class="s1" text-anchor="middle" x="259" y="83">Cerf y Kahn publican el</text><text class="s1" text-anchor="middle" x="259" y="96">protocolo de interconexión</text>
<rect fill="#0055a0" height="58" rx="5" width="154" x="344" y="50"></rect><text class="t1" text-anchor="middle" x="421" y="68">1978 · TCP + IP</text><text class="s1" text-anchor="middle" x="421" y="83">Se separan: IP encamina,</text><text class="s1" text-anchor="middle" x="421" y="96">TCP da fiabilidad</text>
<rect fill="#d13c3c" height="58" rx="5" width="154" x="506" y="50"></rect><text class="t1" text-anchor="middle" x="583" y="68">1-1-1983 · FLAG DAY</text><text class="s1" text-anchor="middle" x="583" y="83">ARPANET abandona NCP</text><text class="s1" text-anchor="middle" x="583" y="96">y adopta TCP/IP</text>
<text class="k1" x="20" y="130">ETAPA 2 · LA WEB Y LA APERTURA COMERCIAL</text>
<rect fill="#2d8659" height="58" rx="5" width="154" x="20" y="138"></rect><text class="t1" text-anchor="middle" x="97" y="156">1983-1987 · DNS</text><text class="s1" text-anchor="middle" x="97" y="171">Mockapetris. Sustituye al</text><text class="s1" text-anchor="middle" x="97" y="184">fichero HOSTS.TXT</text>
<rect fill="#2d8659" height="58" rx="5" width="154" x="182" y="138"></rect><text class="t1" text-anchor="middle" x="259" y="156">1989-1991 · WWW</text><text class="s1" text-anchor="middle" x="259" y="171">Berners-Lee en el CERN:</text><text class="s1" text-anchor="middle" x="259" y="184">HTML + URL + HTTP</text>
<rect fill="#2d8659" height="58" rx="5" width="154" x="344" y="138"></rect><text class="t1" text-anchor="middle" x="421" y="156">30-4-1993 · LIBRE</text><text class="s1" text-anchor="middle" x="421" y="171">El CERN cede la Web al</text><text class="s1" text-anchor="middle" x="421" y="184">dominio público. Mosaic</text>
<rect fill="#2d8659" height="58" rx="5" width="154" x="506" y="138"></rect><text class="t1" text-anchor="middle" x="583" y="156">1990-1995</text><text class="s1" text-anchor="middle" x="583" y="171">Fin de ARPANET (1990) y</text><text class="s1" text-anchor="middle" x="583" y="184">privatización de NSFNET</text>
<text class="k1" x="20" y="218">ETAPA 3 · MADUREZ, ESCALA Y CIFRADO</text>
<rect fill="#e89822" height="58" rx="5" width="154" x="20" y="226"></rect><text class="t1" text-anchor="middle" x="97" y="244">2011-2019</text><text class="s1" text-anchor="middle" x="97" y="259">Agotamiento de IPv4:</text><text class="s1" text-anchor="middle" x="97" y="272">IANA 2011, RIPE 2019</text>
<rect fill="#e89822" height="58" rx="5" width="154" x="182" y="226"></rect><text class="t1" text-anchor="middle" x="259" y="244">2015-2022</text><text class="s1" text-anchor="middle" x="259" y="259">HTTP/2 y HTTP/3. La Web</text><text class="s1" text-anchor="middle" x="259" y="272">pasa a ser binaria</text>
<rect fill="#e89822" height="58" rx="5" width="154" x="344" y="226"></rect><text class="t1" text-anchor="middle" x="421" y="244">2018-2026 · TLS 1.3</text><text class="s1" text-anchor="middle" x="421" y="259">RFC 8446, reeditado en</text><text class="s1" text-anchor="middle" x="421" y="272">julio de 2026: RFC 9846</text>
<rect fill="#e89822" height="58" rx="5" width="154" x="506" y="226"></rect><text class="t1" text-anchor="middle" x="583" y="244">28-3-2026 · IPv6</text><text class="s1" text-anchor="middle" x="583" y="259">Supera el 50% de accesos</text><text class="s1" text-anchor="middle" x="583" y="272">medidos por Google</text>
<rect fill="none" height="34" rx="5" stroke="#0055a0" stroke-width="1.5" width="640" x="20" y="298"></rect>
<text class="k1" text-anchor="middle" x="340" y="313">INTERNET (1983) es la infraestructura · LA WEB (1991) es UN SERVICIO que se ejecuta sobre ella</text>
<text class="n1" text-anchor="middle" x="340" y="326">Sobre la misma infraestructura corren también el correo, el DNS, la transferencia de archivos y el acceso remoto</text>
<text class="n1" text-anchor="end" x="670" y="348">[Fuente: elaboración propia sobre RFC 1, RFC 801, W3C y CERN]</text>
</svg>