<svg aria-label="Mecanismo de estado en HTTP: el servidor envía la cabecera Set-Cookie y el navegador devuelve la cabecera Cookie en cada petición posterior. Atributos de seguridad: Secure obliga a HTTPS, HttpOnly impide el acceso desde JavaScript y mitiga el robo por XSS, SameSite mitiga la falsificación de petición en sitios cruzados y Expires determina si la cookie es de sesión o persistente. Comparación entre sesión en el servidor, revocable, y token autocontenido, sin estado pero no revocable" role="img" viewbox="0 0 680 356" xmlns="http://www.w3.org/2000/svg">
<style>.t16{font:700 10px system-ui,sans-serif;fill:#fff}.s16{font:8.5px system-ui,sans-serif;fill:#fff}.d16{font:9px system-ui,sans-serif;fill:#333}.h16{font:700 13px system-ui,sans-serif;fill:#0055a0}.k16{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n16{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h16" text-anchor="middle" x="340" y="20">HTTP no tiene estado: el estado se transporta en cada petición</text>
<text class="k16" x="20" y="42">EL MECANISMO</text>
<rect fill="#0055a0" height="44" rx="5" width="150" x="20" y="50"></rect><text class="t16" text-anchor="middle" x="95" y="70">NAVEGADOR</text><text class="s16" text-anchor="middle" x="95" y="85">Guarda la cookie</text>
<rect fill="#0055a0" height="44" rx="5" width="150" x="510" y="50"></rect><text class="t16" text-anchor="middle" x="585" y="70">SERVIDOR</text><text class="s16" text-anchor="middle" x="585" y="85">Identifica la sesión</text>
<path d="M506 62 L176 62" marker-end="url(#a16)" stroke="#2d8659" stroke-width="1.5"></path>
<text class="n16" text-anchor="middle" x="341" y="58">1 · Set-Cookie: JSESSIONID=8F2A...; Secure; HttpOnly; SameSite=Lax</text>
<path d="M176 84 L506 84" marker-end="url(#a16b)" stroke="#0055a0" stroke-width="1.5"></path>
<text class="n16" text-anchor="middle" x="341" y="80">2 · Cookie: JSESSIONID=8F2A... en TODAS las peticiones siguientes</text>
<defs><marker id="a16" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3"><path d="M0,0 L6,3 L0,6 z" fill="#2d8659"></path></marker><marker id="a16b" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3"><path d="M0,0 L6,3 L0,6 z" fill="#0055a0"></path></marker></defs>
<text class="k16" x="20" y="118">ATRIBUTOS DE SEGURIDAD · qué amenaza mitiga cada uno</text>
<rect fill="#2d8659" height="48" rx="4" width="154" x="20" y="126"></rect><text class="t16" text-anchor="middle" x="97" y="144">Secure</text><text class="s16" text-anchor="middle" x="97" y="160">Solo se envía por HTTPS</text>
<rect fill="#2d8659" height="48" rx="4" width="154" x="182" y="126"></rect><text class="t16" text-anchor="middle" x="259" y="144">HttpOnly</text><text class="s16" text-anchor="middle" x="259" y="160">Invisible a JavaScript: XSS</text>
<rect fill="#2d8659" height="48" rx="4" width="154" x="344" y="126"></rect><text class="t16" text-anchor="middle" x="421" y="144">SameSite</text><text class="s16" text-anchor="middle" x="421" y="160">Peticiones cruzadas: CSRF</text>
<rect fill="#e89822" height="48" rx="4" width="154" x="506" y="126"></rect><text class="t16" text-anchor="middle" x="583" y="144">Expires y Max-Age</text><text class="s16" text-anchor="middle" x="583" y="160">Sesión o persistente</text>
<text class="k16" x="20" y="196">DÓNDE VIVE EL ESTADO</text>
<rect fill="#eef3f8" height="56" rx="5" width="312" x="20" y="204"></rect><text class="d16" text-anchor="middle" x="176" y="222">SESIÓN EN EL SERVIDOR</text><text class="n16" text-anchor="middle" x="176" y="238">La cookie solo lleva un identificador opaco</text><text class="n16" text-anchor="middle" x="176" y="252">Ventaja: se puede REVOCAR al instante</text>
<rect fill="#fdf3e3" height="56" rx="5" width="312" x="348" y="204"></rect><text class="d16" text-anchor="middle" x="504" y="222">TOKEN AUTOCONTENIDO (JWT)</text><text class="n16" text-anchor="middle" x="504" y="238">El testigo lleva la información firmada</text><text class="n16" text-anchor="middle" x="504" y="252">Firmado NO es cifrado, y no se revoca sin lista</text>
<rect fill="#fbeaea" height="26" rx="4" width="640" x="20" y="270"></rect>
<text class="d16" text-anchor="middle" x="340" y="287">Para datos personales: Cache-Control no-store (no basta no-cache, que solo obliga a revalidar) y private</text>
<rect fill="none" height="26" rx="4" stroke="#0055a0" stroke-width="1.5" width="640" x="20" y="304"></rect>
<text class="k16" text-anchor="middle" x="340" y="321">Mínimo en un servicio público: Secure + HttpOnly + SameSite, identificador aleatorio y renovado tras el acceso</text>
<text class="n16" text-anchor="end" x="670" y="348">[Fuente: RFC 6265 y RFC 9111]</text>
</svg>