<svg aria-label="fetch envía una petición de red que se procesa fuera del hilo principal de JavaScript; cuando la respuesta llega, se encola en la cola de tareas y el bucle de eventos la ejecuta cuando el hilo principal queda libre" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>.t11{font:700 11px system-ui,sans-serif;fill:#fff}.s11{font:9.5px system-ui,sans-serif;fill:#fff}.l11{font:11px system-ui,sans-serif;fill:#444}.h11{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h11" text-anchor="middle" x="340" y="20">fetch() y el bucle de eventos</text>
<rect fill="#0055a0" height="60" rx="6" width="220" x="30" y="44"></rect>
<text class="t11" text-anchor="middle" x="140" y="68">Hilo único de JS</text>
<text class="s11" text-anchor="middle" x="140" y="86">Ejecuta await fetch(...)</text>
<path d="M250 74 L340 74" marker-end="url(#f11)" stroke="#888" stroke-width="2"></path>
<rect fill="#e89822" height="60" rx="6" width="220" x="350" y="44"></rect>
