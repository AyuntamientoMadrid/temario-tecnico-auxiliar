<text class="t11" text-anchor="middle" x="340" y="278">Bucle de eventos</text>
<text class="s11" text-anchor="middle" x="340" y="296">Ejecuta la continuación cuando el hilo está libre</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="332">[Fuente: V8-DOC; MDN-JS]</text>
