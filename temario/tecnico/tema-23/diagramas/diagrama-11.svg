<text class="s11" text-anchor="middle" x="460" y="86">Petición HTTP en curso</text>
<path d="M140 104 L140 150" marker-end="url(#f11)" stroke="#888" stroke-width="2"></path>
<defs><marker id="f11" markerheight="9" markerwidth="9" orient="auto" refx="4.5" refy="4.5"><path d="M0 0 L9 4.5 L0 9 z" fill="#888"></path></marker></defs>
<rect fill="#2d8659" height="60" rx="6" width="220" x="30" y="152"></rect>
<text class="t11" text-anchor="middle" x="140" y="176">Sigue ejecutando</text>
<text class="s11" text-anchor="middle" x="140" y="194">otro código sin bloquear</text>
<path d="M460 104 L460 150" marker-end="url(#f11)" stroke="#888" stroke-dasharray="4 3" stroke-width="2"></path>
<rect fill="#d13c3c" height="60" rx="6" width="220" x="350" y="152"></rect>
