<svg aria-label="El DOM representa un documento HTML como un árbol de nodos: el nodo raíz html tiene hijos head y body, head contiene title, body contiene h1 y p" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.t10{font:700 11px system-ui,sans-serif;fill:#fff}.l10{font:11px system-ui,sans-serif;fill:#444}.h10{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h10" text-anchor="middle" x="340" y="20">El DOM: documento como árbol de nodos</text>
<rect fill="#0055a0" height="36" rx="5" width="100" x="290" y="40"></rect><text class="t10" text-anchor="middle" x="340" y="63">&lt;html&gt;</text>
<path d="M340 76 L200 116" stroke="#888" stroke-width="2"></path>
<path d="M340 76 L480 116" stroke="#888" stroke-width="2"></path>
<rect fill="#2d8659" height="36" rx="5" width="100" x="150" y="118"></rect><text class="t10" text-anchor="middle" x="200" y="141">&lt;head&gt;</text>
<rect fill="#2d8659" height="36" rx="5" width="100" x="430" y="118"></rect><text class="t10" text-anchor="middle" x="480" y="141">&lt;body&gt;</text>
<path d="M200 154 L200 194" stroke="#888" stroke-width="2"></path>
<path d="M480 154 L400 194" stroke="#888" stroke-width="2"></path>
<path d="M480 154 L560 194" stroke="#888" stroke-width="2"></path>
<rect fill="#e89822" height="36" rx="5" width="100" x="150" y="196"></rect><text class="t10" text-anchor="middle" x="200" y="219">&lt;title&gt;</text>
<rect fill="#e89822" height="36" rx="5" width="100" x="350" y="196"></rect><text class="t10" text-anchor="middle" x="400" y="219">&lt;h1&gt;</text>
<rect fill="#e89822" height="36" rx="5" width="100" x="510" y="196"></rect><text class="t10" text-anchor="middle" x="560" y="219">&lt;p&gt;</text>
<rect fill="#d13c3c" height="52" rx="6" width="560" x="60" y="252"></rect>
<text class="t10" text-anchor="middle" x="340" y="272">document.querySelector('h1').textContent = '...'</text>
<text style="font:9.5px system-ui;fill:#fff" text-anchor="middle" x="340" y="290">JavaScript lee y modifica este árbol después de la carga</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="316">[Fuente: W3C-DOM4]</text>
</svg>