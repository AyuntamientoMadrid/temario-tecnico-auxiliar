<svg aria-label="Cheat sheet de métodos HTTP GET POST PUT PATCH DELETE con su idempotencia, y de las cinco familias de códigos de estado 1xx a 5xx" role="img" viewbox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<style>.t3{font:700 11px system-ui,sans-serif;fill:#fff}.s3{font:9.5px system-ui,sans-serif;fill:#fff}.l3{font:11px system-ui,sans-serif;fill:#444}.h3{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h3" text-anchor="middle" x="340" y="20">Métodos HTTP y códigos de estado</text>
<rect fill="#0055a0" height="40" rx="5" width="120" x="20" y="34"></rect><text class="t3" text-anchor="middle" x="80" y="50">GET</text><text class="s3" text-anchor="middle" x="80" y="66">idempotente · seguro</text>
<rect fill="#d13c3c" height="40" rx="5" width="120" x="150" y="34"></rect><text class="t3" text-anchor="middle" x="210" y="50">POST</text><text class="s3" text-anchor="middle" x="210" y="66">no idempotente</text>
<rect fill="#2d8659" height="40" rx="5" width="120" x="280" y="34"></rect><text class="t3" text-anchor="middle" x="340" y="50">PUT</text><text class="s3" text-anchor="middle" x="340" y="66">idempotente</text>
<rect fill="#e89822" height="40" rx="5" width="120" x="410" y="34"></rect><text class="t3" text-anchor="middle" x="470" y="50">PATCH</text><text class="s3" text-anchor="middle" x="470" y="66">no idempotente</text>
<rect fill="#2d8659" height="40" rx="5" width="120" x="540" y="34"></rect><text class="t3" text-anchor="middle" x="600" y="50">DELETE</text><text class="s3" text-anchor="middle" x="600" y="66">idempotente</text>
<line stroke="#ccc" stroke-width="1" x1="20" x2="660" y1="92" y2="92"></line>
<text style="font:700 11px system-ui;fill:#0055a0" text-anchor="middle" x="340" y="112">Familias de códigos de estado</text>
<rect fill="#888" height="56" rx="5" width="120" x="20" y="126"></rect><text class="t3" text-anchor="middle" x="80" y="146">1xx</text><text class="s3" text-anchor="middle" x="80" y="169">Informativo</text>
<rect fill="#2d8659" height="56" rx="5" width="120" x="150" y="126"></rect><text class="t3" text-anchor="middle" x="210" y="146">2xx</text><text class="s3" text-anchor="middle" x="210" y="163">Éxito</text><text class="s3" text-anchor="middle" x="210" y="176">(200, 201, 204)</text>
<rect fill="#0055a0" height="56" rx="5" width="120" x="280" y="126"></rect><text class="t3" text-anchor="middle" x="340" y="146">3xx</text><text class="s3" text-anchor="middle" x="340" y="163">Redirección</text><text class="s3" text-anchor="middle" x="340" y="176">(301, 304)</text>
<rect fill="#e89822" height="56" rx="5" width="120" x="410" y="126"></rect><text class="t3" text-anchor="middle" x="470" y="146">4xx</text><text class="s3" text-anchor="middle" x="470" y="163">Error cliente</text><text class="s3" text-anchor="middle" x="470" y="176">(401, 403, 404)</text>
<rect fill="#d13c3c" height="56" rx="5" width="120" x="540" y="126"></rect><text class="t3" text-anchor="middle" x="600" y="146">5xx</text><text class="s3" text-anchor="middle" x="600" y="163">Error servidor</text><text class="s3" text-anchor="middle" x="600" y="176">(500, 503)</text>
<rect fill="none" height="130" rx="6" stroke="#d13c3c" stroke-width="2" width="560" x="60" y="200"></rect>
<text style="font:700 12px system-ui;fill:#d13c3c" text-anchor="middle" x="340" y="222">401 vs 403 — el par más confundido</text>
<text class="l3" x="90" y="248"><tspan style="font-weight:700;fill:#d13c3c">401 Unauthorized</tspan> → fallo de AUTENTICACIÓN</text>
<text class="l3" x="90" y="266">El servidor no sabe quién eres, o tus credenciales no son válidas</text>
<text class="l3" x="90" y="292"><tspan style="font-weight:700;fill:#d13c3c">403 Forbidden</tspan> → fallo de AUTORIZACIÓN</text>
<text class="l3" x="90" y="310">Sabe quién eres, pero no tienes permiso sobre ese recurso</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="360">[Fuente: RFC9110]</text>
</svg>