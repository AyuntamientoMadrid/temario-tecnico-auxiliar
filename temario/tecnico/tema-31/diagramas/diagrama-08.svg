<svg aria-label="Las cinco características esenciales de la computación en la nube según el NIST: autoservicio bajo demanda, acceso amplio a la red, agrupación de recursos, elasticidad rápida y servicio medido, con la advertencia de que si falta una no es nube y de que ISO añade la multitenencia como sexta" role="img" viewbox="0 0 680 327" xmlns="http://www.w3.org/2000/svg">
<style>.t8{font:700 10.5px system-ui,sans-serif;fill:#fff}.s8{font:8.5px system-ui,sans-serif;fill:#fff}.d8{font:9px system-ui,sans-serif;fill:#333}.h8{font:700 13px system-ui,sans-serif;fill:#0055a0}.k8{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.f8{font:8px system-ui,sans-serif;fill:#777}</style>
<text class="h8" text-anchor="middle" x="340" y="20">Las cinco características esenciales (NIST SP 800-145)</text>
<rect fill="#0055a0" height="52" rx="6" width="126" x="20" y="34"></rect><text class="t8" text-anchor="middle" x="83" y="55">AUTOSERVICIO</text><text class="s8" text-anchor="middle" x="83" y="69">bajo demanda,</text><text class="s8" text-anchor="middle" x="83" y="80">sin pedir permiso</text>
<rect fill="#0055a0" height="52" rx="6" width="126" x="153" y="34"></rect><text class="t8" text-anchor="middle" x="216" y="55">ACCESO A LA RED</text><text class="s8" text-anchor="middle" x="216" y="69">amplio, desde</text><text class="s8" text-anchor="middle" x="216" y="80">cualquier dispositivo</text>
<rect fill="#0055a0" height="52" rx="6" width="126" x="286" y="34"></rect><text class="t8" text-anchor="middle" x="349" y="55">AGRUPACIÓN</text><text class="s8" text-anchor="middle" x="349" y="69">recursos compartidos,</text><text class="s8" text-anchor="middle" x="349" y="80">multiinquilino</text>
<rect fill="#0055a0" height="52" rx="6" width="126" x="419" y="34"></rect><text class="t8" text-anchor="middle" x="482" y="55">ELASTICIDAD</text><text class="s8" text-anchor="middle" x="482" y="69">crece y decrece</text><text class="s8" text-anchor="middle" x="482" y="80">rápidamente</text>
<rect fill="#0055a0" height="52" rx="6" width="108" x="552" y="34"></rect><text class="t8" text-anchor="middle" x="606" y="55">MEDICIÓN</text><text class="s8" text-anchor="middle" x="606" y="69">se mide, se paga</text><text class="s8" text-anchor="middle" x="606" y="80">por lo usado</text>
<text class="k8" x="20" y="110">QUÉ APORTA CADA UNA</text>
<rect fill="#eef3f8" height="22" rx="4" width="640" x="20" y="116"></rect><text class="d8" x="30" y="131">Autoservicio: convierte semanas de tramitación en minutos de consola o una llamada a la API</text>
<rect fill="#f5f5f5" height="22" rx="4" width="640" x="20" y="142"></rect><text class="d8" x="30" y="157">Acceso a la red: sin conectividad no hay servicio; la red pasa a ser tan crítica como el propio servicio</text>
<rect fill="#eef3f8" height="22" rx="4" width="640" x="20" y="168"></rect><text class="d8" x="30" y="183">Agrupación: produce la economía de escala y, a la vez, los problemas jurídicos de ubicación del dato</text>
<rect fill="#f5f5f5" height="22" rx="4" width="640" x="20" y="194"></rect><text class="d8" x="30" y="209">Elasticidad: capacidad percibida como ilimitada; solo ahorra si de verdad se decrece</text>
<rect fill="#eef3f8" height="22" rx="4" width="640" x="20" y="220"></rect><text class="d8" x="30" y="235">Medición: hace posible el pago por uso y la imputación del gasto a quien lo genera</text>
<rect fill="#d13c3c" height="26" rx="5" width="310" x="20" y="252"></rect><text class="s8" text-anchor="middle" x="175" y="269">Si falta una sola, NO es nube: es virtualización</text>
<rect fill="#e89822" height="26" rx="5" width="310" x="350" y="252"></rect><text class="s8" text-anchor="middle" x="505" y="269">ISO/IEC 17788 añade una sexta: multitenencia</text>
<rect fill="#0055a0" height="20" rx="4" width="640" x="20" y="284"></rect><text class="s8" text-anchor="middle" x="340" y="298">Regla mnemotécnica: A-A-A-E-M — Autoservicio, Acceso, Agrupación, Elasticidad, Medición</text>
<text class="f8" text-anchor="middle" x="340" y="318">[Fuente: NIST145, ISO17788]</text>
</svg>