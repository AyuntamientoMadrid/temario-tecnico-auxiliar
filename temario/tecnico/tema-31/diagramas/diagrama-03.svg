<rect fill="#fdecec" height="22" rx="4" width="80" x="370" y="214"></rect><text class="d3" text-anchor="middle" x="410" y="229">presentación</text>
<rect fill="#fdecec" height="22" rx="4" width="70" x="488" y="214"></rect><text class="d3" text-anchor="middle" x="523" y="229">negocio</text>
<rect fill="#fdecec" height="22" rx="4" width="64" x="590" y="214"></rect><text class="d3" text-anchor="middle" x="622" y="229">datos</text>
<path d="M410 240 q106 34 212 -4" fill="none" marker-end="url(#b3)" stroke="#d13c3c" stroke-dasharray="4 3" stroke-width="2"></path>
<text class="d3" text-anchor="middle" x="516" y="272">salto directo a los datos</text>
<defs><marker id="a3" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3"><path d="M0 0 L6 3 L0 6 z" fill="#2d8659"></path></marker><marker id="b3" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="3"><path d="M0 0 L6 3 L0 6 z" fill="#d13c3c"></path></marker></defs>
<rect fill="#0055a0" height="22" rx="4" width="630" x="30" y="286"></rect><text class="s3" text-anchor="middle" x="340" y="301">Si la presentación ataca directamente a la base de datos, hay tres capas dibujadas y dos de verdad</text>
<text class="f3" text-anchor="middle" x="340" y="326">[Fuente: TANENBAUM]</text>
</svg>