<svg aria-label="Los siete pilares de la Estrategia de servicios en la nube híbrida para las Administraciones Públicas de diciembre de 2022: nube híbrida por diseño, catálogo de servicios creciente, política de nube híbrida primero, soberanía del dato, orientación al dato, evolución de sistemas hacia la nube híbrida y nube segura, con sus diecinueve iniciativas agrupadas" role="img" viewbox="0 0 680 361" xmlns="http://www.w3.org/2000/svg">
<style>.t17{font:700 10px system-ui,sans-serif;fill:#fff}.s17{font:8.5px system-ui,sans-serif;fill:#fff}.d17{font:9px system-ui,sans-serif;fill:#333}.h17{font:700 13px system-ui,sans-serif;fill:#0055a0}.k17{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n17{font:700 12px system-ui,sans-serif;fill:#fff}.f17{font:8px system-ui,sans-serif;fill:#777}</style>
<text class="h17" text-anchor="middle" x="340" y="18">Estrategia de servicios en la nube híbrida para las AAPP (diciembre de 2022)</text>
<text class="k17" text-anchor="middle" x="340" y="34">7 PILARES · 19 INICIATIVAS</text>
<rect fill="#0055a0" height="34" rx="5" width="34" x="20" y="42"></rect><text class="n17" text-anchor="middle" x="37" y="64">1</text>
<rect fill="#0055a0" height="34" rx="4" width="180" x="60" y="42"></rect><text class="s17" text-anchor="middle" x="150" y="56">NUBE HÍBRIDA POR DISEÑO</text><text class="s17" text-anchor="middle" x="150" y="69">i1 ampliar nube privada · i2 interoperar</text>
<rect fill="#0055a0" height="34" rx="5" width="34" x="20" y="82"></rect><text class="n17" text-anchor="middle" x="37" y="104">2</text>
<rect fill="#0055a0" height="34" rx="4" width="180" x="60" y="82"></rect><text class="s17" text-anchor="middle" x="150" y="96">CATÁLOGO CRECIENTE</text><text class="s17" text-anchor="middle" x="150" y="109">i3 tienda · i4 intermediar · i5 ampliar</text>
<rect fill="#e89822" height="34" rx="5" width="34" x="20" y="122"></rect><text class="n17" text-anchor="middle" x="37" y="144">3</text>
<rect fill="#e89822" height="34" rx="4" width="180" x="60" y="122"></rect><text class="s17" text-anchor="middle" x="150" y="136">NUBE HÍBRIDA PRIMERO</text><text class="s17" text-anchor="middle" x="150" y="149">i6 priorizar · i7 contratación</text>
<rect fill="#2d8659" height="34" rx="5" width="34" x="20" y="162"></rect><text class="n17" text-anchor="middle" x="37" y="184">4</text>
<rect fill="#2d8659" height="34" rx="4" width="180" x="60" y="162"></rect><text class="s17" text-anchor="middle" x="150" y="176">SOBERANÍA DEL DATO</text><text class="s17" text-anchor="middle" x="150" y="189">i8 guía de riesgos · i9 contratación</text>
<rect fill="#2d8659" height="34" rx="5" width="34" x="260" y="42"></rect><text class="n17" text-anchor="middle" x="277" y="64">5</text>
<rect fill="#2d8659" height="34" rx="4" width="200" x="300" y="42"></rect><text class="s17" text-anchor="middle" x="400" y="56">ORIENTACIÓN AL DATO</text><text class="s17" text-anchor="middle" x="400" y="69">i10 plataforma del dato · i11 analítica</text>
<rect fill="#888" height="34" rx="5" width="34" x="260" y="82"></rect><text class="n17" text-anchor="middle" x="277" y="104">6</text>
<rect fill="#888" height="34" rx="4" width="200" x="300" y="82"></rect><text class="s17" text-anchor="middle" x="400" y="96">EVOLUCIÓN A LA NUBE</text><text class="s17" text-anchor="middle" x="400" y="109">i12 transformar · i13 consolidar · i14 cargas</text>
<rect fill="#d13c3c" height="74" rx="5" width="34" x="260" y="122"></rect><text class="n17" text-anchor="middle" x="277" y="164">7</text>
<rect fill="#d13c3c" height="74" rx="4" width="200" x="300" y="122"></rect><text class="s17" text-anchor="middle" x="400" y="140">NUBE SEGURA</text><text class="s17" text-anchor="middle" x="400" y="155">i15 certificación ENS de la nube</text><text class="s17" text-anchor="middle" x="400" y="168">i16 capacidades · i17 centro de operaciones</text><text class="s17" text-anchor="middle" x="400" y="181">i18 red de SOC · i19 guías CCN-STIC</text>
<rect fill="#eef3f8" height="154" rx="5" width="144" x="516" y="42"></rect><text class="k17" text-anchor="middle" x="588" y="62">DESAFÍOS</text><text class="d17" text-anchor="middle" x="588" y="82">Autonomía tecnológica</text><text class="d17" text-anchor="middle" x="588" y="100">Soberanía del dato</text><text class="d17" text-anchor="middle" x="588" y="118">Redundancia y resiliencia</text><text class="d17" text-anchor="middle" x="588" y="136">Interoperabilidad</text><text class="d17" text-anchor="middle" x="588" y="154">Protección de datos</text><text class="d17" text-anchor="middle" x="588" y="172">Ciberseguridad</text>
<rect fill="#0055a0" height="24" rx="4" width="640" x="20" y="208"></rect><text class="s17" text-anchor="middle" x="340" y="224">El principio español no es «cloud first» sin matices, sino «nube híbrida primero» (hybrid first)</text>
<rect fill="#c9d9e8" height="60" rx="5" width="310" x="20" y="240"></rect><text class="d17" text-anchor="middle" x="175" y="258">NubeSARA</text><text class="d17" text-anchor="middle" x="175" y="274">Nube PRIVADA de la AGE, desplegada</text><text class="d17" text-anchor="middle" x="175" y="288">por la SGAD en 2015 sobre la red SARA</text>
<rect fill="#cfe3d6" height="60" rx="5" width="310" x="350" y="240"></rect><text class="d17" text-anchor="middle" x="505" y="258">Catálogo IaaS y PaaS con costes</text><text class="d17" text-anchor="middle" x="505" y="274">y acuerdos de nivel de servicio; evoluciona</text><text class="d17" text-anchor="middle" x="505" y="288">a una «tienda» para todas las AAPP</text>
<rect fill="#e89822" height="22" rx="4" width="640" x="20" y="308"></rect><text class="s17" text-anchor="middle" x="340" y="323">No confundir la red SARA (la red de interconexión) con NubeSARA (la nube desplegada sobre ella)</text>
<text class="f17" text-anchor="middle" x="340" y="352">[Fuente: ESTRATEGIA-CLOUD]</text>
</svg>