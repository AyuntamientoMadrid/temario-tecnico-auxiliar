<svg aria-label="Los cuatro modelos de despliegue definidos por el NIST: nube privada de uso exclusivo de una organización, nube comunitaria para un conjunto de organizaciones con intereses comunes, nube pública abierta al público general y nube híbrida que combina dos o más de las anteriores manteniéndolas como entidades separadas; incluye la distinción entre nube híbrida y multicloud" role="img" viewbox="0 0 680 343" xmlns="http://www.w3.org/2000/svg">
<style>.t14{font:700 10.5px system-ui,sans-serif;fill:#fff}.s14{font:8.5px system-ui,sans-serif;fill:#fff}.d14{font:9px system-ui,sans-serif;fill:#333}.h14{font:700 13px system-ui,sans-serif;fill:#0055a0}.k14{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.f14{font:8px system-ui,sans-serif;fill:#777}</style>
<text class="h14" text-anchor="middle" x="340" y="20">Los cuatro modelos de despliegue (NIST)</text>
<rect fill="#2d8659" height="50" rx="6" width="155" x="20" y="34"></rect><text class="t14" text-anchor="middle" x="97" y="54">PRIVADA</text><text class="s14" text-anchor="middle" x="97" y="68">uso exclusivo de UNA</text><text class="s14" text-anchor="middle" x="97" y="79">organización</text>
<rect fill="#0055a0" height="50" rx="6" width="155" x="182" y="34"></rect><text class="t14" text-anchor="middle" x="259" y="54">COMUNITARIA</text><text class="s14" text-anchor="middle" x="259" y="68">una comunidad con</text><text class="s14" text-anchor="middle" x="259" y="79">intereses comunes</text>
<rect fill="#e89822" height="50" rx="6" width="155" x="344" y="34"></rect><text class="t14" text-anchor="middle" x="421" y="54">PÚBLICA</text><text class="s14" text-anchor="middle" x="421" y="68">uso abierto</text><text class="s14" text-anchor="middle" x="421" y="79">al público general</text>
<rect fill="#888" height="50" rx="6" width="154" x="506" y="34"></rect><text class="t14" text-anchor="middle" x="583" y="54">HÍBRIDA</text><text class="s14" text-anchor="middle" x="583" y="68">dos o más de las</text><text class="s14" text-anchor="middle" x="583" y="79">anteriores, unidas</text>
<text class="k14" x="20" y="106">¿QUIÉN LA POSEE Y OPERA?</text>
<rect fill="#eef3f8" height="34" rx="4" width="155" x="20" y="112"></rect><text class="d14" text-anchor="middle" x="97" y="127">La organización, un</text><text class="d14" text-anchor="middle" x="97" y="140">tercero o ambos</text>
<rect fill="#eef3f8" height="34" rx="4" width="155" x="182" y="112"></rect><text class="d14" text-anchor="middle" x="259" y="127">Una o varias de ellas,</text><text class="d14" text-anchor="middle" x="259" y="140">un tercero o ambos</text>
<rect fill="#eef3f8" height="34" rx="4" width="155" x="344" y="112"></rect><text class="d14" text-anchor="middle" x="421" y="127">El proveedor</text><text class="d14" text-anchor="middle" x="421" y="140">(empresa o entidad)</text>
<rect fill="#eef3f8" height="34" rx="4" width="154" x="506" y="112"></rect><text class="d14" text-anchor="middle" x="583" y="127">Cada una conserva</text><text class="d14" text-anchor="middle" x="583" y="140">su titularidad</text>
<text class="k14" x="20" y="168">¿DÓNDE ESTÁ?</text>
<rect fill="#f5f5f5" height="28" rx="4" width="155" x="20" y="174"></rect><text class="d14" text-anchor="middle" x="97" y="192">Dentro O FUERA</text>
<rect fill="#f5f5f5" height="28" rx="4" width="155" x="182" y="174"></rect><text class="d14" text-anchor="middle" x="259" y="192">Dentro o fuera</text>
<rect fill="#f5f5f5" height="28" rx="4" width="155" x="344" y="174"></rect><text class="d14" text-anchor="middle" x="421" y="192">En el proveedor</text>
<rect fill="#f5f5f5" height="28" rx="4" width="154" x="506" y="174"></rect><text class="d14" text-anchor="middle" x="583" y="192">Mixto</text>
<rect fill="#d13c3c" height="24" rx="4" width="640" x="20" y="212"></rect><text class="s14" text-anchor="middle" x="340" y="228">Error clásico: una nube privada NO tiene por qué estar en las instalaciones del cliente ni ser propiedad suya</text>
<rect fill="#e8f4ec" height="52" rx="5" width="310" x="20" y="244"></rect><text class="d14" text-anchor="middle" x="175" y="262">HÍBRIDA</text><text class="d14" text-anchor="middle" x="175" y="277">modelos de despliegue distintos</text><text class="d14" text-anchor="middle" x="175" y="290">unidos por portabilidad real</text>
<rect fill="#fdf3e2" height="52" rx="5" width="310" x="350" y="244"></rect><text class="d14" text-anchor="middle" x="505" y="262">MULTICLOUD</text><text class="d14" text-anchor="middle" x="505" y="277">varios proveedores del mismo tipo</text><text class="d14" text-anchor="middle" x="505" y="290">(no es un modelo del NIST)</text>
<rect fill="#0055a0" height="20" rx="4" width="640" x="20" y="302"></rect><text class="s14" text-anchor="middle" x="340" y="316">Se pueden dar a la vez: nube privada propia más dos proveedores públicos es híbrida y multicloud</text>
<text class="f14" text-anchor="middle" x="340" y="334">[Fuente: NIST145]</text>
</svg>