<svg aria-label="Estructura de la Ley 11 de 2022 General de Telecomunicaciones con sus ocho títulos, el principio de que las telecomunicaciones son servicios de interés general en libre competencia, el contenido del servicio universal con diez megabits por segundo, y el régimen del artículo 13 para las Administraciones públicas que instalan redes" role="img" viewbox="0 0 680 352" xmlns="http://www.w3.org/2000/svg">
<style>.t18{font:700 10px system-ui,sans-serif;fill:#fff}.s18{font:8.5px system-ui,sans-serif;fill:#fff}.d18{font:9px system-ui,sans-serif;fill:#333}.h18{font:700 13px system-ui,sans-serif;fill:#0055a0}.k18{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n18{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h18" text-anchor="middle" x="340" y="20">Ley 11/2022 · 8 títulos · 114 artículos · 3 anexos</text>
<rect fill="#8fa9c4" height="34" rx="3" width="78" x="20" y="34"></rect><text class="t18" text-anchor="middle" x="59" y="48">I</text><text class="s18" text-anchor="middle" x="59" y="62">generales</text>
<rect fill="#7196b8" height="34" rx="3" width="78" x="106" y="34"></rect><text class="t18" text-anchor="middle" x="145" y="48">II</text><text class="s18" text-anchor="middle" x="145" y="62">redes y servicios</text>
<rect fill="#0055a0" height="34" rx="3" width="78" x="192" y="34"></rect><text class="t18" text-anchor="middle" x="231" y="48">III</text><text class="s18" text-anchor="middle" x="231" y="62">servicio público</text>
<rect fill="#7196b8" height="34" rx="3" width="78" x="278" y="34"></rect><text class="t18" text-anchor="middle" x="317" y="48">IV</text><text class="s18" text-anchor="middle" x="317" y="62">equipos</text>
<rect fill="#0055a0" height="34" rx="3" width="78" x="364" y="34"></rect><text class="t18" text-anchor="middle" x="403" y="48">V</text><text class="s18" text-anchor="middle" x="403" y="62">espectro</text>
<rect fill="#7196b8" height="34" rx="3" width="78" x="450" y="34"></rect><text class="t18" text-anchor="middle" x="489" y="48">VI</text><text class="s18" text-anchor="middle" x="489" y="62">administración</text>
<rect fill="#8fa9c4" height="34" rx="3" width="60" x="536" y="34"></rect><text class="t18" text-anchor="middle" x="566" y="48">VII</text><text class="s18" text-anchor="middle" x="566" y="62">tasas</text>
<rect fill="#8fa9c4" height="34" rx="3" width="56" x="604" y="34"></rect><text class="t18" text-anchor="middle" x="632" y="48">VIII</text><text class="s18" text-anchor="middle" x="632" y="62">sanciones</text>
<rect fill="#eef3f8" height="40" rx="5" width="640" x="20" y="80"></rect>
<text class="k18" text-anchor="middle" x="340" y="97">ART. 2 · LAS TELECOMUNICACIONES SON SERVICIOS DE INTERÉS GENERAL EN LIBRE COMPETENCIA</text>
<text class="n18" text-anchor="middle" x="340" y="113">Solo son SERVICIO PÚBLICO los del art. 4: seguridad nacional, defensa, seguridad pública, seguridad vial y protección civil</text>
<rect fill="#e8f4ee" height="58" rx="5" width="640" x="20" y="130"></rect>
<text class="k18" text-anchor="middle" x="340" y="147">ART. 37 · SERVICIO UNIVERSAL — la principal obligación de servicio público</text>
<text class="n18" text-anchor="middle" x="340" y="163">(a) Acceso a internet de banda ancha en UBICACIÓN FIJA: mínimo 10 Mbit/s descendentes, escalables por real decreto a 30</text>
<text class="n18" text-anchor="middle" x="340" y="176">(b) Servicios de comunicaciones vocales · el anexo III enumera los ONCE servicios que debe soportar la conexión</text>
<rect fill="#fdf3e3" height="58" rx="5" width="640" x="20" y="198"></rect>
<text class="k18" text-anchor="middle" x="340" y="215">ART. 13 · CUANDO UNA ADMINISTRACIÓN INSTALA Y EXPLOTA REDES PÚBLICAS</text>
<text class="n18" text-anchor="middle" x="340" y="231">Principio de INVERSOR PRIVADO · separación de cuentas · neutralidad, transparencia, no distorsión y no discriminación</text>
<text class="n18" text-anchor="middle" x="340" y="244">Excepción: TDT en zonas sin cobertura, donde la ley declara que hay FALLO DE MERCADO</text>
<rect fill="#fbeaea" height="30" rx="5" width="640" x="20" y="266"></rect>
<text class="d18" text-anchor="middle" x="340" y="285">ART. 85 · El espectro es BIEN DE DOMINIO PÚBLICO, de titularidad y administración ESTATAL</text>
<rect fill="#f5f5f5" height="26" rx="4" width="206" x="20" y="306"></rect><text class="d18" text-anchor="middle" x="123" y="323">UIT · mundial</text>
<rect fill="#f5f5f5" height="26" rx="4" width="206" x="237" y="306"></rect><text class="d18" text-anchor="middle" x="340" y="323">Ministerio · espectro e incidentes</text>
<rect fill="#f5f5f5" height="26" rx="4" width="206" x="454" y="306"></rect><text class="d18" text-anchor="middle" x="557" y="323">CNMC · mercados y conflictos</text>
<text class="n18" text-anchor="end" x="670" y="346">[Fuente: Ley 11/2022, arts. 2, 4, 13, 37 y 85 y anexo III]</text>
</svg>