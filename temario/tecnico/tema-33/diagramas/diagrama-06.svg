<svg aria-label="Parámetros de calidad de un enlace con su unidad de medida: ancho de banda en hercios, caudal en bits por segundo, atenuación y relación señal ruido en decibelios, latencia y fluctuación en milisegundos, tasa de error de bit y pérdida de paquetes, con la advertencia de que el decibelio es logarítmico" role="img" viewbox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>.t6{font:700 10px system-ui,sans-serif;fill:#fff}.s6{font:8.5px system-ui,sans-serif;fill:#fff}.d6{font:9px system-ui,sans-serif;fill:#333}.h6{font:700 13px system-ui,sans-serif;fill:#0055a0}.k6{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n6{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h6" text-anchor="middle" x="340" y="20">Qué se mide, en qué unidad y qué lo estropea</text>
<text class="k6" x="26" y="42">PARÁMETRO</text><text class="k6" x="200" y="42">UNIDAD</text><text class="k6" x="330" y="42">QUÉ LO DEGRADA</text>
<rect fill="#0055a0" height="24" rx="3" width="170" x="20" y="50"></rect><text class="t6" text-anchor="middle" x="105" y="66">Ancho de banda</text>
<rect fill="#eef3f8" height="24" rx="3" width="120" x="196" y="50"></rect><text class="d6" text-anchor="middle" x="256" y="66">hercios (Hz)</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="50"></rect><text class="d6" text-anchor="middle" x="491" y="66">Es una propiedad física del medio</text>
<rect fill="#0055a0" height="24" rx="3" width="170" x="20" y="78"></rect><text class="t6" text-anchor="middle" x="105" y="94">Caudal efectivo</text>
<rect fill="#eef3f8" height="24" rx="3" width="120" x="196" y="78"></rect><text class="d6" text-anchor="middle" x="256" y="94">bits/s</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="78"></rect><text class="d6" text-anchor="middle" x="491" y="94">Cabeceras, colisiones, retransmisiones</text>
<rect fill="#e89822" height="24" rx="3" width="170" x="20" y="106"></rect><text class="t6" text-anchor="middle" x="105" y="122">Atenuación</text>
<rect fill="#fdf3e3" height="24" rx="3" width="120" x="196" y="106"></rect><text class="d6" text-anchor="middle" x="256" y="122">dB o dB/km</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="106"></rect><text class="d6" text-anchor="middle" x="491" y="122">Distancia y frecuencia</text>
<rect fill="#e89822" height="24" rx="3" width="170" x="20" y="134"></rect><text class="t6" text-anchor="middle" x="105" y="150">Relación señal-ruido</text>
<rect fill="#fdf3e3" height="24" rx="3" width="120" x="196" y="134"></rect><text class="d6" text-anchor="middle" x="256" y="150">dB</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="134"></rect><text class="d6" text-anchor="middle" x="491" y="150">Ruido térmico e interferencias</text>
<rect fill="#2d8659" height="24" rx="3" width="170" x="20" y="162"></rect><text class="t6" text-anchor="middle" x="105" y="178">Latencia</text>
<rect fill="#e8f4ee" height="24" rx="3" width="120" x="196" y="162"></rect><text class="d6" text-anchor="middle" x="256" y="178">milisegundos</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="162"></rect><text class="d6" text-anchor="middle" x="491" y="178">Distancia, número de saltos, encolamiento</text>
<rect fill="#2d8659" height="24" rx="3" width="170" x="20" y="190"></rect><text class="t6" text-anchor="middle" x="105" y="206">Fluctuación (jitter)</text>
<rect fill="#e8f4ee" height="24" rx="3" width="120" x="196" y="190"></rect><text class="d6" text-anchor="middle" x="256" y="206">milisegundos</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="190"></rect><text class="d6" text-anchor="middle" x="491" y="206">Colas variables y rutas distintas</text>
<rect fill="#d13c3c" height="24" rx="3" width="170" x="20" y="218"></rect><text class="t6" text-anchor="middle" x="105" y="234">Tasa de error (BER)</text>
<rect fill="#fbeaea" height="24" rx="3" width="120" x="196" y="218"></rect><text class="d6" text-anchor="middle" x="256" y="234">adimensional</text>
<rect fill="#f5f5f5" height="24" rx="3" width="338" x="322" y="218"></rect><text class="d6" text-anchor="middle" x="491" y="234">Ruido, interferencia, atenuación excesiva</text>
<rect fill="#eef3f8" height="42" rx="5" width="316" x="20" y="252"></rect>
<text class="k6" text-anchor="middle" x="178" y="270">LATENCIA vs FLUCTUACIÓN</text>
<text class="n6" text-anchor="middle" x="178" y="286">La transferencia sufre con la latencia; la VOZ, con la fluctuación</text>
<rect fill="#fdf3e3" height="42" rx="5" width="316" x="344" y="252"></rect>
<text class="k6" text-anchor="middle" x="502" y="270">EL DECIBELIO ES LOGARÍTMICO</text>
<text class="n6" text-anchor="middle" x="502" y="286">3 dB = doble · 10 dB = x10 · 20 dB = x100 · 30 dB = x1000</text>
<text class="n6" text-anchor="middle" x="340" y="312">Las atenuaciones en decibelios de tramos sucesivos SE SUMAN, no se multiplican</text>
<text class="n6" text-anchor="end" x="670" y="326">[Fuente: STALLINGS; UIT-T]</text>
</svg>