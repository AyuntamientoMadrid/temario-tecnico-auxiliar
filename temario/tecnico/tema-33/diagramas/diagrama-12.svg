<svg aria-label="Las cinco topologías físicas de red: bus, anillo, estrella, árbol y malla, dibujadas con sus nodos y enlaces, indicando en cada una el punto único de fallo, y la distinción entre topología física y topología lógica con el ejemplo de Ethernet conmutado y de Token Ring" role="img" viewbox="0 0 680 352" xmlns="http://www.w3.org/2000/svg">
<style>.t12{font:700 10px system-ui,sans-serif;fill:#fff}.d12{font:9px system-ui,sans-serif;fill:#333}.h12{font:700 13px system-ui,sans-serif;fill:#0055a0}.k12{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n12{font:8.5px system-ui,sans-serif;fill:#666}.ln12{stroke:#0055a0;stroke-width:1.6;fill:none}</style>
<text class="h12" text-anchor="middle" x="340" y="20">Cinco formas de unir los mismos nodos</text>
<rect fill="#0055a0" height="20" rx="3" width="124" x="20" y="34"></rect><text class="t12" text-anchor="middle" x="82" y="48">BUS</text>
<rect fill="#0055a0" height="20" rx="3" width="124" x="152" y="34"></rect><text class="t12" text-anchor="middle" x="214" y="48">ANILLO</text>
<rect fill="#0055a0" height="20" rx="3" width="124" x="284" y="34"></rect><text class="t12" text-anchor="middle" x="346" y="48">ESTRELLA</text>
<rect fill="#0055a0" height="20" rx="3" width="124" x="416" y="34"></rect><text class="t12" text-anchor="middle" x="478" y="48">ÁRBOL</text>
<rect fill="#0055a0" height="20" rx="3" width="112" x="548" y="34"></rect><text class="t12" text-anchor="middle" x="604" y="48">MALLA</text>
