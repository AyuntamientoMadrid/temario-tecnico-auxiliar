<path class="ln12" d="M574 74 L634 74 L634 112 L574 112 Z M574 74 L634 112 M634 74 L574 112"></path>
<circle cx="574" cy="74" fill="#2d8659" r="5"></circle><circle cx="634" cy="74" fill="#2d8659" r="5"></circle><circle cx="634" cy="112" fill="#2d8659" r="5"></circle><circle cx="574" cy="112" fill="#2d8659" r="5"></circle>
<text class="k12" x="26" y="146">PUNTO ÚNICO DE FALLO</text>
<rect fill="#fbeaea" height="40" rx="4" width="124" x="20" y="154"></rect><text class="d12" text-anchor="middle" x="82" y="170">El troncal</text><text class="n12" text-anchor="middle" x="82" y="185">un corte tumba todo</text>
<rect fill="#fbeaea" height="40" rx="4" width="124" x="152" y="154"></rect><text class="d12" text-anchor="middle" x="214" y="170">Cualquier nodo</text><text class="n12" text-anchor="middle" x="214" y="185">salvo doble anillo</text>
<rect fill="#fdf3e3" height="40" rx="4" width="124" x="284" y="154"></rect><text class="d12" text-anchor="middle" x="346" y="170">El nodo central</text><text class="n12" text-anchor="middle" x="346" y="185">el resto queda aislado</text>
<rect fill="#fdf3e3" height="40" rx="4" width="124" x="416" y="154"></rect><text class="d12" text-anchor="middle" x="478" y="170">Los nodos altos</text><text class="n12" text-anchor="middle" x="478" y="185">aíslan su rama</text>
<rect fill="#e8f4ee" height="40" rx="4" width="112" x="548" y="154"></rect><text class="d12" text-anchor="middle" x="604" y="170">NINGUNO</text><text class="n12" text-anchor="middle" x="604" y="185">caminos alternativos</text>
<rect fill="#eef3f8" height="26" rx="4" width="640" x="20" y="206"></rect>
<text class="d12" text-anchor="middle" x="340" y="223">Malla COMPLETA: n(n−1)/2 enlaces · crece al cuadrado y no escala · en la práctica, malla PARCIAL o doble anillo</text>
<text class="k12" x="26" y="256">TOPOLOGÍA FÍSICA FRENTE A TOPOLOGÍA LÓGICA</text>
<rect fill="#0055a0" height="46" rx="5" width="316" x="20" y="264"></rect>
<text class="t12" text-anchor="middle" x="178" y="282">Ethernet conmutado</text>
<text class="n12" style="fill:#dfe9f3" text-anchor="middle" x="178" y="299">estrella física · bus conmutado lógico</text>
<rect fill="#7a2f8a" height="46" rx="5" width="316" x="344" y="264"></rect>
<text class="t12" text-anchor="middle" x="502" y="282">Token Ring</text>
<text class="n12" style="fill:#efe4f3" text-anchor="middle" x="502" y="299">estrella física (MAU) · anillo lógico</text>
<text class="n12" text-anchor="middle" x="340" y="330">La topología física dice por dónde va el cable; la lógica, por dónde va la señal</text>
<text class="n12" text-anchor="end" x="670" y="346">[Fuente: FOROUZAN; TANENBAUM]</text>
</svg>