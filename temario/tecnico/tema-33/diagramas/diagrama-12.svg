<circle cx="346" cy="93" fill="#e89822" r="8"></circle>
<path class="ln12" d="M346 93 L306 72 M346 93 L386 72 M346 93 L306 114 M346 93 L386 114"></path>
<circle cx="306" cy="72" fill="#0055a0" r="5"></circle><circle cx="386" cy="72" fill="#0055a0" r="5"></circle><circle cx="306" cy="114" fill="#0055a0" r="5"></circle><circle cx="386" cy="114" fill="#0055a0" r="5"></circle>
