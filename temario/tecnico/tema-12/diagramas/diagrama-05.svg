<svg aria-label="Tecnologías inalámbricas ordenadas por alcance creciente: NFC menos de 4 centímetros, Bluetooth hasta 10 metros red personal, Wi-Fi decenas de metros red local" class="svd5" role="img" viewbox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd5 .t{font:700 13px system-ui,sans-serif;fill:#fff}.svd5 .s{font:11px system-ui,sans-serif;fill:#fff}.svd5 .l{font:11px system-ui,sans-serif;fill:#555}.svd5 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h" text-anchor="middle" x="340" y="26">Del contacto casi físico a la red local</text>
<rect fill="#d13c3c" height="150" rx="10" width="180" x="30" y="70"></rect><text class="t" text-anchor="middle" x="120" y="100">NFC</text><text class="s" text-anchor="middle" x="120" y="128">&lt; 4 cm · 13,56 MHz</text><text class="s" text-anchor="middle" x="120" y="152">Pagos, validación,</text><text class="s" text-anchor="middle" x="120" y="170">emparejamiento</text><text class="s" text-anchor="middle" x="120" y="200">Muy corto alcance</text>
<rect fill="#0055a0" height="150" rx="10" width="180" x="250" y="70"></rect><text class="t" text-anchor="middle" x="340" y="100">Bluetooth (WPAN)</text><text class="s" text-anchor="middle" x="340" y="128">~10 m · 2,4 GHz</text><text class="s" text-anchor="middle" x="340" y="152">Teclado, ratón,</text><text class="s" text-anchor="middle" x="340" y="170">auriculares · BLE</text><text class="s" text-anchor="middle" x="340" y="200">Periféricos personales</text>
<rect fill="#2d8659" height="150" rx="10" width="180" x="470" y="70"></rect><text class="t" text-anchor="middle" x="560" y="100">Wi-Fi (WLAN)</text><text class="s" text-anchor="middle" x="560" y="128">Decenas de m</text><text class="s" text-anchor="middle" x="560" y="152">2,4 / 5 / 6 GHz</text><text class="s" text-anchor="middle" x="560" y="170">802.11ax/be</text><text class="s" text-anchor="middle" x="560" y="200">Acceso a la red</text>
<text class="l" text-anchor="middle" x="120" y="248">menor alcance</text><text class="l" text-anchor="middle" x="560" y="248">mayor alcance</text>
<path d="M60 262 L640 262" marker-end="url(#a5)" stroke="#bbb" stroke-width="2"></path>
<defs><marker id="a5" markerheight="9" markerwidth="9" orient="auto" refx="5" refy="4"><path d="M0 0 L8 4 L0 8 z" fill="#bbb"></path></marker></defs>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="672" y="292">[Fuente: BT-SIG; IEEE 802.11]</text>
</svg>