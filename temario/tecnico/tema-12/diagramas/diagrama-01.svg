<svg aria-label="Clasificación funcional de los periféricos en cinco categorías: entrada, salida, entrada/salida, comunicación y almacenamiento, con ejemplos" class="svd1" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd1 .t{font:700 13px system-ui,sans-serif;fill:#fff}.svd1 .s{font:11px system-ui,sans-serif;fill:#fff}.svd1 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h" text-anchor="middle" x="340" y="26">Periféricos según la dirección del flujo de datos</text>
<rect fill="#0055a0" height="110" rx="8" width="130" x="30" y="50"></rect><text class="t" text-anchor="middle" x="95" y="76">ENTRADA</text><text class="s" text-anchor="middle" x="95" y="100">Teclado</text><text class="s" text-anchor="middle" x="95" y="118">Ratón</text><text class="s" text-anchor="middle" x="95" y="136">Escáner</text>
<rect fill="#2d8659" height="110" rx="8" width="130" x="180" y="50"></rect><text class="t" text-anchor="middle" x="245" y="76">SALIDA</text><text class="s" text-anchor="middle" x="245" y="100">Monitor</text><text class="s" text-anchor="middle" x="245" y="118">Impresora</text><text class="s" text-anchor="middle" x="245" y="136">Altavoces</text>
<rect fill="#003d73" height="110" rx="8" width="150" x="330" y="50"></rect><text class="t" text-anchor="middle" x="405" y="76">ENTRADA/SALIDA</text><text class="s" text-anchor="middle" x="405" y="100">Pantalla táctil</text><text class="s" text-anchor="middle" x="405" y="118">Multifunción</text><text class="s" text-anchor="middle" x="405" y="136">Disco (lee/escribe)</text>
<rect fill="#e89822" height="110" rx="8" width="150" x="500" y="50"></rect><text class="t" text-anchor="middle" x="575" y="76">COMUNICACIÓN</text><text class="s" text-anchor="middle" x="575" y="100">Tarjeta de red</text><text class="s" text-anchor="middle" x="575" y="118">Módem</text><text class="s" text-anchor="middle" x="575" y="136">Bluetooth</text>
<rect fill="#6ea3d2" height="90" rx="8" width="320" x="180" y="185"></rect><text class="t" text-anchor="middle" x="340" y="213">ALMACENAMIENTO</text><text class="s" text-anchor="middle" x="340" y="238">HDD · SSD · memoria USB · NAS · grabadora óptica</text><text class="s" text-anchor="middle" x="340" y="258">Conservan los datos de forma persistente</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="672" y="308">[Fuente: ISO 7498]</text>
</svg>