<svg aria-label="Proceso de digitalización certificada según la Norma Técnica de Interoperabilidad: captura a 200 ppp, optimización y OCR, metadatos, firma o CSV e incorporación al expediente como copia auténtica" class="svd12" role="img" viewbox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd12 .t{font:700 12px system-ui,sans-serif;fill:#fff}.svd12 .s{font:10px system-ui,sans-serif;fill:#fff}.svd12 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}.svd12 .n{font:700 12px system-ui,sans-serif;fill:#e89822}.svd12 .res{font:700 13px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h" text-anchor="middle" x="340" y="26">De papel a copia auténtica (ENI · NTI de Digitalización)</text>
<rect fill="#003d73" height="86" rx="8" width="118" x="20" y="70"></rect><text class="n" text-anchor="middle" x="79" y="58">1</text><text class="t" text-anchor="middle" x="79" y="102">Captura</text><text class="s" text-anchor="middle" x="79" y="124">Escáner</text><text class="s" text-anchor="middle" x="79" y="142">≥ 200 ppp</text>
<rect fill="#0055a0" height="86" rx="8" width="118" x="150" y="70"></rect><text class="n" text-anchor="middle" x="209" y="58">2</text><text class="t" text-anchor="middle" x="209" y="102">Optimizar</text><text class="s" text-anchor="middle" x="209" y="124">Recorte, OCR</text><text class="s" text-anchor="middle" x="209" y="142">sin alterar</text>
<rect fill="#2d8659" height="86" rx="8" width="118" x="280" y="70"></rect><text class="n" text-anchor="middle" x="339" y="58">3</text><text class="t" text-anchor="middle" x="339" y="102">Metadatos</text><text class="s" text-anchor="middle" x="339" y="124">Mínimos</text><text class="s" text-anchor="middle" x="339" y="142">obligatorios</text>
<rect fill="#e89822" height="86" rx="8" width="118" x="410" y="70"></rect><text class="n" text-anchor="middle" x="469" y="58">4</text><text class="t" text-anchor="middle" x="469" y="102">Firma / CSV</text><text class="s" text-anchor="middle" x="469" y="124">Integridad y</text><text class="s" text-anchor="middle" x="469" y="142">autenticidad</text>
<rect fill="#0055a0" height="86" rx="8" width="120" x="540" y="70"></rect><text class="n" text-anchor="middle" x="600" y="58">5</text><text class="t" text-anchor="middle" x="600" y="102">Expediente</text><text class="s" text-anchor="middle" x="600" y="124">Archivo</text><text class="s" text-anchor="middle" x="600" y="142">electrónico</text>
<g marker-end="url(#a12)" stroke="#888" stroke-width="2"><path d="M138 113 L148 113"></path><path d="M268 113 L278 113"></path><path d="M398 113 L408 113"></path><path d="M528 113 L538 113"></path></g>
<defs><marker id="a12" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4"><path d="M0 0 L8 4 L0 8 z" fill="#888"></path></marker></defs>
<rect fill="#eef6f0" height="46" rx="8" width="440" x="120" y="200"></rect><text class="res" text-anchor="middle" x="340" y="222">Resultado: COPIA AUTÉNTICA (art. 27 Ley 39/2015)</text><text class="s" style="fill:#333" text-anchor="middle" x="340" y="240">con el mismo valor que el original en papel · PDF/A</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="672" y="292">[Fuente: RD 4/2010; NTI-DIGIT; L39-2015]</text>
</svg>