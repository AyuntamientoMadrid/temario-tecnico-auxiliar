<svg aria-label="Tipos de almacenamiento secundario según su tecnología: magnéticos como disco duro y cinta, ópticos como CD DVD Blu-ray, y estado sólido con memoria flash NAND" class="svd8" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd8 .t{font:700 13px system-ui,sans-serif;fill:#fff}.svd8 .s{font:11px system-ui,sans-serif;fill:#333}.svd8 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}.svd8 .hd{font:700 12px system-ui,sans-serif;fill:#fff}</style>
<text class="h" text-anchor="middle" x="340" y="26">Almacenamiento persistente por tecnología de grabación</text>
<rect fill="#0055a0" height="40" rx="6" width="195" x="30" y="50"></rect><text class="hd" text-anchor="middle" x="127" y="75">MAGNÉTICO</text>
<rect fill="#2d8659" height="40" rx="6" width="195" x="243" y="50"></rect><text class="hd" text-anchor="middle" x="340" y="75">ÓPTICO</text>
<rect fill="#e89822" height="40" rx="6" width="195" x="456" y="50"></rect><text class="hd" text-anchor="middle" x="553" y="75">ESTADO SÓLIDO (SSD)</text>
<rect fill="#eef3f9" height="185" rx="6" width="195" x="30" y="100"></rect><rect fill="#eef6f0" height="185" rx="6" width="195" x="243" y="100"></rect><rect fill="#fbf1e2" height="185" rx="6" width="195" x="456" y="100"></rect>
<text class="s" text-anchor="middle" x="127" y="128">Polaridad magnética</text><text class="s" text-anchor="middle" x="127" y="156">HDD: platos + cabezal</text><text class="s" text-anchor="middle" x="127" y="180">Cinta (LTO): secuencial</text><text class="s" text-anchor="middle" x="127" y="212">Mucha capacidad</text><text class="s" text-anchor="middle" x="127" y="232">barata; más lento;</text><text class="s" text-anchor="middle" x="127" y="252">partes móviles</text><text class="s" text-anchor="middle" x="127" y="274">Cinta = archivo largo</text>
<text class="s" text-anchor="middle" x="340" y="128">Lectura con láser</text><text class="s" text-anchor="middle" x="340" y="156">CD ~700 MB</text><text class="s" text-anchor="middle" x="340" y="180">DVD 4,7 GB</text><text class="s" text-anchor="middle" x="340" y="204">Blu-ray 25-100 GB</text><text class="s" text-anchor="middle" x="340" y="236">En retroceso frente</text><text class="s" text-anchor="middle" x="340" y="256">a red y nube</text>
<text class="s" text-anchor="middle" x="553" y="128">Memoria flash NAND</text><text class="s" text-anchor="middle" x="553" y="156">Sin partes móviles</text><text class="s" text-anchor="middle" x="553" y="180">SATA o NVMe (PCIe)</text><text class="s" text-anchor="middle" x="553" y="212">Muy rápido,</text><text class="s" text-anchor="middle" x="553" y="232">silencioso, resistente</text><text class="s" text-anchor="middle" x="553" y="252">Más caro por GB</text><text class="s" text-anchor="middle" x="553" y="274">NVMe &gt; SATA</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="672" y="312">[Fuente: ISO 9660; APFS-NTFS]</text>
</svg>