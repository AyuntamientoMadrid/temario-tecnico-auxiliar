<svg aria-label="Comparativa de HDMI, DisplayPort y USB-C con Thunderbolt según ámbito, multipantalla y contenido transportado" class="svd3" role="img" viewbox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd3 .t{font:700 13px system-ui,sans-serif;fill:#fff}.svd3 .s{font:11px system-ui,sans-serif;fill:#333}.svd3 .hd{font:700 12px system-ui,sans-serif;fill:#0055a0}.svd3 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h" text-anchor="middle" x="340" y="26">Interfaces de vídeo y audio digital</text>
<rect fill="#0055a0" height="40" rx="6" width="200" x="30" y="46"></rect><text class="t" text-anchor="middle" x="130" y="71">HDMI</text>
<rect fill="#2d8659" height="40" rx="6" width="200" x="240" y="46"></rect><text class="t" text-anchor="middle" x="340" y="71">DisplayPort</text>
<rect fill="#e89822" height="40" rx="6" width="200" x="450" y="46"></rect><text class="t" text-anchor="middle" x="550" y="71">USB-C / Thunderbolt</text>
<rect fill="#eef3f9" height="180" rx="6" width="200" x="30" y="96"></rect><rect fill="#eef6f0" height="180" rx="6" width="200" x="240" y="96"></rect><rect fill="#fbf1e2" height="180" rx="6" width="200" x="450" y="96"></rect>
<text class="hd" text-anchor="middle" x="130" y="122">Ámbito consumo/AV</text><text class="s" text-anchor="middle" x="130" y="150">TV, consolas,</text><text class="s" text-anchor="middle" x="130" y="168">proyectores</text><text class="s" text-anchor="middle" x="130" y="200">1 pantalla/puerto</text><text class="s" text-anchor="middle" x="130" y="232">Vídeo + audio</text><text class="s" text-anchor="middle" x="130" y="256">eARC (2.1: 4K/120)</text>
<text class="hd" text-anchor="middle" x="340" y="122">Ámbito profesional</text><text class="s" text-anchor="middle" x="340" y="150">PC y monitores</text><text class="s" text-anchor="middle" x="340" y="168">estándar abierto VESA</text><text class="s" text-anchor="middle" x="340" y="200">Varias en cadena (MST)</text><text class="s" text-anchor="middle" x="340" y="232">Vídeo + audio</text><text class="s" text-anchor="middle" x="340" y="256">Muy alto ancho de banda</text>
<text class="hd" text-anchor="middle" x="550" y="122">Todo en un cable</text><text class="s" text-anchor="middle" x="550" y="150">Conector USB-C</text><text class="s" text-anchor="middle" x="550" y="168">reversible</text><text class="s" text-anchor="middle" x="550" y="200">TB4: 40 Gbps, 2×4K</text><text class="s" text-anchor="middle" x="550" y="232">Datos + vídeo + energía</text><text class="s" text-anchor="middle" x="550" y="256">Base de USB4 · docks</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="672" y="294">[Fuente: HDMI; VESA-DP; TB]</text>
</svg>