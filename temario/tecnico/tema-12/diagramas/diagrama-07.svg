<svg aria-label="Comparativa de tecnologías de impresión: láser con tóner y fusión, inyección con tinta líquida, matricial de impacto y térmica por calor" class="svd7" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd7 .t{font:700 13px system-ui,sans-serif;fill:#fff}.svd7 .s{font:10px system-ui,sans-serif;fill:#333}.svd7 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h" text-anchor="middle" x="340" y="26">Cuatro tecnologías de impresión</text>
<rect fill="#0055a0" height="36" rx="6" width="150" x="24" y="48"></rect><text class="t" text-anchor="middle" x="99" y="72">LÁSER</text>
<rect fill="#2d8659" height="36" rx="6" width="150" x="188" y="48"></rect><text class="t" text-anchor="middle" x="263" y="72">INYECCIÓN</text>
<rect fill="#e89822" height="36" rx="6" width="150" x="352" y="48"></rect><text class="t" text-anchor="middle" x="427" y="72">MATRICIAL</text>
<rect fill="#003d73" height="36" rx="6" width="140" x="516" y="48"></rect><text class="t" text-anchor="middle" x="586" y="72">TÉRMICA</text>
<rect fill="#eef3f9" height="200" rx="6" width="150" x="24" y="94"></rect><rect fill="#eef6f0" height="200" rx="6" width="150" x="188" y="94"></rect><rect fill="#fbf1e2" height="200" rx="6" width="150" x="352" y="94"></rect><rect fill="#eaf0f6" height="200" rx="6" width="140" x="516" y="94"></rect>
<text class="s" text-anchor="middle" x="99" y="122">Tóner (polvo)</text><text class="s" text-anchor="middle" x="99" y="146">Fusión por calor</text><text class="s" text-anchor="middle" x="99" y="176">Muy rápida</text><text class="s" text-anchor="middle" x="99" y="200">Bajo coste/pág.</text><text class="s" text-anchor="middle" x="99" y="236">Documentos y</text><text class="s" text-anchor="middle" x="99" y="254">volúmenes altos</text>
<text class="s" text-anchor="middle" x="263" y="122">Gotas de tinta</text><text class="s" text-anchor="middle" x="263" y="146">líquida</text><text class="s" text-anchor="middle" x="263" y="176">Gran color/foto</text><text class="s" text-anchor="middle" x="263" y="200">Equipo económico</text><text class="s" text-anchor="middle" x="263" y="236">Fotografía y</text><text class="s" text-anchor="middle" x="263" y="254">color de calidad</text>
<text class="s" text-anchor="middle" x="427" y="122">Agujas de impacto</text><text class="s" text-anchor="middle" x="427" y="146">sobre cinta</text><text class="s" text-anchor="middle" x="427" y="176">Copia por presión</text><text class="s" text-anchor="middle" x="427" y="200">(autocopiativo)</text><text class="s" text-anchor="middle" x="427" y="236">Formularios</text><text class="s" text-anchor="middle" x="427" y="254">multicopia</text>
<text class="s" text-anchor="middle" x="586" y="122">Calor sobre papel</text><text class="s" text-anchor="middle" x="586" y="146">termosensible</text><text class="s" text-anchor="middle" x="586" y="176">Sencilla, silenciosa</text><text class="s" text-anchor="middle" x="586" y="200">Sin tinta (directa)</text><text class="s" text-anchor="middle" x="586" y="236">Tickets y</text><text class="s" text-anchor="middle" x="586" y="254">etiquetas</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="672" y="312">[Fuente: HP-PRINT]</text>
</svg>