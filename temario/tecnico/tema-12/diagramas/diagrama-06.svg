<svg aria-label="Ciclo Plug and Play en cinco pasos: detección, identificación, asignación de recursos, carga del driver y disponibilidad" class="svd6" role="img" viewbox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
<style>.svd6 .t{font:700 12px system-ui,sans-serif;fill:#fff}.svd6 .s{font:10px system-ui,sans-serif;fill:#fff}.svd6 .h{font:700 14px system-ui,sans-serif;fill:#0055a0}.svd6 .n{font:700 13px system-ui,sans-serif;fill:#e89822}</style>
<text class="h" text-anchor="middle" x="340" y="28">Al conectar el dispositivo, el sistema lo configura solo</text>
<rect fill="#003d73" height="90" rx="8" width="120" x="24" y="90"></rect><text class="n" text-anchor="middle" x="84" y="60">1</text><text class="t" text-anchor="middle" x="84" y="120">Detección</text><text class="s" text-anchor="middle" x="84" y="142">El bus avisa</text><text class="s" text-anchor="middle" x="84" y="158">del nuevo HW</text>
<rect fill="#0055a0" height="90" rx="8" width="120" x="164" y="90"></rect><text class="n" text-anchor="middle" x="224" y="60">2</text><text class="t" text-anchor="middle" x="224" y="120">Identificación</text><text class="s" text-anchor="middle" x="224" y="142">VID/PID</text><text class="s" text-anchor="middle" x="224" y="158">y clase</text>
