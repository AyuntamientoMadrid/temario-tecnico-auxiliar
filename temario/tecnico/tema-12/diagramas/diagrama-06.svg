<rect fill="#0055a0" height="90" rx="8" width="120" x="444" y="90"></rect><text class="n" text-anchor="middle" x="504" y="60">4</text><text class="t" text-anchor="middle" x="504" y="120">Carga driver</text><text class="s" text-anchor="middle" x="504" y="142">Local / Update /</text><text class="s" text-anchor="middle" x="504" y="158">repositorio</text>
