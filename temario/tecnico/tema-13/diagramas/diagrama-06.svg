<svg aria-label="Rotación AVL que equilibra un árbol degenerado" class="svd6" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd6 .n{fill:#d13c3c}.svd6 .ne{fill:#2d8659}.svd6 .b{font:700 13px system-ui,sans-serif;fill:#fff}.svd6 .t{font:700 13px system-ui,sans-serif;fill:#0055a0}.svd6 .lab{font:11px system-ui,sans-serif;fill:#666}</style>
<text class="t" text-anchor="middle" x="120" y="40">Desequilibrado (FE = −2)</text>
<line stroke="#888" stroke-width="2" x1="80" x2="130" y1="70" y2="130"></line>
<line stroke="#888" stroke-width="2" x1="130" x2="180" y1="130" y2="190"></line>
<circle class="n" cx="80" cy="70" r="20"></circle><text class="b" text-anchor="middle" x="80" y="75">10</text>
<circle class="n" cx="130" cy="130" r="20"></circle><text class="b" text-anchor="middle" x="130" y="135">20</text>
<circle class="n" cx="180" cy="190" r="20"></circle><text class="b" text-anchor="middle" x="180" y="195">30</text>
<text fill="#0055a0" font="700 24px system-ui,sans-serif" text-anchor="middle" x="330" y="160">⟶</text>
<text class="lab" text-anchor="middle" x="330" y="185">rotación izq. sobre 10</text>
<text class="t" text-anchor="middle" x="540" y="40">Equilibrado (FE = 0)</text>
<line stroke="#888" stroke-width="2" x1="540" x2="490" y1="90" y2="150"></line>
<line stroke="#888" stroke-width="2" x1="540" x2="590" y1="90" y2="150"></line>
<circle class="ne" cx="540" cy="90" r="20"></circle><text class="b" text-anchor="middle" x="540" y="95">20</text>
<circle class="ne" cx="490" cy="150" r="20"></circle><text class="b" text-anchor="middle" x="490" y="155">10</text>
<circle class="ne" cx="590" cy="150" r="20"></circle><text class="b" text-anchor="middle" x="590" y="155">30</text>
<text class="lab" x="40" y="280">AVL: |altura(izq) − altura(der)| ≤ 1 en cada nodo · rotaciones O(1) · operaciones O(log n)</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="640" y="312">[Fuente: CLRS, cap. 13]</text>
</svg>