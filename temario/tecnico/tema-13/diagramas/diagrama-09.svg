<svg aria-label="Grafo con representación en matriz y en lista de adyacencia" class="svd9" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.svd9 .n{fill:#0055a0}.svd9 .b{font:700 12px system-ui,sans-serif;fill:#fff}.svd9 .m{font:12px monospace;fill:#1a1a1a}.svd9 .t{font:700 13px system-ui,sans-serif;fill:#0055a0}.svd9 .lab{font:11px system-ui,sans-serif;fill:#666}</style>
<text class="t" text-anchor="middle" x="110" y="30">Grafo (no dirigido)</text>
<line stroke="#888" stroke-width="2" x1="80" x2="160" y1="80" y2="80"></line>
<line stroke="#888" stroke-width="2" x1="80" x2="80" y1="80" y2="170"></line>
<line stroke="#888" stroke-width="2" x1="160" x2="160" y1="80" y2="170"></line>
<line stroke="#888" stroke-width="2" x1="80" x2="160" y1="170" y2="170"></line>
<circle class="n" cx="80" cy="80" r="18"></circle><text class="b" text-anchor="middle" x="80" y="85">A</text>
<circle class="n" cx="160" cy="80" r="18"></circle><text class="b" text-anchor="middle" x="160" y="85">B</text>
<circle class="n" cx="80" cy="170" r="18"></circle><text class="b" text-anchor="middle" x="80" y="175">C</text>
<circle class="n" cx="160" cy="170" r="18"></circle><text class="b" text-anchor="middle" x="160" y="175">D</text>
<text class="t" text-anchor="middle" x="300" y="30">Matriz de adyacencia — O(V²)</text>
<g class="m">
<text x="250" y="70">    A B C D</text>
<text x="250" y="92">A [ 0 1 1 0 ]</text>
<text x="250" y="114">B [ 1 0 0 1 ]</text>
<text x="250" y="136">C [ 1 0 0 1 ]</text>
<text x="250" y="158">D [ 0 1 1 0 ]</text>
</g>
<text class="t" text-anchor="middle" x="300" y="210">Lista de adyacencia — O(V+E)</text>
<g class="m">
<text x="250" y="240">A → B, C</text>
<text x="250" y="262">B → A, D</text>
<text x="250" y="284">C → A, D</text>
<text x="250" y="306">D → B, C</text>
</g>
<text class="lab" x="500" y="100">Matriz:</text>
<text class="lab" x="500" y="120">consulta arista O(1),</text>
<text class="lab" x="500" y="138">ideal grafos densos</text>
<text class="lab" x="500" y="240">Lista:</text>
<text class="lab" x="500" y="260">menos memoria,</text>
<text class="lab" x="500" y="278">ideal grafos dispersos</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="640" y="346">[Fuente: CLRS, cap. 20]</text>
</svg>