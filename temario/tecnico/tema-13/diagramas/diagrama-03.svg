<svg aria-label="Lista enlazada simple y doblemente enlazada" class="svd3" role="img" viewbox="0 0 660 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd3 .ti{font:700 14px system-ui,sans-serif;fill:#0055a0}.svd3 .b{font:700 13px system-ui,sans-serif;fill:#fff}.svd3 .lab{font:11px system-ui,sans-serif;fill:#666}</style>
<text class="ti" x="30" y="40">Simplemente enlazada</text>
