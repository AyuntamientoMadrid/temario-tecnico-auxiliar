<svg aria-label="Modos de direccionamiento" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>
    .md-title{font:600 12px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}
    .md-note{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}
    .md-op{font:700 13px system-ui,sans-serif;fill:#2d8659;text-anchor:middle}
  </style>
<text fill="#0055a0" font="700 16px system-ui,sans-serif" text-anchor="middle" x="340" y="30">Modos de direccionamiento</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="middle" x="340" y="48">operando objetivo: 42</text>
<text class="md-title" x="80" y="75">1. Inmediato</text>
<rect fill="#d8f0dc" height="30" stroke="#2d8659" stroke-width="1.5" width="110" x="25" y="90"></rect>
<text fill="#555" style="font:600 11px system-ui,sans-serif" x="35" y="110">SUMA #42</text>
<text class="md-op" x="115" y="110">← 42</text>
<text class="md-note" fill="#2d8659" font-weight="600" x="80" y="176">1 acceso</text>
<text class="md-title" x="210" y="75">2. Directo</text>
<rect fill="#eef4fa" height="30" stroke="#0055a0" stroke-width="1.5" width="110" x="155" y="90"></rect>
<text fill="#555" style="font:600 11px system-ui,sans-serif" x="170" y="110">SUMA [100]</text>
<rect fill="#d8f0dc" height="30" stroke="#2d8659" stroke-width="1.5" width="110" x="155" y="135"></rect>
<text class="md-op" x="230" y="155">42</text>
<text class="md-note" fill="#0055a0" font-weight="600" x="210" y="200">2 accesos</text>
<text class="md-title" x="340" y="75">3. Indirecto</text>
<rect fill="#eef4fa" height="30" stroke="#0055a0" stroke-width="1.5" width="110" x="285" y="90"></rect>
<text fill="#555" style="font:600 11px system-ui,sans-serif" x="297" y="110">SUMA [[500]]</text>
<rect fill="#f5f5f5" height="30" stroke="#666" stroke-width="1.5" width="110" x="285" y="135"></rect>
<text fill="#1a1a1a" style="font:600 12px system-ui,sans-serif" x="360" y="155">100</text>
<rect fill="#d8f0dc" height="30" stroke="#2d8659" stroke-width="1.5" width="110" x="285" y="180"></rect>
<text class="md-op" x="360" y="200">42</text>
<text class="md-note" fill="#d13c3c" font-weight="600" x="340" y="245">3 accesos</text>
</svg>