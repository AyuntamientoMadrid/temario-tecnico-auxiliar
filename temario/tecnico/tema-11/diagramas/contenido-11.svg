<svg aria-label="Comparativa BIOS vs UEFI" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>
    .bu-title{font:700 16px system-ui,sans-serif;text-anchor:middle}
    .bu-row{font:11px system-ui,sans-serif;fill:#1a1a1a}
    .bu-aspect{font:600 11px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}
  </style>
<text fill="#0055a0" font="700 16px system-ui,sans-serif" text-anchor="middle" x="340" y="28">BIOS vs UEFI</text>
<rect fill="#f5f5f5" height="290" rx="6" stroke="#999" width="200" x="30" y="50"></rect>
<text class="bu-title" fill="#666" x="130" y="78">BIOS · 1975</text>
<rect fill="#eef4fa" height="290" rx="6" stroke="#0055a0" stroke-width="2" width="180" x="250" y="50"></rect>
<text class="bu-aspect" x="340" y="110">Arquitectura</text>
<text class="bu-aspect" x="340" y="135">Interfaz</text>
<text class="bu-aspect" x="340" y="160">Conectividad</text>
<text class="bu-aspect" x="340" y="185">Disco de arranque</text>
<text class="bu-aspect" x="340" y="210">Disco &gt; 2 TiB</text>
<text class="bu-aspect" x="340" y="235">Arranque</text>
<text class="bu-aspect" x="340" y="260">Seguridad</text>
<text class="bu-aspect" x="340" y="285">Extensibilidad</text>
<rect fill="#d8f0dc" height="290" rx="6" stroke="#2d8659" width="200" x="450" y="50"></rect>
<text class="bu-title" fill="#2d8659" x="550" y="78">UEFI</text>
<text class="bu-row" text-anchor="middle" x="130" y="115">16 bits</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="115">32/64 bits</text>
<text class="bu-row" text-anchor="middle" x="130" y="140">Texto</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="140">GUI · ratón</text>
<text class="bu-row" fill="#d13c3c" text-anchor="middle" x="130" y="165">Aislado</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="165">Internet</text>
<text class="bu-row" fill="#d13c3c" text-anchor="middle" x="130" y="190">Esquema MBR</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="190">GPT (nativo)</text>
<text class="bu-row" fill="#d13c3c" text-anchor="middle" x="130" y="215">No (límite MBR)</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="215">Sí (con GPT)</text>
<text class="bu-row" text-anchor="middle" x="130" y="240">Lento ~30s</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="240">Rápido ~5s</text>
<text class="bu-row" fill="#d13c3c" text-anchor="middle" x="130" y="265">Sin verific.</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="265">Secure Boot</text>
<text class="bu-row" fill="#d13c3c" text-anchor="middle" x="130" y="290">Firme</text>
<text class="bu-row" fill="#2d8659" text-anchor="middle" x="550" y="290">Modular</text>
</svg>