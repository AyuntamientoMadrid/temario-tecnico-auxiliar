<svg aria-label="Bloques internos de la CPU: ALU, Unidad de Control y Banco de Registros, conectados con Memoria RAM, E/S y ROM/BIOS mediante buses de control, direcciones y datos" role="img" viewbox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
<style>
    .cpu-heading{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}
    .cpu-heading-dark{font:700 14px system-ui,sans-serif;fill:#0a2540;text-anchor:middle}
    .cpu-sub{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}
    .cpu-sub-light{font:11px system-ui,sans-serif;fill:#cde4f0;text-anchor:middle}
    .cpu-chip{font:700 12px system-ui,sans-serif;fill:#0055a0;letter-spacing:2px}
    .cpu-bus{font:600 12px system-ui,sans-serif;text-anchor:middle}
  </style>
<rect fill="#eef4fa" height="240" rx="8" stroke="#0055a0" stroke-dasharray="6 4" stroke-width="2" width="380" x="50" y="60"></rect>
<text class="cpu-chip" x="70" y="82">CPU / MICROPROCESADOR</text>
<rect fill="#0055a0" height="65" rx="4" width="150" x="80" y="100"></rect>
<text class="cpu-heading" x="155" y="125">ALU</text>
<text class="cpu-sub-light" x="155" y="145">aritmético-lógica</text>
<text class="cpu-sub-light" x="155" y="158">+ − × ÷ AND OR XOR</text>
<rect fill="#0055a0" height="65" rx="4" width="160" x="250" y="100"></rect>
<text class="cpu-heading" x="330" y="125">Unidad de Control</text>
<text class="cpu-sub-light" x="330" y="145">reloj + CP + decoder</text>
<text class="cpu-sub-light" x="330" y="158">+ secuenciador</text>
<rect fill="#3378b9" height="90" rx="4" width="330" x="80" y="190"></rect>
<text class="cpu-heading" x="245" y="215">Banco de Registros</text>
<text class="cpu-sub-light" x="245" y="237">MAR · MBR · CP · RI · ACC</text>
<text class="cpu-sub-light" x="245" y="253">FLAGS · SP · GPRs · SPRs</text>
<rect fill="#d6e4f0" height="50" rx="4" stroke="#0055a0" stroke-width="1.5" width="140" x="530" y="80"></rect>
<text class="cpu-heading-dark" x="600" y="110">Memoria RAM</text>
<rect fill="#d6e4f0" height="50" rx="4" stroke="#0055a0" stroke-width="1.5" width="140" x="530" y="150"></rect>
<text class="cpu-heading-dark" x="600" y="180">E/S</text>
<rect fill="#d6e4f0" height="50" rx="4" stroke="#0055a0" stroke-width="1.5" width="140" x="530" y="220"></rect>
<text class="cpu-heading-dark" x="600" y="250">ROM / BIOS</text>
<line stroke="#a82828" stroke-width="2.5" x1="430" x2="530" y1="120" y2="105"></line>
<text class="cpu-bus" fill="#a82828" x="480" y="104">control</text>
<line stroke="#1f6644" stroke-width="2.5" x1="430" x2="530" y1="170" y2="175"></line>
<text class="cpu-bus" fill="#1f6644" x="480" y="164">direcciones</text>
<line stroke="#003d73" stroke-width="2.5" x1="430" x2="530" y1="240" y2="245"></line>
<text class="cpu-bus" fill="#003d73" x="480" y="234">datos</text>
</svg>