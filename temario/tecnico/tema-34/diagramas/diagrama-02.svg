<svg aria-label="Reparto de competencias de normalización: ISO y UIT-T publican el modelo OSI, el IETF publica los RFC de la pila TCP-IP, el IEEE normaliza las capas física y de enlace mediante la serie 802, e IANA bajo ICANN administra los números de puerto, de protocolo y las direcciones a través de los cinco registros regionales" role="img" viewbox="0 0 680 346" xmlns="http://www.w3.org/2000/svg">
<style>.t2{font:700 10.5px system-ui,sans-serif;fill:#fff}.s2{font:8.5px system-ui,sans-serif;fill:#fff}.d2{font:9px system-ui,sans-serif;fill:#333}.h2{font:700 13px system-ui,sans-serif;fill:#0055a0}.k2{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n2{font:8.5px system-ui,sans-serif;fill:#666}</style>
<text class="h2" text-anchor="middle" x="340" y="20">Tres familias de organismos y qué produce cada una</text>
<text class="k2" x="20" y="42">1 · NORMALIZACIÓN FORMAL (de iure)</text>
<rect fill="#0055a0" height="52" rx="5" width="152" x="20" y="50"></rect><text class="t2" text-anchor="middle" x="96" y="70">ISO / IEC</text><text class="s2" text-anchor="middle" x="96" y="86">Modelo OSI · 7498-1</text>
<rect fill="#0055a0" height="52" rx="5" width="152" x="180" y="50"></rect><text class="t2" text-anchor="middle" x="256" y="70">UIT-T</text><text class="s2" text-anchor="middle" x="256" y="86">Recomendación X.200</text>
<rect fill="#0055a0" height="52" rx="5" width="152" x="340" y="50"></rect><text class="t2" text-anchor="middle" x="416" y="70">ETSI · CEN</text><text class="s2" text-anchor="middle" x="416" y="86">Normas europeas</text>
<rect fill="#0055a0" height="52" rx="5" width="160" x="500" y="50"></rect><text class="t2" text-anchor="middle" x="580" y="70">UNE / AENOR</text><text class="s2" text-anchor="middle" x="580" y="86">Adopción en España</text>
<text class="k2" x="20" y="124">2 · COMUNIDAD DE INTERNET (de facto)</text>
<rect fill="#2d8659" height="52" rx="5" width="152" x="20" y="132"></rect><text class="t2" text-anchor="middle" x="96" y="152">IETF</text><text class="s2" text-anchor="middle" x="96" y="168">Los RFC de TCP/IP</text>
<rect fill="#2d8659" height="52" rx="5" width="152" x="180" y="132"></rect><text class="t2" text-anchor="middle" x="256" y="152">IAB · IESG · IRTF</text><text class="s2" text-anchor="middle" x="256" y="168">Arquitectura y proceso</text>
<rect fill="#2d8659" height="52" rx="5" width="152" x="340" y="132"></rect><text class="t2" text-anchor="middle" x="416" y="152">ICANN / IANA</text><text class="s2" text-anchor="middle" x="416" y="168">Puertos y protocolos</text>
<rect fill="#2d8659" height="52" rx="5" width="160" x="500" y="132"></rect><text class="t2" text-anchor="middle" x="580" y="152">W3C</text><text class="s2" text-anchor="middle" x="580" y="168">Tecnologías de la web</text>
<text class="k2" x="20" y="206">3 · ASOCIACIONES PROFESIONALES Y CONSORCIOS</text>
<rect fill="#e89822" height="52" rx="5" width="312" x="20" y="214"></rect><text class="t2" text-anchor="middle" x="176" y="234">IEEE — comité 802</text><text class="s2" text-anchor="middle" x="176" y="250">802.3 Ethernet · 802.11 Wi-Fi · 802.1Q VLAN · 802.1X</text>
<rect fill="#e89822" height="52" rx="5" width="320" x="340" y="214"></rect><text class="t2" text-anchor="middle" x="500" y="234">ANSI · TIA/EIA · consorcios</text><text class="s2" text-anchor="middle" x="500" y="250">Cableado, conectores y certificación de producto</text>
<rect fill="#eef3f8" height="34" rx="4" width="640" x="20" y="280"></rect>
<text class="k2" text-anchor="middle" x="340" y="295">Regla de atribución: OSI es de ISO y UIT-T · TCP/IP es del IETF · capas 1 y 2 locales son del IEEE</text>
<text class="d2" text-anchor="middle" x="340" y="308">Los números (puertos, protocolos, direcciones) los administra IANA; las direcciones europeas, RIPE NCC</text>
<text class="n2" text-anchor="end" x="670" y="334">[Fuente: ISO, UIT-T, IETF, IEEE, IANA]</text>
</svg>