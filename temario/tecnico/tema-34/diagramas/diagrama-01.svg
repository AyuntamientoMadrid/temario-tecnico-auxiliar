<rect fill="#2d8659" height="38" rx="4" width="170" x="485" y="204"></rect><text class="t1" text-anchor="middle" x="570" y="228">Capa 1 · Física</text>
<text class="n1" text-anchor="middle" x="110" y="96">interfaz</text>
<text class="n1" text-anchor="middle" x="110" y="148">interfaz</text>
<text class="n1" text-anchor="middle" x="110" y="200">interfaz</text>
<text class="n1" text-anchor="middle" x="570" y="96">interfaz</text>
<text class="n1" text-anchor="middle" x="570" y="148">interfaz</text>
