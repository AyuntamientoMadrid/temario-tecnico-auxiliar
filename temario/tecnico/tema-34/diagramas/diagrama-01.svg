<text class="d1" text-anchor="middle" x="338" y="61">protocolo de aplicación (virtual)</text>
<text class="d1" text-anchor="middle" x="338" y="113">protocolo de transporte (virtual)</text>
<text class="d1" text-anchor="middle" x="338" y="165">protocolo de red (virtual)</text>
<text class="g1" text-anchor="middle" x="338" y="217">MEDIO FÍSICO — única transmisión real</text>
<rect fill="none" height="52" rx="5" stroke="#0055a0" stroke-width="1.5" width="630" x="25" y="258"></rect>
<text class="k1" text-anchor="middle" x="340" y="277">La capa N de A cree que habla con la capa N de B; en realidad baja, cruza el cable y sube</text>
<text class="d1" text-anchor="middle" x="340" y="294">Solo hay dos comunicaciones reales: las interfaces (dentro de cada máquina) y el medio físico (entre ambas)</text>
<text class="n1" text-anchor="end" x="670" y="328">[Fuente: ISO/IEC 7498-1]</text>
</svg>