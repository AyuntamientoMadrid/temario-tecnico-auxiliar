<svg aria-label="Dos sistemas con cuatro capas cada uno: entre capas adyacentes del mismo sistema la comunicación es vertical y real a través de una interfaz, mientras que entre capas homólogas de sistemas distintos la comunicación es horizontal y virtual mediante un protocolo; solo la capa física transmite bits de forma real por el medio" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>.t1{font:700 10.5px system-ui,sans-serif;fill:#fff}.d1{font:9px system-ui,sans-serif;fill:#333}.h1{font:700 13px system-ui,sans-serif;fill:#0055a0}.k1{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n1{font:8.5px system-ui,sans-serif;fill:#666}.g1{font:700 9px system-ui,sans-serif;fill:#2d8659}</style>
<defs><marker id="a1" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#d13c3c"></path></marker><marker id="b1" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#2d8659"></path></marker></defs>
<text class="h1" text-anchor="middle" x="340" y="20">Vertical = real (interfaz) · Horizontal = virtual (protocolo)</text>
<text class="k1" text-anchor="middle" x="110" y="40">SISTEMA A</text>
<text class="k1" text-anchor="middle" x="570" y="40">SISTEMA B</text>
