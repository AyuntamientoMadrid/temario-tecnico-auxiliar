<rect fill="#0055a0" height="38" rx="4" width="170" x="485" y="100"></rect><text class="t1" text-anchor="middle" x="570" y="124">Capa 3 · Transporte</text>
<rect fill="#0055a0" height="38" rx="4" width="170" x="25" y="152"></rect><text class="t1" text-anchor="middle" x="110" y="176">Capa 2 · Red</text>
<rect fill="#0055a0" height="38" rx="4" width="170" x="485" y="152"></rect><text class="t1" text-anchor="middle" x="570" y="176">Capa 2 · Red</text>
