<svg aria-label="Las siete capas del modelo OSI de arriba abajo: aplicación, presentación y sesión son capas orientadas al usuario y solo existen en los equipos terminales; transporte es la capa frontera y extremo a extremo; red, enlace de datos y física son capas orientadas a la red y están presentes también en los equipos intermedios. Se indica para cada capa su unidad de datos y ejemplos de protocolo" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.t4{font:700 10px system-ui,sans-serif;fill:#fff}.s4{font:8.5px system-ui,sans-serif;fill:#fff}.d4{font:8.5px system-ui,sans-serif;fill:#333}.h4{font:700 13px system-ui,sans-serif;fill:#0055a0}.k4{font:700 9px system-ui,sans-serif;fill:#0055a0}.n4{font:8.5px system-ui,sans-serif;fill:#666}.w4{font:700 9px system-ui,sans-serif;fill:#fff}</style>
<text class="h4" text-anchor="middle" x="340" y="19">Modelo OSI · 7 capas, su PDU y sus protocolos</text>
<text class="k4" x="36" y="40">N.º</text><text class="k4" x="96" y="40">CAPA</text><text class="k4" x="212" y="40">FUNCIÓN PRINCIPAL</text><text class="k4" x="452" y="40">PDU</text><text class="k4" x="530" y="40">EJEMPLOS</text>
<rect fill="#0055a0" height="32" rx="4" width="628" x="26" y="46"></rect>
<text class="t4" x="42" y="66">7</text><text class="t4" x="96" y="66">Aplicación</text><text class="s4" x="212" y="66">Servicios directos al proceso de usuario</text><text class="s4" x="452" y="66">Mensaje</text><text class="s4" x="530" y="66">HTTP · SMTP · DNS · FTP</text>
<rect fill="#1e6bb0" height="32" rx="4" width="628" x="26" y="82"></rect>
<text class="t4" x="42" y="102">6</text><text class="t4" x="96" y="102">Presentación</text><text class="s4" x="212" y="102">Formato, códigos, compresión y cifrado</text><text class="s4" x="452" y="102">Mensaje</text><text class="s4" x="530" y="102">ASN.1 · BER · Unicode</text>
<rect fill="#3781c0" height="32" rx="4" width="628" x="26" y="118"></rect>
<text class="t4" x="42" y="138">5</text><text class="t4" x="96" y="138">Sesión</text><text class="s4" x="212" y="138">Diálogo, turnos y puntos de comprobación</text><text class="s4" x="452" y="138">Mensaje</text><text class="s4" x="530" y="138">RPC · NetBIOS · SIP</text>
<rect fill="#e89822" height="32" rx="4" width="628" x="26" y="154"></rect>
<text class="t4" x="42" y="174">4</text><text class="t4" x="96" y="174">Transporte</text><text class="s4" x="212" y="174">Extremo a extremo, puertos y fiabilidad</text><text class="s4" x="452" y="174">Segmento</text><text class="s4" x="530" y="174">TCP · UDP · TP0-TP4</text>
<rect fill="#2d8659" height="32" rx="4" width="628" x="26" y="190"></rect>
<text class="t4" x="42" y="210">3</text><text class="t4" x="96" y="210">Red</text><text class="s4" x="212" y="210">Direccionamiento lógico y encaminamiento</text><text class="s4" x="452" y="210">Paquete</text><text class="s4" x="530" y="210">IP · ICMP · CLNP · X.25</text>
<rect fill="#37996d" height="32" rx="4" width="628" x="26" y="226"></rect>
<text class="t4" x="42" y="246">2</text><text class="t4" x="96" y="246">Enlace de datos</text><text class="s4" x="212" y="246">Tramas, MAC y detección de errores</text><text class="s4" x="452" y="246">Trama</text><text class="s4" x="530" y="246">Ethernet · Wi-Fi · PPP</text>
<rect fill="#4aab80" height="32" rx="4" width="628" x="26" y="262"></rect>
<text class="t4" x="42" y="282">1</text><text class="t4" x="96" y="282">Física</text><text class="s4" x="212" y="282">Bits, señales, conectores y medios</text><text class="s4" x="452" y="282">Bit</text><text class="s4" x="530" y="282">RJ-45 · fibra · 10BASE-T</text>
<rect fill="#eef3f8" height="28" rx="4" width="310" x="26" y="302"></rect>
<text class="d4" text-anchor="middle" x="181" y="320">Capas 5-7: solo en los equipos TERMINALES</text>
<rect fill="#e7f2ec" height="28" rx="4" width="310" x="344" y="302"></rect>
<text class="d4" text-anchor="middle" x="499" y="320">Capas 1-3: también en los equipos INTERMEDIOS</text>
<text class="k4" text-anchor="middle" x="340" y="346">La capa 4 es la frontera: es la más baja que solo existe en los extremos</text>
<text class="n4" text-anchor="end" x="670" y="356">[Fuente: ISO/IEC 7498-1]</text>
</svg>