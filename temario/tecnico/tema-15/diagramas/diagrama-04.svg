<line stroke="#2d8659" stroke-width="2" x1="330" x2="330" y1="80" y2="130"></line><text class="l" fill="#2d8659" x="340" y="110">indep. lógica</text>
<line stroke="#2d8659" stroke-width="2" x1="330" x2="330" y1="174" y2="220"></line><text class="l" fill="#2d8659" x="340" y="200">indep. física</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="650" y="308">[Fuente: ANSI-SPARC · DATE]</text>
