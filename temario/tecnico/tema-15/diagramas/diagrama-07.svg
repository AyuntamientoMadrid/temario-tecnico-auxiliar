<rect fill="#e89822" height="50" rx="6" width="120" x="540" y="110"></rect><text class="b" text-anchor="middle" x="600" y="132">NoSQL</text><text class="l" style="fill:#fff" text-anchor="middle" x="600" y="150">escala horiz.</text>
