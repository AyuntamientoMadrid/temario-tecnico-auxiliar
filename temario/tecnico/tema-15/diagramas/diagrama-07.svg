<line stroke="#bbb" x1="340" x2="80" y1="66" y2="110"></line><line stroke="#bbb" x1="340" x2="210" y1="66" y2="110"></line><line stroke="#bbb" x1="340" x2="340" y1="66" y2="110"></line><line stroke="#bbb" x1="340" x2="470" y1="66" y2="110"></line><line stroke="#bbb" x1="340" x2="600" y1="66" y2="110"></line>
