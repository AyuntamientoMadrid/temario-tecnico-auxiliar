<rect fill="#0055a0" height="36" rx="6" width="140" x="270" y="30"></rect><text class="b" text-anchor="middle" x="340" y="53">SGBD</text>
<g>
<rect fill="#6ea3d2" height="50" rx="6" width="120" x="20" y="110"></rect><text class="b" text-anchor="middle" x="80" y="132">Jerárquico</text><text class="l" style="fill:#fff" text-anchor="middle" x="80" y="150">árbol (IMS)</text>
<rect fill="#6ea3d2" height="50" rx="6" width="120" x="150" y="110"></rect><text class="b" text-anchor="middle" x="210" y="132">En red</text><text class="l" style="fill:#fff" text-anchor="middle" x="210" y="150">CODASYL</text>
<rect fill="#2d8659" height="50" rx="6" width="120" x="280" y="110"></rect><text class="b" text-anchor="middle" x="340" y="132">Relacional</text><text class="l" style="fill:#fff" text-anchor="middle" x="340" y="150">tablas/SQL ★</text>
