<svg aria-label="Dos tablas relacionadas por clave primaria y clave ajena" class="svd6" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd6 .t{font:700 12px system-ui,sans-serif;fill:#0055a0}.svd6 .h{font:700 11px monospace;fill:#fff}.svd6 .c{font:11px monospace;fill:#1a1a1a}.svd6 .l{font:11px system-ui,sans-serif;fill:#444}</style>
<text class="t" x="120" y="34">HABITANTE</text>
<rect fill="#0055a0" height="26" width="220" x="40" y="44"></rect><text class="h" x="50" y="62">DNI (PK) | nombre | distrito_id</text>
<rect fill="#e8f0f8" height="24" width="220" x="40" y="70"></rect><text class="c" x="50" y="87">0001A | Ana | 7</text>
<rect fill="#fff" height="24" width="220" x="40" y="94"></rect><text class="c" x="50" y="111">0002B | Luis | 7</text>
<text class="t" x="480" y="34">DISTRITO</text>
<rect fill="#2d8659" height="26" width="200" x="420" y="44"></rect><text class="h" x="430" y="62">id (PK) | nombre</text>
<rect fill="#e8f5ee" height="24" width="200" x="420" y="70"></rect><text class="c" x="430" y="87">7 | Chamberí</text>
<path d="M 260 100 C 340 100 340 82 418 82" fill="none" marker-end="url(#a6)" stroke="#d13c3c" stroke-width="2"></path>
<text class="l" fill="#d13c3c" x="300" y="135">distrito_id (clave ajena) → id (clave primaria)</text>
<text class="l" x="40" y="200">Integridad referencial: distrito_id debe existir en DISTRITO (no hay distritos "huérfanos").</text>
<text class="l" x="40" y="230">El JOIN combina ambas tablas por esa relación de claves.</text>
<defs><marker id="a6" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="5"><polygon fill="#d13c3c" points="0,0 10,5 0,10"></polygon></marker></defs>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="308">[Fuente: CODD-1970 · DATE]</text>
</svg>