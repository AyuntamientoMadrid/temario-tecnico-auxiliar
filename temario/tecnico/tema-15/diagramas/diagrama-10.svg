<path d="M 210 130 L 248 130" marker-end="url(#a10)" stroke="#444" stroke-width="2"></path>
<path d="M 430 130 L 468 130" marker-end="url(#a10)" stroke="#444" stroke-width="2"></path>
<defs><marker id="a10" markerheight="10" markerwidth="10" orient="auto" refx="8" refy="5"><polygon fill="#444" points="0,0 10,5 0,10"></polygon></marker></defs>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="308">[Fuente: KIMBALL-DW · INMON-DW]</text>
