<svg aria-label="Los cuatro tipos de bases de datos NoSQL" class="svd8" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>.svd8 .t{font:700 13px system-ui,sans-serif;fill:#fff}.svd8 .l{font:11px system-ui,sans-serif;fill:#fff}.svd8 .e{font:11px system-ui,sans-serif;fill:#cfe2f3}</style>
<rect fill="#0055a0" height="120" rx="8" width="300" x="30" y="40"></rect>
<text class="t" x="50" y="68">Clave-valor</text><text class="l" x="50" y="92">clave → valor · acceso ultrarrápido</text><text class="e" x="50" y="120">Redis, DynamoDB</text>
<rect fill="#3378b9" height="120" rx="8" width="300" x="350" y="40"></rect>
<text class="t" x="370" y="68">Documental</text><text class="l" x="370" y="92">documentos JSON · esquema flexible</text><text class="e" x="370" y="120">MongoDB</text>
<rect fill="#2d8659" height="120" rx="8" width="300" x="30" y="180"></rect>
<text class="t" x="50" y="208">Columnar</text><text class="l" x="50" y="232">familias de columnas · big data</text><text class="e" x="50" y="260">Cassandra, HBase</text>
<rect fill="#e89822" height="120" rx="8" width="300" x="350" y="180"></rect>
<text class="t" x="370" y="208">Grafos</text><text class="l" x="370" y="232">nodos + relaciones · redes/rutas</text><text class="e" x="370" y="260">Neo4j</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="328">[Fuente: SADALAGE-FOWLER]</text>
</svg>