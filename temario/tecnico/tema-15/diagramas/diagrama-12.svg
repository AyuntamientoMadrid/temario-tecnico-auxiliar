<svg aria-label="Recuperación a un punto en el tiempo combinando copia completa y log de transacciones" class="svd12" role="img" viewbox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd12 .t{font:700 12px system-ui,sans-serif;fill:#0055a0}.svd12 .l{font:11px system-ui,sans-serif;fill:#444}.svd12 .b{font:600 11px system-ui,sans-serif;fill:#fff}</style>
<line stroke="#888" stroke-width="2" x1="40" x2="640" y1="120" y2="120"></line>
<rect fill="#0055a0" height="40" width="80" x="60" y="100"></rect><text class="b" text-anchor="middle" x="100" y="125">Backup full</text>
<rect fill="#2d8659" height="30" width="14" x="380" y="105"></rect><rect fill="#2d8659" height="30" width="14" x="420" y="105"></rect><rect fill="#2d8659" height="30" width="14" x="460" y="105"></rect><rect fill="#2d8659" height="30" width="14" x="500" y="105"></rect>
<text class="l" fill="#2d8659" x="300" y="95">log de transacciones (cambios continuos)</text>
<line stroke="#d13c3c" stroke-dasharray="4" stroke-width="2" x1="540" x2="540" y1="70" y2="160"></line><text class="l" fill="#d13c3c" text-anchor="middle" x="540" y="60">fallo / error</text>
<text class="l" fill="#d13c3c" text-anchor="middle" x="540" y="185">se recupera al instante justo anterior</text>
<text class="l" x="40" y="230">PITR = restaurar la copia completa + aplicar el log hasta el momento elegido.</text>
<text class="l" x="40" y="252">Tipos de copia: completa · incremental / diferencial (solo lo cambiado).</text>
<text fill="#666" font="11px system-ui,sans-serif" text-anchor="end" x="670" y="288">[Fuente: POSTGRES-DOC · SILBERSCHATZ-DB]</text>
</svg>