<svg aria-label="El Centro de Atención a Usuarios como punto único de contacto: seis canales de entrada (teléfono, portal de autoservicio, correo, chat, monitorización automática y presencial) que confluyen en un único registro, y desde ahí la distribución entre los niveles de soporte 0, 1, 2 y 3 y el soporte de campo, con el coste por contacto creciendo de arriba abajo" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.t12{font:700 10px system-ui,sans-serif;fill:#fff}.s12{font:8.5px system-ui,sans-serif;fill:#fff}.d12{font:9px system-ui,sans-serif;fill:#333}.h12{font:700 13px system-ui,sans-serif;fill:#0055a0}.k12{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n12{font:8.5px system-ui,sans-serif;fill:#666}</style>
<defs><marker id="a12" markerheight="7" markerwidth="7" orient="auto" refx="6" refy="2.5"><path d="M0,0 L6,2.5 L0,5 z" fill="#0055a0"></path></marker></defs>
<text class="h12" text-anchor="middle" x="340" y="20">Punto único de contacto y niveles de soporte</text>
<text class="k12" x="20" y="42">CANALES DE ENTRADA (multicanal)</text>
<rect fill="#0055a0" height="34" rx="4" width="102" x="20" y="50"></rect><text class="t12" text-anchor="middle" x="71" y="65">Teléfono</text><text class="s12" text-anchor="middle" x="71" y="78">inmediato, caro</text>
<rect fill="#0055a0" height="34" rx="4" width="102" x="130" y="50"></rect><text class="t12" text-anchor="middle" x="181" y="65">Portal</text><text class="s12" text-anchor="middle" x="181" y="78">24×7, barato</text>
<rect fill="#0055a0" height="34" rx="4" width="102" x="240" y="50"></rect><text class="t12" text-anchor="middle" x="291" y="65">Correo</text><text class="s12" text-anchor="middle" x="291" y="78">desestructurado</text>
<rect fill="#0055a0" height="34" rx="4" width="102" x="350" y="50"></rect><text class="t12" text-anchor="middle" x="401" y="65">Chat</text><text class="s12" text-anchor="middle" x="401" y="78">varios a la vez</text>
<rect fill="#2d8659" height="34" rx="4" width="102" x="460" y="50"></rect><text class="t12" text-anchor="middle" x="511" y="65">Monitorización</text><text class="s12" text-anchor="middle" x="511" y="78">detecta antes</text>
<rect fill="#888" height="34" rx="4" width="90" x="570" y="50"></rect><text class="t12" text-anchor="middle" x="615" y="65">Presencial</text><text class="s12" text-anchor="middle" x="615" y="78">el más caro</text>
<path d="M71,84 L71,96 L609,96 L609,84" fill="none" stroke="#0055a0" stroke-width="1.5"></path>
<line marker-end="url(#a12)" stroke="#0055a0" stroke-width="2" x1="340" x2="340" y1="96" y2="108"></line>
<rect fill="#e89822" height="34" rx="5" width="380" x="150" y="112"></rect>
<text class="t12" text-anchor="middle" x="340" y="127">UN ÚNICO REGISTRO · UNA ÚNICA HERRAMIENTA</text>
<text class="s12" text-anchor="middle" x="340" y="140">la multicanalidad está en la ENTRADA, nunca en el registro</text>
<line marker-end="url(#a12)" stroke="#0055a0" stroke-width="2" x1="340" x2="340" y1="146" y2="160"></line>
<text class="k12" x="20" y="176">NIVELES DE SOPORTE · el coste por contacto crece hacia abajo</text>
<rect fill="#2d8659" height="26" rx="4" width="400" x="140" y="184"></rect><text class="t12" text-anchor="middle" x="340" y="202">N0 · AUTOSERVICIO: portal, contraseña, catálogo · coste casi nulo</text>
<rect fill="#0055a0" height="26" rx="4" width="440" x="120" y="216"></rect><text class="t12" text-anchor="middle" x="340" y="234">N1 · CAU: casos frecuentes, guiones, ASISTENCIA REMOTA · objetivo FCR</text>
<rect fill="#0055a0" height="26" rx="4" width="480" x="100" y="248"></rect><text class="t12" text-anchor="middle" x="340" y="266">N2 · ESPECIALISTAS: puesto, red, sistemas, aplicaciones, bases de datos</text>
<rect fill="#e89822" height="26" rx="4" width="520" x="80" y="280"></rect><text class="t12" text-anchor="middle" x="340" y="298">N3 · EXPERTOS, DESARROLLO, FABRICANTE O PROVEEDOR (contrato UC)</text>
<rect fill="#d13c3c" height="26" rx="4" width="560" x="60" y="312"></rect><text class="t12" text-anchor="middle" x="340" y="330">SOPORTE DE CAMPO: todo lo físico · coste dominado por el desplazamiento</text>
<text class="n12" text-anchor="end" x="670" y="354">[Fuente: ITIL4; ISO20000]</text>
</svg>