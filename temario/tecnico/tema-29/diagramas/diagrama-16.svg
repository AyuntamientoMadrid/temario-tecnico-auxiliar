<svg aria-label="El ciclo completo del servicio: la asistencia remota y la gestión de incidencias sometidas a los controles del Esquema Nacional de Seguridad y del RGPD, medidas mediante indicadores clave de rendimiento, y realimentadas por la gestión del conocimiento, la gestión de problemas, la satisfacción de los usuarios y las auditorías, con las cinco dimensiones de seguridad y las categorías del sistema" role="img" viewbox="0 0 680 366" xmlns="http://www.w3.org/2000/svg">
<style>.t16{font:700 10.5px system-ui,sans-serif;fill:#fff}.s16{font:9px system-ui,sans-serif;fill:#fff}.d16{font:9px system-ui,sans-serif;fill:#333}.h16{font:700 13px system-ui,sans-serif;fill:#0055a0}.k16{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n16{font:8.5px system-ui,sans-serif;fill:#666}</style>
<defs><marker id="a16" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#0055a0"></path></marker></defs>
<text class="h16" text-anchor="middle" x="340" y="20">El marco normativo envuelve toda la operación</text>
<rect fill="#d13c3c" height="56" rx="5" width="640" x="20" y="32"></rect>
<text class="t16" text-anchor="middle" x="340" y="50">ENS · RD 311/2022 · cinco dimensiones de seguridad</text>
<text class="s16" text-anchor="middle" x="340" y="67">DISPONIBILIDAD · AUTENTICIDAD · INTEGRIDAD · CONFIDENCIALIDAD · TRAZABILIDAD</text>
<text class="s16" text-anchor="middle" x="340" y="82">Categoría del sistema: BÁSICA · MEDIA · ALTA (la fija el nivel más alto de cualquier dimensión)</text>
<rect fill="#e89822" height="46" rx="5" width="315" x="20" y="94"></rect>
<text class="t16" text-anchor="middle" x="177" y="112">RGPD y LOPDGDD</text>
<text class="s16" text-anchor="middle" x="177" y="129">minimización · finalidad · encargado · brecha en 72 h</text>
<rect fill="#888" height="46" rx="5" width="315" x="345" y="94"></rect>
<text class="t16" text-anchor="middle" x="502" y="112">MÍNIMO PRIVILEGIO Y TRAZABILIDAD</text>
<text class="s16" text-anchor="middle" x="502" y="129">RBAC · alcance · elevación temporal · registro por tique</text>
<rect fill="#0055a0" height="60" rx="5" width="205" x="20" y="152"></rect>
<text class="t16" text-anchor="middle" x="122" y="172">ASISTENCIA REMOTA</text>
<text class="s16" text-anchor="middle" x="122" y="189">consentimiento, canal cifrado</text>
<text class="s16" text-anchor="middle" x="122" y="204">y modo mínimo suficiente</text>
<rect fill="#0055a0" height="60" rx="5" width="205" x="237" y="152"></rect>
<text class="t16" text-anchor="middle" x="339" y="172">GESTIÓN DE INCIDENCIAS</text>
<text class="s16" text-anchor="middle" x="339" y="189">registrar, priorizar, escalar,</text>
<text class="s16" text-anchor="middle" x="339" y="204">resolver y cerrar</text>
<rect fill="#2d8659" height="60" rx="5" width="206" x="454" y="152"></rect>
<text class="t16" text-anchor="middle" x="557" y="172">MEDICIÓN (KPI)</text>
<text class="s16" text-anchor="middle" x="557" y="189">FCR · MTTR · ASA · SLA</text>
<text class="s16" text-anchor="middle" x="557" y="204">reapertura · CSAT · backlog</text>
<line marker-end="url(#a16)" stroke="#0055a0" stroke-width="2" x1="225" x2="234" y1="182" y2="182"></line>
<line marker-end="url(#a16)" stroke="#0055a0" stroke-width="2" x1="442" x2="451" y1="182" y2="182"></line>
<text class="k16" x="20" y="234">CUATRO FUENTES DE MEJORA QUE REALIMENTAN EL CICLO</text>
<rect fill="#eef3f8" height="56" rx="4" width="155" x="20" y="242"></rect>
<text class="k16" text-anchor="middle" x="97" y="260">INDICADORES</text>
<text class="d16" text-anchor="middle" x="97" y="277">señalan dónde duele</text>
<text class="d16" text-anchor="middle" x="97" y="291">y hay que segmentar</text>
<rect fill="#eaf3ee" height="56" rx="4" width="155" x="182" y="242"></rect>
<text class="k16" text-anchor="middle" x="259" y="260">PROBLEMAS</text>
<text class="d16" text-anchor="middle" x="259" y="277">eliminan familias</text>
<text class="d16" text-anchor="middle" x="259" y="291">enteras de incidencias</text>
<rect fill="#fdf3e6" height="56" rx="4" width="155" x="344" y="242"></rect>
<text class="k16" text-anchor="middle" x="421" y="260">USUARIOS</text>
<text class="d16" text-anchor="middle" x="421" y="277">satisfacción y quejas:</text>
<text class="d16" text-anchor="middle" x="421" y="291">lo que no capta el dato</text>
<rect fill="#fbeaea" height="56" rx="4" width="154" x="506" y="242"></rect>
<text class="k16" text-anchor="middle" x="583" y="260">AUDITORÍAS</text>
<text class="d16" text-anchor="middle" x="583" y="277">detectan lo que la</text>
<text class="d16" text-anchor="middle" x="583" y="291">operación normaliza</text>
<path d="M97,298 L97,314 L583,314 L583,298" fill="none" stroke="#0055a0" stroke-width="1.5"></path>
<line marker-end="url(#a16)" stroke="#0055a0" stroke-width="2" x1="340" x2="340" y1="314" y2="322"></line>
<rect fill="#0055a0" height="24" rx="5" width="400" x="140" y="326"></rect>
<text class="t16" text-anchor="middle" x="340" y="342">MEJORA CONTINUA · planificar, hacer, verificar, actuar</text>
<text class="n16" text-anchor="end" x="670" y="362">[Fuente: ENS; RGPD; ITIL4; ISO20000]</text>
</svg>