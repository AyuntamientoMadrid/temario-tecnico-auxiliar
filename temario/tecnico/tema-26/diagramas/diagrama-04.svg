<svg aria-label="Esquema de los niveles RAID 0, 1, 5, 6 y 10, mostrando el reparto de datos y paridad entre discos, la capacidad útil y el número de discos cuyo fallo se tolera en cada nivel" role="img" viewbox="0 0 680 370" xmlns="http://www.w3.org/2000/svg">
<style>.t4{font:700 10px system-ui,sans-serif;fill:#fff}.s4{font:8.5px system-ui,sans-serif;fill:#fff}.d4{font:9px system-ui,sans-serif;fill:#333}.h4{font:700 13px system-ui,sans-serif;fill:#0055a0}.k4{font:700 10px system-ui,sans-serif;fill:#0055a0}.n4{font:700 9px system-ui,sans-serif;fill:#fff}</style>
<text class="h4" text-anchor="middle" x="340" y="20">Niveles RAID: reparto, capacidad útil y tolerancia</text>
<text class="k4" x="20" y="44">RAID 0 · striping</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="200" y="32"></rect><text class="n4" text-anchor="middle" x="235" y="47">A1</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="276" y="32"></rect><text class="n4" text-anchor="middle" x="311" y="47">A2</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="352" y="32"></rect><text class="n4" text-anchor="middle" x="387" y="47">A3</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="428" y="32"></rect><text class="n4" text-anchor="middle" x="463" y="47">A4</text>
<text class="d4" x="510" y="42">Útil: 100 %</text><text style="font:700 9px system-ui;fill:#d13c3c" x="510" y="53">Tolera 0 discos</text>
<text class="k4" x="20" y="86">RAID 1 · espejo</text>
<rect fill="#2d8659" height="22" rx="3" width="146" x="200" y="74"></rect><text class="n4" text-anchor="middle" x="273" y="89">A1 A2</text>
<rect fill="#888" height="22" rx="3" width="146" x="352" y="74"></rect><text class="n4" text-anchor="middle" x="425" y="89">copia de A1 A2</text>
<text class="d4" x="510" y="84">Útil: 50 %</text><text style="font:700 9px system-ui;fill:#2d8659" x="510" y="95">Tolera 1 por espejo</text>
<text class="k4" x="20" y="128">RAID 5 · paridad</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="200" y="116"></rect><text class="n4" text-anchor="middle" x="235" y="131">A1</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="276" y="116"></rect><text class="n4" text-anchor="middle" x="311" y="131">A2</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="352" y="116"></rect><text class="n4" text-anchor="middle" x="387" y="131">A3</text>
<rect fill="#e89822" height="22" rx="3" width="70" x="428" y="116"></rect><text class="n4" text-anchor="middle" x="463" y="131">Paridad P</text>
<text class="d4" x="510" y="126">Útil: n−1</text><text style="font:700 9px system-ui;fill:#e89822" x="510" y="137">Tolera 1 disco</text>
<text class="k4" x="20" y="170">RAID 6 · doble paridad</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="200" y="158"></rect><text class="n4" text-anchor="middle" x="235" y="173">A1</text>
<rect fill="#0055a0" height="22" rx="3" width="70" x="276" y="158"></rect><text class="n4" text-anchor="middle" x="311" y="173">A2</text>
<rect fill="#e89822" height="22" rx="3" width="70" x="352" y="158"></rect><text class="n4" text-anchor="middle" x="387" y="173">Paridad P</text>
<rect fill="#e89822" height="22" rx="3" width="70" x="428" y="158"></rect><text class="n4" text-anchor="middle" x="463" y="173">Paridad Q</text>
<text class="d4" x="510" y="168">Útil: n−2</text><text style="font:700 9px system-ui;fill:#2d8659" x="510" y="179">Tolera 2 discos</text>
<text class="k4" x="20" y="212">RAID 10 · espejo + striping</text>
<rect fill="#2d8659" height="22" rx="3" width="70" x="200" y="200"></rect><text class="n4" text-anchor="middle" x="235" y="215">A1</text>
<rect fill="#888" height="22" rx="3" width="70" x="276" y="200"></rect><text class="n4" text-anchor="middle" x="311" y="215">copia A1</text>
<rect fill="#2d8659" height="22" rx="3" width="70" x="352" y="200"></rect><text class="n4" text-anchor="middle" x="387" y="215">A2</text>
<rect fill="#888" height="22" rx="3" width="70" x="428" y="200"></rect><text class="n4" text-anchor="middle" x="463" y="215">copia A2</text>
<text class="d4" x="510" y="210">Útil: 50 %</text><text style="font:700 9px system-ui;fill:#2d8659" x="510" y="221">Mejor en escritura</text>
<line stroke="#ccc" stroke-width="1" x1="20" x2="660" y1="236" y2="236"></line>
<rect fill="#d13c3c" height="52" rx="5" width="205" x="20" y="248"></rect>
<text class="t4" text-anchor="middle" x="122" y="266">PENALIZACIÓN DE ESCRITURA</text>
<text class="s4" text-anchor="middle" x="122" y="282">RAID 5: 4 E/S · RAID 6: 6 E/S</text>
<text class="s4" text-anchor="middle" x="122" y="295">RAID 1 y 10: solo 2 E/S</text>
<rect fill="#e89822" height="52" rx="5" width="206" x="237" y="248"></rect>
<text class="t4" text-anchor="middle" x="340" y="266">RECONSTRUCCIÓN</text>
<text class="s4" text-anchor="middle" x="340" y="282">Con discos grandes dura horas</text>
<text class="s4" text-anchor="middle" x="340" y="295">o días: un 2.º fallo lo destruye</text>
<rect fill="#2d8659" height="52" rx="5" width="205" x="455" y="248"></rect>
<text class="t4" text-anchor="middle" x="557" y="266">ELECCIÓN HABITUAL</text>
<text class="s4" text-anchor="middle" x="557" y="282">Escritura intensa: RAID 10</text>
<text class="s4" text-anchor="middle" x="557" y="295">Capacidad y lectura: RAID 6</text>
<rect fill="none" height="30" rx="5" stroke="#d13c3c" stroke-width="2" width="560" x="60" y="312"></rect>
<text style="font:700 11px system-ui;fill:#d13c3c" text-anchor="middle" x="340" y="331">El RAID NO es una copia de seguridad: no protege del borrado, la corrupción ni el ransomware</text>
<text style="font:9px system-ui;fill:#666" text-anchor="end" x="670" y="362">[Fuente: PATTERSON88; SNIA-DDF]</text>
</svg>