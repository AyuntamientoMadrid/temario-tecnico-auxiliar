<svg aria-label="Esquema del almacenamiento definido por software: un plano de control que aplica políticas sobre un plano de datos formado por servidores estándar con discos locales, frente al modelo de cabina tradicional" role="img" viewbox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">
<style>.t7{font:700 11px system-ui,sans-serif;fill:#fff}.s7{font:9px system-ui,sans-serif;fill:#fff}.d7{font:9px system-ui,sans-serif;fill:#333}.h7{font:700 13px system-ui,sans-serif;fill:#0055a0}.k7{font:700 9px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h7" text-anchor="middle" x="340" y="20">Almacenamiento definido por software (SDS)</text>
<rect fill="#0055a0" height="46" rx="5" width="640" x="20" y="34"></rect>
<text class="t7" text-anchor="middle" x="340" y="52">PLANO DE CONTROL — políticas, no cables</text>
<text class="s7" text-anchor="middle" x="340" y="70">«3 réplicas · cifrado · mínimo 5.000 IOPS · tolerar la caída de un nodo» · API y automatización</text>
<path d="M340 84 L340 104" marker-end="url(#a7)" stroke="#0055a0" stroke-width="2"></path>
<defs><marker id="a7" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="3"><path d="M0,0 L0,6 L7,3 z" fill="#0055a0"></path></marker></defs>
<text class="k7" x="20" y="120">PLANO DE DATOS — servidores estándar con discos locales</text>
<rect fill="#2d8659" height="56" rx="4" width="150" x="20" y="126"></rect><text class="s7" text-anchor="middle" x="95" y="146">Nodo 1</text><text class="s7" text-anchor="middle" x="95" y="162">discos SAS/NVMe</text><text class="s7" text-anchor="middle" x="95" y="176">réplica de bloques</text>
<rect fill="#2d8659" height="56" rx="4" width="150" x="178" y="126"></rect><text class="s7" text-anchor="middle" x="253" y="146">Nodo 2</text><text class="s7" text-anchor="middle" x="253" y="162">discos SAS/NVMe</text><text class="s7" text-anchor="middle" x="253" y="176">réplica de bloques</text>
<rect fill="#2d8659" height="56" rx="4" width="150" x="336" y="126"></rect><text class="s7" text-anchor="middle" x="411" y="146">Nodo 3</text><text class="s7" text-anchor="middle" x="411" y="162">discos SAS/NVMe</text><text class="s7" text-anchor="middle" x="411" y="176">réplica de bloques</text>
<rect fill="#888" height="56" rx="4" width="150" x="494" y="126"></rect><text class="s7" text-anchor="middle" x="569" y="146">Nodo N…</text><text class="s7" text-anchor="middle" x="569" y="162">se crece añadiendo</text><text class="s7" text-anchor="middle" x="569" y="176">nodos (scale-out)</text>
<rect fill="#e89822" height="24" rx="4" width="624" x="20" y="190"></rect>
<text class="s7" text-anchor="middle" x="332" y="206">Red interna de 10/25 Gbit/s redundante: en SDS y HCI la red FORMA PARTE del almacenamiento</text>
<rect fill="#eef3f8" height="56" rx="5" stroke="#888" width="310" x="20" y="226"></rect>
<text class="k7" text-anchor="middle" x="175" y="244">CABINA TRADICIONAL</text>
<text class="d7" text-anchor="middle" x="175" y="260">Hardware propietario · RAID en la</text>
<text class="d7" text-anchor="middle" x="175" y="274">controladora · crecimiento vertical</text>
<rect fill="#eef3f8" height="56" rx="5" stroke="#0055a0" stroke-width="2" width="302" x="342" y="226"></rect>
<text class="k7" text-anchor="middle" x="493" y="244">SDS</text>
<text class="d7" text-anchor="middle" x="493" y="260">Hardware estándar · réplica o erasure coding</text>
<text class="d7" text-anchor="middle" x="493" y="274">por software · crecimiento horizontal</text>
<text class="k7" text-anchor="middle" x="340" y="298">Ejemplos: Ceph (CRUSH) · vSAN · Storage Spaces Direct</text>
<text style="font:9px system-ui;fill:#666" text-anchor="end" x="670" y="306">[Fuente: SNIA-SDS; CEPH; VSAN; S2D]</text>
</svg>