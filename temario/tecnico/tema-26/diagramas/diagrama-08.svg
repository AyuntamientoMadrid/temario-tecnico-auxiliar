<svg aria-label="Comparación entre la arquitectura de tres capas, con servidores, red de almacenamiento y cabina separados, y la arquitectura hiperconvergente, en la que cada nodo aporta cómputo y discos locales agregados por software" role="img" viewbox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>.t8{font:700 10.5px system-ui,sans-serif;fill:#fff}.s8{font:9px system-ui,sans-serif;fill:#fff}.d8{font:9px system-ui,sans-serif;fill:#333}.h8{font:700 13px system-ui,sans-serif;fill:#0055a0}.k8{font:700 9.5px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h8" text-anchor="middle" x="340" y="20">Tres capas frente a hiperconvergencia</text>
<rect fill="#888" height="24" rx="5" width="310" x="20" y="32"></rect><text class="t8" text-anchor="middle" x="175" y="49">ARQUITECTURA DE TRES CAPAS</text>
<rect fill="#0055a0" height="24" rx="5" width="310" x="350" y="32"></rect><text class="t8" text-anchor="middle" x="505" y="49">HIPERCONVERGENCIA (HCI)</text>
<rect fill="#eef3f8" height="34" rx="4" stroke="#888" width="310" x="20" y="64"></rect><text class="d8" text-anchor="middle" x="175" y="78">Servidores de cómputo</text><text class="d8" text-anchor="middle" x="175" y="91">(se compran y crecen por separado)</text>
<rect fill="#eef3f8" height="34" rx="4" stroke="#888" width="310" x="20" y="104"></rect><text class="d8" text-anchor="middle" x="175" y="118">Red de almacenamiento FC o iSCSI</text><text class="d8" text-anchor="middle" x="175" y="131">(zoning, LUN masking, multipathing)</text>
<rect fill="#eef3f8" height="34" rx="4" stroke="#888" width="310" x="20" y="144"></rect><text class="d8" text-anchor="middle" x="175" y="158">Cabina de almacenamiento</text><text class="d8" text-anchor="middle" x="175" y="171">(consola y equipo propios)</text>
<rect fill="#2d8659" height="56" rx="4" width="150" x="350" y="64"></rect><text class="s8" text-anchor="middle" x="425" y="82">NODO 1</text><text class="s8" text-anchor="middle" x="425" y="98">CPU + RAM</text><text class="s8" text-anchor="middle" x="425" y="112">+ discos locales</text>
<rect fill="#2d8659" height="56" rx="4" width="150" x="510" y="64"></rect><text class="s8" text-anchor="middle" x="585" y="82">NODO 2</text><text class="s8" text-anchor="middle" x="585" y="98">CPU + RAM</text><text class="s8" text-anchor="middle" x="585" y="112">+ discos locales</text>
<rect fill="#2d8659" height="52" rx="4" width="150" x="350" y="126"></rect><text class="s8" text-anchor="middle" x="425" y="144">NODO 3</text><text class="s8" text-anchor="middle" x="425" y="160">CPU + RAM</text><text class="s8" text-anchor="middle" x="425" y="173">+ discos locales</text>
<rect fill="#888" height="52" rx="4" width="150" x="510" y="126"></rect><text class="s8" text-anchor="middle" x="585" y="144">NODO 4…</text><text class="s8" text-anchor="middle" x="585" y="160">se crece</text><text class="s8" text-anchor="middle" x="585" y="173">añadiendo nodos</text>
<rect fill="#e89822" height="24" rx="4" width="310" x="350" y="184"></rect><text class="s8" text-anchor="middle" x="505" y="200">Capa SDS distribuida: un pool único con todos los discos</text>
<rect fill="#eef3f8" height="24" rx="4" width="310" x="20" y="184"></rect><text class="d8" text-anchor="middle" x="175" y="200">Tres equipos, tres consolas, tres ciclos de compra</text>
<line stroke="#ccc" stroke-width="1" x1="20" x2="660" y1="220" y2="220"></line>
<rect fill="#2d8659" height="34" rx="4" width="310" x="20" y="230"></rect><text class="s8" text-anchor="middle" x="175" y="245">A favor: control y ajuste fino de cada capa;</text><text class="s8" text-anchor="middle" x="175" y="258">se dimensiona cada recurso por separado</text>
<rect fill="#2d8659" height="34" rx="4" width="310" x="350" y="230"></rect><text class="s8" text-anchor="middle" x="505" y="245">A favor: una sola consola y crecimiento</text><text class="s8" text-anchor="middle" x="505" y="258">incremental por nodos, sin fabric FC</text>
<rect fill="#d13c3c" height="34" rx="4" width="310" x="20" y="268"></rect><text class="s8" text-anchor="middle" x="175" y="283">En contra: complejidad y silos de</text><text class="s8" text-anchor="middle" x="175" y="296">administración entre equipos distintos</text>
<rect fill="#d13c3c" height="34" rx="4" width="310" x="350" y="268"></rect><text class="s8" text-anchor="middle" x="505" y="283">En contra: cómputo y capacidad crecen</text><text class="s8" text-anchor="middle" x="505" y="296">juntos; la red entre nodos es crítica</text>
<text class="k8" text-anchor="middle" x="340" y="318">Regla de dimensionado: reservar espacio libre para que el pool pueda reconstruirse si cae un nodo</text>
<text style="font:9px system-ui;fill:#666" text-anchor="end" x="670" y="328">[Fuente: VSAN; NUTANIX; S2D]</text>
</svg>