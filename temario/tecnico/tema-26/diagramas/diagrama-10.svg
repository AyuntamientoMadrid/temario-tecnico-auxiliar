<svg aria-label="Esquema de la regla 3-2-1 ampliada a 3-2-1-1-0, con tres copias en dos soportes, una fuera de la ubicación, una copia inmutable o fuera de línea y cero errores de verificación, junto al esquema de retención abuelo-padre-hijo" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>.t10{font:700 11px system-ui,sans-serif;fill:#fff}.s10{font:9px system-ui,sans-serif;fill:#fff}.d10{font:9px system-ui,sans-serif;fill:#333}.h10{font:700 13px system-ui,sans-serif;fill:#0055a0}.k10{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.n10{font:700 20px system-ui,sans-serif;fill:#fff}</style>
<text class="h10" text-anchor="middle" x="340" y="20">La regla 3-2-1-1-0</text>
<rect fill="#0055a0" height="76" rx="5" width="124" x="20" y="32"></rect><text class="n10" text-anchor="middle" x="82" y="60">3</text><text class="s10" text-anchor="middle" x="82" y="80">copias de los datos</text><text class="s10" text-anchor="middle" x="82" y="95">(original + 2)</text>
<rect fill="#0055a0" height="76" rx="5" width="124" x="150" y="32"></rect><text class="n10" text-anchor="middle" x="212" y="60">2</text><text class="s10" text-anchor="middle" x="212" y="80">soportes o sistemas</text><text class="s10" text-anchor="middle" x="212" y="95">distintos</text>
<rect fill="#0055a0" height="76" rx="5" width="124" x="280" y="32"></rect><text class="n10" text-anchor="middle" x="342" y="60">1</text><text class="s10" text-anchor="middle" x="342" y="80">fuera de la ubicación</text><text class="s10" text-anchor="middle" x="342" y="95">(otro CPD o proveedor)</text>
<rect fill="#d13c3c" height="76" rx="5" width="124" x="410" y="32"></rect><text class="n10" text-anchor="middle" x="472" y="60">1</text><text class="s10" text-anchor="middle" x="472" y="80">inmutable o fuera</text><text class="s10" text-anchor="middle" x="472" y="95">de línea (air gap)</text>
<rect fill="#2d8659" height="76" rx="5" width="120" x="540" y="32"></rect><text class="n10" text-anchor="middle" x="600" y="60">0</text><text class="s10" text-anchor="middle" x="600" y="80">errores tras la</text><text class="s10" text-anchor="middle" x="600" y="95">verificación</text>
<rect fill="#e89822" height="26" rx="4" width="640" x="20" y="118"></rect>
<text class="s10" text-anchor="middle" x="340" y="135">Los dos últimos dígitos los añade el ransomware: ataca primero las copias y el catálogo para impedir la recuperación</text>
<text class="k10" x="20" y="166">RETENCIÓN ESCALONADA — GFS (abuelo, padre, hijo)</text>
<rect fill="#eef3f8" height="56" rx="4" stroke="#0055a0" width="155" x="20" y="174"></rect><text class="k10" text-anchor="middle" x="97" y="192">HIJO · diaria</text><text class="d10" text-anchor="middle" x="97" y="208">Se conserva 7-14 días</text><text class="d10" text-anchor="middle" x="97" y="222">Errores del día a día</text>
<rect fill="#eef3f8" height="56" rx="4" stroke="#0055a0" width="155" x="183" y="174"></rect><text class="k10" text-anchor="middle" x="260" y="192">PADRE · semanal</text><text class="d10" text-anchor="middle" x="260" y="208">Se conserva 4-8 semanas</text><text class="d10" text-anchor="middle" x="260" y="222">Incidentes vistos tarde</text>
<rect fill="#eef3f8" height="56" rx="4" stroke="#0055a0" width="155" x="346" y="174"></rect><text class="k10" text-anchor="middle" x="423" y="192">ABUELO · mensual</text><text class="d10" text-anchor="middle" x="423" y="208">Se conserva 12 meses</text><text class="d10" text-anchor="middle" x="423" y="222">Referencia y auditoría</text>
<rect fill="#eef3f8" height="56" rx="4" stroke="#0055a0" width="151" x="509" y="174"></rect><text class="k10" text-anchor="middle" x="584" y="192">ANUAL</text><text class="d10" text-anchor="middle" x="584" y="208">5-10 años o lo que</text><text class="d10" text-anchor="middle" x="584" y="222">exija la norma</text>
<rect fill="#d13c3c" height="50" rx="5" width="315" x="20" y="242"></rect>
<text class="t10" text-anchor="middle" x="177" y="260">NO CUMPLE EL 3-2-1</text>
<text class="s10" text-anchor="middle" x="177" y="277">Guardar la copia en la MISMA cabina que el dato</text>
<rect fill="#2d8659" height="50" rx="5" width="315" x="345" y="242"></rect>
<text class="t10" text-anchor="middle" x="502" y="260">SÍ CUMPLE</text>
<text class="s10" text-anchor="middle" x="502" y="277">Repositorio local + réplica al 2.º CPD + objeto WORM</text>
<text class="k10" text-anchor="middle" x="340" y="312">Límite legal: el artículo 5.1.e del RGPD prohíbe conservar datos personales indefinidamente</text>
<text style="font:9px system-ui;fill:#666" text-anchor="end" x="670" y="334">[Fuente: ISO27002; NIST-SP800-209; RGPD]</text>
</svg>