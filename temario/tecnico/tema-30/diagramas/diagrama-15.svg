<svg aria-label="Mapa que relaciona cada parte del tema con la medida del Anexo II del Esquema Nacional de Seguridad que la respalda: la segmentación con la medida de separación de flujos de información en la red, la gestión de usuarios con las medidas de control de acceso, el inventario y el parcheo con las de explotación, y la monitorización con las de detección de intrusión, sistema de métricas y vigilancia; se recogen además las cinco dimensiones de seguridad y las tres categorías de sistema" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.tf{font:700 10px system-ui,sans-serif;fill:#fff}.sf{font:8.5px system-ui,sans-serif;fill:#fff}.df{font:9px system-ui,sans-serif;fill:#333}.hf{font:700 13px system-ui,sans-serif;fill:#0055a0}.kf{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.nf{font:8.5px system-ui,sans-serif;fill:#666}.cf{font:700 9.5px system-ui,sans-serif;fill:#fff}</style>
<text class="hf" text-anchor="middle" x="340" y="20">Cada sección del tema tiene su medida en el Anexo II del ENS</text>
<text class="kf" x="24" y="42">CINCO DIMENSIONES DE SEGURIDAD — RD 311/2022</text>
<rect fill="#0055a0" height="26" rx="4" width="124" x="20" y="48"></rect><text class="cf" text-anchor="middle" x="82" y="65">Disponibilidad</text>
<rect fill="#0055a0" height="26" rx="4" width="124" x="150" y="48"></rect><text class="cf" text-anchor="middle" x="212" y="65">Autenticidad</text>
<rect fill="#0055a0" height="26" rx="4" width="124" x="280" y="48"></rect><text class="cf" text-anchor="middle" x="342" y="65">Integridad</text>
<rect fill="#0055a0" height="26" rx="4" width="124" x="410" y="48"></rect><text class="cf" text-anchor="middle" x="472" y="65">Confidencialidad</text>
<rect fill="#0055a0" height="26" rx="4" width="120" x="540" y="48"></rect><text class="cf" text-anchor="middle" x="600" y="65">Trazabilidad</text>
<rect fill="#eef3f8" height="24" rx="4" width="316" x="20" y="80"></rect><text class="df" text-anchor="middle" x="178" y="96">Tres NIVELES por dimensión: bajo · medio · alto</text>
<rect fill="#eef3f8" height="24" rx="4" width="316" x="344" y="80"></rect><text class="df" text-anchor="middle" x="502" y="96">Tres CATEGORÍAS de sistema: BÁSICA · MEDIA · ALTA</text>
<text class="kf" x="24" y="126">DE CADA SECCIÓN DEL TEMA A SU MEDIDA</text>
<rect fill="#e89822" height="30" rx="4" width="200" x="20" y="132"></rect><text class="tf" text-anchor="middle" x="120" y="145">§1 · Segmentación en VLAN</text><text class="sf" text-anchor="middle" x="120" y="157">y red de gestión separada</text>
<text class="df" x="228" y="152">→</text>
<rect fill="#fdf3e3" height="30" rx="4" stroke="#e89822" stroke-width="1.2" width="416" x="244" y="132"></rect>
<text class="df" text-anchor="middle" x="452" y="152">mp.com.4 separación de flujos · mp.com.1 perímetro seguro · mp.com.2 y mp.com.3</text>
<rect fill="#2d8659" height="30" rx="4" width="200" x="20" y="168"></rect><text class="tf" text-anchor="middle" x="120" y="181">§2 · Gestión de usuarios</text><text class="sf" text-anchor="middle" x="120" y="193">directorio, GPO, RBAC</text>
<text class="df" x="228" y="188">→</text>
<rect fill="#e8f4ee" height="30" rx="4" stroke="#2d8659" stroke-width="1.2" width="416" x="244" y="168"></rect>
<text class="df" style="font-size:8.4px" text-anchor="middle" x="452" y="188">op.acc.1 a op.acc.6 · op.acc.3 segregación de funciones · op.exp.2 y op.exp.3 configuración</text>
<rect fill="#0055a0" height="30" rx="4" width="200" x="20" y="204"></rect><text class="tf" text-anchor="middle" x="120" y="217">§3 · Gestión de dispositivos</text><text class="sf" text-anchor="middle" x="120" y="229">inventario, parches, admisión</text>
<text class="df" x="228" y="224">→</text>
<rect fill="#eef3f8" height="30" rx="4" stroke="#0055a0" stroke-width="1.2" width="416" x="244" y="204"></rect>
<text class="df" text-anchor="middle" x="452" y="224">op.exp.1 inventario · op.exp.4 actualizaciones · mp.eq.4 otros dispositivos conectados</text>
<rect fill="#d13c3c" height="30" rx="4" width="200" x="20" y="240"></rect><text class="tf" text-anchor="middle" x="120" y="253">§4 · Monitorización y tráfico</text><text class="sf" text-anchor="middle" x="120" y="265">métricas, flujos, registros</text>
<text class="df" x="228" y="260">→</text>
<rect fill="#fbeaea" height="30" rx="4" stroke="#d13c3c" stroke-width="1.2" width="416" x="244" y="240"></rect>
<text class="df" style="font-size:8.4px" text-anchor="middle" x="452" y="260">op.mon.1 detección de intrusión · op.mon.2 métricas · op.mon.3 vigilancia · op.exp.8 registro</text>
<rect fill="#fdf3e3" height="24" rx="4" stroke="#e89822" stroke-width="1.2" width="640" x="20" y="280"></rect>
<text class="df" text-anchor="middle" x="340" y="296">Categoría MEDIA y ALTA: auditoría al menos BIENAL · Categoría BÁSICA: autoevaluación</text>
<rect fill="none" height="24" rx="4" stroke="#0055a0" stroke-width="1.5" width="640" x="20" y="312"></rect>
<text class="kf" text-anchor="middle" x="340" y="328">Lo no inventariado no se protege · lo no segmentado no se contiene · lo no registrado no se demuestra</text>
<text class="nf" text-anchor="end" x="670" y="352">[Fuente: ENS; CCN-STIC]</text>
</svg>