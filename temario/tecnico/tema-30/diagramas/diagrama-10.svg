<svg aria-label="Esquema del control de admisión a la red basado en el estándar 802.1X: el suplicante que es el equipo, el autenticador que es el conmutador o punto de acceso, y el servidor de autenticación RADIUS que consulta el directorio; antes de autenticarse por el puerto solo circula EAPOL, y según el resultado el dispositivo se coloca en la VLAN corporativa, en la de invitados, en cuarentena o queda rechazado" role="img" viewbox="0 0 680 362" xmlns="http://www.w3.org/2000/svg">
<style>.ta{font:700 10.5px system-ui,sans-serif;fill:#fff}.sa{font:8.5px system-ui,sans-serif;fill:#fff}.da{font:9px system-ui,sans-serif;fill:#333}.ha{font:700 13px system-ui,sans-serif;fill:#0055a0}.ka{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.na{font:8.5px system-ui,sans-serif;fill:#666}.ca{font:700 8.5px system-ui,sans-serif;fill:#d13c3c}</style>
<defs><marker id="a10" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 z" fill="#0055a0"></path></marker></defs>
<text class="ha" text-anchor="middle" x="340" y="20">802.1X: control de acceso a la red basado en puerto</text>
<rect fill="#0055a0" height="52" rx="5" width="150" x="20" y="40"></rect><text class="ta" text-anchor="middle" x="95" y="58">SUPLICANTE</text><text class="sa" text-anchor="middle" x="95" y="73">el equipo que quiere entrar</text><text class="sa" text-anchor="middle" x="95" y="86">presenta certificado o credencial</text>
<line marker-end="url(#a10)" stroke="#0055a0" stroke-width="2" x1="174" x2="256" y1="66" y2="66"></line>
<text class="ca" text-anchor="middle" x="215" y="58">EAPOL</text>
<rect fill="#2d8659" height="52" rx="5" width="160" x="260" y="40"></rect><text class="ta" text-anchor="middle" x="340" y="58">AUTENTICADOR</text><text class="sa" text-anchor="middle" x="340" y="73">conmutador o punto de acceso</text><text class="sa" text-anchor="middle" x="340" y="86">mantiene el puerto cerrado</text>
<line marker-end="url(#a10)" stroke="#0055a0" stroke-width="2" x1="424" x2="506" y1="66" y2="66"></line>
<text class="ca" text-anchor="middle" x="465" y="58">RADIUS</text>
<rect fill="#e89822" height="52" rx="5" width="150" x="510" y="40"></rect><text class="ta" text-anchor="middle" x="585" y="58">SERVIDOR AAA</text><text class="sa" text-anchor="middle" x="585" y="73">RADIUS · UDP 1812/1813</text><text class="sa" text-anchor="middle" x="585" y="86">consulta el directorio</text>
<rect fill="#fbeaea" height="26" rx="4" stroke="#d13c3c" stroke-width="1.2" width="640" x="20" y="102"></rect>
<text class="da" text-anchor="middle" x="340" y="119">Antes de autenticarse, por el puerto SOLO circula EAPOL: ni DHCP, ni DNS, ni nada más</text>
<text class="ka" x="24" y="152">EL SERVIDOR NO SOLO DICE SÍ O NO: DEVUELVE ATRIBUTOS QUE COLOCAN AL DISPOSITIVO</text>
<rect fill="#2d8659" height="56" rx="4" width="156" x="20" y="158"></rect><text class="ta" text-anchor="middle" x="98" y="176">VLAN CORPORATIVA</text><text class="sa" text-anchor="middle" x="98" y="192">Autenticado y conforme</text><text class="sa" text-anchor="middle" x="98" y="205">EAP-TLS, PEAP, EAP-TTLS</text>
<rect fill="#e89822" height="56" rx="4" width="156" x="182" y="158"></rect><text class="ta" text-anchor="middle" x="260" y="176">CUARENTENA</text><text class="sa" text-anchor="middle" x="260" y="192">Autenticado, NO conforme</text><text class="sa" text-anchor="middle" x="260" y="205">solo acceso a remediación</text>
<rect fill="#888" height="56" rx="4" width="156" x="344" y="158"></rect><text class="ta" text-anchor="middle" x="422" y="176">VLAN DE INVITADOS</text><text class="sa" text-anchor="middle" x="422" y="192">No se autentica</text><text class="sa" text-anchor="middle" x="422" y="205">solo salida a internet</text>
<rect fill="#d13c3c" height="56" rx="4" width="154" x="506" y="158"></rect><text class="ta" text-anchor="middle" x="583" y="176">RECHAZADO</text><text class="sa" text-anchor="middle" x="583" y="192">Puerto cerrado</text><text class="sa" text-anchor="middle" x="583" y="205">y evento registrado</text>
<text class="ka" x="24" y="238">MECANISMOS DE RESPALDO Y REFUERZO</text>
<rect fill="#eef3f8" height="48" rx="4" width="212" x="20" y="244"></rect><text class="ka" text-anchor="middle" x="126" y="260">MAB — autenticación por MAC</text><text class="da" text-anchor="middle" x="126" y="274">Para lo que no habla 802.1X.</text><text class="da" text-anchor="middle" x="126" y="287">Débil: una MAC se falsifica</text>
<rect fill="#eef3f8" height="48" rx="4" width="212" x="238" y="244"></rect><text class="ka" text-anchor="middle" x="344" y="260">MODO DE SUPERVISIÓN</text><text class="da" text-anchor="middle" x="344" y="274">Evalúa y registra, pero NO aplica.</text><text class="da" text-anchor="middle" x="344" y="287">Fase obligada antes de cortar</text>
<rect fill="#e8f4ee" height="48" rx="4" width="204" x="456" y="244"></rect><text class="ka" text-anchor="middle" x="558" y="260">RADIUS CoA — RFC 5176</text><text class="da" text-anchor="middle" x="558" y="274">Cambia o corta una sesión YA activa:</text><text class="da" text-anchor="middle" x="558" y="287">control continuo, no puntual</text>
<rect fill="#fbeaea" height="24" rx="4" stroke="#d13c3c" stroke-width="1.2" width="640" x="20" y="300"></rect>
<text class="da" text-anchor="middle" x="340" y="316">Riesgo operativo: si cae el servidor RADIUS, la sede se queda sin red. Redunda y define el comportamiento de contingencia</text>
<rect fill="none" height="20" rx="4" stroke="#0055a0" stroke-width="1.5" width="500" x="90" y="330"></rect>
<text class="ka" text-anchor="middle" x="340" y="344">Refuerzos de nivel 2: seguridad de puerto · inspección DHCP · inspección ARP dinámica</text>
<text class="na" text-anchor="end" x="670" y="360">[Fuente: IEEE8021X; RFC2865; RFC3748]</text>
</svg>