<rect fill="#e89822" height="26" width="45" x="228" y="248"></rect><text class="w9" text-anchor="middle" x="250" y="265">EST. 4</text>
<rect fill="#7fa8cc" height="26" width="70" x="277" y="248"></rect><text class="w9" text-anchor="middle" x="312" y="265">ESTACIÓN 5</text>
<rect fill="#c9d6e2" height="26" width="143" x="351" y="248"></rect><text class="w9" style="fill:#33475b" text-anchor="middle" x="422" y="265">UNIDADES DE RECURSO LIBRES</text>
<text class="g9" x="512" y="252">La novedad real</text>
<text class="n9" x="512" y="264">de Wi-Fi 6: atiende</text>
<text class="n9" x="512" y="276">a muchos clientes</text>
<text class="n9" x="512" y="288">pequeños A LA VEZ</text>
<rect fill="none" height="48" rx="5" stroke="#0055a0" stroke-width="1.5" width="632" x="26" y="300"></rect>
<text class="k9" text-anchor="middle" x="342" y="320">Frontera con la sección 4: MULTIPLEXAR reparte de forma planificada</text>
<text class="d9" text-anchor="middle" x="342" y="336">ACCEDER AL MEDIO arbitra una contienda imprevisible entre estaciones que compiten</text>
<text class="n9" text-anchor="end" x="670" y="372">[Fuente: Stallings · IEEE 802.11ax]</text>
</svg>