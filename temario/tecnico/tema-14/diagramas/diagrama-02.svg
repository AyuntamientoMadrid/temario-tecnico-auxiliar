<style>.svd2 .t{font:700 13px system-ui,sans-serif;fill:#0055a0}.svd2 .b{font:600 12px system-ui,sans-serif;fill:#fff}.svd2 .s{font:11px system-ui,sans-serif;fill:#444}</style>
