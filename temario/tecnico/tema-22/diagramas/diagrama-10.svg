<svg aria-label="Cheat sheet REST: verbos HTTP GET POST PUT PATCH DELETE con su idempotencia, familias de codigos de estado 2xx exito 4xx error cliente 5xx error servidor, y los cuatro niveles del modelo de madurez de Richardson desde RPC disfrazado hasta HATEOAS" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.t10{font:700 11px system-ui,sans-serif;fill:#fff}.s10{font:9px system-ui,sans-serif;fill:#fff}.l10{font:10px system-ui,sans-serif;fill:#444}.h10{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h10" text-anchor="middle" x="340" y="18">REST: verbos, códigos y modelo de madurez de Richardson</text>
<rect fill="#0055a0" height="30" rx="4" width="90" x="20" y="32"></rect><text class="t10" text-anchor="middle" x="65" y="52">GET</text>
<rect fill="#d13c3c" height="30" rx="4" width="90" x="118" y="32"></rect><text class="t10" text-anchor="middle" x="163" y="52">POST</text>
<rect fill="#0055a0" height="30" rx="4" width="90" x="216" y="32"></rect><text class="t10" text-anchor="middle" x="261" y="52">PUT</text>
<rect fill="#d13c3c" height="30" rx="4" width="90" x="314" y="32"></rect><text class="t10" text-anchor="middle" x="359" y="52">PATCH</text>
<rect fill="#0055a0" height="30" rx="4" width="90" x="412" y="32"></rect><text class="t10" text-anchor="middle" x="457" y="52">DELETE</text>
<text class="l10" text-anchor="middle" x="65" y="76">idempotente</text><text class="l10" text-anchor="middle" x="163" y="76">no idemp.</text><text class="l10" text-anchor="middle" x="261" y="76">idempotente</text><text class="l10" text-anchor="middle" x="359" y="76">no idemp.</text><text class="l10" text-anchor="middle" x="457" y="76">idempotente</text>
<rect fill="#f4f4f4" height="60" rx="5" stroke="#ccc" width="130" x="530" y="32"></rect><text style="font:700 9.5px system-ui;fill:#0055a0" text-anchor="middle" x="595" y="50">Idempotente:</text><text class="l10" text-anchor="middle" x="595" y="65">repetir = mismo</text><text class="l10" text-anchor="middle" x="595" y="79">efecto que una vez</text>
<rect fill="#2d8659" height="40" rx="4" width="200" x="20" y="102"></rect><text class="t10" text-anchor="middle" x="120" y="126">2xx — Éxito</text>
<rect fill="#e89822" height="40" rx="4" width="200" x="230" y="102"></rect><text class="t10" text-anchor="middle" x="330" y="126">4xx — Error del cliente</text>
<rect fill="#d13c3c" height="40" rx="4" width="200" x="440" y="102"></rect><text class="t10" text-anchor="middle" x="540" y="126">5xx — Error del servidor</text>
<text class="l10" text-anchor="middle" x="120" y="156">200 OK · 201 · 204</text><text class="l10" text-anchor="middle" x="330" y="156">400 · 401 vs 403 · 404</text><text class="l10" text-anchor="middle" x="540" y="156">500 · 503</text>
<rect fill="#ccc" height="46" rx="4" width="150" x="20" y="182"></rect><text style="font:700 10px system-ui;fill:#333" text-anchor="middle" x="95" y="202">Nivel 0</text><text style="font:9px system-ui;fill:#333" text-anchor="middle" x="95" y="218">RPC disfrazado</text>
<rect fill="#9db8cf" height="46" rx="4" width="150" x="188" y="182"></rect><text style="font:700 10px system-ui;fill:#fff" text-anchor="middle" x="263" y="202">Nivel 1</text><text class="s10" text-anchor="middle" x="263" y="218">Recursos por URI</text>
<rect fill="#3778b5" height="46" rx="4" width="150" x="356" y="182"></rect><text style="font:700 10px system-ui;fill:#fff" text-anchor="middle" x="431" y="202">Nivel 2</text><text class="s10" text-anchor="middle" x="431" y="218">Verbos + códigos</text>
<rect fill="#0055a0" height="46" rx="4" width="136" x="524" y="182"></rect><text style="font:700 10px system-ui;fill:#fff" text-anchor="middle" x="592" y="202">Nivel 3</text><text class="s10" text-anchor="middle" x="592" y="218">HATEOAS</text>
<path d="M170 205 L186 205" marker-end="url(#a10)" stroke="#888" stroke-width="2"></path><path d="M338 205 L354 205" marker-end="url(#a10)" stroke="#888" stroke-width="2"></path><path d="M506 205 L522 205" marker-end="url(#a10)" stroke="#888" stroke-width="2"></path>
<defs><marker id="a10" markerheight="7" markerwidth="7" orient="auto" refx="3.5" refy="3.5"><path d="M0 0 L7 3.5 L0 7 z" fill="#888"></path></marker></defs>
<text style="font:700 11px system-ui;fill:#d13c3c" text-anchor="middle" x="340" y="252">401 = no autenticado · 403 = autenticado pero sin permiso</text>
<text class="l10" text-anchor="middle" x="340" y="272">Nivel 2 es donde se sitúa la inmensa mayoría de las APIs REST reales</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="352">[Fuente: RFC9110; FIELDING]</text>
</svg>