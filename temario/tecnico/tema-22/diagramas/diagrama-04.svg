<svg aria-label="Comparativa de tres modelos: dos capas con cliente pesado conectado directamente a la base de datos, tres capas con cliente, servidor de aplicaciones y base de datos, y n capas con balanceador, varios servidores de aplicaciones, cache y base de datos" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.t4{font:700 11px system-ui,sans-serif;fill:#fff}.s4{font:9px system-ui,sans-serif;fill:#fff}.l4{font:10.5px system-ui,sans-serif;fill:#444}.h4{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h4" text-anchor="middle" x="340" y="18">2-Tier · 3-Tier · n-Tier</text>
<text class="l4" text-anchor="middle" x="80" y="40">2-TIER</text>
<rect fill="#888" height="44" rx="5" width="120" x="20" y="48"></rect><text class="t4" text-anchor="middle" x="80" y="66">Cliente pesado</text><text class="s4" text-anchor="middle" x="80" y="82">+ lógica ambigua</text>
<path d="M80 92 L80 116" marker-end="url(#a4)" stroke="#888" stroke-width="2.5"></path>
<rect fill="#d13c3c" height="44" rx="5" width="120" x="20" y="118"></rect><text class="t4" text-anchor="middle" x="80" y="136">Base de datos</text><text class="s4" text-anchor="middle" x="80" y="152">+ procedimientos</text>
<text class="l4" text-anchor="middle" x="270" y="40">3-TIER</text>
<rect fill="#0055a0" height="36" rx="5" width="160" x="180" y="48"></rect><text class="t4" text-anchor="middle" x="260" y="70">Cliente (presentación)</text>
<path d="M260 84 L260 104" marker-end="url(#a4)" stroke="#888" stroke-width="2.5"></path>
<rect fill="#2d8659" height="36" rx="5" width="160" x="180" y="106"></rect><text class="t4" text-anchor="middle" x="260" y="128">Servidor aplicaciones</text>
<path d="M260 142 L260 162" marker-end="url(#a4)" stroke="#888" stroke-width="2.5"></path>
<rect fill="#e89822" height="36" rx="5" width="160" x="180" y="164"></rect><text class="t4" text-anchor="middle" x="260" y="186">Base de datos</text>
<text class="l4" text-anchor="middle" x="500" y="40">N-TIER</text>
<rect fill="#0055a0" height="30" rx="5" width="160" x="420" y="48"></rect><text class="t4" text-anchor="middle" x="500" y="68">Balanceador de carga</text>
<path d="M460 78 L440 98" marker-end="url(#a4)" stroke="#888" stroke-width="2"></path><path d="M540 78 L560 98" marker-end="url(#a4)" stroke="#888" stroke-width="2"></path>
<rect fill="#2d8659" height="34" rx="5" width="90" x="400" y="100"></rect><text class="s4" text-anchor="middle" x="445" y="121">App server A</text>
<rect fill="#2d8659" height="34" rx="5" width="90" x="510" y="100"></rect><text class="s4" text-anchor="middle" x="555" y="121">App server B</text>
<path d="M445 134 L490 156" marker-end="url(#a4)" stroke="#888" stroke-width="2"></path><path d="M555 134 L510 156" marker-end="url(#a4)" stroke="#888" stroke-width="2"></path>
<rect fill="#3778b5" height="30" rx="5" width="120" x="440" y="158"></rect><text class="s4" text-anchor="middle" x="500" y="178">Caché</text>
<path d="M500 188 L500 208" marker-end="url(#a4)" stroke="#888" stroke-width="2.5"></path>
<rect fill="#e89822" height="34" rx="5" width="160" x="420" y="210"></rect><text class="t4" text-anchor="middle" x="500" y="231">Clúster de datos</text>
<defs><marker id="a4" markerheight="8" markerwidth="8" orient="auto" refx="4" refy="4"><path d="M0 0 L8 4 L0 8 z" fill="#888"></path></marker></defs>
<rect fill="#f4f4f4" height="54" rx="6" stroke="#ccc" width="640" x="20" y="266"></rect>
<text style="font:700 11px system-ui;fill:#0055a0" text-anchor="middle" x="340" y="288">Capa lógica (layer) ≠ nivel físico (tier): n-Tier puede tener 3 capas lógicas en 5+ niveles físicos</text>
<text class="l4" text-anchor="middle" x="340" y="306">2-Tier acopla cliente y datos · 3-Tier los desacopla con el servidor de aplicaciones intermedio</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="352">[Fuente: GARTNER-3TIER]</text>
</svg>