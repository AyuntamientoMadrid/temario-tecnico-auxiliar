<svg aria-label="Mapa del anexo II del ENS: 73 medidas en tres grupos y dieciséis familias. Marco organizativo con cuatro medidas, marco operacional con treinta y tres repartidas en planificación, control de acceso, explotación, recursos externos, servicios en la nube, continuidad y monitorización, y medidas de protección con treinta y seis repartidas en instalaciones, personal, equipos, comunicaciones, soportes, aplicaciones, información y servicios" role="img" viewbox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
<style>.h13{font:700 13px system-ui,sans-serif;fill:#0055a0}.k13{font:700 10px system-ui,sans-serif;fill:#0055a0}.d13{font:8px system-ui,sans-serif;fill:#333}.n13{font:8.5px system-ui,sans-serif;fill:#666}.w13{font:700 11px system-ui,sans-serif;fill:#fff}.wd13{font:8.5px system-ui,sans-serif;fill:#fff}.fam13{font:700 7.4px system-ui,sans-serif;fill:#0055a0}.cnt13{font:700 10px system-ui,sans-serif;fill:#0055a0}.nv13{font:700 7.5px system-ui,sans-serif;fill:#d13c3c}</style>
<text class="h13" text-anchor="middle" x="340" y="19">El anexo II del ENS: 73 medidas · 3 grupos · 16 familias</text>
<text class="n13" text-anchor="middle" x="340" y="35">Proporcionales a las dimensiones relevantes y a la categoría. Son mínimos exigibles, siempre ampliables</text>
<rect fill="#0055a0" height="36" rx="4" width="632" x="24" y="46"></rect>
<rect fill="#01406f" height="36" rx="4" width="120" x="24" y="46"></rect>
<text class="w13" text-anchor="middle" x="84" y="62">org · 4</text>
<text class="wd13" text-anchor="middle" x="84" y="76">MARCO ORGANIZATIVO</text>
<text class="wd13" x="156" y="63">Medidas de la ORGANIZACIÓN GLOBAL de la seguridad. Las cuatro se exigen POR CATEGORÍA y APLICAN</text>
<text class="wd13" x="156" y="76">EN LAS TRES: org.1 política · org.2 normativa · org.3 procedimientos · org.4 proceso de autorización</text>
<rect fill="#eef4fa" height="126" rx="4" stroke="#0055a0" stroke-width="1.2" width="632" x="24" y="90"></rect>
<rect fill="#0055a0" height="126" rx="4" width="120" x="24" y="90"></rect>
<text class="w13" text-anchor="middle" x="84" y="140">op · 33</text>
<text class="wd13" text-anchor="middle" x="84" y="158">MARCO</text>
<text class="wd13" text-anchor="middle" x="84" y="171">OPERACIONAL</text>
<text class="d13" x="156" y="108">Protegen LA OPERACIÓN del sistema como conjunto integral de componentes para un fin</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="156" y="116"></rect>
<text class="fam13" x="164" y="129">op.pl · Planificación</text>
<text class="d13" x="164" y="141">riesgos y arquitectura</text>
<text class="cnt13" text-anchor="end" x="264" y="131">5</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="280" y="116"></rect>
<text class="fam13" x="288" y="129">op.acc · Accesos</text>
<text class="d13" x="288" y="141">identificación y acceso</text>
<text class="cnt13" text-anchor="end" x="388" y="131">6</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="404" y="116"></rect>
<text class="fam13" x="412" y="129">op.exp · Explotación</text>
<text class="d13" x="412" y="141">la familia más numerosa</text>
<text class="cnt13" text-anchor="end" x="512" y="131">10</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="528" y="116"></rect>
<text class="fam13" x="536" y="129">op.ext · Rec. externos</text>
<text class="d13" x="536" y="141">contratación y ANS</text>
<text class="cnt13" text-anchor="end" x="636" y="131">4</text>
<rect fill="#fdf3e3" height="30" rx="3" width="118" x="156" y="150"></rect>
<text class="fam13" x="164" y="163">op.nub · Nube</text>
<text class="nv13" x="164" y="175">FAMILIA NUEVA EN 2022</text>
<text class="cnt13" text-anchor="end" x="264" y="165">1</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="280" y="150"></rect>
<text class="fam13" x="288" y="163">op.cont · Continuidad</text>
<text class="d13" x="288" y="175">solo op.cont.1 en MEDIA</text>
<text class="cnt13" text-anchor="end" x="388" y="165">4</text>
<rect fill="#fdf3e3" height="30" rx="3" width="118" x="404" y="150"></rect>
<text class="fam13" x="412" y="163">op.mon · Monitoriz.</text>
<text class="nv13" x="412" y="175">FAMILIA NUEVA EN 2022</text>
<text class="cnt13" text-anchor="end" x="512" y="165">3</text>
<rect fill="#fdf3e3" height="36" rx="3" width="118" x="528" y="150"></rect>
<text class="nv13" x="536" y="161">TAMBIÉN NUEVAS</text>
<text class="d13" x="536" y="172">op.ext.3 cadena suministro</text>
<text class="d13" x="536" y="183">op.ext.4 interconexión</text>
<text class="d13" x="156" y="197">Códigos clave: op.exp.4 mantenimiento · op.exp.8 registro de actividad, con 5 refuerzos en ALTA</text>
<text class="d13" x="156" y="209">op.exp.10 protección de CLAVES CRIPTOGRÁFICAS, no de registros: es la denominación que muchas fuentes dan mal</text>
<rect fill="#eef4fa" height="112" rx="4" stroke="#0055a0" stroke-width="1.2" width="632" x="24" y="224"></rect>
<rect fill="#0055a0" height="112" rx="4" width="120" x="24" y="224"></rect>
<text class="w13" text-anchor="middle" x="84" y="266">mp · 36</text>
<text class="wd13" text-anchor="middle" x="84" y="284">MEDIDAS DE</text>
<text class="wd13" text-anchor="middle" x="84" y="297">PROTECCIÓN</text>
<text class="d13" x="156" y="242">Protegen ACTIVOS CONCRETOS, según su naturaleza y la calidad exigida por el nivel de las dimensiones</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="156" y="250"></rect>
<text class="fam13" x="164" y="263">mp.if · Instalaciones</text>
<text class="d13" x="164" y="275">áreas, energía, incendios</text>
<text class="cnt13" text-anchor="end" x="264" y="265">7</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="280" y="250"></rect>
<text class="fam13" x="288" y="263">mp.per · Personal</text>
<text class="d13" x="288" y="275">concienciación, formación</text>
<text class="cnt13" text-anchor="end" x="388" y="265">4</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="404" y="250"></rect>
<text class="fam13" x="412" y="263">mp.eq · Equipos</text>
<text class="d13" x="412" y="275">puesto, portátiles, IoT</text>
<text class="cnt13" text-anchor="end" x="512" y="265">4</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="528" y="250"></rect>
<text class="fam13" x="536" y="263">mp.com · Comunic.</text>
<text class="d13" x="536" y="275">perímetro, cifrado, flujos</text>
<text class="cnt13" text-anchor="end" x="636" y="265">4</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="156" y="284"></rect>
<text class="fam13" x="164" y="297">mp.si · Soportes</text>
<text class="d13" x="164" y="309">marcado, custodia, borrado</text>
<text class="cnt13" text-anchor="end" x="264" y="299">5</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="280" y="284"></rect>
<text class="fam13" x="288" y="297">mp.sw · Aplicaciones</text>
<text class="d13" x="288" y="309">desarrollo y aceptación</text>
<text class="cnt13" text-anchor="end" x="388" y="299">2</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="404" y="284"></rect>
<text class="fam13" x="412" y="297">mp.info · Información</text>
<text class="d13" x="412" y="309">firma, sellos, copias</text>
<text class="cnt13" text-anchor="end" x="512" y="299">6</text>
<rect fill="#dce7f2" height="30" rx="3" width="118" x="528" y="284"></rect>
<text class="fam13" x="536" y="297">mp.s · Servicios</text>
<text class="d13" x="536" y="309">correo, web, navegación</text>
<text class="cnt13" text-anchor="end" x="636" y="299">4</text>
<text class="d13" x="156" y="330">Trampas: mp.com.4 NO APLICA EN BÁSICA · mp.info.4 sellos SOLO EN ALTA · mp.s.2 ya exige un refuerzo en BÁSICA</text>
<rect fill="#e6f2ec" height="22" rx="3" width="632" x="24" y="344"></rect>
<text class="d13" x="36" y="358">CÓMO SE LEE UNA CELDA: «n.a.» = no aplica · «aplica» = base sin refuerzos · «+ R1 + R2» = base MÁS TODOS · «+ [R1 o R2]» = UNO A ELEGIR</text>
<text class="n13" x="24" y="382">[Fuente: ENS, anexo II, apartados 1, 2 y 5, y tabla de medidas — texto consolidado del BOE]</text>
</svg>