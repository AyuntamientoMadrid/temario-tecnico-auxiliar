<svg aria-label="Estructura del Real Decreto 4/2010 con sus doce capítulos y veintinueve artículos, y sus tres principios específicos del artículo 4: la interoperabilidad como cualidad integral desarrollada en el artículo 5, el carácter multidimensional en el artículo 6 y el enfoque de soluciones multilaterales en el artículo 7; el ENI no tiene capítulo de categorización ni anexo de medidas" role="img" viewbox="0 0 680 376" xmlns="http://www.w3.org/2000/svg">
<style>.h15{font:700 13px system-ui,sans-serif;fill:#0055a0}.k15{font:700 10px system-ui,sans-serif;fill:#0055a0}.d15{font:8.5px system-ui,sans-serif;fill:#333}.n15{font:8.5px system-ui,sans-serif;fill:#666}.w15{font:700 10.5px system-ui,sans-serif;fill:#fff}.wd15{font:8px system-ui,sans-serif;fill:#fff}.cap15{font:700 8.5px system-ui,sans-serif;fill:#fff}.r15{font:700 9.5px system-ui,sans-serif;fill:#d13c3c}</style>
<text class="h15" text-anchor="middle" x="340" y="19">Real Decreto 4/2010: 29 artículos en 12 capítulos, y sus tres principios específicos</text>
<text class="n15" text-anchor="middle" x="340" y="35">Paralelismo con el ENS: capítulo II de principios, capítulo de conformidad y capítulo final de actualización</text>
<rect fill="#0055a0" height="40" rx="4" width="102" x="24" y="46"></rect>
<text class="cap15" text-anchor="middle" x="75" y="62">I · arts. 1-3</text>
<text class="cap15" text-anchor="middle" x="75" y="76">Generales</text>
