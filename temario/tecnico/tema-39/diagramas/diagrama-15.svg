<text class="cap15" text-anchor="middle" x="605" y="106">XII · art. 29</text>
<text class="cap15" text-anchor="middle" x="605" y="120">Actualización</text>
<rect fill="#fdf3e3" height="24" rx="3" stroke="#d13c3c" stroke-width="1.2" width="632" x="24" y="138"></rect>
<text class="r15" x="36" y="154">LO QUE EL ENI NO TIENE Y EL ENS SÍ: capítulo de CATEGORIZACIÓN, anexo de MEDIDAS y régimen de AUDITORÍA.</text>
<text class="k15" x="24" y="180">LOS TRES PRINCIPIOS ESPECÍFICOS — ART. 4, UN ARTÍCULO POR PRINCIPIO</text>
<rect fill="#eef4fa" height="52" rx="4" width="632" x="24" y="188"></rect>
<rect fill="#0055a0" height="52" rx="4" width="60" x="24" y="188"></rect>
<text class="w15" text-anchor="middle" x="54" y="210">a)</text>
<text class="wd15" text-anchor="middle" x="54" y="226">art. 5</text>
<text class="k15" x="94" y="205">LA INTEROPERABILIDAD COMO CUALIDAD INTEGRAL</text>
<text class="d15" x="94" y="219">«De forma integral DESDE LA CONCEPCIÓN y a lo largo de su ciclo de vida», con NUEVE momentos:</text>
<text class="d15" x="94" y="232">planificación · diseño · adquisición · construcción · despliegue · explotación · PUBLICACIÓN · CONSERVACIÓN · ACCESO</text>
<rect fill="#eef4fa" height="52" rx="4" width="632" x="24" y="246"></rect>
<rect fill="#0055a0" height="52" rx="4" width="60" x="24" y="246"></rect>
<text class="w15" text-anchor="middle" x="54" y="268">b)</text>
<text class="wd15" text-anchor="middle" x="54" y="284">art. 6</text>
<text class="k15" x="94" y="263">CARÁCTER MULTIDIMENSIONAL DE LA INTEROPERABILIDAD</text>
<text class="d15" x="94" y="277">Dimensiones ORGANIZATIVA, SEMÁNTICA y TÉCNICA, «sin olvidar la DIMENSIÓN TEMPORAL». La cadena de interoperabilidad se</text>
<text class="d15" x="94" y="290">manifiesta en cinco planos: acuerdos interadministrativos · despliegue · estándares · infraestructuras · reutilización</text>
<rect fill="#eef4fa" height="52" rx="4" width="632" x="24" y="304"></rect>
<rect fill="#0055a0" height="52" rx="4" width="60" x="24" y="304"></rect>
<text class="w15" text-anchor="middle" x="54" y="326">c)</text>
<text class="wd15" text-anchor="middle" x="54" y="342">art. 7</text>
<text class="k15" x="94" y="321">ENFOQUE DE SOLUCIONES MULTILATERALES</text>
<text class="d15" x="94" y="335">Cinco ventajas: ESCALADO · ARQUITECTURAS MODULARES · COMPARTIR · REUTILIZAR · COLABORAR</text>
<text class="d15" x="94" y="348">Se materializa en los NODOS DE INTEROPERABILIDAD (art. 8.3): un acuerdo en lugar de uno por cada pareja</text>
<text class="n15" x="24" y="368">[Fuente: ENI, arts. 4 a 7 y estructura completa — texto consolidado del BOE]</text>
</svg>