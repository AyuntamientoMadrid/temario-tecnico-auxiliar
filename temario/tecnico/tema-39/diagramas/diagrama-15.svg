<text class="cap15" text-anchor="middle" x="181" y="76">PRINCIPIOS</text>
<rect fill="#2d8659" height="40" rx="4" width="102" x="236" y="46"></rect>
<text class="cap15" text-anchor="middle" x="287" y="62">III · arts. 8-9</text>
<text class="cap15" text-anchor="middle" x="287" y="76">ORGANIZATIVA</text>
<rect fill="#2d8659" height="40" rx="4" width="102" x="342" y="46"></rect>
<text class="cap15" text-anchor="middle" x="393" y="62">IV · art. 10</text>
<text class="cap15" text-anchor="middle" x="393" y="76">SEMÁNTICA</text>
<rect fill="#2d8659" height="40" rx="4" width="102" x="448" y="46"></rect>
<text class="cap15" text-anchor="middle" x="499" y="62">V · art. 11</text>
<text class="cap15" text-anchor="middle" x="499" y="76">TÉCNICA</text>
<rect fill="#0055a0" height="40" rx="4" width="102" x="554" y="46"></rect>
<text class="cap15" text-anchor="middle" x="605" y="62">VI · art. 12</text>
<text class="cap15" text-anchor="middle" x="605" y="76">Infraestructuras</text>
<rect fill="#0055a0" height="40" rx="4" width="102" x="24" y="90"></rect>
<text class="cap15" text-anchor="middle" x="75" y="106">VII · arts. 13-15</text>
<text class="cap15" text-anchor="middle" x="75" y="120">Comunicaciones</text>
<rect fill="#0055a0" height="40" rx="4" width="102" x="130" y="90"></rect>
<text class="cap15" text-anchor="middle" x="181" y="106">VIII · arts. 16-17</text>
<text class="cap15" text-anchor="middle" x="181" y="120">Reutilización</text>
<rect fill="#0055a0" height="40" rx="4" width="102" x="236" y="90"></rect>
<text class="cap15" text-anchor="middle" x="287" y="106">IX · arts. 18-20</text>
<text class="cap15" text-anchor="middle" x="287" y="120">Firma electrónica</text>
<rect fill="#e89822" height="40" rx="4" width="102" x="342" y="90"></rect>
<text class="cap15" text-anchor="middle" x="393" y="106">X · arts. 21-24</text>
<text class="cap15" text-anchor="middle" x="393" y="120">CONSERVACIÓN</text>
