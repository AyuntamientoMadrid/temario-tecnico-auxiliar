<svg aria-label="Conversión de niveles a categoría sobre el sistema de expedientes municipal: confidencialidad, integridad y trazabilidad en nivel medio, autenticidad en nivel alto y disponibilidad en nivel bajo; como alguna dimensión alcanza el nivel alto la categoría del sistema es alta, pero la disponibilidad sigue siendo baja, de modo que las medidas de continuidad exigidas por la dimensión D no aplican" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.h12{font:700 13px system-ui,sans-serif;fill:#0055a0}.k12{font:700 10px system-ui,sans-serif;fill:#0055a0}.d12{font:8.5px system-ui,sans-serif;fill:#333}.n12{font:8.5px system-ui,sans-serif;fill:#666}.w12{font:700 11px system-ui,sans-serif;fill:#fff}.wd12{font:8.5px system-ui,sans-serif;fill:#fff}.big12{font:700 16px system-ui,sans-serif;fill:#fff}.r12{font:700 9.5px system-ui,sans-serif;fill:#d13c3c}</style>
<text class="h12" text-anchor="middle" x="340" y="19">De los niveles a la categoría: manda la dimensión más alta</text>
<text class="n12" text-anchor="middle" x="340" y="35">Sistema de tramitación de expedientes de la sede municipal (anexo I, aps. 3 y 4)</text>
<text class="k12" x="24" y="54">PASO 1 — VALORAR CADA DIMENSIÓN (responsables de la información y del servicio, art. 41.1)</text>
<rect fill="#e89822" height="58" rx="4" width="122" x="24" y="62"></rect>
<text class="w12" text-anchor="middle" x="85" y="78">C</text>
<text class="big12" text-anchor="middle" x="85" y="99">MEDIO</text>
<text class="wd12" text-anchor="middle" x="85" y="112">Datos económicos</text>
<rect fill="#e89822" height="58" rx="4" width="122" x="150" y="62"></rect>
<text class="w12" text-anchor="middle" x="211" y="78">I</text>
<text class="big12" text-anchor="middle" x="211" y="99">MEDIO</text>
<text class="wd12" text-anchor="middle" x="211" y="112">Alterar resoluciones</text>
<rect fill="#e89822" height="58" rx="4" width="122" x="276" y="62"></rect>
<text class="w12" text-anchor="middle" x="337" y="78">T</text>
<text class="big12" text-anchor="middle" x="337" y="99">MEDIO</text>
<text class="wd12" text-anchor="middle" x="337" y="112">Quién resolvió</text>
<rect fill="#d13c3c" height="58" rx="4" width="122" x="402" y="62"></rect>
<text class="w12" text-anchor="middle" x="463" y="78">A</text>
<text class="big12" text-anchor="middle" x="463" y="99">ALTO</text>
<text class="wd12" text-anchor="middle" x="463" y="112">Sin ella no hay acto</text>
<rect fill="#2d8659" height="58" rx="4" width="128" x="528" y="62"></rect>
<text class="w12" text-anchor="middle" x="592" y="78">D</text>
<text class="big12" text-anchor="middle" x="592" y="99">BAJO</text>
<text class="wd12" text-anchor="middle" x="592" y="112">Retraso subsanable</text>
<path d="M463 120 L463 138 L340 138 L340 152" fill="none" stroke="#d13c3c" stroke-width="2"></path>
<text class="r12" x="476" y="136">esta dimensión es la que decide</text>
<rect fill="#d13c3c" height="42" rx="5" width="320" x="180" y="152"></rect>
<text class="w12" text-anchor="middle" x="340" y="170">PASO 2 — CATEGORÍA DEL SISTEMA: ALTA</text>
<text class="wd12" text-anchor="middle" x="340" y="186">Basta con que UNA dimensión alcance el nivel ALTO (anexo I, ap. 4.1.a)</text>
<rect fill="#fdf3e3" height="52" rx="4" stroke="#e89822" stroke-width="1.3" width="632" x="24" y="204"></rect>
<text class="r12" x="36" y="220">PASO 3 — LA CATEGORÍA NO ELEVA LAS DIMENSIONES QUE NO INFLUYERON (anexo I, ap. 4.2)</text>
<text class="d12" x="36" y="234">Que sea de categoría ALTA por su autenticidad NO convierte en ALTA su disponibilidad, que se queda en BAJO. Consecuencias:</text>
<text class="d12" x="36" y="247">las medidas POR CATEGORÍA se aplican en versión ALTA; las exigidas POR DIMENSIÓN D siguen el nivel BAJO.</text>
<rect fill="#eef4fa" height="52" rx="4" stroke="#0055a0" stroke-width="1.2" width="312" x="24" y="264"></rect>
<text class="k12" text-anchor="middle" x="180" y="280">SE APLICAN EN VERSIÓN ALTA (por categoría)</text>
<text class="d12" x="36" y="295">org.1 a org.4 · op.pl.1 riesgos + R2 · op.exp.4</text>
<text class="d12" x="36" y="308">+ R1 + R2 · op.nub.1 + R1 + R2 · mp.s.2 + R2 + R3</text>
<rect fill="#e6f2ec" height="52" rx="4" stroke="#2d8659" stroke-width="1.2" width="312" x="344" y="264"></rect>
<text class="k12" text-anchor="middle" x="500" y="280">NO SE APLICAN (por dimensión D, que es BAJA)</text>
<text class="d12" x="356" y="295">op.cont.1 impacto · op.cont.2 plan de continuidad</text>
<text class="d12" x="356" y="308">op.cont.3 pruebas · op.cont.4 medios alternativos</text>
<text class="n12" x="24" y="342">[Fuente: ENS, anexo I apartados 3 a 5, anexo II y art. 41 — texto consolidado del BOE]</text>
</svg>