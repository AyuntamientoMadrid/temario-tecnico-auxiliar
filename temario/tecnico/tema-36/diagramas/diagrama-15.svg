<svg aria-label="Comparación de los protocolos AAA: RADIUS sobre UDP puertos 1812 y 1813 que cifra solo la contraseña y junta autenticación y autorización; TACACS+ sobre TCP puerto 49 que cifra todo el cuerpo y separa las tres funciones; y Diameter sobre TCP o SCTP con TLS. Se añaden las novedades del RFC 9887 de diciembre de 2025 que lleva TACACS+ sobre TLS 1.3 y del RFC 9765 de abril de 2025 con RADIUS 1.1. Y el flujo de 802.1X con suplicante, autenticador y servidor de autenticación, incluida la asignación dinámica de VLAN" role="img" viewbox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>.h15{font:700 13px system-ui,sans-serif;fill:#0055a0}.k15{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.t15{font:700 9.5px system-ui,sans-serif;fill:#fff}.s15{font:8px system-ui,sans-serif;fill:#fff}.d15{font:8.5px system-ui,sans-serif;fill:#333}.b15{font:700 9px system-ui,sans-serif;fill:#0055a0}.n15{font:8px system-ui,sans-serif;fill:#666}.a15{font:8px system-ui,sans-serif;fill:#666}.hd15{font:700 8.5px system-ui,sans-serif;fill:#fff}</style>
<text class="h15" text-anchor="middle" x="340" y="20">RADIUS para el acceso de usuarios a la red · TACACS+ para administrar los equipos</text>
<rect fill="#0055a0" height="20" rx="3" width="640" x="20" y="32"></rect>
<text class="hd15" x="30" y="46">CRITERIO</text><text class="hd15" x="200" y="46">RADIUS</text><text class="hd15" x="368" y="46">TACACS+</text><text class="hd15" x="536" y="46">DIAMETER</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="54"></rect><text class="d15" x="30" y="68">Norma</text><text class="d15" x="200" y="68">RFC 2865 y 2866</text><text class="d15" x="368" y="68">RFC 8907 (informativo)</text><text class="d15" x="536" y="68">RFC 6733</text>
<rect fill="#fff" height="20" width="640" x="20" y="76"></rect><text class="d15" x="30" y="90">Transporte y puertos</text><text class="d15" x="200" y="90">UDP 1812 y 1813</text><text class="d15" x="368" y="90">TCP 49</text><text class="d15" x="536" y="90">TCP o SCTP con TLS/DTLS</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="98"></rect><text class="d15" x="30" y="112">Qué cifra</text><text class="d15" x="200" y="112">SOLO la contraseña</text><text class="d15" x="368" y="112">TODO el cuerpo del mensaje</text><text class="d15" x="536" y="112">Todo, con TLS</text>
<rect fill="#fff" height="20" width="640" x="20" y="120"></rect><text class="d15" x="30" y="134">¿Separa las tres A?</text><text class="d15" x="200" y="134">NO: van juntas</text><text class="d15" x="368" y="134">SÍ: las tres independientes</text><text class="d15" x="536" y="134">Sí</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="142"></rect><text class="d15" x="30" y="156">Uso típico</text><text class="d15" x="200" y="156">802.1X, Wi-Fi corporativa, VPN</text><text class="d15" x="368" y="156">Administración de equipos de red</text><text class="d15" x="536" y="156">Redes de operador, 4G y 5G</text>
<rect fill="#fff5e6" height="33" rx="4" stroke="#e89822" width="640" x="20" y="170"></rect>
<text class="b15" text-anchor="middle" x="340" y="184">Dos novedades verificadas contra el índice del RFC Editor que casi ningún temario recoge</text>
<text class="d15" text-anchor="middle" x="340" y="197">RFC 9887 (diciembre de 2025): TACACS+ sobre TLS 1.3 · RFC 9765 (abril de 2025): RADIUS/1.1 elimina MD5 usando ALPN — estado Experimental</text>
<text class="k15" x="20" y="220">802.1X · CONTROL DE ACCESO A LA RED BASADO EN PUERTO: TRES ACTORES</text>
<rect fill="#f7f9fc" height="76" rx="5" stroke="#ccc" width="640" x="20" y="228"></rect>
<rect fill="#0055a0" height="42" rx="4" width="140" x="34" y="248"></rect><text class="t15" text-anchor="middle" x="104" y="266">1 · SUPLICANTE</text><text class="s15" text-anchor="middle" x="104" y="280">El equipo que se conecta</text>
<text class="a15" x="182" y="266">EAPOL</text><text class="a15" x="182" y="278">→</text>
<rect fill="#e89822" height="42" rx="4" width="140" x="224" y="248"></rect><text class="t15" text-anchor="middle" x="294" y="266">2 · AUTENTICADOR</text><text class="s15" text-anchor="middle" x="294" y="280">Conmutador o punto de acceso</text>
<text class="a15" x="372" y="266">RADIUS</text><text class="a15" x="372" y="278">→</text>
<rect fill="#2d8659" height="42" rx="4" width="140" x="418" y="248"></rect><text class="t15" text-anchor="middle" x="488" y="266">3 · SERVIDOR AAA</text><text class="s15" text-anchor="middle" x="488" y="280">RADIUS: es quien DECIDE</text>
<rect fill="#0055a0" height="42" rx="4" width="80" x="568" y="248"></rect><text class="t15" text-anchor="middle" x="608" y="266">DIRECTORIO</text><text class="s15" text-anchor="middle" x="608" y="280">Identidades</text>
<text class="d15" x="34" y="242">Hasta que la autenticación tiene éxito, el puerto está NO AUTORIZADO y solo deja pasar EAPOL: ni siquiera se obtiene dirección IP</text>
<text class="k15" x="20" y="324">MÉTODOS EAP Y LA FUNCIÓN MÁS ÚTIL</text>
<rect fill="#eef4fa" height="22" rx="3" stroke="#0055a0" width="316" x="20" y="332"></rect><text class="d15" style="font-size:8px" text-anchor="middle" x="178" y="347">EAP-TLS (RFC 5216, y 9190 para TLS 1.3): certificado en AMBOS extremos</text>
<rect fill="#eef7f1" height="22" rx="3" stroke="#2d8659" width="316" x="344" y="332"></rect><text class="d15" style="font-size:8px" text-anchor="middle" x="502" y="347">El RADIUS puede devolver el ID de VLAN: asignación DINÁMICA de VLAN</text>
<text class="n15" x="20" y="368">[Fuente: RFC 2865, 2866, 6733, 8907, 9765, 9887, 3748, 5216 y 9190 — verificados contra el índice del RFC Editor · IEEE 802.1X]</text>
</svg>