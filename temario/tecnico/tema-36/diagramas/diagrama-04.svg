<svg aria-label="Ataques y contramedidas por capa de la pila TCP barra IP: en la capa de aplicación phishing, inyección SQL y envenenamiento de DNS, defendidos con SSH, HTTPS, DNSSEC y proxy; en transporte inundación SYN y secuestro de sesión, defendidos con TLS, DTLS y cookies SYN; en internet suplantación de IP y denegación de servicio volumétrica, defendidos con IPsec y filtrado; y en acceso al medio envenenamiento ARP, saturación de la tabla CAM y punto de acceso impostor, defendidos con 802.1X, MACsec, inspección de ARP y WPA3" role="img" viewbox="0 0 680 366" xmlns="http://www.w3.org/2000/svg">
<style>.h4{font:700 13px system-ui,sans-serif;fill:#0055a0}.k4{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.t4{font:700 10.5px system-ui,sans-serif;fill:#fff}.s4{font:8.5px system-ui,sans-serif;fill:#fff}.d4{font:8.5px system-ui,sans-serif;fill:#333}.b4{font:700 9px system-ui,sans-serif;fill:#0055a0}.n4{font:8px system-ui,sans-serif;fill:#666}.hd4{font:700 8.5px system-ui,sans-serif;fill:#0055a0}.r4{font:700 8.5px system-ui,sans-serif;fill:#d13c3c}.g4{font:700 8.5px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h4" text-anchor="middle" x="340" y="20">Cada capa tiene su ataque y su defensa: no son intercambiables</text>
<text class="hd4" x="26" y="42">CAPA TCP/IP</text><text class="hd4" x="152" y="42">ATAQUES CARACTERÍSTICOS</text><text class="hd4" x="400" y="42">MECANISMO DE PROTECCIÓN</text>
<rect fill="#0055a0" height="58" rx="5" width="126" x="20" y="48"></rect><text class="t4" text-anchor="middle" x="83" y="70">APLICACIÓN</text><text class="s4" text-anchor="middle" x="83" y="86">Capa 4 de TCP/IP</text><text class="s4" text-anchor="middle" x="83" y="98">(5-6-7 de OSI)</text>
<rect fill="#fdeeee" height="58" rx="5" stroke="#d13c3c" width="238" x="152" y="48"></rect><text class="r4" x="162" y="66">Phishing e ingeniería social</text><text class="d4" x="162" y="80">Inyección SQL, XSS, recorrido de directorios</text><text class="d4" x="162" y="94">Envenenamiento de caché DNS · DDoS de aplicación</text>
<rect fill="#eef7f1" height="58" rx="5" stroke="#2d8659" width="264" x="396" y="48"></rect><text class="g4" x="406" y="66">SSH · HTTPS · DNSSEC · S/MIME</text><text class="d4" x="406" y="80">Proxy y pasarela de aplicación (§2.2.2) · WAF</text><text class="d4" x="406" y="94">Formación del usuario (§5.4) · antimalware</text>
<rect fill="#0055a0" height="52" rx="5" width="126" x="20" y="112"></rect><text class="t4" text-anchor="middle" x="83" y="134">TRANSPORTE</text><text class="s4" text-anchor="middle" x="83" y="150">TCP y UDP</text>
<rect fill="#fdeeee" height="52" rx="5" stroke="#d13c3c" width="238" x="152" y="112"></rect><text class="r4" x="162" y="130">Inundación SYN (agota la tabla de estados)</text><text class="d4" x="162" y="144">Secuestro de sesión TCP · escaneo de puertos</text><text class="d4" x="162" y="157">Degradación forzada de la versión de TLS</text>
<rect fill="#eef7f1" height="52" rx="5" stroke="#2d8659" width="264" x="396" y="112"></rect><text class="g4" x="406" y="130">TLS 1.2 y 1.3 · DTLS · cookies SYN</text><text class="d4" x="406" y="144">Cortafuegos con estado (§2.2.1) · límites por origen</text><text class="d4" x="406" y="157">HSTS y prohibición de versiones antiguas</text>
<rect fill="#0055a0" height="52" rx="5" width="126" x="20" y="170"></rect><text class="t4" text-anchor="middle" x="83" y="192">INTERNET</text><text class="s4" text-anchor="middle" x="83" y="208">IP, ICMP, encaminamiento</text>
<rect fill="#fdeeee" height="52" rx="5" stroke="#d13c3c" width="238" x="152" y="170"></rect><text class="r4" x="162" y="188">Suplantación de dirección IP</text><text class="d4" x="162" y="202">DDoS volumétrico · reconocimiento y barrido</text><text class="d4" x="162" y="215">Secuestro de prefijo y encaminamiento malicioso</text>
<rect fill="#eef7f1" height="52" rx="5" stroke="#2d8659" width="264" x="396" y="170"></rect><text class="g4" x="406" y="188">IPsec: AH, ESP e IKEv2 (§4.2.1)</text><text class="d4" x="406" y="202">Filtrado en cortafuegos y encaminador · antifalsificación</text><text class="d4" x="406" y="215">Mitigación aguas arriba · RPKI en el encaminamiento</text>
<rect fill="#0055a0" height="58" rx="5" width="126" x="20" y="228"></rect><text class="t4" text-anchor="middle" x="83" y="250">ACCESO AL MEDIO</text><text class="s4" text-anchor="middle" x="83" y="266">Enlace y físico</text><text class="s4" text-anchor="middle" x="83" y="278">Ethernet, Wi-Fi</text>
<rect fill="#fdeeee" height="58" rx="5" stroke="#d13c3c" width="238" x="152" y="228"></rect><text class="r4" x="162" y="246">Envenenamiento ARP · saturación de la tabla CAM</text><text class="d4" x="162" y="260">Salto de VLAN · servidor DHCP no autorizado</text><text class="d4" x="162" y="274">Punto de acceso impostor · escucha del cableado</text>
<rect fill="#eef7f1" height="58" rx="5" stroke="#2d8659" width="264" x="396" y="228"></rect><text class="g4" x="406" y="246">802.1X con EAP · MACsec (IEEE 802.1AE)</text><text class="d4" x="406" y="260">Inspección dinámica de ARP · vigilancia de DHCP</text><text class="d4" x="406" y="274">Seguridad de puerto · VLAN · WPA3-Enterprise</text>
<rect fill="#fff5e6" height="42" rx="5" stroke="#e89822" width="640" x="20" y="292"></rect>
<text class="b4" text-anchor="middle" x="340" y="307">La regla que permite elegir capa</text>
<text class="d4" text-anchor="middle" x="340" y="319">Cuanto más BAJA es la capa, MÁS tráfico se protege de golpe y MENOS se entiende de lo que se protege.</text>
<text class="d4" text-anchor="middle" x="340" y="330">Por eso conviven: MACsec protege un cable, IPsec todas las aplicaciones, TLS una conexión concreta</text>
<text class="n4" x="20" y="352">[Fuente: RFC 4301 (IPsec) · RFC 9846 (TLS 1.3) · RFC 3748 (EAP) · IEEE 802.1X y 802.1AE · ENS, mp.com]</text>
</svg>