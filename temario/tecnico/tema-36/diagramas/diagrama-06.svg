<svg aria-label="Matriz de medidas del anexo dos del Esquema Nacional de Seguridad aplicables a este tema, con su aplicación en categoría básica, media y alta: perímetro seguro mp com uno aplica en las tres; protección de la confidencialidad mp com dos; protección de la integridad y autenticidad mp com tres; separación de flujos mp com cuatro que no aplica en básica; detección de intrusión op mon uno; vigilancia op mon tres; autenticación op acc cinco; código dañino op exp seis con EDR en alta; y las medidas del puesto mp eq uno a cuatro, más navegación web, concienciación y formación" role="img" viewbox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<style>.h6{font:700 13px system-ui,sans-serif;fill:#0055a0}.k6{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.d6{font:8.5px system-ui,sans-serif;fill:#333}.b6{font:700 9px system-ui,sans-serif;fill:#0055a0}.n6{font:8px system-ui,sans-serif;fill:#666}.hd6{font:700 8.5px system-ui,sans-serif;fill:#fff}.cd6{font:700 8.5px system-ui,sans-serif;fill:#0055a0}.na6{font:700 8.5px system-ui,sans-serif;fill:#d13c3c}.ok6{font:8.5px system-ui,sans-serif;fill:#2d8659}.s6{font:8.5px system-ui,sans-serif;fill:#fff}</style>
<text class="h6" text-anchor="middle" x="340" y="20">Las medidas del anexo II que hay que citar en este tema</text>
<rect fill="#0055a0" height="20" rx="4" width="640" x="20" y="30"></rect>
<text class="hd6" x="28" y="44">CÓDIGO</text><text class="hd6" x="98" y="44">DENOMINACIÓN OFICIAL</text><text class="hd6" x="330" y="44">DIM.</text><text class="hd6" x="376" y="44">BÁSICA</text><text class="hd6" x="452" y="44">MEDIA</text><text class="hd6" x="556" y="44">ALTA</text>
<rect fill="#f7f9fc" height="22" width="640" x="20" y="52"></rect><text class="cd6" x="28" y="67">mp.com.1</text><text class="d6" x="98" y="67">Perímetro seguro</text><text class="d6" x="330" y="67">Todas</text><text class="ok6" x="376" y="67">aplica</text><text class="ok6" x="452" y="67">aplica</text><text class="ok6" x="556" y="67">aplica</text>
<rect fill="#fff" height="22" width="640" x="20" y="76"></rect><text class="cd6" x="28" y="91">mp.com.2</text><text class="d6" x="98" y="91">Protección de la confidencialidad — exige VPN cifrada</text><text class="d6" x="330" y="91">C</text><text class="ok6" x="376" y="91">aplica</text><text class="ok6" x="452" y="91">+ R1</text><text class="ok6" x="556" y="91">+ R1 + R2 + R3</text>
<rect fill="#f7f9fc" height="22" width="640" x="20" y="100"></rect><text class="cd6" x="28" y="115">mp.com.3</text><text class="d6" x="98" y="115">Protección de la integridad y de la autenticidad</text><text class="d6" x="330" y="115">I · A</text><text class="ok6" x="376" y="115">aplica</text><text class="ok6" x="452" y="115">+ R1 + R2</text><text class="ok6" x="556" y="115">+ R1 a R4</text>
<rect fill="#fdeeee" height="22" width="640" x="20" y="124"></rect><text class="cd6" x="28" y="139">mp.com.4</text><text class="d6" x="98" y="139">Separación de flujos en la red — VLAN, VPN o física</text><text class="d6" x="330" y="139">Todas</text><text class="na6" x="376" y="139">NO APLICA</text><text class="ok6" x="452" y="139">+ [R1 o R2 o R3]</text><text class="ok6" x="556" y="139">+ [R2 o R3] + R4</text>
<rect fill="#fff" height="22" width="640" x="20" y="148"></rect><text class="cd6" x="28" y="163">op.mon.1</text><text class="d6" x="98" y="163">Detección de intrusión — IDS o IPS</text><text class="d6" x="330" y="163">Todas</text><text class="ok6" x="376" y="163">aplica</text><text class="ok6" x="452" y="163">+ R1 (por reglas)</text><text class="ok6" x="556" y="163">+ R1 + R2</text>
<rect fill="#f7f9fc" height="22" width="640" x="20" y="172"></rect><text class="cd6" x="28" y="187">op.mon.3</text><text class="d6" x="98" y="187">Vigilancia — recolección de eventos; R1 es el SIEM</text><text class="d6" x="330" y="187">Todas</text><text class="ok6" x="376" y="187">aplica</text><text class="ok6" x="452" y="187">+ R1 + R2</text><text class="ok6" x="556" y="187">+ R1 a R6</text>
<rect fill="#fff" height="22" width="640" x="20" y="196"></rect><text class="cd6" x="28" y="211">op.acc.5</text><text class="d6" x="98" y="211">Mecanismo de autenticación (usuarios externos)</text><text class="d6" x="330" y="211">Todas</text><text class="ok6" x="376" y="211">+ [R1 a R4]</text><text class="ok6" x="452" y="211">+ [R2 o R3 o R4] + R5</text><text class="ok6" x="556" y="211">igual que MEDIA</text>
<rect fill="#f7f9fc" height="22" width="640" x="20" y="220"></rect><text class="cd6" x="28" y="235">op.exp.6</text><text class="d6" x="98" y="235">Protección frente a código dañino — R4 es el EDR</text><text class="d6" x="330" y="235">Todas</text><text class="ok6" x="376" y="235">aplica</text><text class="ok6" x="452" y="235">+ R1 + R2</text><text class="ok6" x="556" y="235">+ R1 + R2 + R3 + R4</text>
<rect fill="#fff" height="22" width="640" x="20" y="244"></rect><text class="cd6" x="28" y="259">mp.eq.1</text><text class="d6" x="98" y="259">Puesto de trabajo despejado</text><text class="d6" x="330" y="259">Todas</text><text class="ok6" x="376" y="259">aplica</text><text class="ok6" x="452" y="259">+ R1</text><text class="ok6" x="556" y="259">+ R1</text>
<rect fill="#fdeeee" height="22" width="640" x="20" y="268"></rect><text class="cd6" x="28" y="283">mp.eq.2</text><text class="d6" x="98" y="283">Bloqueo de puesto de trabajo</text><text class="d6" x="330" y="283">A</text><text class="na6" x="376" y="283">NO APLICA</text><text class="ok6" x="452" y="283">aplica</text><text class="ok6" x="556" y="283">+ R1 (cierra sesiones)</text>
<rect fill="#fff" height="22" width="640" x="20" y="292"></rect><text class="cd6" x="28" y="307">mp.eq.3</text><text class="d6" x="98" y="307">Protección de dispositivos portátiles — R1 cifra disco</text><text class="d6" x="330" y="307">Todas</text><text class="ok6" x="376" y="307">aplica</text><text class="ok6" x="452" y="307">aplica</text><text class="ok6" x="556" y="307">+ R1 + R2</text>
<rect fill="#f7f9fc" height="22" width="640" x="20" y="316"></rect><text class="cd6" x="28" y="331">mp.per.3 y 4</text><text class="d6" x="98" y="331">Concienciación y Formación</text><text class="d6" x="330" y="331">Todas</text><text class="ok6" x="376" y="331">aplica</text><text class="ok6" x="452" y="331">aplica</text><text class="ok6" x="556" y="331">aplica</text>
<rect fill="#e89822" height="18" rx="3" width="640" x="20" y="344"></rect>
<text class="s6" text-anchor="middle" x="340" y="357">El detalle que casi nadie sabe: mp.com.1 remite a una ITS de INTERCONEXIÓN que NO está publicada — solo hay cuatro ITS en el BOE</text>
<text class="n6" x="20" y="374">[Fuente: ENS, RD 311/2022, anexo II — tablas de aplicación verificadas contra el PDF del BOE, BOE-A-2022-7191]</text>
</svg>