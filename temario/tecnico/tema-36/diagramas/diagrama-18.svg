<svg aria-label="Tabla de decisión entre VPN IPsec y VPN basada en SSL o TLS, comparando capa, alcance, necesidad de cliente, paso por cortafuegos ajenos, traducción de direcciones, rendimiento y granularidad de la autorización; con la conclusión de que IPsec es idóneo para uniones de sitio a sitio y las VPN TLS para el acceso remoto de usuarios. Se explican las dos modalidades sin cliente y con cliente, y el fenómeno de degradación al encapsular TCP dentro de TCP" role="img" viewbox="0 0 680 356" xmlns="http://www.w3.org/2000/svg">
<style>.h18{font:700 13px system-ui,sans-serif;fill:#0055a0}.k18{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.d18{font:8.5px system-ui,sans-serif;fill:#333}.b18{font:700 9px system-ui,sans-serif;fill:#0055a0}.n18{font:8px system-ui,sans-serif;fill:#666}.hd18{font:700 8.5px system-ui,sans-serif;fill:#fff}.s18{font:8.5px system-ui,sans-serif;fill:#fff}.g18{font:700 8.5px system-ui,sans-serif;fill:#2d8659}.r18{font:700 8.5px system-ui,sans-serif;fill:#d13c3c}</style>
<text class="h18" text-anchor="middle" x="340" y="20">No se elige «la mejor»: se elige la que encaja con el escenario</text>
<rect fill="#0055a0" height="20" rx="3" width="640" x="20" y="32"></rect>
<text class="hd18" x="30" y="46">CRITERIO</text><text class="hd18" x="250" y="46">IPsec</text><text class="hd18" x="470" y="46">SSL/TLS VPN</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="54"></rect><text class="d18" x="30" y="68">Capa en la que opera</text><text class="d18" x="250" y="68">Red (3)</text><text class="d18" x="470" y="68">Transporte-aplicación (4-7)</text>
<rect fill="#fff" height="20" width="640" x="20" y="76"></rect><text class="d18" x="30" y="90">Alcance</text><text class="g18" x="250" y="90">TODO el tráfico IP, transparente</text><text class="d18" x="470" y="90">Solo lo que se encamine al túnel</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="98"></rect><text class="d18" x="30" y="112">Software en el extremo</text><text class="d18" x="250" y="112">Cliente necesario y configurado</text><text class="g18" x="470" y="112">Navegador o cliente ligero</text>
<rect fill="#fff" height="20" width="640" x="20" y="120"></rect><text class="d18" x="30" y="134">Paso por cortafuegos ajenos</text><text class="r18" x="250" y="134">Problemático: protocolos 50/51, UDP 500/4500</text><text class="g18" x="470" y="134">Excelente: TCP 443, como HTTPS</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="142"></rect><text class="d18" x="30" y="156">Traducción de direcciones (NAT)</text><text class="d18" x="250" y="156">Requiere NAT-T (RFC 3948)</text><text class="g18" x="470" y="156">Nativo, sin configuración</text>
<rect fill="#fff" height="20" width="640" x="20" y="164"></rect><text class="d18" x="30" y="178">Rendimiento bruto</text><text class="g18" x="250" y="178">Mejor, con aceleración por hardware</text><text class="r18" x="470" y="178">Peor: TCP dentro de TCP degrada</text>
<rect fill="#f7f9fc" height="20" width="640" x="20" y="186"></rect><text class="d18" x="30" y="200">Granularidad de la autorización</text><text class="d18" x="250" y="200">Por subredes y servicios</text><text class="g18" x="470" y="200">Por aplicación y usuario</text>
<rect fill="#e89822" height="20" width="640" x="20" y="208"></rect><text class="s18" x="30" y="222">ESCENARIO IDEAL</text><text class="s18" x="250" y="222">SITIO A SITIO y enlaces permanentes</text><text class="s18" x="470" y="222">ACCESO REMOTO de usuarios</text>
<text class="k18" x="20" y="248">LAS DOS MODALIDADES DE VPN SSL/TLS</text>
<rect fill="#eef4fa" height="52" rx="5" stroke="#0055a0" width="316" x="20" y="256"></rect>
<text class="b18" text-anchor="middle" x="178" y="272">SIN CLIENTE (clientless)</text>
<text class="d18" x="30" y="286">Solo navegador. Portal con aplicaciones web publicadas</text>
<text class="d18" x="30" y="299">Nivel efectivo: aplicación. Control del puesto: mínimo. Para terceros</text>
<rect fill="#eef7f1" height="52" rx="5" stroke="#2d8659" width="316" x="344" y="256"></rect>
<text class="b18" text-anchor="middle" x="502" y="272">CON CLIENTE (túnel completo)</text>
<text class="d18" x="354" y="286">Adaptador virtual: encamina CUALQUIER tráfico IP</text>
<text class="d18" x="354" y="299">Nivel efectivo: red. Permite comprobar el estado del dispositivo</text>
<rect fill="#fdeeee" height="24" rx="4" stroke="#d13c3c" width="640" x="20" y="316"></rect>
<text class="d18" text-anchor="middle" x="340" y="332">Mismos límites de versión que HTTPS: prohibidos SSL 3.0 (RFC 7568) y TLS 1.0 y 1.1 (RFC 8996). Admisibles TLS 1.2 y TLS 1.3 (RFC 9846)</text>
<text class="n18" x="20" y="350">[Fuente: RFC 9846, 8996, 7568, 3948 y 7296 — verificados contra el índice del RFC Editor · ENS, mp.com.2 · CCN-STIC-836]</text>
</svg>