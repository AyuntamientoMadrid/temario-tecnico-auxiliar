<rect fill="#0055a0" height="46" rx="6" width="120" x="390" y="90"></rect><text class="t1" text-anchor="middle" x="450" y="110">MODULAR</text><text class="s1" text-anchor="middle" x="450" y="126">proc. y func.</text>
