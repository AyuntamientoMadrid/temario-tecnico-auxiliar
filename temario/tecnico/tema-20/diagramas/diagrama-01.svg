<svg aria-label="Línea de tiempo de la evolución de los paradigmas de programación: no estructurada, estructurada, modular y orientada a objetos, con los hitos Simula 67, Smalltalk, C++ y Java" role="img" viewbox="0 0 680 316" xmlns="http://www.w3.org/2000/svg">
