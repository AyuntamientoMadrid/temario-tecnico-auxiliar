<svg aria-label="Diagrama de clases del patrón Factory Method aplicado a la jerarquía Expediente: ExpedienteFactory crea objetos ExpedienteLicencia o ExpedienteTributario sin que el cliente conozca las clases concretas" role="img" viewbox="0 0 660 340" xmlns="http://www.w3.org/2000/svg">
<style>.t10{font:700 11px system-ui,sans-serif;fill:#fff}.m10{font:10px monospace;fill:#123}.l10{font:11px system-ui,sans-serif;fill:#444}.h10{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h10" text-anchor="middle" x="330" y="20">Factory Method: desacopla al cliente de las clases concretas</text>
<rect fill="#0055a0" height="50" rx="4" width="150" x="40" y="44"></rect><text class="t10" text-anchor="middle" x="115" y="74">Cliente</text>
<line stroke="#0055a0" stroke-dasharray="4,3" stroke-width="2" x1="190" x2="240" y1="70" y2="70"></line>
<rect fill="#0055a0" height="50" rx="4" width="180" x="240" y="44"></rect><text class="t10" text-anchor="middle" x="330" y="66">ExpedienteFactory</text><text class="m10" style="fill:#fff" text-anchor="middle" x="330" y="82">+ crear(tipo)</text>
<line stroke="#2d8659" stroke-width="2" x1="330" x2="200" y1="94" y2="150"></line>
<line stroke="#2d8659" stroke-width="2" x1="330" x2="460" y1="94" y2="150"></line>
<rect fill="#fff" height="60" stroke="#0055a0" stroke-width="1.5" width="160" x="120" y="150"></rect>
<rect fill="#0055a0" height="22" width="160" x="120" y="150"></rect><text class="t10" text-anchor="middle" x="200" y="166">ExpedienteLicencia</text>
<text class="m10" x="128" y="188">tipoLicencia: String</text>
<text class="m10" x="128" y="202">calcularPlazo(): int</text>
<rect fill="#fff" height="60" stroke="#0055a0" stroke-width="1.5" width="180" x="380" y="150"></rect>
<rect fill="#0055a0" height="22" width="180" x="380" y="150"></rect><text class="t10" text-anchor="middle" x="470" y="166">ExpedienteTributario</text>
<text class="m10" x="388" y="188">importe: double</text>
<text class="m10" x="388" y="202">calcularPlazo(): int</text>
<text class="l10" text-anchor="middle" x="330" y="248">Cliente solo conoce ExpedienteFactory.crear(tipo);</text>
<text class="l10" text-anchor="middle" x="330" y="264">añadir un nuevo tipo de expediente no modifica al Cliente (principio abierto/cerrado, §1.4)</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="650" y="326">[Fuente: GOF94]</text>
</svg>