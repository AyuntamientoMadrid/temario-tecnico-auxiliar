<svg aria-label="Los 23 patrones de diseño del catálogo Gang of Four, agrupados en 5 patrones creacionales, 7 estructurales y 11 de comportamiento" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
