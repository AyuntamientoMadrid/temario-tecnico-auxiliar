<svg aria-label="Tres niveles de un lenguaje: sintaxis como forma o gramática, semántica como significado, pragmática como uso práctico" role="img" viewbox="0 0 660 300" xmlns="http://www.w3.org/2000/svg">
<style>.t3{font:700 13px system-ui,sans-serif;fill:#fff}.s3{font:11px system-ui,sans-serif;fill:#fff}.l3{font:11px system-ui,sans-serif;fill:#444}.h3{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h3" text-anchor="middle" x="330" y="26">Cómo se describe un lenguaje de programación</text>
<rect fill="#0055a0" height="130" rx="8" width="180" x="40" y="48"></rect><text class="t3" text-anchor="middle" x="130" y="76">SINTAXIS</text><text class="s3" text-anchor="middle" x="130" y="100">La FORMA</text><text class="s3" text-anchor="middle" x="130" y="122">Reglas gramaticales</text><text class="s3" text-anchor="middle" x="130" y="140">(BNF): qué está</text><text class="s3" text-anchor="middle" x="130" y="156">bien escrito</text>
<rect fill="#2d8659" height="130" rx="8" width="180" x="240" y="48"></rect><text class="t3" text-anchor="middle" x="330" y="76">SEMÁNTICA</text><text class="s3" text-anchor="middle" x="330" y="100">El SIGNIFICADO</text><text class="s3" text-anchor="middle" x="330" y="122">Qué hace cada</text><text class="s3" text-anchor="middle" x="330" y="140">construcción al</text><text class="s3" text-anchor="middle" x="330" y="156">ejecutarse</text>
<rect fill="#e89822" height="130" rx="8" width="180" x="440" y="48"></rect><text class="t3" text-anchor="middle" x="530" y="76">PRAGMÁTICA</text><text class="s3" text-anchor="middle" x="530" y="100">El USO</text><text class="s3" text-anchor="middle" x="530" y="122">Estilo, legibilidad,</text><text class="s3" text-anchor="middle" x="530" y="140">buenas prácticas</text><text class="s3" text-anchor="middle" x="530" y="156">(no la impone la gramática)</text>
<text class="l3" text-anchor="middle" x="130" y="206">Falta un `;` →</text><text class="l3" text-anchor="middle" x="130" y="222">error de sintaxis</text>
<text class="l3" text-anchor="middle" x="330" y="206">Dividir por 0 →</text><text class="l3" text-anchor="middle" x="330" y="222">error semántico</text>
<text class="l3" text-anchor="middle" x="530" y="206">Nombres claros →</text><text class="l3" text-anchor="middle" x="530" y="222">buen estilo</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="650" y="288">[Fuente: ASU, cap. 1]</text>
</svg>