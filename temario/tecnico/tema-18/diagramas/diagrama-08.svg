<svg aria-label="Pila de llamadas de factorial de 4: se apilan factorial 4, 3, 2 y 1, el caso base factorial 1 devuelve 1 y se desenrolla multiplicando hasta 24" role="img" viewbox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
<style>.t8{font:700 12px system-ui,sans-serif;fill:#fff}.l8{font:11px system-ui,sans-serif;fill:#444}.h8{font:700 13px system-ui,sans-serif;fill:#0055a0}.g8{font:700 12px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h8" text-anchor="middle" x="320" y="24">factorial(4) — apilar (bajar) y desenrollar (subir)</text>
<text class="l8" text-anchor="middle" x="150" y="52">① Llamadas que se apilan ↓</text>
<rect fill="#0055a0" height="30" rx="4" width="160" x="70" y="64"></rect><text class="t8" text-anchor="middle" x="150" y="84">factorial(4) = 4 · …</text>
<rect fill="#0055a0" height="30" rx="4" width="160" x="70" y="100"></rect><text class="t8" text-anchor="middle" x="150" y="120">factorial(3) = 3 · …</text>
<rect fill="#0055a0" height="30" rx="4" width="160" x="70" y="136"></rect><text class="t8" text-anchor="middle" x="150" y="156">factorial(2) = 2 · …</text>
<rect fill="#d13c3c" height="30" rx="4" width="160" x="70" y="172"></rect><text class="t8" text-anchor="middle" x="150" y="192">factorial(1) = 1 (BASE)</text>
<path d="M150 94 L150 100" marker-end="url(#a8)" stroke="#888"></path><path d="M150 130 L150 136" marker-end="url(#a8)" stroke="#888"></path><path d="M150 166 L150 172" marker-end="url(#a8)" stroke="#888"></path>
<text class="l8" text-anchor="middle" x="470" y="52">② Resultados que suben ↑</text>
<rect fill="#2d8659" height="30" rx="4" width="160" x="390" y="172"></rect><text class="t8" text-anchor="middle" x="470" y="192">devuelve 1</text>
<rect fill="#2d8659" height="30" rx="4" width="160" x="390" y="136"></rect><text class="t8" text-anchor="middle" x="470" y="156">2 · 1 = 2</text>
<rect fill="#2d8659" height="30" rx="4" width="160" x="390" y="100"></rect><text class="t8" text-anchor="middle" x="470" y="120">3 · 2 = 6</text>
<rect fill="#2d8659" height="30" rx="4" width="160" x="390" y="64"></rect><text class="t8" text-anchor="middle" x="470" y="84">4 · 6 = 24</text>
<path d="M470 172 L470 166" marker-end="url(#g8m)" stroke="#2d8659"></path><path d="M470 136 L470 130" marker-end="url(#g8m)" stroke="#2d8659"></path><path d="M470 100 L470 94" marker-end="url(#g8m)" stroke="#2d8659"></path>
<path d="M232 187 L388 187" marker-end="url(#r8)" stroke="#d13c3c" stroke-dasharray="4 3" stroke-width="1.5"></path>
<rect fill="#fdf6ec" height="34" rx="8" stroke="#e89822" width="164" x="238" y="248"></rect><text class="g8" text-anchor="middle" x="320" y="270">Resultado: 24</text>
<text class="l8" text-anchor="middle" x="320" y="302">Sin caso base → recursión infinita → desbordamiento de pila</text>
<defs><marker id="a8" markerheight="8" markerwidth="8" orient="auto" refx="4" refy="4"><path d="M0 0 L8 4 L0 8 z" fill="#888"></path></marker><marker id="g8m" markerheight="8" markerwidth="8" orient="auto" refx="4" refy="4"><path d="M0 0 L8 4 L0 8 z" fill="#2d8659"></path></marker><marker id="r8" markerheight="8" markerwidth="8" orient="auto" refx="4" refy="4"><path d="M0 0 L8 4 L0 8 z" fill="#d13c3c"></path></marker></defs>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="630" y="332">[Fuente: ABELSON; CLRS cap. 2]</text>
</svg>