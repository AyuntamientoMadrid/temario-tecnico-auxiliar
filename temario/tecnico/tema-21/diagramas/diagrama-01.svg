<svg aria-label="Línea de tiempo de J2EE 1999 a Jakarta EE actual, con los hitos de introducción de anotaciones en 2006, transferencia a la Eclipse Foundation en 2017-2019 y cambio de namespace javax a jakarta en 2020" role="img" viewbox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>.t1{font:700 11px system-ui,sans-serif;fill:#fff}.s1{font:9.5px system-ui,sans-serif;fill:#fff}.l1{font:11px system-ui,sans-serif;fill:#444}.h1{font:700 13px system-ui,sans-serif;fill:#0055a0}</style>
<text class="h1" text-anchor="middle" x="340" y="22">De J2EE (1999) a Jakarta EE (actual)</text>
<line stroke="#0055a0" stroke-width="3" x1="40" x2="640" y1="60" y2="60"></line>
<circle cx="60" cy="60" fill="#0055a0" r="7"></circle><text class="l1" text-anchor="middle" x="60" y="42">1999</text><text style="font:700 10.5px system-ui;fill:#0055a0" text-anchor="middle" x="60" y="80">J2EE 1.2</text>
<circle cx="200" cy="60" fill="#0055a0" r="7"></circle><text class="l1" text-anchor="middle" x="200" y="42">2006</text><text style="font:700 10.5px system-ui;fill:#0055a0" text-anchor="middle" x="200" y="80">Java EE 5</text>
<circle cx="320" cy="60" fill="#888" r="6"></circle><text class="l1" text-anchor="middle" x="320" y="42">2009</text><text class="l1" text-anchor="middle" x="320" y="80">Java EE 6</text>
<circle cx="440" cy="60" fill="#888" r="6"></circle><text class="l1" text-anchor="middle" x="440" y="42">2017</text><text class="l1" text-anchor="middle" x="440" y="80">Java EE 8</text>
<circle cx="540" cy="60" fill="#d13c3c" r="7"></circle><text class="l1" text-anchor="middle" x="540" y="42">2018-19</text><text style="font:700 10.5px system-ui;fill:#d13c3c" text-anchor="middle" x="540" y="80">→ Eclipse</text>
<circle cx="620" cy="60" fill="#d13c3c" r="7"></circle><text class="l1" text-anchor="middle" x="620" y="42">2020</text><text style="font:700 10.5px system-ui;fill:#d13c3c" text-anchor="middle" x="620" y="80">Jakarta 9</text>
<rect fill="#0055a0" height="50" rx="5" width="220" x="20" y="100"></rect><text class="t1" text-anchor="middle" x="130" y="122">J2EE 1.2 (1999)</text><text class="s1" text-anchor="middle" x="130" y="140">Modelo pesado, mucho XML</text>
<rect fill="#3778b5" height="50" rx="5" width="220" x="250" y="100"></rect><text class="t1" text-anchor="middle" x="360" y="122">Java EE 5 (2006)</text><text class="s1" text-anchor="middle" x="360" y="140">Giro a ANOTACIONES, menos XML</text>
<rect fill="#2d8659" height="50" rx="5" width="180" x="480" y="100"></rect><text class="t1" text-anchor="middle" x="570" y="122">Java EE 6 (2009)</text><text class="s1" text-anchor="middle" x="570" y="140">Nace CDI</text>
<rect fill="#d13c3c" height="54" rx="5" width="260" x="60" y="164"></rect><text class="t1" text-anchor="middle" x="190" y="186">Transferencia a Eclipse (2018-19)</text><text class="s1" text-anchor="middle" x="190" y="204">Oracle conserva la marca «Java» → renombrado</text>
<rect fill="#e89822" height="54" rx="5" width="280" x="340" y="164"></rect><text class="t1" text-anchor="middle" x="480" y="186">Jakarta EE 9 (2020)</text><text class="s1" text-anchor="middle" x="480" y="204">«Big Bang Renaming»: javax.* → jakarta.*</text>
<text style="font:700 11px system-ui;fill:#0055a0" text-anchor="middle" x="340" y="248">El renombrado es consecuencia LEGAL (marca), no una decisión técnica</text>
<text class="l1" text-anchor="middle" x="340" y="268">jakarta.* es una ruptura binaria, no solo un cambio de nombre de paquete</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="312">[Fuente: JAKARTA-PLAT; GONCALVES]</text>
</svg>