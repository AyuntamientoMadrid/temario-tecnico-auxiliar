<svg aria-label="Proceso de evaluación de accesibilidad: los cinco pasos de la metodología WCAG-EM, los tres tipos de comprobación (automática, manual experta y con usuarios) con la advertencia de que la automática solo detecta una parte de los criterios, y el contenido obligatorio de la declaración de accesibilidad" role="img" viewbox="0 0 680 350" xmlns="http://www.w3.org/2000/svg">
<style>.t7{font:700 10px system-ui,sans-serif;fill:#fff}.s7{font:9px system-ui,sans-serif;fill:#fff}.h7{font:700 13px system-ui,sans-serif;fill:#0055a0}.k7{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.d7{font:9px system-ui,sans-serif;fill:#333}</style>
<text class="h7" text-anchor="middle" x="340" y="20">De la evaluación a la declaración pública</text>
<text class="k7" x="20" y="40">1 · METODOLOGÍA WCAG-EM — cinco pasos</text>
<rect fill="#0055a0" height="42" rx="5" width="122" x="20" y="48"></rect>
<text class="t7" text-anchor="middle" x="81" y="65">1 · ALCANCE</text>
<text class="s7" text-anchor="middle" x="81" y="80">qué sitio y qué nivel</text>
<rect fill="#0055a0" height="42" rx="5" width="122" x="150" y="48"></rect>
<text class="t7" text-anchor="middle" x="211" y="65">2 · EXPLORAR</text>
<text class="s7" text-anchor="middle" x="211" y="80">tipos de página</text>
<rect fill="#0055a0" height="42" rx="5" width="122" x="280" y="48"></rect>
<text class="t7" text-anchor="middle" x="341" y="65">3 · MUESTRA</text>
<text class="s7" text-anchor="middle" x="341" y="80">y procesos completos</text>
<rect fill="#2d8659" height="42" rx="5" width="122" x="410" y="48"></rect>
<text class="t7" text-anchor="middle" x="471" y="65">4 · AUDITAR</text>
<text class="s7" text-anchor="middle" x="471" y="80">criterio a criterio</text>
<rect fill="#2d8659" height="42" rx="5" width="120" x="540" y="48"></rect>
<text class="t7" text-anchor="middle" x="600" y="65">5 · INFORMAR</text>
<text class="s7" text-anchor="middle" x="600" y="80">evidencias y plan</text>
<text class="k7" x="20" y="112">2 · TRES TIPOS DE COMPROBACIÓN — ninguno basta por sí solo</text>
<rect fill="#e89822" height="60" rx="5" width="208" x="20" y="120"></rect>
<text class="t7" text-anchor="middle" x="124" y="138">AUTOMÁTICA</text>
<text class="s7" text-anchor="middle" x="124" y="155">Rápida, repetible, en cada cambio</text>
<text class="s7" text-anchor="middle" x="124" y="171">Solo detecta parte de los criterios</text>
<rect fill="#0055a0" height="60" rx="5" width="208" x="238" y="120"></rect>
<text class="t7" text-anchor="middle" x="342" y="138">MANUAL EXPERTA</text>
<text class="s7" text-anchor="middle" x="342" y="155">Teclado, contraste, encabezados,</text>
<text class="s7" text-anchor="middle" x="342" y="171">lector de pantalla</text>
<rect fill="#2d8659" height="60" rx="5" width="204" x="456" y="120"></rect>
<text class="t7" text-anchor="middle" x="558" y="138">CON USUARIOS REALES</text>
<text class="s7" text-anchor="middle" x="558" y="155">No exigida por la norma,</text>
<text class="s7" text-anchor="middle" x="558" y="171">insustituible en la práctica</text>
<rect fill="#fbe9e9" height="24" rx="5" stroke="#d13c3c" width="500" x="90" y="188"></rect>
<text style="font:700 10px system-ui;fill:#d13c3c" text-anchor="middle" x="340" y="204">Una web puede superar el 100 % de las pruebas automáticas y ser inaccesible</text>
<text class="k7" x="20" y="234">3 · DECLARACIÓN DE ACCESIBILIDAD (obligatoria, modelo europeo, enlazada desde todas las páginas)</text>
<rect fill="#eef3f8" height="52" rx="5" stroke="#0055a0" width="155" x="20" y="242"></rect>
<text class="d7" text-anchor="middle" x="97" y="260">GRADO DE CUMPLIMIENTO</text>
<text class="d7" text-anchor="middle" x="97" y="275">Plenamente / parcialmente</text>
<text class="d7" text-anchor="middle" x="97" y="288">/ no conforme</text>
<rect fill="#eef3f8" height="52" rx="5" stroke="#0055a0" width="155" x="185" y="242"></rect>
<text class="d7" text-anchor="middle" x="262" y="260">CONTENIDO NO ACCESIBLE</text>
<text class="d7" text-anchor="middle" x="262" y="275">Por falta de conformidad,</text>
<text class="d7" text-anchor="middle" x="262" y="288">carga o fuera de ámbito</text>
<rect fill="#eef3f8" height="52" rx="5" stroke="#0055a0" width="155" x="350" y="242"></rect>
<text class="d7" text-anchor="middle" x="427" y="260">FECHA Y MÉTODO</text>
<text class="d7" text-anchor="middle" x="427" y="275">Autoevaluación o</text>
<text class="d7" text-anchor="middle" x="427" y="288">evaluación por tercero</text>
<rect fill="#fdf1de" height="52" rx="5" stroke="#e89822" width="145" x="515" y="242"></rect>
<text class="d7" text-anchor="middle" x="587" y="260">COMUNICACIÓN Y</text>
<text class="d7" text-anchor="middle" x="587" y="275">RECLAMACIÓN</text>
<text class="d7" text-anchor="middle" x="587" y="288">→ unidad responsable</text>
<rect fill="none" height="26" rx="5" stroke="#0055a0" stroke-width="2" width="420" x="130" y="302"></rect>
<text style="font:700 10px system-ui;fill:#0055a0" text-anchor="middle" x="340" y="319">Revisión al menos anual y ante todo cambio sustancial del sitio</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="344">[Fuente: WCAG-EM; RD1112-2018; DEC2018-1523; OBSERVATORIO]</text>
</svg>