<svg aria-label="Estructura de WCAG: cuatro principios POUR (perceptible, operable, comprensible y robusto) con sus trece pautas, de las que cuelgan los criterios de conformidad verificables en niveles A, AA y AAA, y por debajo las técnicas, que son informativas y no normativas" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>.t4{font:700 10.5px system-ui,sans-serif;fill:#fff}.s4{font:9px system-ui,sans-serif;fill:#fff}.h4{font:700 13px system-ui,sans-serif;fill:#0055a0}.k4{font:700 9.5px system-ui,sans-serif;fill:#0055a0}.d4{font:9px system-ui,sans-serif;fill:#333}</style>
<text class="h4" text-anchor="middle" x="340" y="20">WCAG 2.2 — los 4 principios POUR y sus 13 pautas</text>
<rect fill="#0055a0" height="40" rx="5" width="155" x="20" y="32"></rect>
<text class="t4" text-anchor="middle" x="97" y="50">P · PERCEPTIBLE</text>
<text class="s4" text-anchor="middle" x="97" y="65">Que se pueda percibir</text>
<rect fill="#2d8659" height="40" rx="5" width="155" x="185" y="32"></rect>
<text class="t4" text-anchor="middle" x="262" y="50">O · OPERABLE</text>
<text class="s4" text-anchor="middle" x="262" y="65">Que se pueda manejar</text>
<rect fill="#e89822" height="40" rx="5" width="155" x="350" y="32"></rect>
<text class="t4" text-anchor="middle" x="427" y="50">C · COMPRENSIBLE</text>
<text class="s4" text-anchor="middle" x="427" y="65">Que se entienda</text>
<rect fill="#888" height="40" rx="5" width="145" x="515" y="32"></rect>
<text class="t4" text-anchor="middle" x="587" y="50">R · ROBUSTO</text>
<text class="s4" text-anchor="middle" x="587" y="65">Que lo lea la tecnología</text>
<rect fill="#e6eff7" height="86" rx="4" width="155" x="20" y="80"></rect>
<text class="d4" x="28" y="96">1.1 Alternativas textuales</text>
<text class="d4" x="28" y="112">1.2 Medios tempodepend.</text>
<text class="d4" x="28" y="128">1.3 Adaptable (semántica)</text>
<text class="d4" x="28" y="144">1.4 Distinguible</text>
<text class="d4" x="28" y="160">(contraste 4,5:1 · 200 %)</text>
<rect fill="#e6f2ec" height="86" rx="4" width="155" x="185" y="80"></rect>
<text class="d4" x="193" y="96">2.1 Accesible por teclado</text>
<text class="d4" x="193" y="112">2.2 Tiempo suficiente</text>
<text class="d4" x="193" y="128">2.3 Convulsiones</text>
<text class="d4" x="193" y="144">2.4 Navegable (foco)</text>
<text class="d4" x="193" y="160">2.5 Modalidades de entrada</text>
<rect fill="#fdf1de" height="86" rx="4" width="155" x="350" y="80"></rect>
<text class="d4" x="358" y="96">3.1 Legible (idioma)</text>
<text class="d4" x="358" y="112">3.2 Predecible</text>
<text class="d4" x="358" y="128">3.3 Entrada de datos</text>
<text class="d4" x="358" y="144">asistida (errores,</text>
<text class="d4" x="358" y="160">etiquetas, autenticación)</text>
<rect fill="#f0f0f0" height="86" rx="4" width="145" x="515" y="80"></rect>
<text class="d4" x="523" y="96">4.1 Compatible</text>
<text class="d4" x="523" y="112">4.1.2 Nombre, función</text>
<text class="d4" x="523" y="128">y valor (ARIA)</text>
<text class="d4" x="523" y="144">4.1.3 Mensajes de</text>
<text class="d4" x="523" y="160">estado</text>
<line stroke="#ccc" stroke-width="1" x1="20" x2="660" y1="182" y2="182"></line>
<text class="k4" text-anchor="middle" x="340" y="202">La jerarquía normativa: qué obliga y qué solo orienta</text>
<rect fill="#0055a0" height="30" rx="5" width="380" x="150" y="212"></rect>
<text class="t4" text-anchor="middle" x="340" y="232">4 PRINCIPIOS  —  objetivos generales</text>
<rect fill="#3d7fb8" height="30" rx="5" width="380" x="150" y="248"></rect>
<text class="t4" text-anchor="middle" x="340" y="268">13 PAUTAS  —  NO verificables por sí solas</text>
<rect fill="#2d8659" height="34" rx="5" width="380" x="150" y="284"></rect>
<text class="t4" text-anchor="middle" x="340" y="299">86 CRITERIOS DE CONFORMIDAD  —  A / AA / AAA</text>
<text class="s4" text-anchor="middle" x="340" y="313">VERIFICABLES · lo único NORMATIVO</text>
<rect fill="#f0f0f0" height="26" rx="5" stroke="#888" stroke-dasharray="4 2" width="380" x="150" y="324"></rect>
<text class="d4" text-anchor="middle" x="340" y="342">TÉCNICAS suficientes y consultivas + FALLOS  —  INFORMATIVAS</text>
<text class="k4" x="30" y="300">Solo esta capa</text>
<text class="k4" x="30" y="314">se audita y se</text>
<text class="k4" x="30" y="328">declara</text>
<text style="font:11px system-ui;fill:#666" text-anchor="end" x="670" y="356">[Fuente: WCAG22; WAI]</text>
</svg>