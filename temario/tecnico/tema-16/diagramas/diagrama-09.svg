<svg aria-label="Diagrama de transición de estados del ciclo de vida de un expediente administrativo" class="svd9" role="img" viewbox="0 0 660 290" xmlns="http://www.w3.org/2000/svg">
<style>.svd9 .w{font:700 11px system-ui,sans-serif;fill:#fff}.svd9 .ev{font:10px system-ui,sans-serif;fill:#d13c3c}.svd9 .h{font:700 13px system-ui,sans-serif;fill:#0055a0}.svd9 .lab{font:11px system-ui,sans-serif;fill:#555}</style>
<text class="h" text-anchor="middle" x="330" y="22">Ciclo de vida de un expediente (DTE)</text>
<defs><marker id="ar" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 Z" fill="#0055a0"></path></marker></defs>
<circle cx="45" cy="90" fill="#002a52" r="7"></circle>
<rect fill="#0055a0" height="40" rx="20" width="105" x="75" y="70"></rect><text class="w" text-anchor="middle" x="127" y="94">INICIADO</text>
<rect fill="#0055a0" height="40" rx="20" width="125" x="235" y="70"></rect><text class="w" text-anchor="middle" x="297" y="94">EN TRAMITACIÓN</text>
<rect fill="#e89822" height="40" rx="20" width="125" x="235" y="170"></rect><text class="w" text-anchor="middle" x="297" y="194">SUBSANACIÓN</text>
<rect fill="#0055a0" height="40" rx="20" width="105" x="420" y="70"></rect><text class="w" text-anchor="middle" x="472" y="94">RESUELTO</text>
<rect fill="#2d8659" height="40" rx="20" width="95" x="555" y="70"></rect><text class="w" text-anchor="middle" x="602" y="94">ARCHIVADO</text>
<line marker-end="url(#ar)" stroke="#0055a0" x1="52" x2="73" y1="90" y2="90"></line>
<line marker-end="url(#ar)" stroke="#0055a0" x1="180" x2="233" y1="90" y2="90"></line><text class="ev" text-anchor="middle" x="206" y="83">admitir</text>
<line marker-end="url(#ar)" stroke="#0055a0" x1="297" x2="297" y1="110" y2="168"></line><text class="ev" text-anchor="end" x="291" y="142">requerir [falta doc.]</text>
<path d="M 360 185 Q 410 150 360 112" fill="none" marker-end="url(#ar)" stroke="#0055a0"></path><text class="ev" x="412" y="150">subsanar</text>
<line marker-end="url(#ar)" stroke="#0055a0" x1="360" x2="418" y1="90" y2="90"></line><text class="ev" text-anchor="middle" x="389" y="83">resolver</text>
<line marker-end="url(#ar)" stroke="#0055a0" x1="525" x2="553" y1="90" y2="90"></line><text class="ev" text-anchor="middle" x="540" y="64">notificar</text>
<circle cx="602" cy="140" fill="none" r="9" stroke="#2d8659" stroke-width="2"></circle><circle cx="602" cy="140" fill="#2d8659" r="4"></circle>
<line marker-end="url(#ar)" stroke="#0055a0" x1="602" x2="602" y1="110" y2="131"></line>
<text class="lab" x="45" y="250">Etiqueta de transición: <tspan font-weight="700">evento [guarda] / acción</tspan> · estado inicial (●), estados, estado final (◎)</text>
<text class="lab" style="fill:#888" text-anchor="end" x="630" y="275">[Fuente: YOURDON · UML]</text>
</svg>