<svg aria-label="Descomposición del DFD: diagrama de contexto nivel 0, nivel 1 y explosión de un proceso con equilibrado de flujos" class="svd11" role="img" viewbox="0 0 660 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd11 .w{font:700 11px system-ui,sans-serif;fill:#fff}.svd11 .lab{font:11px system-ui,sans-serif;fill:#555}.svd11 .h{font:700 12px system-ui,sans-serif;fill:#0055a0}.svd11 .eq{font:700 11px system-ui,sans-serif;fill:#2d8659}</style>
<text class="h" text-anchor="middle" x="330" y="20">Top-down: del contexto a las primitivas funcionales</text>
<!-- nivel 0 -->
<text class="h" text-anchor="middle" x="100" y="48">Nivel 0 · contexto</text>
<rect fill="#2d8659" height="26" rx="2" width="50" x="40" y="60"></rect><text class="w" style="font-size:9px" text-anchor="middle" x="65" y="78">CONTRIB.</text>
<circle cx="135" cy="95" fill="#0055a0" r="28"></circle><text class="w" text-anchor="middle" x="135" y="99">0</text>
<rect fill="#2d8659" height="26" rx="2" width="50" x="180" y="105"></rect><text class="w" style="font-size:9px" text-anchor="middle" x="205" y="123">BANCO</text>
<line marker-end="url(#m2)" stroke="#333" x1="90" x2="108" y1="78" y2="88"></line><text class="lab" style="font-size:9px" x="58" y="102">declarac.</text>
<line marker-end="url(#m2)" stroke="#333" x1="160" x2="180" y1="110" y2="116"></line><text class="lab" style="font-size:9px" x="150" y="135">cobro</text>
<defs><marker id="m2" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 Z" fill="#333"></path></marker></defs>
<text class="lab" style="font-size:10px" text-anchor="middle" x="100" y="160">1 burbuja · sin almacenes</text>
<!-- nivel 1 -->
<text class="h" text-anchor="middle" x="400" y="48">Nivel 1 · sistema</text>
<circle cx="320" cy="85" fill="#0055a0" r="22"></circle><text class="w" text-anchor="middle" x="320" y="89">1</text>
<circle cx="400" cy="85" fill="#0055a0" r="22"></circle><text class="w" text-anchor="middle" x="400" y="89">2</text>
<circle cx="480" cy="85" fill="#0055a0" r="22"></circle><text class="w" text-anchor="middle" x="480" y="89">3</text>
<line marker-end="url(#m2)" stroke="#333" x1="342" x2="378" y1="85" y2="85"></line>
<line marker-end="url(#m2)" stroke="#333" x1="422" x2="458" y1="85" y2="85"></line>
<line stroke="#0055a0" x1="350" x2="464" y1="125" y2="125"></line><line stroke="#0055a0" x1="350" x2="464" y1="140" y2="140"></line><line stroke="#0055a0" x1="350" x2="350" y1="125" y2="140"></line><text class="h" style="font-size:10px" x="360" y="137">D1 Liquidaciones</text>
<line marker-end="url(#m2)" stroke="#333" x1="400" x2="400" y1="107" y2="125"></line>
<text class="lab" style="font-size:10px" text-anchor="middle" x="400" y="165">procesos 1,2,3 + almacenes</text>
<!-- nivel 2 explosion -->
<text class="h" text-anchor="middle" x="330" y="205">Nivel 2 · explosión del proceso «1»</text>
<rect fill="#eaf1f8" height="80" rx="8" stroke="#0055a0" stroke-dasharray="5 4" width="360" x="150" y="220"></rect>
<circle cx="220" cy="260" fill="#3378b9" r="20"></circle><text class="w" style="font-size:10px" text-anchor="middle" x="220" y="264">1.1</text>
<circle cx="330" cy="260" fill="#3378b9" r="20"></circle><text class="w" style="font-size:10px" text-anchor="middle" x="330" y="264">1.2</text>
<circle cx="440" cy="260" fill="#3378b9" r="20"></circle><text class="w" style="font-size:10px" text-anchor="middle" x="440" y="264">1.3</text>
<line marker-end="url(#m2)" stroke="#333" x1="240" x2="310" y1="260" y2="260"></line>
<line marker-end="url(#m2)" stroke="#333" x1="350" x2="420" y1="260" y2="260"></line>
<line marker-end="url(#m3)" stroke="#2d8659" stroke-width="2" x1="110" x2="200" y1="260" y2="260"></line><text class="eq" style="font-size:9px" x="105" y="253">declarac.</text>
<line marker-end="url(#m3)" stroke="#2d8659" stroke-width="2" x1="460" x2="550" y1="260" y2="260"></line><text class="eq" style="font-size:9px" x="514" y="253">liquidación</text>
<defs><marker id="m3" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 Z" fill="#2d8659"></path></marker></defs>
<text class="eq" text-anchor="middle" x="330" y="320">EQUILIBRADO: los flujos verdes (frontera del hijo) = entradas/salidas del proceso «1» del nivel 1 — [DEMARCO]</text>
</svg>