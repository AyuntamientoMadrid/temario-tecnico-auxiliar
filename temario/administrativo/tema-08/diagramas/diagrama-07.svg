<svg aria-label="El precio público procede cuando el servicio es de solicitud voluntaria y lo presta también el sector privado, no figura entre los tributos propios, debe cubrir como mínimo el coste y lo fija el Pleno con posible delegación" class="svd7" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd7 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd7 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd7 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="48" rx="8" width="280" x="220" y="16"></rect>
<text class="h" x="360" y="38">PRECIO PÚBLICO (arts. 41-47)</text>
<text class="h" style="font-weight:400;font-size:10.5px" x="360" y="55">NO es tributo propio (art. 2.1.b y e)</text>
<rect fill="#e8f5ee" height="66" rx="8" stroke="#2d8659" width="280" x="60" y="86"></rect>
<text class="t" style="font-weight:700" x="200" y="110">Condición 1</text>
<text class="s" x="200" y="132">solicitud o recepción VOLUNTARIA</text>
<rect fill="#e8f5ee" height="66" rx="8" stroke="#2d8659" width="280" x="380" y="86"></rect>
<text class="t" style="font-weight:700" x="520" y="110">Condición 2</text>
<text class="s" x="520" y="132">prestado TAMBIÉN por el sector privado</text>
<rect fill="#eef3f8" height="36" rx="8" stroke="#0055a0" width="480" x="120" y="168"></rect>
<text class="s" style="font-weight:700;fill:#0055a0" x="360" y="191">deben concurrir LAS DOS · si falta una → es TASA</text>
<rect fill="#fdeaea" height="80" rx="8" stroke="#d13c3c" width="280" x="60" y="220"></rect>
<text class="t" style="font-weight:700;fill:#d13c3c" x="200" y="244">Cuantía (art. 44)</text>
<text class="s" style="font-weight:700" x="200" y="266">MÍNIMO: cubrir el coste</text>
<text class="s" x="200" y="286">excepción social: puede bajar (44.2)</text>
<rect fill="#fff5e6" height="80" rx="8" stroke="#e89822" width="280" x="380" y="220"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="520" y="244">Establecimiento (art. 47)</text>
<text class="s" x="520" y="266">lo fija el PLENO</text>
<text class="s" x="520" y="286">delegable en la Junta de Gobierno Local</text>
</svg>