<svg aria-label="Para la cobranza de los ingresos de derecho público la Hacienda local ostenta las prerrogativas de la Hacienda del Estado (art. 2.2); la efectividad de los derechos derivados de ingresos de derecho privado se sujeta a las normas y procedimientos del derecho privado (art. 4)" class="svd3" role="img" viewbox="0 0 720 362" xmlns="http://www.w3.org/2000/svg">
<style>.svd3 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd3 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd3 .s{font:10.5px system-ui,sans-serif;fill:#444;text-anchor:start}</style>
<rect fill="#0055a0" height="44" rx="8" width="310" x="30" y="20"></rect>
<text class="h" x="185" y="47">INGRESOS DE DERECHO PÚBLICO</text>
<rect fill="#7a5230" height="44" rx="8" width="310" x="380" y="20"></rect>
<text class="h" x="535" y="47">INGRESOS DE DERECHO PRIVADO</text>
<rect fill="#e8f0f8" height="190" rx="8" stroke="#0055a0" width="310" x="30" y="78"></rect>
<text class="s" style="font-weight:700;fill:#0055a0" x="48" y="104">Régimen: procedimientos administrativos</text>
<text class="s" x="48" y="128">• Prerrogativas de la Hacienda del Estado</text>
<text class="s" x="48" y="150">• Tributos: apremio en período ejecutivo</text>
<text class="s" x="48" y="172">• Clases: tributos (impuestos, tasas,</text>
<text class="s" x="58" y="190">contrib. especiales), recargos,</text>
<text class="s" x="58" y="208">participaciones, subvenciones,</text>
<text class="s" x="58" y="226">multas, precios públicos</text>
<text class="s" style="fill:#0055a0" x="48" y="248">art. 2.2 TRLHL</text>
<rect fill="#f3ece4" height="190" rx="8" stroke="#7a5230" width="310" x="380" y="78"></rect>
<text class="s" style="font-weight:700;fill:#7a5230" x="398" y="104">Régimen: derecho privado (art. 4)</text>
<text class="s" x="398" y="128">• Sin las prerrogativas del art. 2.2</text>
<text class="s" x="398" y="150">• Clases: rendimientos del patrimonio;</text>
<text class="s" x="408" y="168">herencias, legados y donaciones</text>
<text class="s" x="398" y="192">• Nunca los de bienes de dominio público</text>
<text class="s" style="font-weight:700;fill:#d13c3c" x="398" y="216">• Efectividad: normas y procedimientos</text>
<text class="s" style="font-weight:700;fill:#d13c3c" x="408" y="234">del derecho privado (art. 4)</text>
<text class="s" style="fill:#7a5230" x="398" y="252">arts. 3 y 4 TRLHL</text>
<rect fill="#fff5e6" height="56" rx="8" stroke="#e89822" width="480" x="120" y="290"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="314">Diferencia: las PRERROGATIVAS de cobranza</text>
<text class="s" style="text-anchor:middle" x="360" y="334">público: prerrogativas (art. 2.2) · privado: derecho privado (art. 4)</text>
</svg>