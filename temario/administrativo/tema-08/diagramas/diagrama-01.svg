<svg aria-label="La Constitución (arts. 137, 140 y 142) garantiza la autonomía y la suficiencia financiera local; la LBRL remite a la legislación estatal; el TRLHL (RDLeg 2/2004) regula los recursos de las Haciendas Locales" class="svd1" role="img" viewbox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd1 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd1 .t{font:13px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd1 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="58" rx="8" width="360" x="170" y="18"></rect>
<text class="h" x="350" y="42">Constitución Española</text>
<text class="h" style="font-weight:400;font-size:11px" x="350" y="62">arts. 137 y 140 (autonomía) · 142 (suficiencia financiera)</text>
<line stroke="#0055a0" stroke-width="1.5" x1="350" x2="350" y1="76" y2="87"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="220" x2="480" y1="87" y2="87"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="220" x2="220" y1="87" y2="98"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="480" x2="480" y1="87" y2="98"></line>
<rect fill="#e8f0f8" height="58" rx="8" stroke="#0055a0" width="200" x="120" y="98"></rect>
<text class="t" style="font-weight:700" x="220" y="122">LBRL (Ley 7/1985)</text>
<text class="s" x="220" y="142">remite a la legislación estatal</text>
<rect fill="#e8f0f8" height="58" rx="8" stroke="#0055a0" width="200" x="380" y="98"></rect>
<text class="t" style="font-weight:700" x="480" y="122">art. 133.2 CE</text>
<text class="s" x="480" y="142">potestad tributaria conforme a ley</text>
<line stroke="#0055a0" stroke-width="1.5" x1="220" x2="220" y1="156" y2="168"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="480" x2="480" y1="156" y2="168"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="220" x2="480" y1="168" y2="168"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="350" x2="350" y1="168" y2="180"></line>
<rect fill="#e8f5ee" height="60" rx="8" stroke="#2d8659" width="340" x="180" y="180"></rect>
<text class="t" style="font-weight:700" x="350" y="205">TRLHL · RDLeg 2/2004, de 5 de marzo</text>
<text class="s" x="350" y="225">refunde la Ley 39/1988 · regula los recursos locales</text>
<rect fill="#fff5e6" height="52" rx="8" stroke="#e89822" width="380" x="160" y="262"></rect>
<text class="s" style="font-weight:700;fill:#b5740f" x="350" y="284">Suficiencia financiera (art. 142 CE)</text>
<text class="s" x="350" y="302">medios suficientes para las funciones que la ley atribuye</text>
</svg>