<svg aria-label="Mapa resumen: el TRLHL clasifica los recursos en ingresos de derecho público y privado; los tributos propios son tasas, contribuciones especiales e impuestos; los precios públicos no son tributo; los impuestos se dividen en obligatorios y potestativos" class="svd12" role="img" viewbox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
<style>.svd12 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd12 .t{font:11.5px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd12 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="44" rx="8" width="220" x="270" y="14"></rect>
