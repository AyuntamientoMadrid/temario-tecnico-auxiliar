<svg aria-label="La contribución especial grava el beneficio especial por obras o servicios; la base imponible es como máximo el 90 por ciento del coste soportado (art. 31) y se reparte por módulos del art. 32" class="svd6" role="img" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd6 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd6 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd6 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="48" rx="8" width="340" x="190" y="16"></rect>
<text class="h" x="360" y="38">CONTRIBUCIÓN ESPECIAL (arts. 28-37)</text>
<text class="h" style="font-weight:400;font-size:10.5px" x="360" y="55">beneficio especial por obra o servicio local</text>
<rect fill="#e8f0f8" height="74" rx="8" stroke="#0055a0" width="300" x="40" y="86"></rect>
<text class="t" style="font-weight:700" x="190" y="110">Hecho imponible (art. 28)</text>
<text class="s" x="190" y="132">obtención de un beneficio o aumento</text>
<text class="s" x="190" y="150">de valor de los bienes del sujeto pasivo</text>
<rect fill="#e8f5ee" height="74" rx="8" stroke="#2d8659" width="300" x="380" y="86"></rect>
<text class="t" style="font-weight:700" x="530" y="110">Sujetos pasivos (art. 30)</text>
<text class="s" x="530" y="132">los especialmente beneficiados</text>
<text class="s" x="530" y="150">(propietarios, titulares, aseguradoras)</text>
<rect fill="#fdeaea" height="76" rx="8" stroke="#d13c3c" width="300" x="40" y="176"></rect>
<text class="t" style="font-weight:700;fill:#d13c3c" x="190" y="200">Base imponible — art. 31</text>
<text class="s" style="font-weight:700" x="190" y="222">MÁXIMO el 90 % del coste soportado</text>
<text class="s" x="190" y="242">(coste total − subvenciones, art. 31.5)</text>
<rect fill="#e8f0f8" height="76" rx="8" stroke="#0055a0" width="300" x="380" y="176"></rect>
<text class="t" style="font-weight:700" x="530" y="200">Módulos de reparto — art. 32</text>
<text class="s" x="530" y="222">metros de fachada · superficie ·</text>
<text class="s" x="530" y="242">volumen edificable · valor catastral</text>
<rect fill="#fff5e6" height="48" rx="8" stroke="#e89822" width="440" x="140" y="268"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="290">¡No confundir! 90 % = art. 31 · módulos = art. 32</text>
<text class="s" x="360" y="309">posibilidad de anticipar el pago (art. 33.2)</text>
</svg>