<svg aria-label="ICIO grava obras con licencia, tipo máximo 4 por ciento; IIVTNU grava la plusvalía del suelo urbano con sistema dual tras la STC 182/2021; el impuesto sobre gastos suntuarios solo subsiste para cotos de caza y pesca" class="svd10" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd10 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd10 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd10 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#e89822" height="40" rx="8" width="320" x="200" y="14"></rect>
<text class="h" x="360" y="39">IMPUESTOS POTESTATIVOS</text>
<rect fill="#fff5e6" height="226" rx="8" stroke="#e89822" width="220" x="20" y="70"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="130" y="96">ICIO (100-103)</text>
<text class="s" x="130" y="122">construcciones, instalaciones</text>
<text class="s" x="130" y="138">u obras con licencia</text>
<text class="s" x="130" y="166">base = coste real y</text>
<text class="s" x="130" y="182">efectivo de la obra</text>
<text class="s" style="font-weight:700" x="130" y="212">tipo MÁXIMO 4 %</text>
<text class="s" style="fill:#b5740f" x="130" y="266">art. 102.3</text>
<rect fill="#fff5e6" height="226" rx="8" stroke="#e89822" width="220" x="250" y="70"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="96">IIVTNU (104-110)</text>
<text class="s" x="360" y="120">plusvalía del suelo urbano</text>
<text class="s" x="360" y="136">en transmisiones</text>
<text class="s" style="font-weight:700;fill:#d13c3c" x="360" y="162">tras STC 182/2021 +</text>
<text class="s" style="font-weight:700;fill:#d13c3c" x="360" y="180">RDL 26/2021:</text>
<text class="s" x="360" y="200">sistema DUAL (objetivo/real)</text>
<text class="s" x="360" y="218">a instancia del sujeto pasivo</text>
<text class="s" x="360" y="238">no sujeción si no hay incremento</text>
<text class="s" style="fill:#b5740f" x="360" y="266">art. 104.5 y 107</text>
<rect fill="#fff5e6" height="226" rx="8" stroke="#e89822" width="220" x="480" y="70"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="590" y="96">Gastos Suntuarios</text>
<text class="s" x="590" y="124">solo subsiste la modalidad</text>
<text class="s" style="font-weight:700" x="590" y="142">de cotos de caza y pesca</text>
<text class="s" x="590" y="172">«podrán continuar exigiendo»</text>
<text class="s" x="590" y="204">base legal:</text>
<text class="s" style="font-weight:700" x="590" y="222">Disposición Transitoria 6.ª</text>
<text class="s" style="fill:#b5740f" x="590" y="266">DT 6.ª TRLHL</text>
</svg>