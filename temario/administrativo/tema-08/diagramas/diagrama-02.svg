<svg aria-label="El artículo 2.1 del TRLHL enumera ocho recursos: patrimonio, tributos propios y recargos, participación en tributos del Estado y CCAA, subvenciones, precios públicos, crédito, multas y sanciones, y demás prestaciones de derecho público" class="svd2" role="img" viewbox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
<style>.svd2 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd2 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd2 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="48" rx="8" width="240" x="240" y="16"></rect>
<text class="h" x="360" y="37">RECURSOS (art. 2.1 TRLHL)</text>
<text class="h" style="font-weight:400;font-size:10.5px" x="360" y="54">ocho categorías</text>
<rect fill="#fdeaea" height="64" rx="8" stroke="#d13c3c" width="160" x="20" y="90"></rect>
<text class="t" style="font-weight:700" x="100" y="114">a) Patrimonio</text>
<text class="s" x="100" y="134">y demás de derecho privado</text>
<rect fill="#e8f5ee" height="64" rx="8" stroke="#2d8659" width="170" x="190" y="90"></rect>
<text class="t" style="font-weight:700" x="275" y="110">b) Tributos propios</text>
<text class="s" x="275" y="128">tasas · contrib. especiales ·</text>
<text class="s" x="275" y="144">impuestos (+ recargos)</text>
<rect fill="#e8f0f8" height="64" rx="8" stroke="#0055a0" width="170" x="370" y="90"></rect>
<text class="t" style="font-weight:700" x="455" y="114">c) Participación</text>
<text class="s" x="455" y="134">tributos del Estado y CCAA</text>
<rect fill="#e8f0f8" height="64" rx="8" stroke="#0055a0" width="150" x="550" y="90"></rect>
<text class="t" style="font-weight:700" x="625" y="127">d) Subvenciones</text>
<rect fill="#e8f5ee" height="64" rx="8" stroke="#2d8659" width="160" x="20" y="172"></rect>
<text class="t" style="font-weight:700" x="100" y="196">e) Precios</text>
<text class="t" style="font-weight:700" x="100" y="214">públicos</text>
<rect fill="#e8f0f8" height="64" rx="8" stroke="#0055a0" width="170" x="190" y="172"></rect>
<text class="t" style="font-weight:700" x="275" y="196">f) Operaciones</text>
<text class="t" style="font-weight:700" x="275" y="214">de crédito</text>
<rect fill="#e8f0f8" height="64" rx="8" stroke="#0055a0" width="170" x="370" y="172"></rect>
<text class="t" style="font-weight:700" x="455" y="196">g) Multas y</text>
<text class="t" style="font-weight:700" x="455" y="214">sanciones</text>
<rect fill="#e8f0f8" height="64" rx="8" stroke="#0055a0" width="150" x="550" y="172"></rect>
<text class="t" style="font-weight:700" x="625" y="196">h) Demás</text>
<text class="s" x="625" y="214">prest. dcho. público</text>
<rect fill="#fff5e6" height="70" rx="8" stroke="#e89822" width="480" x="120" y="270"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="296">Tributos propios = TASAS + CONTRIBUCIONES ESPECIALES + IMPUESTOS</text>
<text class="s" x="360" y="320">el resto son recursos no tributarios (salvo recargos)</text>
</svg>