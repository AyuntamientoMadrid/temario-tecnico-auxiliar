<svg aria-label="Árbol de decisión: si el servicio es voluntario y además lo presta el sector privado, es precio público; si falta cualquiera de las dos condiciones, es tasa" class="svd5" role="img" viewbox="0 0 720 350" xmlns="http://www.w3.org/2000/svg">
<style>.svd5 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd5 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd5 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}.svd5 .d{font:700 11px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}</style>
<rect fill="#003d75" height="50" rx="8" width="260" x="230" y="16"></rect>
<text class="h" x="360" y="38">¿Servicio de competencia local?</text>
<text class="h" style="font-weight:400;font-size:10.5px" x="360" y="57">prestación pecuniaria a decidir</text>
<line stroke="#0055a0" x1="360" x2="360" y1="66" y2="86"></line>
<rect fill="#e8f0f8" height="46" rx="8" stroke="#0055a0" width="300" x="210" y="86"></rect>
<text class="t" style="font-weight:700" x="360" y="106">¿Es de solicitud/recepción VOLUNTARIA?</text>
<text class="s" x="360" y="124">y además, ¿lo presta también el sector privado?</text>
<line stroke="#0055a0" x1="360" x2="360" y1="132" y2="150"></line>
<line stroke="#0055a0" x1="200" x2="520" y1="150" y2="150"></line>
<line stroke="#2d8659" x1="200" x2="200" y1="150" y2="168"></line>
<line stroke="#d13c3c" x1="520" x2="520" y1="150" y2="168"></line>
<text class="d" style="fill:#2d8659" x="130" y="164">SÍ a las dos</text>
<text class="d" style="fill:#d13c3c" x="590" y="164">NO a alguna</text>
<rect fill="#e8f5ee" height="92" rx="8" stroke="#2d8659" width="260" x="70" y="168"></rect>
<text class="t" style="font-weight:700;fill:#2d8659" x="200" y="194">PRECIO PÚBLICO</text>
<text class="s" x="200" y="216">no es tributo propio · art. 2.1</text>
<text class="s" x="200" y="236">cuantía: MÍNIMO el coste (44)</text>
<text class="s" x="200" y="254">lo fija el Pleno (delegable JGL)</text>
<rect fill="#fdeaea" height="92" rx="8" stroke="#d13c3c" width="260" x="390" y="168"></rect>
<text class="t" style="font-weight:700;fill:#d13c3c" x="520" y="194">TASA</text>
<text class="s" x="520" y="216">es tributo · arts. 20-27</text>
<text class="s" x="520" y="236">cuantía: MÁXIMO el coste (24.2)</text>
<text class="s" x="520" y="254">ordenanza fiscal del Pleno</text>
<rect fill="#fff5e6" height="50" rx="8" stroke="#e89822" width="420" x="150" y="286"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="308">Regla espejo: precio público = suelo · tasa = techo</text>
<text class="s" x="360" y="327">ambos son ingresos de derecho público (art. 2.2)</text>
</svg>