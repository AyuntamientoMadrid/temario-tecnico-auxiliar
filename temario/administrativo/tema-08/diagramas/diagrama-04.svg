<svg aria-label="El hecho imponible de la tasa tiene dos modalidades: utilización privativa del dominio público local, y prestación de servicios coactivos; la cuantía por servicios no puede exceder del coste" class="svd4" role="img" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd4 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd4 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd4 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="46" rx="8" width="220" x="250" y="16"></rect>
<text class="h" x="360" y="37">TASA — hecho imponible</text>
<text class="h" style="font-weight:400;font-size:10.5px" x="360" y="54">art. 20 TRLHL</text>
<line stroke="#0055a0" x1="360" x2="360" y1="62" y2="78"></line>
<line stroke="#0055a0" x1="180" x2="540" y1="78" y2="78"></line>
<line stroke="#0055a0" x1="180" x2="180" y1="78" y2="94"></line>
<line stroke="#0055a0" x1="540" x2="540" y1="78" y2="94"></line>
<rect fill="#e8f0f8" height="110" rx="8" stroke="#0055a0" width="280" x="40" y="94"></rect>
<text class="t" style="font-weight:700" x="180" y="118">1) Dominio público local</text>
<text class="s" x="180" y="140">utilización privativa o</text>
<text class="s" x="180" y="158">aprovechamiento especial</text>
<text class="s" x="180" y="182">(vados, terrazas, ocupación</text>
<text class="s" x="180" y="198">de la vía pública…)</text>
<rect fill="#e8f5ee" height="110" rx="8" stroke="#2d8659" width="280" x="400" y="94"></rect>
<text class="t" style="font-weight:700" x="540" y="118">2) Servicios/actividades</text>
<text class="s" x="540" y="140">en régimen de derecho público</text>
<text class="s" style="font-weight:700;fill:#2d8659" x="540" y="162">si NO son voluntarios O</text>
<text class="s" style="font-weight:700;fill:#2d8659" x="540" y="180">NO los presta el sector privado</text>
<text class="s" x="540" y="198">(coactividad)</text>
<rect fill="#fff5e6" height="80" rx="8" stroke="#e89822" width="460" x="130" y="232"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="258">Cuantía (art. 24)</text>
<text class="s" x="360" y="280">dominio público → valor de mercado / utilidad (24.1)</text>
<text class="s" style="font-weight:700" x="360" y="300">servicios → NO excede del coste real o previsible (24.2)</text>
</svg>