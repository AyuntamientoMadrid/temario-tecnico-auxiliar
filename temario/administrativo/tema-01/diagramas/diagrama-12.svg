<svg aria-label="Organizacion territorial" role="img" viewbox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
<style>.d12-state{fill:#0055a0}.d12-ccaa{fill:#3378b9}.d12-prov{fill:#88b2d9}.d12-mun{fill:#d8e3f2}.d12-label{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.d12-mun-label{font:700 12px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}.d12-art{font:10px system-ui,sans-serif;fill:#fff;text-anchor:middle}.d12-mun-art{font:10px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}.d12-line{stroke:#0055a0;stroke-width:2;fill:none}.d12-head{font:700 14px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}.d12-note{font:italic 11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<text class="d12-head" x="360" y="24">ORGANIZACIÓN TERRITORIAL — CE Título VIII</text>
