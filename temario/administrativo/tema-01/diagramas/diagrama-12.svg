<line class="d12-line" x1="360" x2="360" y1="94" y2="130"></line><line class="d12-line" x1="160" x2="560" y1="130" y2="130"></line><line class="d12-line" x1="160" x2="160" y1="130" y2="150"></line><line class="d12-line" x1="360" x2="360" y1="130" y2="150"></line><line class="d12-line" x1="560" x2="560" y1="130" y2="150"></line>
