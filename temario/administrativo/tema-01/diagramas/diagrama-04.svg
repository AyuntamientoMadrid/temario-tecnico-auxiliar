<svg aria-label="Reforma ordinaria" role="img" viewbox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
<style>.d4-box{fill:#0055a0}.d4-alt{fill:#e89822}.d4-ok{fill:#2d8659}.d4-ref{fill:#d13c3c}.d4-title{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.d4-sub{font:11px system-ui,sans-serif;fill:#fff;text-anchor:middle}.d4-arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#d4-arrow)}.d4-label{font:11px system-ui,sans-serif;fill:#333;text-anchor:middle}</style>
