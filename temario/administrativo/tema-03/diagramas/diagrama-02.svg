<text class="b-s" x="350" y="180">de un distrito</text>
<text class="b-s" style="font-style:italic" x="350" y="206">distritos (Tema 4)</text>
<rect class="b-box" height="120" rx="8" width="200" x="470" y="110"></rect>
<text class="b-h" x="570" y="138">ORGANISMOS PÚBLICOS</text>
<text class="b-s" x="570" y="164">ejecución / gestión</text>
<text class="b-s" x="570" y="180">adscritos a un Área</text>
<text class="b-s" style="font-style:italic" x="570" y="206">autónomos y EPE</text>
</svg>