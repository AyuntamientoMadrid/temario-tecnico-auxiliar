<svg aria-label="Para elegir el recurso: si el acto no agota la vía administrativa, procede el recurso de alzada ante el superior jerárquico, obligatorio. Si el acto agota la vía, procede el recurso potestativo de reposición ante el mismo órgano, o directamente el contencioso-administrativo. Si el acto es firme y concurre causa tasada, procede el recurso extraordinario de revisión" class="svd10" role="img" viewbox="0 0 720 336" xmlns="http://www.w3.org/2000/svg">
<style>.svd10 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd10 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd10 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="40" rx="8" width="180" x="270" y="14"></rect>
<text class="h" x="360" y="32">¿El acto agota la</text>
<text class="h" x="360" y="48">vía administrativa?</text>
<path d="M300 54 L160 86" marker-end="url(#a10)" stroke="#0055a0" stroke-width="2"></path>
<path d="M420 54 L560 86" marker-end="url(#a10)" stroke="#0055a0" stroke-width="2"></path>
<text class="s" style="font-weight:700;fill:#d13c3c" x="196" y="66">NO agota</text>
<text class="s" style="font-weight:700;fill:#2d8659" x="534" y="66">SÍ agota</text>
<rect fill="#fbe9e7" height="96" rx="8" stroke="#d13c3c" width="270" x="30" y="92"></rect>
<text class="t" style="font-weight:700;fill:#a82a2a" x="165" y="116">Recurso de ALZADA</text>
<text class="s" x="165" y="138">Ante el SUPERIOR jerárquico</text>
<text class="s" x="165" y="156">OBLIGATORIO (arts. 121-122)</text>
<text class="s" x="165" y="174">1 mes (expreso) · resuelve en 3 meses</text>
<rect fill="#e8f5ee" height="96" rx="8" stroke="#2d8659" width="270" x="420" y="92"></rect>
<text class="t" style="font-weight:700;fill:#1f6b45" x="555" y="116">Recurso de REPOSICIÓN</text>
<text class="s" x="555" y="138">Ante el MISMO órgano</text>
<text class="s" x="555" y="156">POTESTATIVO (arts. 123-124)</text>
<text class="s" x="555" y="174">1 mes (expreso) · resuelve en 1 mes</text>
<path d="M165 188 L165 214" marker-end="url(#a10)" stroke="#0055a0" stroke-width="2"></path>
<path d="M555 188 L555 214" marker-end="url(#a10)" stroke="#0055a0" stroke-width="2"></path>
<rect fill="#003d75" height="40" rx="8" width="460" x="130" y="218"></rect>
<text class="h" x="360" y="243">Recurso CONTENCIOSO-ADMINISTRATIVO (judicial)</text>
<rect fill="#fff5e6" height="50" rx="8" stroke="#e89822" width="400" x="160" y="276"></rect>
<text class="s" style="font-weight:700;fill:#b5740f" x="360" y="298">Acto FIRME + causa tasada → recurso EXTRAORDINARIO</text>
<text class="s" x="360" y="316">de revisión ante el mismo órgano (art. 125)</text>
<defs><marker id="a10" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="3"><path d="M0 0 L6 3 L0 6 Z" fill="#0055a0"></path></marker></defs>
</svg>