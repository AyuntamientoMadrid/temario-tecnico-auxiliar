<text class="h" style="font-weight:400;font-size:11px" x="245" y="126">Procedimiento (relación con el ciudadano)</text>
<rect fill="#0055a0" height="64" rx="8" width="210" x="480" y="80"></rect>
<text class="h" x="585" y="104">Ley 40/2015 · LRJSP</text>
<text class="h" style="font-weight:400;font-size:11px" x="585" y="121">Régimen jurídico</text>
<text class="h" style="font-weight:400;font-size:11px" x="585" y="135">(organización interna)</text>
<text class="b" x="245" y="166">Estructura de la Ley 39/2015 por títulos</text>
<text class="s" x="585" y="166">En el Tema 7 solo se cita como apoyo</text>
