<svg aria-label="El 1 de octubre de 2015 se aprueban la Ley 39/2015 del procedimiento administrativo común y la Ley 40/2015 de régimen jurídico del sector público; la Ley 39/2015 deroga la Ley 30/1992. Los títulos de la Ley 39/2015 se reparten entre dos temas: el preliminar y los títulos I y II se ven en el Tema 6, y los títulos III, IV y V en el Tema 7. La Ley 40/2015 no es objeto del Tema 7, que solo la cita como apoyo" class="svd1" role="img" viewbox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
<style>.svd1 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd1 .t{font:13px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd1 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}.svd1 .b{font:700 12px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}</style>
<rect fill="#7a1f1f" height="40" rx="8" width="220" x="250" y="14"></rect>
<text class="h" x="360" y="33">Ley 30/1992 (derogada)</text>
<text class="h" style="font-weight:400;font-size:10px" x="360" y="48">1 de octubre de 2015: dos nuevas leyes</text>
