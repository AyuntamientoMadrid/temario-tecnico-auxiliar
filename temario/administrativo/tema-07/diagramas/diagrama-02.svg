<svg aria-label="El procedimiento administrativo es el cauce formal de actos que conduce al acto administrativo. Tiene doble naturaleza: garantía del ciudadano (audiencia, prueba, motivación) y cauce de acierto y eficacia de la Administración. Su fundamento constitucional es el artículo 105 c de la Constitución" class="svd2" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd2 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd2 .t{font:13px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd2 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#e8f0f8" height="56" rx="8" stroke="#0055a0" width="160" x="40" y="20"></rect>
<text class="t" style="font-weight:700" x="120" y="44">Inicio del</text>
<text class="t" style="font-weight:700" x="120" y="62">procedimiento</text>
<text class="s" x="232" y="52">trámites →</text>
<rect fill="#e8f0f8" height="56" rx="8" stroke="#0055a0" width="160" x="280" y="20"></rect>
<text class="t" style="font-weight:700" x="360" y="44">Cauce formal</text>
<text class="t" x="360" y="62">(serie de actos)</text>
<text class="s" x="472" y="52">→ produce</text>
<rect fill="#003d75" height="56" rx="8" width="160" x="520" y="20"></rect>
<text class="h" x="600" y="44">ACTO</text>
<text class="h" style="font-weight:400;font-size:11px" x="600" y="62">administrativo final</text>
<text class="s" style="font-weight:700;fill:#0055a0" x="360" y="112">DOBLE NATURALEZA DEL PROCEDIMIENTO</text>
<rect fill="#e8f5ee" height="96" rx="8" stroke="#2d8659" width="280" x="60" y="128"></rect>
<text class="t" style="font-weight:700;fill:#1f6b45" x="200" y="152">Garantía del ciudadano</text>
<text class="s" x="200" y="176">Audiencia · contradicción · prueba</text>
<text class="s" x="200" y="196">Motivación · acceso al expediente</text>
<text class="s" x="200" y="214">Evita la arbitrariedad</text>
<rect fill="#e8f0f8" height="96" rx="8" stroke="#0055a0" width="280" x="380" y="128"></rect>
<text class="t" style="font-weight:700;fill:#0055a0" x="520" y="152">Cauce de la Administración</text>
<text class="s" x="520" y="176">Ordena la formación de voluntad</text>
<text class="s" x="520" y="196">Acierto y eficacia de la decisión</text>
<text class="s" x="520" y="214">Sirve el interés general</text>
<rect fill="#fff5e6" height="52" rx="8" stroke="#e89822" width="320" x="200" y="250"></rect>
<text class="s" style="font-weight:700;fill:#b5740f" x="360" y="273">FUNDAMENTO CONSTITUCIONAL</text>
<text class="s" x="360" y="292">art. 105.c) CE: procedimiento + audiencia del interesado</text>
</svg>