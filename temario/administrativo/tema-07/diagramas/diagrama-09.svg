<svg aria-label="La nulidad de pleno derecho (artículo 47) es la sanción más grave: efectos desde el origen, insubsanable e imprescriptible, por supuestos tasados como la incompetencia manifiesta por materia o territorio o el contenido imposible. La anulabilidad (artículo 48) es la regla general: cualquier infracción del ordenamiento, incluida la desviación de poder; el acto es subsanable y convalidable" class="svd9" role="img" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd9 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd9 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd9 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:start}.svd9 .c{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#7a1f1f" height="34" rx="8" width="320" x="30" y="16"></rect>
<text class="h" x="190" y="38">NULIDAD de pleno derecho (art. 47)</text>
<rect fill="#0055a0" height="34" rx="8" width="320" x="370" y="16"></rect>
<text class="h" x="530" y="38">ANULABILIDAD (art. 48)</text>
<rect fill="#fbe9e7" height="210" rx="8" stroke="#d13c3c" width="320" x="30" y="60"></rect>
<text class="s" style="font-weight:700;fill:#a82a2a" x="48" y="84">Supuestos TASADOS:</text>
<text class="s" x="48" y="104">a) lesión de derechos fundamentales</text>
<text class="s" x="48" y="122">b) incompetencia manifiesta (materia/territorio)</text>
<text class="s" x="48" y="140">c) contenido imposible</text>
<text class="s" x="48" y="158">d) infracción penal o consecuencia de ella</text>
<text class="s" x="48" y="176">e) prescindir total del procedimiento</text>
<text class="s" x="48" y="194">f) adquirir derechos sin requisitos esenciales</text>
<text class="s" x="48" y="212">g) otros por ley</text>
<text class="c" style="font-weight:700;fill:#a82a2a" x="190" y="238">Efectos desde el ORIGEN (ex tunc)</text>
<text class="c" x="190" y="258">insubsanable · imprescriptible</text>
<rect fill="#e8f0f8" height="210" rx="8" stroke="#0055a0" width="320" x="370" y="60"></rect>
<text class="s" style="font-weight:700;fill:#0055a0" x="388" y="86">Regla GENERAL de invalidez:</text>
<text class="s" x="388" y="108">Cualquier infracción del ordenamiento,</text>
<text class="s" x="388" y="126">incluida la DESVIACIÓN DE PODER (48.1)</text>
<text class="s" style="font-weight:700" x="388" y="152">Defecto de forma → solo anula si:</text>
<text class="s" x="388" y="170">· impide alcanzar su fin, o</text>
<text class="s" x="388" y="188">· produce indefensión (48.2)</text>
<text class="s" x="388" y="212">Fuera de plazo → solo si lo impone</text>
<text class="s" x="388" y="230">la naturaleza del término (48.3)</text>
<text class="c" style="font-weight:700;fill:#0055a0" x="530" y="256">SUBSANABLE · convalidable (art. 52)</text>
<rect fill="#fff5e6" height="38" rx="8" stroke="#e89822" width="400" x="160" y="284"></rect>
<text class="c" style="font-weight:700;fill:#b5740f" x="360" y="307">Incompetencia JERÁRQUICA → solo anulabilidad (convalidable)</text>
</svg>