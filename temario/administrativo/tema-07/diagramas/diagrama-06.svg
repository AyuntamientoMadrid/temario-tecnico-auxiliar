<svg aria-label="La instrucción comprende cuatro trámites: alegaciones (artículo 76), prueba de diez a treinta días (artículos 77 y 78), informes facultativos y no vinculantes salvo disposición (artículos 79 a 81) y trámite de audiencia de diez a quince días e información pública de al menos veinte días (artículos 82 y 83)" class="svd6" role="img" viewbox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd6 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd6 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd6 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="38" rx="8" width="200" x="260" y="14"></rect>
<text class="h" x="360" y="38">INSTRUCCIÓN (art. 75)</text>
<rect fill="#e8f0f8" height="86" rx="8" stroke="#0055a0" width="200" x="30" y="72"></rect>
<text class="t" style="font-weight:700" x="130" y="96">Alegaciones</text>
<text class="s" x="130" y="118">En cualquier momento</text>
<text class="s" x="130" y="136">antes de la audiencia</text>
<text class="s" x="130" y="152">art. 76</text>
<rect fill="#e8f5ee" height="86" rx="8" stroke="#2d8659" width="200" x="250" y="72"></rect>
<text class="t" style="font-weight:700" x="350" y="96">Prueba</text>
<text class="s" style="font-weight:700;fill:#1f6b45" x="350" y="118">10-30 días</text>
<text class="s" x="350" y="136">cualquier medio admisible</text>
<text class="s" x="350" y="152">arts. 77-78</text>
<rect fill="#e8f0f8" height="86" rx="8" stroke="#0055a0" width="220" x="470" y="72"></rect>
<text class="t" style="font-weight:700" x="580" y="96">Informes</text>
<text class="s" x="580" y="118">Regla: facultativos</text>
<text class="s" x="580" y="136">y NO vinculantes (art. 80)</text>
<text class="s" x="580" y="152">emisión 10 días</text>
<rect fill="#fff5e6" height="60" rx="8" stroke="#e89822" width="400" x="160" y="178"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="360" y="202">Trámite de AUDIENCIA: 10-15 días (art. 82)</text>
<text class="s" x="360" y="224">Información pública: ≥ 20 días (art. 83) · no da condición de interesado</text>
<rect fill="#eef2f7" height="34" rx="8" stroke="#0055a0" width="320" x="200" y="256"></rect>
<text class="s" style="font-weight:700" x="360" y="278">→ Propuesta de resolución</text>
</svg>