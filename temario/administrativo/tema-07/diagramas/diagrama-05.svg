<svg aria-label="Las cuatro fases del procedimiento son: iniciación (artículos 54 a 69), ordenación (artículos 70 a 74), instrucción (artículos 75 a 83) y terminación (artículos 84 a 95). La ordenación impulsa el expediente mientras se instruye" class="svd5" role="img" viewbox="0 0 720 250" xmlns="http://www.w3.org/2000/svg">
<style>.svd5 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd5 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd5 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="80" rx="10" width="150" x="20" y="60"></rect>
<text class="h" x="95" y="92">1. INICIACIÓN</text>
<text class="h" style="font-weight:400;font-size:11px" x="95" y="116">arts. 54-69</text>
<path d="M172 100 L196 100" marker-end="url(#a5)" stroke="#0055a0" stroke-width="2.5"></path>
<rect fill="#0055a0" height="80" rx="10" width="150" x="198" y="60"></rect>
<text class="h" x="273" y="92">2. ORDENACIÓN</text>
<text class="h" style="font-weight:400;font-size:11px" x="273" y="116">arts. 70-74</text>
<path d="M350 100 L374 100" marker-end="url(#a5)" stroke="#0055a0" stroke-width="2.5"></path>
<rect fill="#0055a0" height="80" rx="10" width="150" x="376" y="60"></rect>
<text class="h" x="451" y="92">3. INSTRUCCIÓN</text>
<text class="h" style="font-weight:400;font-size:11px" x="451" y="116">arts. 75-83</text>
<path d="M528 100 L552 100" marker-end="url(#a5)" stroke="#0055a0" stroke-width="2.5"></path>
<rect fill="#2d8659" height="80" rx="10" width="150" x="554" y="60"></rect>
<text class="h" x="629" y="92">4. TERMINACIÓN</text>
<text class="h" style="font-weight:400;font-size:11px" x="629" y="116">arts. 84-95</text>
<rect fill="#fff5e6" height="40" rx="8" stroke="#e89822" width="368" x="178" y="168"></rect>
<text class="s" style="font-weight:700;fill:#b5740f" x="362" y="186">La ORDENACIÓN no es una fase con trámites cerrados:</text>
<text class="s" x="362" y="202">impulsa de oficio el expediente mientras se instruye (art. 71)</text>
<defs><marker id="a5" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="3"><path d="M0 0 L6 3 L0 6 Z" fill="#0055a0"></path></marker></defs>
</svg>