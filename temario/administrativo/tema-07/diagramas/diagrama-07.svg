<svg aria-label="Ponen fin al procedimiento: la resolución (artículo 88), el desistimiento (abandono del procedimiento), la renuncia (abandono del derecho), la declaración de caducidad (paralización por el interesado, advertencia más tres meses, artículo 95), la imposibilidad material sobrevenida y la terminación convencional (artículo 86)" class="svd7" role="img" viewbox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd7 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd7 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd7 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="38" rx="8" width="220" x="250" y="14"></rect>
<text class="h" x="360" y="38">TERMINACIÓN (art. 84)</text>
<rect fill="#e8f5ee" height="76" rx="8" stroke="#2d8659" width="200" x="30" y="72"></rect>
<text class="t" style="font-weight:700;fill:#1f6b45" x="130" y="96">Resolución</text>
<text class="s" x="130" y="118">Decide el fondo · motivada</text>
<text class="s" x="130" y="136">art. 88 · no reformatio in peius</text>
<rect fill="#e8f0f8" height="76" rx="8" stroke="#0055a0" width="200" x="250" y="72"></rect>
<text class="t" style="font-weight:700" x="350" y="96">Desistimiento</text>
<text class="s" x="350" y="118">Abandona el PROCEDIMIENTO</text>
<text class="s" x="350" y="136">conserva el derecho · art. 94</text>
<rect fill="#e8f0f8" height="76" rx="8" stroke="#0055a0" width="220" x="470" y="72"></rect>
<text class="t" style="font-weight:700" x="580" y="96">Renuncia</text>
<text class="s" x="580" y="118">Abandona el DERECHO</text>
<text class="s" x="580" y="136">no se puede volver a pedir · art. 94</text>
<rect fill="#fbe9e7" height="76" rx="8" stroke="#d13c3c" width="200" x="30" y="160"></rect>
<text class="t" style="font-weight:700;fill:#a82a2a" x="130" y="184">Caducidad</text>
<text class="s" x="130" y="206">Paralización del interesado</text>
<text class="s" x="130" y="224">advertencia + 3 meses · art. 95</text>
<rect fill="#e8f0f8" height="76" rx="8" stroke="#0055a0" width="200" x="250" y="160"></rect>
<text class="t" style="font-weight:700" x="350" y="184">Imposibilidad</text>
<text class="t" style="font-weight:700" x="350" y="202">material</text>
<text class="s" x="350" y="224">causas sobrevenidas · art. 84.2</text>
<rect fill="#fff5e6" height="76" rx="8" stroke="#e89822" width="220" x="470" y="160"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="580" y="184">Terminación</text>
<text class="t" style="font-weight:700;fill:#b5740f" x="580" y="202">convencional</text>
<text class="s" x="580" y="224">pactos y convenios · art. 86</text>
<rect fill="#eef2f7" height="34" rx="8" stroke="#0055a0" width="440" x="140" y="252"></rect>
<text class="s" style="font-weight:700" x="360" y="274">La Administración SIEMPRE debe resolver de forma expresa (art. 21.1)</text>
</svg>