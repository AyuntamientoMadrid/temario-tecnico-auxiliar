<svg aria-label="El artículo 37 remite a las garantías del artículo 68 del Estatuto de los Trabajadores e impone el deber de sigilo profesional; el tiempo de reuniones y visitas no se imputa al crédito horario y la formación es tiempo de trabajo" class="svd5" role="img" viewbox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd5 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd5 .t{font:12px system-ui,sans-serif;fill:#1a1a1a}.svd5 .ti{font:700 15px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}</style>
<text class="ti" x="350" y="26">Estatuto del Delegado de Prevención (art. 37 LPRL)</text>
<rect fill="#e8f5ee" height="150" rx="10" stroke="#2d8659" width="290" x="40" y="44"></rect>
<rect fill="#2d8659" height="32" rx="10" width="290" x="40" y="44"></rect>
<text class="h" x="185" y="65">GARANTÍAS (art. 68 ET)</text>
<text class="t" x="56" y="100">• Expediente contradictorio si sanción</text>
<text class="t" x="56" y="126">• Prioridad de permanencia</text>
<text class="t" x="56" y="152">• No discriminación / libertad de expresión</text>
<text class="t" x="56" y="178">• Crédito horario de representante</text>
<rect fill="#fdeaea" height="150" rx="10" stroke="#d13c3c" width="290" x="370" y="44"></rect>
<rect fill="#d13c3c" height="32" rx="10" width="290" x="370" y="44"></rect>
<text class="h" x="515" y="65">DEBER (art. 37.3)</text>
<text class="t" style="font-weight:700" x="386" y="104">Sigilo profesional</text>
<text class="t" x="386" y="128">sobre las informaciones reservadas</text>
<text class="t" x="386" y="152">a las que acceda (art. 65.2 ET);</text>
<text class="t" x="386" y="176">(art. 37.3 LPRL)</text>
<rect fill="#fff5e6" height="68" rx="8" stroke="#e89822" width="620" x="40" y="208"></rect>
<text class="t" style="text-anchor:middle;font-weight:700;fill:#b5740f" x="350" y="232">NO se imputan al crédito horario:</text>
<text class="t" style="text-anchor:middle" x="350" y="254">reuniones del Comité + visitas de acompañamiento (art. 36.2.a y c)</text>
<text class="t" style="text-anchor:middle;fill:#555" x="350" y="270">La formación preventiva es tiempo de trabajo (art. 37.2)</text>
</svg>