<svg aria-label="Competencias del artículo 36.1: colaborar, promover, ser consultados y vigilar. Facultades del 36.2: acompañar, acceder a información, ser informados, recibir información, realizar visitas, recabar medidas y proponer la paralización" class="svd4" role="img" viewbox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
<style>.svd4 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd4 .t{font:12px system-ui,sans-serif;fill:#1a1a1a}.svd4 .cap{font:700 12px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}</style>
<rect fill="#f5f8fc" height="288" rx="10" stroke="#0055a0" width="310" x="30" y="22"></rect>
<rect fill="#0055a0" height="34" rx="10" width="310" x="30" y="22"></rect>
<text class="h" x="185" y="44">COMPETENCIAS (art. 36.1)</text>
<text class="t" x="48" y="84">• Colaborar en la mejora de la acción preventiva</text>
<text class="t" x="48" y="124">• Promover la cooperación de los trabajadores</text>
<text class="t" style="font-weight:700" x="48" y="164">• Ser consultados (previo a la decisión)</text>
<text class="t" x="48" y="204">• Vigilar y controlar el cumplimiento</text>
<rect fill="#fff5e6" height="60" rx="8" stroke="#e89822" width="274" x="48" y="232"></rect>
<text class="cap" style="fill:#b5740f" x="185" y="256">Sin Comité (&lt; 50 trab.)</text>
<text class="t" style="text-anchor:middle" x="185" y="276">asumen las funciones del Comité</text>
<rect fill="#e8f5ee" height="288" rx="10" stroke="#2d8659" width="310" x="360" y="22"></rect>
<rect fill="#2d8659" height="34" rx="10" width="310" x="360" y="22"></rect>
<text class="h" x="515" y="44">FACULTADES (art. 36.2)</text>
<text class="t" x="378" y="80">• Acompañar a técnicos e Inspección</text>
<text class="t" x="378" y="106">• Acceder a información y documentación</text>
<text class="t" x="378" y="132">• Ser informados de los daños en la salud</text>
<text class="t" x="378" y="158">• Recibir información de organismos</text>
<text class="t" x="378" y="184">• Realizar visitas a los lugares de trabajo</text>
<text class="t" x="378" y="210">• Recabar medidas preventivas</text>
<text class="t" x="378" y="236">• Proponer la paralización (art. 21.3)</text>
<text class="t" style="text-anchor:middle;fill:#555" x="515" y="278">Plazo de informe en consulta: 15 días (art. 36.3)</text>
</svg>