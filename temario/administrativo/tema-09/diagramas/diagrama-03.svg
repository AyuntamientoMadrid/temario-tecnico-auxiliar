<rect fill="#f5f8fc" height="30" stroke="#e3e8ef" width="430" x="60" y="128"></rect><text x="72" y="148">De 50 a 100</text>
<rect fill="#f5f8fc" height="30" stroke="#e3e8ef" width="150" x="490" y="128"></rect><text class="n" x="565" y="148">2</text>
<rect fill="#fff" height="30" stroke="#e3e8ef" width="430" x="60" y="158"></rect><text x="72" y="178">De 101 a 500</text>
