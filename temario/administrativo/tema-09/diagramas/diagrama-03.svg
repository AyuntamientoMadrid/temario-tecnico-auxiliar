<rect fill="#f5f8fc" height="30" stroke="#e3e8ef" width="150" x="490" y="188"></rect><text class="n" x="565" y="208">4</text>
<rect fill="#fff" height="30" stroke="#e3e8ef" width="430" x="60" y="218"></rect><text x="72" y="238">De 1.001 a 2.000</text>
