<svg aria-label="El distrito como división territorial con gestión desconcentrada, cuya división corresponde al Pleno, según el artículo 61" role="img" viewbox="0 0 700 290" xmlns="http://www.w3.org/2000/svg">
<style>
    .b-c{fill:#0055a0;stroke:#003d75;stroke-width:2}
    .b-b{fill:#fff;stroke:#0055a0;stroke-width:1.5}
    .b-t{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}
    .b-h{font:700 12px system-ui,sans-serif;fill:#003d75;text-anchor:middle}
    .b-s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}
  </style>
<ellipse class="b-c" cx="350" cy="70" rx="170" ry="46"></ellipse>
<text class="b-t" x="350" y="64">EL DISTRITO</text>
<text class="b-t" style="font-weight:400;font-size:11px" x="350" y="84">división territorial del municipio</text>
<rect class="b-b" height="100" rx="8" width="200" x="30" y="160"></rect>
<text class="b-h" x="130" y="186">Gestión</text>
<text class="b-h" x="130" y="204">DESCONCENTRADA</text>
<text class="b-s" x="130" y="228">sin perjuicio de la unidad</text>
<text class="b-s" x="130" y="244">de gobierno y gestión</text>
<rect class="b-b" height="100" rx="8" width="200" x="250" y="160"></rect>
<text class="b-h" x="350" y="186">Finalidad</text>
<text class="b-s" x="350" y="210">impulso de la</text>
<text class="b-s" x="350" y="226">participación</text>
<text class="b-s" x="350" y="242">ciudadana</text>
<rect fill="#fdf4e4" height="100" rx="8" stroke="#e89822" stroke-width="1.5" width="200" x="470" y="160"></rect>
<text class="b-h" style="fill:#a8650f" x="570" y="186">La divide</text>
<text class="b-h" style="fill:#a8650f" x="570" y="210">EL PLENO</text>
<text class="b-s" x="570" y="234">por norma orgánica</text>
<text class="b-s" x="570" y="250">(art. 61.2 · LBRL 128)</text>
<line stroke="#0055a0" stroke-width="1.2" x1="250" x2="130" y1="110" y2="160"></line>
<line stroke="#0055a0" stroke-width="1.2" x1="350" x2="350" y1="116" y2="160"></line>
<line stroke="#0055a0" stroke-width="1.2" x1="450" x2="570" y1="110" y2="160"></line>
</svg>