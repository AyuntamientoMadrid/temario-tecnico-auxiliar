<svg aria-label="División funcional en Áreas de Gobierno frente a gestión territorial en distritos" role="img" viewbox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<style>
    .a-h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}
    .a-t{font:13px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}
    .a-s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}
  </style>
<rect fill="#003d75" height="46" rx="8" width="250" x="225" y="20"></rect>
<text class="a-h" x="350" y="40">AYUNTAMIENTO DE MADRID</text>
<text class="a-h" style="font-weight:400;font-size:11px" x="350" y="57">ROGA 2004 · art. 5</text>
<line stroke="#0055a0" stroke-width="1.5" x1="350" x2="350" y1="66" y2="86"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="180" x2="180" y1="104" y2="86"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="520" x2="520" y1="104" y2="86"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="180" x2="520" y1="86" y2="86"></line>
<rect fill="#e8f0f8" height="150" rx="8" stroke="#0055a0" stroke-width="1.5" width="240" x="60" y="104"></rect>
<text class="a-h" style="fill:#003d75" x="180" y="132">DIVISIÓN FUNCIONAL</text>
<text class="a-t" x="180" y="160">Áreas de Gobierno</text>
<text class="a-s" x="180" y="184">órganos centrales</text>
<text class="a-s" x="180" y="200">(todo el municipio)</text>
<text class="a-s" style="font-weight:700;fill:#0055a0" x="180" y="228">→ TEMA 3</text>
<rect fill="#e8f5ee" height="150" rx="8" stroke="#2d8659" stroke-width="1.5" width="240" x="400" y="104"></rect>
<text class="a-h" style="fill:#1f5e3f" x="520" y="132">GESTIÓN TERRITORIAL</text>
<text class="a-t" x="520" y="160">Distritos</text>
<text class="a-s" x="520" y="184">órganos territoriales</text>
<text class="a-s" x="520" y="200">(ámbito de un distrito)</text>
<text class="a-s" style="font-weight:700;fill:#2d8659" x="520" y="228">→ TEMA 4 (este)</text>
</svg>