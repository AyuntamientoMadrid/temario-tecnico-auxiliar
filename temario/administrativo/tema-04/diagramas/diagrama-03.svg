<svg aria-label="Órganos de gobierno del distrito: la Junta Municipal y el concejal-presidente, según el artículo 62" role="img" viewbox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<style>
    .c-root{fill:#0055a0;stroke:#003d75;stroke-width:2}
