<svg aria-label="Los empleados públicos se clasifican en funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual; el personal directivo se regula aparte en el artículo 13" class="svd2" role="img" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
