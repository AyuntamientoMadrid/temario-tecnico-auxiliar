<svg aria-label="Los derechos individuales del artículo 14 incluyen inamovilidad, carrera, retribuciones, formación e intimidad; los derechos de ejercicio colectivo del artículo 15 incluyen libertad sindical, negociación colectiva, huelga, conflicto colectivo y reunión" class="svd7" role="img" viewbox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd7 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd7 .t{font:11.5px system-ui,sans-serif;fill:#1a1a1a;text-anchor:start}</style>
<rect fill="#0055a0" height="38" rx="8" width="300" x="30" y="20"></rect>
<text class="h" x="180" y="44">INDIVIDUALES · art. 14</text>
<rect fill="#2d8659" height="38" rx="8" width="300" x="370" y="20"></rect>
<text class="h" x="520" y="44">COLECTIVOS · art. 15</text>
<rect fill="#e8f0f8" height="210" rx="8" stroke="#0055a0" width="300" x="30" y="70"></rect>
<text class="t" x="48" y="98">• Inamovilidad (carrera)</text>
<text class="t" x="48" y="124">• Carrera y promoción interna</text>
<text class="t" x="48" y="150">• Retribuciones e indemnizaciones</text>
<text class="t" x="48" y="176">• Formación continua</text>
<text class="t" x="48" y="202">• Intimidad y desconexión digital</text>
<text class="t" x="48" y="228">• No discriminación / conciliación</text>
<text class="t" x="48" y="254">• Vacaciones, permisos y licencias</text>
<rect fill="#e8f5ee" height="210" rx="8" stroke="#2d8659" width="300" x="370" y="70"></rect>
<text class="t" x="388" y="104">• Libertad sindical</text>
<text class="t" x="388" y="138">• Negociación colectiva</text>
<text class="t" style="font-weight:700;fill:#1f5e3f" x="388" y="172">• Huelga (servicios esenciales)</text>
<text class="t" x="388" y="206">• Conflicto colectivo</text>
<text class="t" x="388" y="240">• Reunión (art. 46)</text>
</svg>