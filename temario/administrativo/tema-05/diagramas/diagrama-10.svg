<svg aria-label="Jornada general y teletrabajo en el artículo 47, permisos en el artículo 48, permisos de conciliación de diecinueve semanas en el artículo 49 y vacaciones de veintidós días hábiles en el artículo 50" class="svd10" role="img" viewbox="0 0 700 270" xmlns="http://www.w3.org/2000/svg">
<style>.svd10 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd10 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd10 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="38" rx="8" width="360" x="170" y="16"></rect>
<text class="h" x="350" y="40">JORNADA · PERMISOS · VACACIONES</text>
<rect fill="#e8f0f8" height="120" rx="8" stroke="#0055a0" width="150" x="30" y="78"></rect>
<text class="t" style="font-weight:700" x="105" y="104">Jornada</text>
<text class="s" x="105" y="122">art. 47</text>
<text class="s" x="105" y="152">general y especiales</text>
<text class="s" style="font-weight:700;fill:#0055a0" x="105" y="174">+ teletrabajo (47 bis)</text>
<rect fill="#e8f0f8" height="120" rx="8" stroke="#0055a0" width="150" x="196" y="78"></rect>
<text class="t" style="font-weight:700" x="271" y="104">Permisos</text>
<text class="s" x="271" y="122">art. 48</text>
<text class="s" x="271" y="150">familiares, traslado,</text>
<text class="s" x="271" y="168">exámenes, lactancia,</text>
<text class="s" x="271" y="186">asuntos particulares</text>
<rect fill="#e8f5ee" height="120" rx="8" stroke="#2d8659" width="150" x="362" y="78"></rect>
<text class="t" style="font-weight:700" x="437" y="104">Conciliación</text>
<text class="s" x="437" y="122">art. 49</text>
<text class="t" style="font-weight:700;fill:#1f5e3f" x="437" y="154">19 semanas</text>
<text class="s" x="437" y="176">nacimiento/adopción</text>
<rect fill="#fff5e6" height="120" rx="8" stroke="#e89822" width="150" x="528" y="78"></rect>
<text class="t" style="font-weight:700" x="603" y="104">Vacaciones</text>
<text class="s" x="603" y="122">art. 50</text>
<text class="t" style="font-weight:700;fill:#b5740f" x="603" y="156">22 días hábiles</text>
<text class="s" x="603" y="178">(o proporcional)</text>
<rect fill="#f4f6f9" height="38" rx="6" stroke="#0055a0" width="620" x="40" y="216"></rect>
<text class="s" style="font-weight:700;fill:#0055a0;font-size:10px" x="350" y="240">IAM: el Acuerdo-Convenio añade días de vacaciones y de asuntos particulares por antigüedad</text>
</svg>