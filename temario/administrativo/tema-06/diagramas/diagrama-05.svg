<svg aria-label="Con carácter general basta con acreditar la identidad para cualquier actuación del procedimiento; la firma acredita la voluntad y el consentimiento y solo es obligatoria para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos. Cuando se firma, la identidad se entiende ya acreditada por el propio acto de la firma" class="svd5" role="img" viewbox="0 0 700 310" xmlns="http://www.w3.org/2000/svg">
<style>.svd5 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd5 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd5 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#0055a0" height="44" rx="8" width="290" x="40" y="20"></rect>
<text class="h" x="185" y="40">IDENTIFICACIÓN (art. 9)</text>
<text class="h" style="font-weight:400;font-size:11px" x="185" y="57">Acredita QUIÉN eres</text>
<rect fill="#2d8659" height="44" rx="8" width="290" x="370" y="20"></rect>
<text class="h" x="515" y="40">FIRMA (arts. 10-11)</text>
<text class="h" style="font-weight:400;font-size:11px" x="515" y="57">Manifiesta la VOLUNTAD</text>
<rect fill="#e8f0f8" height="120" rx="8" stroke="#0055a0" width="290" x="40" y="80"></rect>
<text class="t" style="font-weight:700" x="185" y="104">Basta para CUALQUIER actuación</text>
<text class="s" x="185" y="128">· Certificado cualificado de firma</text>
<text class="s" x="185" y="148">· Certificado cualificado de sello</text>
<text class="s" x="185" y="168">· Otros sistemas que se consideren</text>
<text class="s" x="185" y="188">válidos, con registro previo (art. 9.2)</text>
<rect fill="#e8f5ee" height="120" rx="8" stroke="#2d8659" width="290" x="370" y="80"></rect>
<text class="t" style="font-weight:700" x="515" y="104">Obligatoria solo para (art. 11.2)</text>
<text class="s" x="515" y="128">· Solicitudes</text>
<text class="s" x="515" y="148">· Declaraciones resp. o comunicaciones</text>
<text class="s" x="515" y="168">· Recursos · Desistir de acciones</text>
<text class="s" x="515" y="188">· Renuncia de derechos</text>
<rect fill="#fdecea" height="68" rx="8" stroke="#d13c3c" width="460" x="120" y="222"></rect>
<text class="t" style="font-weight:700;fill:#b32d2d" x="350" y="248">Identificación ≠ firma</text>
<text class="s" x="350" y="270">Al usar un sistema de firma, la identidad se entiende ya acreditada (art. 10.5)</text>
</svg>