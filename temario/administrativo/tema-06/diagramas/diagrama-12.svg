<svg aria-label="Mapa resumen: la Ley 39/2015 regula derechos, interesados, registros y plazos; la Ley 40/2015 la organización interna; la Ley 19/2013 la transparencia con publicidad activa, derecho de acceso y buen gobierno; y la Ordenanza de Transparencia de Madrid de 2016 regula la transparencia municipal, la reutilización y el Registro de lobbies" class="svd12" role="img" viewbox="0 0 720 370" xmlns="http://www.w3.org/2000/svg">
