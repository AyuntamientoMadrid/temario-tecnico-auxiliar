<svg aria-label="La Ley 39/2015 es electrónica por defecto: punto de acceso general, asistencia en medios electrónicos, derecho a no aportar documentos ya en poder de la Administración y sede y registro electrónicos; la persona física puede elegir el canal salvo que esté obligada" class="svd3" role="img" viewbox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd3 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd3 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd3 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="44" rx="8" width="280" x="210" y="16"></rect>
<text class="h" x="350" y="43">ADMINISTRACIÓN ELECTRÓNICA</text>
<rect fill="#e8f0f8" height="80" rx="8" stroke="#0055a0" width="150" x="30" y="84"></rect>
<text class="t" style="font-weight:700" x="105" y="116">Punto de Acceso</text>
<text class="t" style="font-weight:700" x="105" y="134">General</text>
<text class="s" x="105" y="152">art. 13.a)</text>
<rect fill="#e8f0f8" height="80" rx="8" stroke="#0055a0" width="150" x="195" y="84"></rect>
<text class="t" style="font-weight:700" x="270" y="116">Asistencia en</text>
<text class="t" style="font-weight:700" x="270" y="134">medios electrón.</text>
<text class="s" x="270" y="152">art. 13.b)</text>
<rect fill="#e8f5ee" height="80" rx="8" stroke="#2d8659" width="150" x="360" y="84"></rect>
<text class="t" style="font-weight:700" x="435" y="116">No aportar</text>
<text class="t" style="font-weight:700" x="435" y="134">documentos</text>
<text class="s" x="435" y="152">art. 28.2</text>
<rect fill="#e8f0f8" height="80" rx="8" stroke="#0055a0" width="150" x="525" y="84"></rect>
<text class="t" style="font-weight:700" x="600" y="116">Sede y registro</text>
<text class="t" style="font-weight:700" x="600" y="134">electrónicos</text>
<text class="s" x="600" y="152">arts. 14 y 16</text>
<rect fill="#fff5e6" height="80" rx="8" stroke="#e89822" width="540" x="80" y="196"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="350" y="222">Regla de elección de canal (art. 14.1)</text>
<text class="s" x="350" y="244">La persona FÍSICA elige si usa o no medios electrónicos</text>
<text class="s" x="350" y="262">y puede cambiar de medio en cualquier momento — salvo que esté obligada (art. 14.2)</text>
</svg>