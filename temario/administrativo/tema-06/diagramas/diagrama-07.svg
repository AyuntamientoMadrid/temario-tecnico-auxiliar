<svg aria-label="Están obligados a relacionarse electrónicamente con las Administraciones las personas jurídicas, las entidades sin personalidad jurídica, los profesionales con colegiación obligatoria, los representantes de un obligado y los empleados públicos para los trámites de su condición" class="svd7" role="img" viewbox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<style>.svd7 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd7 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd7 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}.svd7 .n{font:700 16px system-ui,sans-serif;fill:#0055a0;text-anchor:middle}</style>
<rect fill="#003d75" height="46" rx="8" width="380" x="160" y="16"></rect>
<text class="h" x="350" y="38">OBLIGADOS A RELACIÓN ELECTRÓNICA</text>
<text class="h" style="font-weight:400;font-size:11px" x="350" y="55">art. 14.2 LPACAP</text>
<rect fill="#e8f0f8" height="110" rx="8" stroke="#0055a0" width="130" x="20" y="84"></rect>
<text class="n" x="85" y="108">1</text>
<text class="t" style="font-weight:700" x="85" y="138">Personas</text>
<text class="t" style="font-weight:700" x="85" y="156">jurídicas</text>
<rect fill="#e8f0f8" height="110" rx="8" stroke="#0055a0" width="130" x="160" y="84"></rect>
<text class="n" x="225" y="108">2</text>
<text class="t" style="font-weight:700" x="225" y="132">Entidades sin</text>
<text class="t" style="font-weight:700" x="225" y="150">personalidad</text>
<text class="t" style="font-weight:700" x="225" y="168">jurídica</text>
<rect fill="#e8f0f8" height="110" rx="8" stroke="#0055a0" width="130" x="300" y="84"></rect>
<text class="n" x="365" y="108">3</text>
<text class="t" style="font-weight:700" x="365" y="132">Profesionales</text>
<text class="t" style="font-weight:700" x="365" y="150">de colegiación</text>
<text class="t" style="font-weight:700" x="365" y="168">obligatoria</text>
<rect fill="#e8f0f8" height="110" rx="8" stroke="#0055a0" width="130" x="440" y="84"></rect>
<text class="n" x="505" y="108">4</text>
<text class="t" style="font-weight:700" x="505" y="138">Representantes</text>
<text class="s" x="505" y="156">de un obligado</text>
<rect fill="#e8f5ee" height="110" rx="8" stroke="#2d8659" width="100" x="580" y="84"></rect>
<text class="n" x="630" y="108">5</text>
<text class="t" style="font-weight:700" x="630" y="138">Empleados</text>
<text class="t" style="font-weight:700" x="630" y="156">públicos</text>
<text class="s" x="630" y="174">(su condición)</text>
<rect fill="#fff5e6" height="60" rx="8" stroke="#e89822" width="460" x="120" y="222"></rect>
<text class="t" style="font-weight:700;fill:#b5740f" x="350" y="246">La persona física NO está obligada (salvo norma)</text>
<text class="s" x="350" y="268">Reglamentariamente pueden añadirse colectivos con medios suficientes (art. 14.3)</text>
</svg>