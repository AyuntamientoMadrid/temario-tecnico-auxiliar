<svg aria-label="En 2015 la Ley 30/1992 se desdobló en la Ley 39/2015 del procedimiento administrativo común, que regula la relación con el ciudadano, y la Ley 40/2015 de régimen jurídico del sector público, que regula la organización interna" class="svd1" role="img" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd1 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd1 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd1 .s{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#7a8694" height="50" rx="8" width="220" x="250" y="16"></rect>
<text class="h" x="360" y="38">Ley 30/1992</text>
<text class="h" style="font-weight:400;font-size:11px" x="360" y="56">(derogada en 2016)</text>
<line stroke="#0055a0" stroke-width="1.5" x1="360" x2="360" y1="66" y2="84"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="180" x2="540" y1="84" y2="84"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="180" x2="180" y1="84" y2="100"></line>
<line stroke="#0055a0" stroke-width="1.5" x1="540" x2="540" y1="84" y2="100"></line>
<rect fill="#003d75" height="92" rx="8" width="280" x="40" y="100"></rect>
<text class="h" x="180" y="126">LEY 39/2015 · LPACAP</text>
<text class="h" style="font-weight:400;font-size:11px" x="180" y="146">Procedimiento Administrativo Común</text>
<text class="h" style="font-weight:400;font-size:11px;fill:#bcd6f0" x="180" y="172">Relación con el ciudadano (ad extra)</text>
<rect fill="#0055a0" height="92" rx="8" width="280" x="400" y="100"></rect>
<text class="h" x="540" y="126">LEY 40/2015 · LRJSP</text>
<text class="h" style="font-weight:400;font-size:11px" x="540" y="146">Régimen Jurídico del Sector Público</text>
<text class="h" style="font-weight:400;font-size:11px;fill:#bcd6f0" x="540" y="172">Organización interna (ad intra)</text>
<rect fill="#e8f0f8" height="98" rx="8" stroke="#0055a0" width="280" x="40" y="210"></rect>
<text class="t" style="font-weight:700" x="180" y="234">En este tema</text>
<text class="s" x="180" y="256">Derechos (art. 13) · Interesados</text>
<text class="s" x="180" y="274">(arts. 3-12) · Registros (art. 16)</text>
<text class="s" x="180" y="292">Plazos (arts. 30-31)</text>
<rect fill="#f3f5f7" height="98" rx="8" stroke="#7a8694" width="280" x="400" y="210"></rect>
<text class="t" style="font-weight:700" x="540" y="234">En este tema</text>
<text class="s" x="540" y="256">Solo su relación con la 39/2015</text>
<text class="s" x="540" y="274">Órganos, competencia, convenios,</text>
<text class="s" x="540" y="292">responsabilidad patrimonial</text>
</svg>