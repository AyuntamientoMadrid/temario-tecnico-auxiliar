<svg aria-label="El artículo 13 de la Ley 39/2015 reconoce a todas las personas el derecho a comunicarse electrónicamente, a ser asistidas, a usar las lenguas oficiales, al acceso a la información pública según la Ley 19/2013, al trato con respeto, a exigir responsabilidades, a los medios de identificación y firma electrónica y a la protección de datos" class="svd2" role="img" viewbox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
<style>.svd2 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd2 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:start}.svd2 .b{font:700 12px system-ui,sans-serif;fill:#0055a0;text-anchor:start}</style>
<rect fill="#003d75" height="46" rx="8" width="320" x="200" y="16"></rect>
<text class="h" x="360" y="38">DERECHOS DEL ART. 13 LPACAP</text>
<text class="h" style="font-weight:400;font-size:11px" x="360" y="55">Derechos de TODAS las personas</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="330" x="30" y="80"></rect>
<text class="t" x="44" y="104"><tspan class="b">a)</tspan> Comunicarse por el Punto de Acceso General</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="330" x="30" y="124"></rect>
<text class="t" x="44" y="148"><tspan class="b">b)</tspan> Ser asistidos en el uso de medios electrónicos</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="330" x="30" y="168"></rect>
<text class="t" x="44" y="192"><tspan class="b">c)</tspan> Usar las lenguas oficiales</text>
<rect fill="#fff5e6" height="38" rx="6" stroke="#e89822" width="330" x="30" y="212"></rect>
<text class="t" x="44" y="236"><tspan class="b" style="fill:#b5740f">d)</tspan> Acceso a información pública (Ley 19/2013)</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="330" x="30" y="256"></rect>
<text class="t" x="44" y="280"><tspan class="b">e)</tspan> Ser tratados con respeto y deferencia</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="320" x="375" y="80"></rect>
<text class="t" x="389" y="104"><tspan class="b">f)</tspan> Exigir responsabilidades a las AAPP</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="320" x="375" y="124"></rect>
<text class="t" x="389" y="148"><tspan class="b">g)</tspan> Identificación y firma electrónica (esta Ley)</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="320" x="375" y="168"></rect>
<text class="t" x="389" y="192"><tspan class="b">h)</tspan> Protección de datos personales</text>
<rect fill="#e8f0f8" height="38" rx="6" stroke="#0055a0" width="320" x="375" y="212"></rect>
<text class="t" x="389" y="236"><tspan class="b">i)</tspan> Cualesquiera otros (Constitución y leyes)</text>
<rect fill="#fdecea" height="74" rx="6" stroke="#d13c3c" width="320" x="375" y="262"></rect>
<text class="b" style="fill:#b32d2d" x="389" y="284">No confundir con el art. 53</text>
<text class="t" style="font-size:11px" x="389" y="304">El art. 53 = derechos del INTERESADO en un</text>
<text class="t" style="font-size:11px" x="389" y="320">procedimiento ya iniciado (estado, alegar...)</text>
</svg>