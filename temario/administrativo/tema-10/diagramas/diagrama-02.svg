<svg aria-label="La Ley Orgánica 3/2007 tiene por objeto hacer efectiva la igualdad de trato y oportunidades; su ámbito alcanza a toda persona física o jurídica en territorio español; y solo sus disposiciones adicionales primera, segunda y tercera tienen carácter orgánico" class="svd2" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd2 .h{font:700 14px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd2 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd2 .s{font:10.5px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="50" rx="8" width="300" x="210" y="16"></rect>
<text class="h" x="360" y="38">LO 3/2007 (LOIEMH)</text>
<text class="h" style="font-weight:400;font-size:11px" x="360" y="56">de 22 de marzo</text>
<rect fill="#e8f0f8" height="80" rx="8" stroke="#0055a0" width="200" x="30" y="100"></rect>
<text class="t" style="font-weight:700" x="130" y="124">Objeto (art. 1)</text>
<text class="s" x="130" y="144">igualdad de trato y</text>
<text class="s" x="130" y="159">oportunidades; eliminar</text>
<text class="s" x="130" y="174">la discriminación de la mujer</text>
<rect fill="#e8f5ee" height="80" rx="8" stroke="#2d8659" width="200" x="260" y="100"></rect>
<text class="t" style="font-weight:700" x="360" y="124">Ámbito (art. 2)</text>
<text class="s" x="360" y="146">TODA persona física</text>
<text class="s" x="360" y="161">o jurídica en</text>
<text class="s" x="360" y="176">territorio español</text>
<rect fill="#fdeaea" height="80" rx="8" stroke="#d13c3c" width="200" x="490" y="100"></rect>
<text class="t" style="font-weight:700" x="590" y="124">Naturaleza (DF 2.ª)</text>
<text class="s" x="590" y="146">orgánicas: solo</text>
<text class="s" x="590" y="161">DA 1.ª, 2.ª y 3.ª</text>
<text class="s" x="590" y="176">resto: no orgánico</text>
<rect fill="#fff5e6" height="54" rx="8" stroke="#e89822" width="560" x="80" y="214"></rect>
<text class="s" style="font-weight:700;fill:#b5740f;font-size:9.5px" x="360" y="238">Clave: el ámbito alcanza a toda persona (no solo empleo ni poderes públicos)</text>
<text class="s" x="360" y="256">y solo las DA 1.ª a 3.ª tienen carácter orgánico (DF 2.ª)</text>
</svg>