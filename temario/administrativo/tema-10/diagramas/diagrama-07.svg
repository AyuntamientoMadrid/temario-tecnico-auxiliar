<svg aria-label="La Ley 4/2023 define en su artículo 3 la orientación sexual (atracción física, sexual o afectiva hacia una persona), la identidad sexual (vivencia interna e individual del sexo) y la expresión de género (manifestación que cada persona hace de su identidad sexual)" class="svd7" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd7 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd7 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd7 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="46" rx="8" width="260" x="230" y="14"></rect>
<text class="h" x="360" y="35">Ley 4/2023 · art. 3</text>
<text class="h" style="font-weight:400;font-size:10px" x="360" y="52">tres conceptos definidos</text>
<rect fill="#e8f0f8" height="110" rx="8" stroke="#0055a0" width="210" x="30" y="92"></rect>
<text class="t" style="font-weight:700" x="135" y="118">Orientación sexual</text>
<text class="s" x="135" y="146">atracción física,</text>
<text class="s" x="135" y="162">sexual o afectiva</text>
<text class="s" style="font-style:italic" x="135" y="184">¿hacia quién?</text>
<rect fill="#e8f5ee" height="110" rx="8" stroke="#2d8659" width="210" x="255" y="92"></rect>
<text class="t" style="font-weight:700" x="360" y="118">Identidad sexual</text>
<text class="s" x="360" y="146">vivencia interna</text>
<text class="s" x="360" y="162">e individual del sexo</text>
<text class="s" style="font-style:italic" x="360" y="184">¿cómo me siento?</text>
<rect fill="#fff5e6" height="110" rx="8" stroke="#e89822" width="210" x="480" y="92"></rect>
<text class="t" style="font-weight:700" x="585" y="118">Expresión de género</text>
<text class="s" x="585" y="146">manifestación que cada</text>
<text class="s" x="585" y="162">persona hace de su identidad</text>
<text class="s" style="font-style:italic" x="585" y="184">¿cómo me muestro?</text>
<rect fill="#fdeaea" height="64" rx="8" stroke="#d13c3c" width="480" x="120" y="236"></rect>
<text class="t" style="font-weight:700" x="360" y="260">No confundir</text>
<text class="s" x="360" y="281">el art. 3 define cada concepto por separado;</text>
<text class="s" x="360" y="296">el art. 4 añade las características sexuales</text>
</svg>