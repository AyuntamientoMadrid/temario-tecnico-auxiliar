<svg aria-label="El III Plan de Igualdad del Ayuntamiento de Madrid se funda en la disposición adicional séptima del TREBEP; se aprobó el 28 de diciembre de 2023 con vigencia 2024-2027; lo negocia la Comisión de Igualdad paritaria presidida por la Dirección General de Función Pública" class="svd9" role="img" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<style>.svd9 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd9 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd9 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="48" rx="8" width="400" x="160" y="14"></rect>
<text class="h" x="360" y="36">III Plan de Igualdad — Ayto. de Madrid y OO.AA.</text>
<text class="h" style="font-weight:400;font-size:10px" x="360" y="54">Plan para la Igualdad al inicio de cada legislatura</text>
<rect fill="#e8f0f8" height="58" rx="8" stroke="#0055a0" width="320" x="40" y="86"></rect>
<text class="t" style="font-weight:700" x="200" y="108">Base legal</text>
<text class="s" x="200" y="129">DA 7.ª TREBEP (Ley 31/2022)</text>
