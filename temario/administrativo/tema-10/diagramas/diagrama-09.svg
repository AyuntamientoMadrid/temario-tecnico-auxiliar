<text class="t" style="font-weight:700" x="530" y="108">Vigencia</text>
<text class="s" x="530" y="129">1-ene-2024 a 31-dic-2027 (4 años)</text>
<rect fill="#e8f0f8" height="58" rx="8" stroke="#0055a0" width="320" x="40" y="156"></rect>
<text class="t" style="font-weight:700" x="200" y="178">Aprobación</text>
<text class="s" x="200" y="199">JGCM 28-dic-2023 · BOAM 9547/70 (11-ene-2024)</text>
<rect fill="#fdeaea" height="58" rx="8" stroke="#d13c3c" width="300" x="380" y="156"></rect>
<text class="t" style="font-weight:700" x="530" y="178">Sustituyó al II Plan</text>
