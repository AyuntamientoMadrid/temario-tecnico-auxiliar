<svg aria-label="El seguimiento del III Plan lo realiza la Comisión de Igualdad al menos semestralmente; la Dirección General de Función Pública elabora un informe anual; el diagnóstico se actualiza cada dos años; y al final de la vigencia se hace una evaluación final" class="svd11" role="img" viewbox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<style>.svd11 .h{font:700 12px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd11 .t{font:11.5px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd11 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#0055a0" height="80" rx="8" width="150" x="20" y="60"></rect>
<text class="h" x="95" y="92">SEMESTRAL</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="95" y="112">seguimiento de la</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="95" y="126">Comisión de Igualdad</text>
<line marker-end="url(#a11)" stroke="#555" stroke-width="2" x1="170" x2="195" y1="100" y2="100"></line>
<defs><marker id="a11" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#555"></path></marker></defs>
<rect fill="#2d8659" height="80" rx="8" width="150" x="195" y="60"></rect>
<text class="h" x="270" y="92">ANUAL</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="270" y="112">informe de la DG de</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="270" y="126">Función Pública</text>
<line marker-end="url(#a11)" stroke="#555" stroke-width="2" x1="345" x2="370" y1="100" y2="100"></line>
<rect fill="#e89822" height="80" rx="8" width="150" x="370" y="60"></rect>
<text class="h" x="445" y="92">BIENAL</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="445" y="112">actualización del</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="445" y="126">diagnóstico</text>
<line marker-end="url(#a11)" stroke="#555" stroke-width="2" x1="520" x2="545" y1="100" y2="100"></line>
<rect fill="#d13c3c" height="80" rx="8" width="155" x="545" y="60"></rect>
<text class="h" x="622" y="92">FINAL</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="622" y="112">evaluación al término</text>
<text class="h" style="font-weight:400;font-size:9.5px" x="622" y="126">de la vigencia</text>
<rect fill="#fff5e6" height="64" rx="8" stroke="#e89822" width="480" x="120" y="180"></rect>
<text class="t" style="font-weight:700" x="360" y="204">Sin partidas económicas específicas</text>
<text class="s" x="360" y="225">es un plan TRANSVERSAL; las modificaciones se acuerdan</text>
<text class="s" x="360" y="240">en el seno de la Comisión de Igualdad</text>
</svg>