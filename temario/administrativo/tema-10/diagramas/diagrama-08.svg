<svg aria-label="La rectificación registral de la mención al sexo no puede condicionarse a informe médico o psicológico; pueden solicitarla por sí mismas las personas mayores de 16 años; la ley añade medidas en el empleo público, un conjunto planificado de medidas en empresas de más de 50 personas y formación en las administraciones" class="svd8" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd8 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd8 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd8 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="46" rx="8" width="340" x="190" y="14"></rect>
<text class="h" x="360" y="35">Rectificación registral del sexo</text>
<text class="h" style="font-weight:400;font-size:10px" x="360" y="52">Ley 4/2023 · arts. 43 y 44</text>
<rect fill="#e8f5ee" height="78" rx="8" stroke="#2d8659" width="300" x="40" y="86"></rect>
<text class="t" style="font-weight:700" x="190" y="110">Sin informe médico</text>
<text class="s" x="190" y="131">ni psicológico (art. 44.3)</text>
<text class="s" x="190" y="147">ni modificación corporal previa</text>
<rect fill="#e8f0f8" height="78" rx="8" stroke="#0055a0" width="300" x="380" y="86"></rect>
<text class="t" style="font-weight:700" x="530" y="110">Edad</text>
<text class="s" x="530" y="131">&gt; 16 años: por sí mismas</text>
<text class="s" x="530" y="147">14-16: asistidas por representantes</text>
<rect fill="#fff5e6" height="64" rx="8" stroke="#e89822" width="200" x="40" y="186"></rect>
<text class="t" style="font-weight:700" x="140" y="210">Empleo público</text>
<text class="s" x="140" y="231">medidas en el acceso y la</text>
<text class="s" x="140" y="246">carrera profesional (art. 11)</text>
<rect fill="#fff5e6" height="64" rx="8" stroke="#e89822" width="200" x="260" y="186"></rect>
<text class="t" style="font-weight:700" x="360" y="210">Medidas LGTBI</text>
<text class="s" x="360" y="231">empresas &gt; 50 personas</text>
<text class="s" x="360" y="246">(art. 15 · RD 1026/2024)</text>
<rect fill="#fff5e6" height="64" rx="8" stroke="#e89822" width="200" x="480" y="186"></rect>
<text class="t" style="font-weight:700" x="580" y="210">AA.PP.</text>
<text class="s" x="580" y="231">formación del personal y</text>
<text class="s" x="580" y="246">pruebas selectivas (art. 12)</text>
<rect fill="#e8f0f8" height="34" rx="6" stroke="#0055a0" width="500" x="110" y="272"></rect>
<text class="s" style="font-weight:700;fill:#0055a0;font-size:9.5px" x="360" y="293">Tutela: nulidad (art. 64), legitimación (art. 65) y carga de la prueba (art. 66)</text>
</svg>