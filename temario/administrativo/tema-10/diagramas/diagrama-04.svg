<svg aria-label="Cualquier trato adverso como consecuencia de una queja, reclamación, denuncia, demanda o recurso es discriminación según el artículo 9; en los procedimientos en que la parte actora alega discriminación por razón de sexo, corresponde a la persona demandada probar la ausencia de discriminación, según el artículo 13, salvo en los procesos penales" class="svd4" role="img" viewbox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
<style>.svd4 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd4 .t{font:12px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd4 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#0055a0" height="70" rx="8" width="180" x="40" y="30"></rect>
<text class="h" x="130" y="58">Parte que demanda</text>
<text class="h" style="font-weight:400;font-size:10px" x="130" y="78">alega discriminación</text>
<text class="h" style="font-weight:400;font-size:10px" x="130" y="93">por razón de sexo</text>
<line marker-end="url(#a4)" stroke="#555" stroke-width="2" x1="220" x2="290" y1="65" y2="65"></line>
<defs><marker id="a4" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4"><path d="M0,0 L8,4 L0,8 z" fill="#555"></path></marker></defs>
<rect fill="#fdeaea" height="70" rx="8" stroke="#d13c3c" width="180" x="290" y="30"></rect>
<text class="t" style="font-weight:700" x="380" y="58">Prueba (art. 13)</text>
<text class="s" x="380" y="79">la carga recae en</text>
<text class="s" x="380" y="93">la persona demandada</text>
<line marker-end="url(#a4)" stroke="#555" stroke-width="2" x1="470" x2="540" y1="65" y2="65"></line>
<rect fill="#2d8659" height="70" rx="8" width="160" x="540" y="30"></rect>
<text class="h" x="620" y="58">Parte demandada</text>
<text class="h" style="font-weight:400;font-size:10px" x="620" y="79">prueba la AUSENCIA de</text>
<text class="h" style="font-weight:400;font-size:10px" x="620" y="93">discriminación</text>
<rect fill="#fff5e6" height="48" rx="8" stroke="#e89822" width="480" x="120" y="140"></rect>
<text class="s" style="font-weight:700;fill:#b5740f" x="360" y="162">Excepción: esta regla NO se aplica a los procesos penales</text>
<text class="s" x="360" y="179">(art. 13.2 LOIEMH)</text>
<rect fill="#e8f0f8" height="74" rx="8" stroke="#0055a0" width="480" x="120" y="216"></rect>
<text class="t" style="font-weight:700" x="360" y="240">Indemnidad frente a represalias (art. 9)</text>
<text class="s" x="360" y="262">trato adverso o efecto negativo como consecuencia de una</text>
<text class="s" x="360" y="279">queja, reclamación, denuncia o recurso = discriminación</text>
</svg>