<svg aria-label="Las políticas de igualdad se basan en la transversalidad del artículo 15 y las acciones positivas del artículo 11; en el empleo público destacan el informe de impacto de género, las estadísticas desagregadas, el protocolo de acoso del artículo 62, el plan de igualdad del artículo 64 y la presencia equilibrada del 40 al 60 por ciento" class="svd5" role="img" viewbox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
<style>.svd5 .h{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}.svd5 .t{font:11.5px system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle}.svd5 .s{font:10px system-ui,sans-serif;fill:#555;text-anchor:middle}</style>
<rect fill="#003d75" height="46" rx="8" width="260" x="230" y="14"></rect>
<text class="h" x="360" y="35">Políticas públicas de igualdad</text>
<text class="h" style="font-weight:400;font-size:10px" x="360" y="52">LOIEMH, arts. 11-22 y 51-64</text>
<rect fill="#e8f5ee" height="56" rx="8" stroke="#2d8659" width="300" x="40" y="84"></rect>
<text class="t" style="font-weight:700" x="190" y="106">Transversalidad (art. 15)</text>
<text class="s" x="190" y="126">la igualdad informa TODAS las políticas</text>
<rect fill="#e8f5ee" height="56" rx="8" stroke="#2d8659" width="300" x="380" y="84"></rect>
<text class="t" style="font-weight:700" x="530" y="106">Acciones positivas (art. 11)</text>
<text class="s" x="530" y="126">en favor de las mujeres · razonables y proporcionadas</text>
<rect fill="#e8f0f8" height="60" rx="8" stroke="#0055a0" width="200" x="40" y="156"></rect>
<text class="t" style="font-weight:700" x="140" y="180">Impacto de género</text>
<text class="s" x="140" y="200">disposiciones grales. (art. 19)</text>
<rect fill="#e8f0f8" height="60" rx="8" stroke="#0055a0" width="200" x="260" y="156"></rect>
<text class="t" style="font-weight:700" x="360" y="180">Estadísticas (art. 20)</text>
<text class="s" x="360" y="200">variable sexo desagregada</text>
<rect fill="#e8f0f8" height="60" rx="8" stroke="#0055a0" width="200" x="480" y="156"></rect>
<text class="t" style="font-weight:700" x="580" y="180">Protocolo acoso (art. 62)</text>
<text class="s" x="580" y="200">negociado en las AAPP</text>
<rect fill="#e8f0f8" height="60" rx="8" stroke="#0055a0" width="320" x="40" y="232"></rect>
<text class="t" style="font-weight:700" x="200" y="256">Plan de Igualdad AGE (art. 64)</text>
<text class="s" x="200" y="276">lo aprueba el Gobierno al inicio de cada legislatura</text>
<rect fill="#fdeaea" height="60" rx="8" stroke="#d13c3c" width="300" x="380" y="232"></rect>
<text class="t" style="font-weight:700" x="530" y="256">Presencia equilibrada</text>
<text class="s" x="530" y="276">40-60 % · DA 1.ª · arts. 51.d y 53</text>
<rect fill="#fff5e6" height="28" rx="6" stroke="#e89822" width="480" x="120" y="306"></rect>
<text class="s" style="font-weight:700;fill:#b5740f;font-size:9.5px" x="360" y="324">Ningún sexo supera el 60 % ni baja del 40 % en órganos de selección</text>
</svg>